<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev 슬라이딩 퍼즐</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --ink: #1c1c1c; --muted: #6b6b6b; --line: #e3e3df;
    --bar: #ececea; --calm: #9a9a94; --hot: #ff4d5e; --hot-soft: rgba(255,77,94,.14); --ok: #58b37a; --flash: rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131313; --panel: #1c1c1c; --ink: #ececea; --muted: #8f8f8a; --line: #2a2a28; --bar: #2e2e2c; --calm: #6f6f6a; --hot: #ff4d5e; --hot-soft: rgba(255,77,94,.14); --ok: #58b37a; --flash: rgba(255,255,255,.07); }
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif; overflow: hidden; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; height: 100%; padding: 14px; box-sizing: border-box; }
  section { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); min-height: 36px; }
  .bar h1 { font-size: 13px; margin: 0; color: var(--ink); }
  .bar .sp { flex: 1; }
  .bar button { border: 1px solid var(--line); background: none; color: var(--muted); font: inherit; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .bar button.primary { color: var(--ink); border-color: var(--ink); }
  .bar label.file { cursor: pointer; }
  .bar input[type=file] { display: none; }
  .stage { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; justify-items: center; gap: 20px; padding: 16px; min-height: 0; }
  canvas#board { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .ref { display: flex; flex-direction: column; gap: 6px; align-items: center; color: var(--muted); font-size: 11px; }
  canvas#ref { width: 144px; height: 120px; border-radius: 6px; border: 1px solid var(--line); }
  .list { flex: 1; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .row { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; transition: border-color .3s, background .3s; }
  .row.pick { border-color: var(--hot); background: var(--hot-soft); }
  .row.forced { border-style: dashed; }
  .row .name { font-weight: 600; }
  .row .p { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); text-align: right; }
  .row.pick .p { color: var(--hot); }
  .row .desc { grid-column: 1 / -1; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--muted); white-space: normal; }
  .row .track { grid-column: 1 / -1; height: 5px; background: var(--bar); border-radius: 3px; overflow: hidden; }
  .row .fill { height: 100%; width: 0; background: var(--calm); border-radius: 3px; transition: width .45s cubic-bezier(.2,.7,.2,1); }
  .row.pick .fill { background: var(--hot); }
  .row .cost { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); }
  .row .cost b { color: var(--ink); }
  .history { padding: 10px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; }
  .history span { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-variant-numeric: tabular-nums; }
  .history span.jev { border-color: var(--hot); color: var(--hot); }
  .gauges { display: grid; grid-template-columns: 1fr; gap: 8px 14px; padding: 10px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .gauge .v { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
  .gauge .track { height: 5px; background: var(--bar); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .gauge .fill { height: 100%; width: 0; background: var(--calm); transition: width .45s cubic-bezier(.2,.7,.2,1); }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 600; }
  .status { font-size: 12px; color: var(--muted); }
  .status.hot { color: var(--hot); }
  .status.ok { color: var(--ok); }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  .fine { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  body.clean .bar .ctl, body.clean .fine { display: none; }
  body.flash::before { content: ""; position: fixed; inset: 0; background: var(--flash); pointer-events: none; animation: blink .15s ease-out forwards; z-index: 9; }
  @keyframes blink { from { opacity: 1; } to { opacity: 0; } }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .stage { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <section>
    <div class="bar">
      <h1>Jev 슬라이딩 퍼즐 <span style="color:var(--muted);font-weight:400">5×6</span></h1>
      <span id="status" class="status">준비</span>
      <span class="sp"></span>
      <button id="scramble" class="ctl">섞기</button>
      <button id="play" class="ctl primary">Jev 시작</button>
      <label class="file ctl">그림 바꾸기<input id="file" type="file" accept="image/*"></label>
    </div>
    <div class="stage">
      <canvas id="board"></canvas>
      <div class="ref"><canvas id="ref"></canvas><span>완성 그림</span></div>
    </div>
    <div class="fine">Jev는 그림도 보드도 못 본다. 남은 직사각형의 <b>윗줄</b>과 <b>왼쪽 열</b> 중 어느 줄을 먼저 벗길지만 고르고(줄마다 타일 수·이미 제자리인 수·집까지 거리 합), 그 줄을 채우는 밀기는 코드가 BFS로 한다. 어느 순서든 다 풀리므로 Jev의 판단은 총 밀기 수에만 나타난다.</div>
  </section>
  <section>
    <div class="bar"><h1>Jev가 읽고 고르는 것</h1><span class="sp"></span><span id="lat"></span></div>
    <div id="list" class="list"><div class="empty">섞은 뒤 시작을 누르면 결정마다 두 줄의 확률이 여기 그려진다.</div></div>
    <div class="history" id="history"></div>
    <div class="gauges">
      <div class="gauge" id="gProg"><span>완성에 가까움</span> <span class="v">-</span><div class="track"><div class="fill"></div></div></div>
    </div>
    <div class="stats">
      <span>밀기 <b id="sMoves">0</b></span><span>거리 하한 <b id="sDist">-</b></span><span>제자리 <b id="sHome">-</b>/29</span><span>결정 <b id="sReq">0</b></span><span>강제 <b id="sForced">0</b></span>
    </div>
  </section>
</main>
<script>
const ROWS = 5, COLS = 6, PW = 1200, PH = 1000;
const q = new URLSearchParams(location.search);
if (q.get('clean') || q.get('demo')) document.body.classList.add('clean');
const $ = id => document.getElementById(id);
const LINE_KO = { row: '윗줄', col: '왼쪽 열', end: '마지막 2×2' };
const SLIDE_MS = +(q.get('slide') || 85);

// ---- picture: a procedural one so nothing is committed that isn't ours; drop a file to swap.
const pic = document.createElement('canvas'); pic.width = PW; pic.height = PH;
function drawDefault() {
  const g = pic.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, PH); sky.addColorStop(0, '#1b2a49'); sky.addColorStop(.55, '#e2643b'); sky.addColorStop(1, '#f7d08a');
  g.fillStyle = sky; g.fillRect(0, 0, PW, PH);
  g.fillStyle = '#ffd77a'; g.beginPath(); g.arc(PW * .62, PH * .5, PH * .13, 0, Math.PI * 2); g.fill();
  const hills = [['#3d2a4a', .6, 190], ['#6a3a4d', .7, 130], ['#2b1f2e', .82, 90]];
  for (const [c, y, amp] of hills) {
    g.fillStyle = c; g.beginPath(); g.moveTo(0, PH);
    for (let x = 0; x <= PW; x += 10) g.lineTo(x, PH * y - Math.abs(Math.sin(x / amp)) * amp * .9 - Math.sin(x / 37) * 12);
    g.lineTo(PW, PH); g.closePath(); g.fill();
  }
  g.fillStyle = 'rgba(255,255,255,.85)';
  let s = 7; for (let i = 0; i < 160; i++) { s = (s * 9301 + 49297) % 233280; const x = (s / 233280) * PW; s = (s * 9301 + 49297) % 233280; const y = (s / 233280) * PH * .45; g.fillRect(x, y, 2, 2); }
  g.fillStyle = 'rgba(255,255,255,.9)'; g.font = 'bold 26px -apple-system, system-ui, sans-serif'; g.textAlign = 'center';
  g.fillText('Jev', PW * .62, PH * .5 + 9);
}
drawDefault();
$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.onload = () => {
    const g = pic.getContext('2d'); const s = Math.min(img.width / PW, img.height / PH);
    const w = PW * s, h = PH * s;
    g.drawImage(img, (img.width - w) / 2, (img.height - h) / 2, w, h, 0, 0, PW, PH); drawRef(); draw();
  }; img.src = URL.createObjectURL(f);
});

// ---- board state
let board = solvedBoard(), region = [0, 0], playing = false, moves = 0, requests = 0, forced = 0, fixed = new Set(), lineTiles = new Set();
const pos = new Map();   // tile -> {x, y} in cell units, animated
function solvedBoard() { const b = []; for (let i = 1; i < ROWS * COLS; i++) b.push(i); b.push(0); return b; }
function key(b) { return b.join(','); }
function resetPos() { pos.clear(); board.forEach((t, i) => { if (t) pos.set(t, { x: i % COLS, y: Math.floor(i / COLS) }); }); }
resetPos();

const cv = $('board'), ctx = cv.getContext('2d');
function fit() {
  const stage = cv.parentElement; const w = Math.max(240, Math.min(stage.clientWidth - 190, (stage.clientHeight - 32) * COLS / ROWS));
  const dpr = devicePixelRatio || 1; cv.width = w * dpr; cv.height = w * ROWS / COLS * dpr; cv.style.width = w + 'px'; cv.style.height = (w * ROWS / COLS) + 'px'; draw();
}
function drawRef() { const r = $('ref'); const dpr = devicePixelRatio || 1; r.width = 144 * dpr; r.height = 120 * dpr; r.getContext('2d').drawImage(pic, 0, 0, r.width, r.height); }
function draw() {
  const cell = cv.width / COLS, gap = Math.round(cv.width * .004);
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bar'); ctx.fillRect(0, 0, cv.width, cv.height);
  const done = key(board) === key(solvedBoard());
  for (const [t, p] of pos) {
    const g = t - 1, sx = (g % COLS) * PW / COLS, sy = Math.floor(g / COLS) * PH / ROWS;
    const x = p.x * cell + gap, y = p.y * cell + gap, w = cell - 2 * gap;
    ctx.drawImage(pic, sx, sy, PW / COLS, PH / ROWS, x, y, w, w);
    if (fixed.has(t) && !done) { ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(x, y, w, w); }
    if (lineTiles.has(t) && !done) { ctx.strokeStyle = '#ff4d5e'; ctx.lineWidth = Math.max(2, cell * .03); ctx.strokeRect(x + 1, y + 1, w - 2, w - 2); }
  }
  if (done) { const g = ROWS * COLS - 1; ctx.drawImage(pic, (g % COLS) * PW / COLS, Math.floor(g / COLS) * PH / ROWS, PW / COLS, PH / ROWS, (g % COLS) * cell + gap, Math.floor(g / COLS) * cell + gap, cell - 2 * gap, cell - 2 * gap); }
}
function animateTo(t, x, y, ms) {
  const p = pos.get(t), x0 = p.x, y0 = p.y, t0 = performance.now();
  return new Promise(res => { (function f(now) {
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 2);
    p.x = x0 + (x - x0) * e; p.y = y0 + (y - y0) * e; draw();
    if (k < 1) setTimeout(() => f(performance.now()), 16); else res();  // setTimeout, not rAF: keeps moving when the window is occluded
  })(t0); });
}
addEventListener('resize', fit); addEventListener('load', fit);

// ---- ui
function setStatus(t, cls = '') { $('status').textContent = t; $('status').className = 'status ' + cls; }
function stats() {
  $('sMoves').textContent = moves; $('sReq').textContent = requests; $('sForced').textContent = forced;
  let d = 0, h = 0; board.forEach((v, i) => { if (v) { const g = v - 1; d += Math.abs(i % COLS - g % COLS) + Math.abs(Math.floor(i / COLS) - Math.floor(g / COLS)); if (v === i + 1) h++; } });
  $('sDist').textContent = d; $('sHome').textContent = h;
  if (q.get('demo')) document.title = `밀기 ${moves} · 거리 ${d} · 결정 ${requests}`;
}
function gauge(id, v) { const g = $(id); g.querySelector('.v').textContent = v.toFixed(2); g.querySelector('.fill').style.width = (v * 100) + '%'; }
function renderCandidates(r) {
  const order = Object.keys(r.candidates).sort((a, b) => (r.probabilities[b] || 0) - (r.probabilities[a] || 0));
  $('list').innerHTML = order.map(d => {
    const c = r.candidates[d], p = r.probabilities[d] || 0, pick = d === r.choice;
    return `<div class="row${pick ? ' pick' : ''}${r.forced ? ' forced' : ''}"><span class="name">${LINE_KO[d]} <span style="color:var(--muted);font-weight:400">타일 ${c.tiles[0]}–${c.tiles[c.tiles.length - 1]}</span></span><span class="p">${r.forced ? '유일' : p.toFixed(2)}</span><span class="desc">${c.text}</span><div class="track"><div class="fill" style="width:0"></div></div>${pick ? `<span class="cost">실제로 든 밀기 <b>${r.path.length}</b></span>` : ''}</div>`;
  }).join('');
  requestAnimationFrame(() => [...$('list').querySelectorAll('.row')].forEach((el, i) => { el.querySelector('.fill').style.width = ((r.probabilities[order[i]] || 0) * 100) + '%'; }));
}
function addHistory(r) {
  const s = document.createElement('span'); s.className = r.forced ? '' : 'jev';
  s.textContent = `${LINE_KO[r.line]} ${r.path.length}`; $('history').appendChild(s);
}

async function scramble() {
  const r = await (await fetch('/api/scramble')).json();
  board = r.board; region = [0, 0]; moves = 0; requests = 0; forced = 0; fixed = new Set(); lineTiles = new Set();
  resetPos(); draw(); stats(); $('list').innerHTML = '<div class="empty">Jev 시작을 누르면 결정마다 확률이 여기 그려진다.</div>'; $('history').innerHTML = '';
  gauge('gProg', 0); setStatus('섞음');
}

async function playPath(path) {
  for (const d of path) {
    const bi = board.indexOf(0), off = { up: COLS, down: -COLS, left: 1, right: -1 }[d];
    const ti = bi + off, t = board[ti];
    await animateTo(t, bi % COLS, Math.floor(bi / COLS), SLIDE_MS);
    board[bi] = t; board[ti] = 0; moves++;
    if (moves % 3 === 0) stats();
  }
  stats();
}
async function stepOnce() {
  setStatus('Jev에게 묻는 중', 'hot');
  const res = await fetch('/api/peel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ board, region, hinted: q.get('hint') !== '0' }) });
  if (!res.ok) { setStatus('오류 ' + res.status, 'hot'); playing = false; return; }
  const r = await res.json();
  if (r.line !== 'end') {
    if (r.forced) { forced++; $('lat').textContent = '선택지 하나, 묻지 않음'; }
    else { requests++; $('lat').textContent = r.latency_ms + ' ms'; gauge('gProg', r.progress / 3); }
    renderCandidates(r);
    setStatus(r.forced ? `${LINE_KO[r.line]} (유일한 줄)` : `${LINE_KO[r.line]}  ${(r.probabilities[r.line] || 0).toFixed(2)}`);
  } else setStatus('마지막 2×2');
  lineTiles = new Set(r.tiles); draw();
  await playPath(r.path);
  addHistory(r);
  r.tiles.forEach(t => fixed.add(t)); lineTiles = new Set(); region = r.region; draw();
  if (r.solved) { document.body.classList.add('flash'); setTimeout(() => document.body.classList.remove('flash'), 200); draw(); setStatus(`완성 - ${moves}수, 결정 ${requests}번`, 'ok'); playing = false; }
}
async function play() {
  if (playing) { playing = false; $('play').textContent = 'Jev 시작'; return; }
  if (key(board) === key(solvedBoard())) await scramble();
  playing = true; $('play').textContent = '멈춤';
  try { while (playing) { await stepOnce(); if (q.get('demo') && playing) await new Promise(r => setTimeout(r, 500)); } } finally { playing = false; $('play').textContent = 'Jev 시작'; }
}
$('scramble').onclick = scramble; $('play').onclick = play;
window.__jev = { get moves() { return moves; }, get playing() { return playing; }, get solved() { return key(board) === key(solvedBoard()); }, get requests() { return requests; } };

drawRef(); fit();
// ---- demo mode: ?demo=1 scrambles and plays by itself (requests are real). ?slide=<ms> per slide.
if (q.get('demo')) { setTimeout(async () => { await scramble(); await new Promise(r => setTimeout(r, 1200)); await play(); document.title = `demo done · ${moves}수 · 결정 ${requests}`; }, 800); }
</script>
</body>
</html>
