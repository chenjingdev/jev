<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev가 플레이하는 테트리스</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel-2: #171b25;
    --line: #232838;
    --text: #e6e9f2;
    --muted: #7d859c;
    --accent: #c084fc;
    --accent-2: #22d3ee;
    --warn: #f87171;
    --ok: #4ade80;
    --cell: 30px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", system-ui, "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1.45;
    overflow: hidden;
  }
  .mono, .stat .v, .hero .v, .cand .pct, .slider .val {
    font-family: "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 14px 24px 8px;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; font-weight: 800; }
  header h1 em { font-style: normal; color: var(--accent); }
  header .hook { color: var(--text); font-size: 13px; opacity: .85; }
  header .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
  header .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); display: inline-block; margin-right: 5px;
    transition: background .2s;
  }
  header .dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  header .dot.busy { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  header .dot.err { background: var(--warn); box-shadow: 0 0 8px var(--warn); }

  main {
    display: flex; gap: 24px; padding: 6px 24px 16px;
    height: calc(100% - 52px);
    align-items: flex-start; justify-content: center;
  }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .col-board { flex: 0 0 auto; }
  /* --side-w is set by app.js: board height minus board width, so board + panel form a square */
  .col-side { width: var(--side-w, 400px); height: var(--col-h, auto); flex: 0 0 auto; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    min-height: 0;
  }
  .card h2 {
    margin: 0 0 10px; font-size: 11px; font-weight: 700;
    color: var(--muted); letter-spacing: .1em; text-transform: uppercase;
  }

  .board-wrap { position: relative; padding: 0; border-radius: 10px; overflow: hidden;
    border: 1px solid #2a3044; background: #080a0e; line-height: 0;
    box-shadow: 0 0 0 1px #0b0d12, 0 0 48px rgba(192, 132, 252, .18), 0 24px 60px rgba(0,0,0,.5); }
  #board { display: block; }

  .below-board { display: flex; gap: 14px; align-items: center; padding: 10px 14px; }
  #next { display: block; }
  .phase { flex: 1; color: var(--muted); font-size: 12px; }
  .phase b { color: var(--text); font-weight: 700; display: block; font-size: 15px; }


  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .hero > div { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
  .hero .k { color: var(--muted); font-size: 11px; }
  .hero .v { font-size: 26px; font-weight: 700; line-height: 1.15; }
  .hero .v small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 2px; }
  .hero .v.accent { color: var(--accent-2); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 8px; }
  .stat { background: var(--panel-2); border-radius: 6px; padding: 6px 10px; }
  .stat .k { color: var(--muted); font-size: 10.5px; }
  .stat .v { font-size: 15px; font-weight: 600; }
  .stat .v small { font-size: 10px; color: var(--muted); font-weight: 400; }
  .fine { display: flex; gap: 14px; color: var(--muted); font-size: 11px; margin-top: 8px; }
  .fine b { color: var(--text); font-weight: 500; }


  .card-cands { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .cands { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 0; flex: 1; }
  .cand {
    background: var(--panel-2); border: 1px solid transparent;
    border-radius: 6px; padding: 6px 8px;
  }
  .cand.sel { border-color: var(--accent); background: #1d1630; }
  .cand .row1 { display: flex; align-items: center; gap: 8px; }
  .cand .pct { width: 52px; text-align: right; font-weight: 700; font-size: 14px; }
  .cand .bar { flex: 1; height: 6px; background: #0e1118; border-radius: 3px; overflow: hidden; }
  .cand .bar i { display: block; height: 100%; background: var(--accent-2); border-radius: 3px; }
  .cand.sel .bar i { background: var(--accent); }
  .cand .sum { color: var(--muted); font-size: 12px; margin-top: 3px; word-break: keep-all; }
  .cand.sel .sum { color: var(--text); font-weight: 600; }
  .cands .empty { color: var(--muted); }

  .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button.act {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 5px 11px; font: inherit; font-size: 11.5px; cursor: pointer;
  }
  button.act:hover { border-color: var(--accent); color: var(--accent); }
  .slider { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .slider label { color: var(--muted); font-size: 11px; white-space: nowrap; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .slider .val { width: 54px; text-align: right; font-variant-numeric: tabular-nums; }

  #toast {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%) translateY(-150%);
    background: #3b1418; border: 1px solid var(--warn); color: #ffd9dc;
    padding: 8px 14px; border-radius: 8px; font-size: 12px; z-index: 30;
    transition: transform .25s ease, opacity .25s ease;
    max-width: 70vw; opacity: 0; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(8, 10, 14, .86); backdrop-filter: blur(2px); z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: 19px; font-weight: 700; letter-spacing: .04em; }
  .overlay .res { color: var(--muted); text-align: center; }

  /* ---- phone / narrow: one column, board first, page scrolls vertically ---- */
  @media (max-width: 900px) {
    html, body { height: auto; }
    body { overflow: visible; }

    header { flex-wrap: wrap; gap: 3px 10px; padding: 12px 16px 8px; }

    main {
      display: flex; flex-direction: column; gap: 10px;
      height: auto; padding: 0 16px 16px; align-items: stretch;
    }
    /* the three desktop columns stop generating boxes so their cards stack directly */
    .col { display: contents; }
    main { padding: 0 16px 16px; }

    .col-board > .board-wrap { order: 1; align-self: center; max-width: 100%; }
    .col-board > .below-board { order: 2; }
    .col-side > .card:nth-child(1) { order: 3; }  /* 통계 */
    .col-side > .card:nth-child(2) { order: 4; }  /* 후보 상위 5 */
    .col-side > .card:nth-child(3) { order: 5; }  /* 컨트롤 */

    .below-board { padding: 8px 10px; gap: 10px; }
    #next { flex: 0 0 auto; }

    /* 16px+ keeps iOS from zooming the page when a field takes focus */
    input, button.act { font-size: 16px; }
    button.act { min-height: 36px; padding: 0 14px; font-size: 13px; }

    .stats { grid-template-columns: repeat(2, 1fr); }

    .card-cands { flex: 0 0 auto; }
    .cands { overflow-y: visible; flex: 0 0 auto; }
    .cand .sum {
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    #toast {
      left: 16px; right: 16px; max-width: none;
      transform: translateY(-150%);
    }
    #toast.show { transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="toast"></div>

<header>
  <h1><em>Jev</em>가 플레이하는 테트리스</h1>
  <span class="hook">조각마다 가능한 착지 자리 전부를 Jev에게 한 번에 묻고, 돌아온 확률을 보드에 그립니다.</span>
  <span class="sub"><span class="dot" id="dot"></span><span id="status">준비</span> · TypeSafe System One · jev-latest</span>
</header>

<main>
  <!-- 보드 -->
  <section class="col col-board">
    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div class="overlay hidden" id="gameover">
        <div class="big">게임 오버</div>
        <div class="res" id="goRes"></div>
        <button class="act" id="btnNew2">새 게임</button>
      </div>
    </div>
    <div class="card below-board">
      <div>
        <div style="color:var(--muted);font-size:10px;margin-bottom:3px">다음</div>
        <canvas id="next"></canvas>
      </div>
      <div class="phase"><b id="phaseName">대기</b><span id="phaseNote">시작하는 중…</span></div>
    </div>
  </section>

  <!-- 통계 + 후보 -->
  <section class="col col-side">
    <div class="card">
      <h2>통계</h2>
      <div class="hero">
        <div><div class="k">평균 응답 · 조각당 호출 1회</div><div class="v accent" id="stAvg">–</div></div>
        <div><div class="k">비용 · 이번 판</div><div class="v" id="stCost">$0</div></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">조각</div><div class="v" id="stPieces">0</div></div>
        <div class="stat"><div class="k">줄</div><div class="v" id="stLines">0</div></div>
        <div class="stat"><div class="k">점수</div><div class="v" id="stScore">0</div></div>
        <div class="stat"><div class="k">T스핀</div><div class="v" id="stTspins">0</div></div>
        <div class="stat"><div class="k">확신도</div><div class="v" id="stConf">–</div></div>
        <div class="stat"><div class="k">비용(누적)</div><div class="v" id="stCostAll">$0</div></div>
      </div>
      <div class="fine"><span>토큰(이번 판) <b id="stTok">0</b></span></div>
    </div>

    <div class="card card-cands">
      <h2>Jev의 확률 분포 · 상위 5</h2>
      <div class="cands" id="cands"><div class="empty">첫 조각을 기다리는 중…</div></div>
    </div>

    <div class="card">
      <h2>컨트롤</h2>
      <div class="controls">
        <button class="act" id="btnPause">일시정지</button>
        <button class="act" id="btnNew">새 게임</button>
      </div>
      <div class="slider">
        <label for="speed">잠금 후 대기</label>
        <input type="range" id="speed" min="0" max="1500" step="50" value="300">
        <span class="val" id="speedVal">300ms</span>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/public/app.js"></script>
</body>
</html>
