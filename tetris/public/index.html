<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev가 플레이하는 테트리스</title>
<!-- an empty data: icon stops the browser requesting /favicon.ico on every load -->
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel-2: #171b25;
    --line: #232838;
    --text: #e6e9f2;
    --muted: #7d859c;
    --accent: #c084fc;
    --accent-2: #22d3ee;
    --warn: #f87171;
    --ok: #4ade80;
    --cell: 30px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", system-ui, "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1.45;
    overflow: hidden;
  }
  .mono, .stat .v, .hero .v, .slider .val, #props .pct, #thought, #verdictLine {
    font-family: "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 14px 24px 8px;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; font-weight: 800; }
  header h1 em { font-style: normal; color: var(--accent); }
  header .hook { color: var(--text); font-size: 13px; opacity: .85; }
  header .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
  header .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); display: inline-block; margin-right: 5px;
    transition: background .2s;
  }
  header .dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  header .dot.busy { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  header .dot.err { background: var(--warn); box-shadow: 0 0 8px var(--warn); }

  main {
    position: relative; /* #synapses is laid over main */
    display: flex; gap: 24px; padding: 6px 24px 16px;
    height: calc(100% - 52px);
    align-items: flex-start; justify-content: center;
  }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .col-board { flex: 0 0 auto; }
  /* --side-w / --col-h are set by app.js: board column height minus board width, so board +
     panel form a square. Four cards of fixed content can exceed that height on a short
     viewport, so the panel scrolls instead of clipping the controls. */
  .col-side {
    width: var(--side-w, 400px); height: var(--col-h, auto); flex: 0 0 auto;
    overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; scrollbar-width: thin;
  }
  .col-side > .card { flex: 0 0 auto; }
  /* Wide screens: the panel wraps into a second column (피질·제안 | 통계·컨트롤) instead of
     scrolling; the explicit width is needed because a wrapped column flex container does not
     grow to fit its columns on its own. 16:10 is where board + two panel columns fit. */
  @media (min-width: 1200px) and (min-aspect-ratio: 16/10) {
    .col-side {
      width: calc(var(--side-w, 400px) * 2 + 24px);
      flex-flow: column wrap; align-content: flex-start; row-gap: 12px; column-gap: 24px;
      scrollbar-gutter: auto; /* a reserved gutter would push the second column out of the box */
    }
    .col-side > .card { width: var(--side-w, 400px); }
  }

  /* Synapse lines from the cortex circles to the ghosts on the board (drawn by app.js). */
  #synapses { display: none !important; }
  #synapses-unused {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 5; overflow: visible;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    min-height: 0;
  }
  .card h2 {
    margin: 0 0 8px; font-size: 11px; font-weight: 700;
    color: var(--muted); letter-spacing: .1em; text-transform: uppercase;
  }

  /* --lead is the leading intent's hue (set by app.js); the glow follows it. */
  .board-wrap { position: relative; padding: 0; border-radius: 10px; overflow: hidden;
    border: 1px solid #2a3044; background: #080a0e; line-height: 0;
    box-shadow: 0 0 0 1px #0b0d12,
      0 0 48px color-mix(in srgb, var(--lead, var(--accent)) 22%, transparent),
      0 24px 60px rgba(0,0,0,.5);
    transition: box-shadow .3s ease; }
  #board { display: block; }

  .below-board { display: flex; gap: 14px; align-items: center; padding: 10px 14px; }
  #next { display: block; }
  .next-k { color: var(--muted); font-size: 10px; margin-bottom: 3px; }
  #queueText { color: var(--muted); font-weight: 400; margin-left: 6px; letter-spacing: .08em; }
  .phase { flex: 1; color: var(--muted); font-size: 12px; min-width: 0; }
  .phase b { color: var(--text); font-weight: 700; display: block; font-size: 15px; }

  /* ---- cortex card ---- */
  .card-cortex { display: flex; flex-direction: column; }
  #cortex { display: block; width: 100%; height: auto; aspect-ratio: 400 / 330; overflow: visible; }
  #verdictLine {
    min-height: 16px; margin-top: 2px; font-size: 10.5px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #verdictLine .cx-fork {
    display: inline-block; padding: 0 4px; border-radius: 3px; margin-right: 2px;
    font-size: 9px; font-weight: 800; color: #0b0d12; letter-spacing: .04em; vertical-align: 1px;
  }
  #timeline { display: flex; gap: 1px; margin-top: 6px; height: 7px; }
  #timeline i {
    display: block; flex: 1 1 0; max-width: 7px; min-width: 0; height: 7px; position: relative;
    background: #1a1e2a; border-radius: 1px;
  }
  #timeline i.veto { outline: 1px solid var(--warn); outline-offset: -1px; }
  #timeline i.hold::after {
    content: ""; position: absolute; left: 2px; top: 2px; width: 3px; height: 3px;
    border-radius: 50%; background: #fff;
  }
  #thought {
    margin-top: 6px; min-height: 15px; font-size: 10.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---- proposals card: rows are built by app.js (6.4); these are the styles it can use ---- */
  #props { display: flex; flex-direction: column; gap: 6px; }
  #props .empty { color: var(--muted); }
  #props .prop {
    background: var(--panel-2); border: 1px solid transparent; border-radius: 6px; padding: 6px 8px;
  }
  #props .prop.sel { border-color: rgba(255,255,255,.55); }
  #props .prop.veto { opacity: .6; }
  #props .row1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #props .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  #props .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  #props .pct { width: 46px; text-align: right; font-weight: 700; font-size: 14px; }
  #props .tag {
    font-size: 9px; font-weight: 800; letter-spacing: .04em; padding: 1px 5px; border-radius: 3px;
    background: rgba(255,255,255,.12); color: var(--text);
  }
  #props .tag.veto { background: var(--warn); color: #fff; }
  #props .tag.alt { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
  #props .bars { display: flex; gap: 6px; margin-top: 4px; align-items: center; }
  #props .bars .bar {
    display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0;
    font-size: 10px; color: var(--muted);
  }
  #props .bars .bar b { flex: 1; height: 6px; background: #0e1118; border-radius: 3px; overflow: hidden; }
  #props .bars .bar b i { display: block; height: 100%; border-radius: 3px; }

  /* ---- stats card ---- */
  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .hero > div { background: var(--panel-2); border-radius: 8px; padding: 8px 12px; }
  .hero .k { color: var(--muted); font-size: 11px; }
  .hero .v { font-size: 24px; font-weight: 700; line-height: 1.15; }
  .hero .v small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 2px; }
  .hero .v.accent { color: var(--accent-2); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 8px; }
  .stat { background: var(--panel-2); border-radius: 6px; padding: 5px 10px; }
  .stat .k { color: var(--muted); font-size: 10.5px; }
  .stat .v { font-size: 15px; font-weight: 600; }
  .stat .v small { font-size: 10px; color: var(--muted); font-weight: 400; }
  .fine { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 11px; margin-top: 8px; }
  .fine b { color: var(--text); font-weight: 500; }

  /* ---- controls card ---- */
  .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .controls .toggles { display: flex; gap: 12px; margin-left: auto; }
  .controls label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 11.5px; cursor: pointer; }
  .controls input[type=checkbox] { accent-color: var(--accent); margin: 0; }
  button.act {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 5px 11px; font: inherit; font-size: 11.5px; cursor: pointer;
  }
  button.act:hover { border-color: var(--accent); color: var(--accent); }
  .slider { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .slider label { color: var(--muted); font-size: 11px; white-space: nowrap; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .slider .val { width: 54px; text-align: right; font-variant-numeric: tabular-nums; }

  #toast {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%) translateY(-150%);
    background: #3b1418; border: 1px solid var(--warn); color: #ffd9dc;
    padding: 8px 14px; border-radius: 8px; font-size: 12px; z-index: 30;
    transition: transform .25s ease, opacity .25s ease;
    max-width: 70vw; opacity: 0; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(8, 10, 14, .86); backdrop-filter: blur(2px); z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: 19px; font-weight: 700; letter-spacing: .04em; }
  .overlay .res { color: var(--muted); text-align: center; }

  /* ---- phone / narrow: one column, board first, page scrolls vertically ---- */
  @media (max-width: 900px) {
    html, body { height: auto; }
    body { overflow: visible; }

    header { flex-wrap: wrap; gap: 3px 10px; padding: 12px 16px 8px; }

    main {
      display: flex; flex-direction: column; gap: 10px;
      height: auto; padding: 0 16px 16px; align-items: stretch;
    }
    /* the desktop columns stop generating boxes so their cards stack directly, in 6.8 order */
    .col { display: contents; }
    .col-side { overflow: visible; }

    .board-wrap { order: 1; align-self: center; max-width: 100%; }
    .below-board { order: 2; }
    .card-cortex { order: 3; }
    .card-props { order: 4; }
    .card-stats { order: 5; }
    .card-controls { order: 6; }

    #synapses { display: none; }

    .below-board { padding: 8px 10px; gap: 10px; }
    #next { flex: 0 0 auto; }

    /* the SVG scales with the card, so give it the width: less padding here */
    .card-cortex { padding: 10px 8px; }
    #thought { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
      -webkit-box-orient: vertical; }

    /* 16px+ keeps iOS from zooming the page when a field takes focus */
    input, button.act { font-size: 16px; }
    button.act { min-height: 36px; padding: 0 14px; font-size: 13px; }
    .controls input[type=checkbox] { width: 16px; height: 16px; }
    .controls .toggles { margin-left: 0; width: 100%; }

    .stats { grid-template-columns: repeat(3, 1fr); gap: 4px 6px; }
    .stat { padding: 4px 8px; }

    #toast {
      left: 16px; right: 16px; max-width: none;
      transform: translateY(-150%);
    }
    #toast.show { transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="toast"></div>

<header>
  <h1><em>Jev</em>가 플레이하는 테트리스</h1>
  <span class="hook">조각마다 엔진이 보고, 다섯 의도 뉴런이 발화하고, 운동 뉴런들이 자리를 제안하고, 중재와 코치가 동시에 심사한다.</span>
  <span class="sub"><span class="dot" id="dot"></span><span id="status">준비</span> · TypeSafe System One · jev-latest</span>
</header>

<main>
  <!-- 보드 -->
  <section class="col col-board">
    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div class="overlay hidden" id="gameover">
        <div class="big">게임 오버</div>
        <div class="res" id="goRes"></div>
        <button class="act" id="btnNew2">새 게임</button>
      </div>
    </div>
    <div class="card below-board">
      <div>
        <div class="next-k">다음<span id="queueText"></span></div>
        <canvas id="next"></canvas>
      </div>
      <div class="phase"><b id="phaseName">대기</b><span id="phaseNote">시작하는 중…</span></div>
    </div>
  </section>

  <!-- 피질 · 제안 · 통계 · 컨트롤 -->
  <section class="col col-side">
    <div class="card card-cortex">
      <h2>피질</h2>
      <svg id="cortex" viewBox="0 0 400 390" width="100%" aria-label="피질: 감각, 의도 뉴런, 제안, 판정"></svg>
      <div id="verdictLine" class="mono"></div>
      <div id="timeline"></div>
      <div id="thought" class="mono"></div>
    </div>

    <div class="card card-props">
      <h2>제안</h2>
      <div id="props"><div class="empty">첫 조각을 기다리는 중…</div></div>
    </div>

    <div class="card card-stats">
      <h2>통계</h2>
      <div class="hero">
        <div><div class="k" id="stAvgLabel">평균 응답 · 조각당 호출 3회</div><div class="v accent" id="stAvg">–</div></div>
        <div><div class="k">비용 · 이번 판</div><div class="v" id="stCost">$0</div></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">조각</div><div class="v" id="stPieces">0</div></div>
        <div class="stat"><div class="k">줄</div><div class="v" id="stLines">0</div></div>
        <div class="stat"><div class="k">점수</div><div class="v" id="stScore">0</div></div>
        <div class="stat"><div class="k">T스핀</div><div class="v" id="stTspins">0</div></div>
        <div class="stat"><div class="k">불일치</div><div class="v" id="stDisagree">0</div></div>
        <div class="stat"><div class="k">뒤집기</div><div class="v" id="stOverride">0</div></div>
        <div class="stat"><div class="k">거부</div><div class="v" id="stVeto">0</div></div>
        <div class="stat"><div class="k">바꿈</div><div class="v" id="stChanged">0</div></div>
        <div class="stat"><div class="k">확신도</div><div class="v" id="stConf">–</div></div>
      </div>
      <div class="fine">
        <span>R1 <b id="stR1">–</b> · R2 <b id="stR2">–</b> · R3 <b id="stR3">–</b> ms</span>
        <span>토큰 <b id="stTok">0</b></span>
        <span>비용(누적) <b id="stCostAll">$0</b></span>
      </div>
    </div>

    <div class="card card-controls">
      <h2>컨트롤</h2>
      <div class="controls">
        <button class="act" id="btnPause">일시정지</button>
        <button class="act" id="btnNew">새 게임</button>
        <span class="toggles">
          <label><input type="checkbox" id="optNeurons" checked> 뉴런</label>
          <label><input type="checkbox" id="optPrefetch"> 미리 묻기</label>
        </span>
      </div>
      <div class="slider">
        <label for="speed">잠금 후 대기</label>
        <input type="range" id="speed" min="0" max="1500" step="50" value="0">
        <span class="val" id="speedVal">0ms</span>
      </div>
    </div>
  </section>

  <svg id="synapses" aria-hidden="true"></svg>
</main>

<script type="module" src="/public/app.js"></script>
</body>
</html>
