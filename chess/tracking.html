<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jev 기물 추적</title><style>
:root{color-scheme:light dark;--bg:#f5f5f2;--panel:#fff;--ink:#222;--muted:#666;--line:#ddd;--accent:#2869bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}main{max-width:1350px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(420px,1fr) 400px;gap:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}h1{font-size:19px;margin:0 0 8px}h2{font-size:14px;margin:12px 0 6px}.muted{font-size:12px;color:var(--muted)}label{display:block;margin:10px 0}select,input,button{font:inherit}select{max-width:100%}button{background:var(--accent);color:white;padding:8px 16px;border:0;border-radius:7px;cursor:pointer}button:disabled{opacity:.5}#board svg{width:100%;height:auto;display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.4 ui-monospace,monospace;max-height:220px;overflow:auto}#verdict{font-size:27px;font-weight:700}.hit{color:#208447}.miss{color:#be3030}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:5px;border-bottom:1px solid var(--line)}a{color:var(--accent)}@media(prefers-color-scheme:dark){:root{--bg:#151515;--panel:#202020;--ink:#eee;--muted:#aaa;--line:#383838;--accent:#5d9eeb}}@media(max-width:900px){main{grid-template-columns:1fr}}
</style></head><body><main><section><div id="board"></div><div class="card"><h2>현재 위치</h2><pre id="fen"></pre><div id="source" class="muted"></div><table id="all"></table></div></section><aside>
<div class="card"><h1>원래 기물의 현재 위치</h1><div class="muted">출발 칸으로 16개 기물을 구분합니다. 잡히면 not_on_board. 같은 기보를 보고 16개 질문에 각각 답합니다.</div></div>
<div class="card"><label>대국 <input id="index" type="number" min="1" max="10" value="1" style="width:65px"></label><label>기보 길이 <select id="plies"><option value="12">12회 착수 · 6턴</option><option value="36">36회 착수 · 18턴</option><option value="60">60회 착수 · 30턴</option></select></label><label>검사 <select id="condition"><option value="base">원본</option><option value="repeat">같은 요청 반복</option><option value="shuffle">선택지 순서 변경</option></select></label><button id="ask">16개 기물 묻기</button><div class="muted">선택한 길이 전에 종료된 대국은 검사할 수 없습니다.</div></div>
<div class="card"><h2>응답</h2><div id="verdict"></div><label>상세 보기 <select id="piece"></select></label><div id="detail"></div><table id="probabilities"></table></div>
<div class="card"><h2>실제 모델 입력</h2><pre id="state"></pre><h2>선택한 질문</h2><pre id="question"></pre><h2>선택지</h2><pre id="options"></pre><a href="/">기본 체스 실험</a></div>
</aside></main><script>
const $=id=>document.getElementById(id);let last=null;
const names={knight:'나이트',bishop:'비숍',rook:'룩',queen:'퀸',king:'킹'};
function label(a){return `${a.colour==='white'?'백':'흑'} ${names[a.kind]} · 출발 ${a.origin}`;}
function detail(){if(!last)return;const a=last.answers.find(a=>a.id===$('piece').value);$('detail').textContent=`정답 ${a.target} · 선택 ${a.pick}`;$('probabilities').innerHTML=Object.entries(a.probabilities).map(([k,p])=>`<tr><td>${k}${k===a.target?' ✓':''}</td><td>${Math.round(p*100)}%</td></tr>`).join('');$('question').textContent=last.request.questions[a.id].instructions;$('options').textContent=JSON.stringify(last.request.questions[a.id].criteria,null,2);}
async function ask(){const controls=['index','plies','condition','ask'].map($);controls.forEach(el=>el.disabled=true);$('verdict').textContent='측정 중…';try{const response=await fetch('/api/tracking',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({index:+$('index').value,plies:+$('plies').value,condition:$('condition').value})});const r=await response.json();if(!response.ok)throw new Error(r.error);last=r;$('board').innerHTML=r.svg;$('fen').textContent=r.fen;$('source').textContent=`Lichess 대국 ${r.game_id} · ${r.plies}회 착수`;$('verdict').textContent=`${r.answers.filter(a=>a.hit).length}/16 적중 · ${r.latency_ms} ms`;$('piece').innerHTML=r.answers.map(a=>`<option value="${a.id}">${label(a)}</option>`).join('');$('all').innerHTML='<tr><th>기물</th><th>정답</th><th>Jev</th></tr>'+r.answers.map(a=>`<tr class="${a.hit?'hit':'miss'}"><td>${label(a)}</td><td>${a.target}</td><td>${a.pick}</td></tr>`).join('');$('state').textContent=JSON.stringify(r.request.state,null,2);detail();}catch(e){$('verdict').textContent=e.message;}finally{controls.forEach(el=>el.disabled=false);}}
$('ask').addEventListener('click',ask);$('piece').addEventListener('change',detail);ask();
</script></body></html>
