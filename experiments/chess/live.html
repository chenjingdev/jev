<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev 체스 라이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.brown.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.cburnett.css">
<style>
  :root {
    --bg: #14171c;
    --panel: #1d2128;
    --panel-2: #252a33;
    --line: #333a45;
    --fg: #e6e9ef;
    --muted: #9aa4b2;
    --jev: #7ee081;
    --warn: #e0a800;
    --bad: #e05a4f;
    --good: #4fa3e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 ui-sans-serif, -apple-system, "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
    padding: 12px 16px 48px;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  header.top {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 12px;
  }
  .sub { color: var(--muted); font-size: 12px; }
  #conn.off { color: var(--bad); }
  #conn.on { color: var(--jev); }

  .strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 9px; font-size: 12px; white-space: nowrap;
  }
  .chip b { font-weight: 600; }
  .chip .w { color: var(--jev); } .chip .d { color: var(--muted); } .chip .l { color: var(--bad); }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } body { padding: 10px 12px 40px; } }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  }
  .card .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 12px; }
  .card .hd .cell { font-weight: 650; }
  .card .hd .who { color: var(--muted); }
  .board { width: 100%; aspect-ratio: 1 / 1; }
  .board .cg-wrap { width: 100%; height: 100%; }
  .card .ft { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; min-height: 18px; }
  .card .ft .san { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .card .ft .cp.ok { color: var(--jev); } .card .ft .cp.mid { color: var(--warn); } .card .ft .cp.bad { color: var(--bad); }
  .card .ft .done { color: var(--good); font-weight: 600; }
  .card.idle { opacity: 0.45; }

  table { border-collapse: collapse; width: 100%; margin-top: 22px; font-size: 12.5px; }
  caption { text-align: left; font-weight: 650; padding-bottom: 6px; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: right; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--muted); font-weight: 500; }
  tbody tr:hover { background: var(--panel-2); }

  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
</style>
</head>
<body>
<header class="top">
  <h1>Jev 체스 라이브</h1>
  <span class="sub" id="progress">대기 중</span>
  <span class="sub off" id="conn">연결 중…</span>
</header>

<div class="strip" id="strip"></div>
<div class="grid" id="grid"></div>

<div class="legend">
  <span><i style="background:#15781B"></i>확률 ≥ 0.50</span>
  <span><i style="background:#1e6fd9"></i>≥ 0.25</span>
  <span><i style="background:#e0a800"></i>≥ 0.10</span>
  <span><i style="background:#8a8a8a"></i>그 외</span>
  <span><i style="background:#c0392b"></i>Stockfish 최선수</span>
</div>

<table id="summary">
  <caption>셀별 요약</caption>
  <thead>
    <tr><th>셀</th><th>판</th><th>승</th><th>무</th><th>패</th><th>미완</th><th>오류</th>
        <th>평균 cp손실</th><th>중앙값</th><th>평균 확신도</th><th>블런더율</th></tr>
  </thead>
  <tbody><tr><td colspan="11" style="text-align:center;color:var(--muted)">아직 결과 없음</td></tr></tbody>
</table>

<script type="module">
import { Chessground } from 'https://cdn.jsdelivr.net/npm/chessground@9.2.1/dist/chessground.min.js';

const MAX_SLOTS = 4;
const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

const BRUSHES = {
  p1:   { key: 'jp1', color: '#15781B', opacity: 0.95, lineWidth: 12 },
  p2:   { key: 'jp2', color: '#1e6fd9', opacity: 0.80, lineWidth: 10 },
  p3:   { key: 'jp3', color: '#e0a800', opacity: 0.62, lineWidth: 8 },
  p4:   { key: 'jp4', color: '#8a8a8a', opacity: 0.42, lineWidth: 6 },
  best: { key: 'jbs', color: '#c0392b', opacity: 0.85, lineWidth: 5 },
};

const brushFor = p => (p >= 0.5 ? 'p1' : p >= 0.25 ? 'p2' : p >= 0.1 ? 'p3' : 'p4');
const sq = (uci, i) => (typeof uci === 'string' && uci.length >= 4 ? uci.slice(i, i + 2) : null);
const turnOf = fen => (String(fen).split(' ')[1] === 'b' ? 'black' : 'white');
const num = (v, d = 1) => (typeof v === 'number' ? v.toFixed(d) : '–');
const pct = v => (typeof v === 'number' ? (v * 100).toFixed(0) + '%' : '–');

const gridEl = document.getElementById('grid');
const stripEl = document.getElementById('strip');
const progEl = document.getElementById('progress');
const connEl = document.getElementById('conn');
const summaryBody = document.querySelector('#summary tbody');

const slots = new Map();   // slot index -> slot object
const gameSlot = new Map(); // game_id -> slot index

function makeSlot(index) {
  const card = document.createElement('div');
  card.className = 'card idle';
  card.innerHTML =
    '<div class="hd"><span class="cell">–</span><span class="who"></span></div>' +
    '<div class="board"></div>' +
    '<div class="ft"></div>';
  gridEl.appendChild(card);
  const boardEl = card.querySelector('.board');
  const cg = Chessground(boardEl, {
    fen: START_FEN,
    viewOnly: true,
    coordinates: true,
    animation: { enabled: true, duration: 140 },
    highlight: { lastMove: true, check: true },
    drawable: { enabled: false, visible: true, autoShapes: [], brushes: BRUSHES },
  });
  const slot = { index, card, cg, gameId: null, cellEl: card.querySelector('.cell'),
                 whoEl: card.querySelector('.who'), ftEl: card.querySelector('.ft') };
  slots.set(index, slot);
  return slot;
}

function slotFor(index) {
  if (index === null || index === undefined || index >= MAX_SLOTS) return null;
  return slots.get(index) || makeSlot(index);
}

function onGameStart(d) {
  const slot = slotFor(d.slot);
  if (!slot) return;
  if (slot.gameId !== null) gameSlot.delete(slot.gameId);
  slot.gameId = d.game_id;
  gameSlot.set(d.game_id, slot.index);
  slot.card.classList.remove('idle');
  slot.cellEl.textContent = `${d.style} vs ${d.opponent}`;
  slot.whoEl.textContent = `#${d.game_id} · Jev=${d.jev_color}`;
  slot.ftEl.innerHTML = '<span>시작</span>';
  slot.cg.set({
    fen: START_FEN,
    orientation: d.jev_color === 'black' ? 'black' : 'white',
    turnColor: 'white',
    lastMove: undefined,
    check: false,
    drawable: { autoShapes: [] },
  });
}

function shapesFor(d) {
  if (d.by !== 'jev') return [];
  const shapes = [];
  for (const row of d.top5 || []) {
    const [, uci, p] = row;
    const orig = sq(uci, 0), dest = sq(uci, 2);
    if (!orig || !dest) continue;
    shapes.push({ orig, dest, brush: brushFor(p) });
  }
  const bo = sq(d.best_uci, 0), bd = sq(d.best_uci, 2);
  if (bo && bd) shapes.push({ orig: bo, dest: bd, brush: 'best', modifiers: { lineWidth: 5 } });
  return shapes;
}

function onMove(d) {
  const index = gameSlot.get(d.game_id);
  const slot = index === undefined ? null : slots.get(index);
  if (!slot || slot.gameId !== d.game_id) return;
  const from = sq(d.uci, 0), to = sq(d.uci, 2);
  slot.cg.set({
    fen: d.fen,
    turnColor: turnOf(d.fen),
    lastMove: from && to ? [from, to] : undefined,
    drawable: { autoShapes: shapesFor(d) },
  });
  const moveNo = Math.floor(d.ply / 2) + 1;
  const bits = [`<span>${moveNo}${d.ply % 2 === 0 ? '.' : '…'}</span>`,
                `<span class="san">${d.san}</span>`];
  if (d.by === 'jev') {
    bits.push(`<span>확신 ${pct(d.confidence)}</span>`);
    const cls = d.cp_loss >= 300 ? 'bad' : d.cp_loss >= 100 ? 'mid' : 'ok';
    bits.push(`<span class="cp ${typeof d.cp_loss === 'number' ? cls : ''}">cp −${typeof d.cp_loss === 'number' ? d.cp_loss : '–'}</span>`);
  } else {
    bits.push('<span>상대</span>');
  }
  slot.ftEl.innerHTML = bits.join('');
}

function onGameEnd(d) {
  const index = gameSlot.get(d.game_id);
  const slot = index === undefined ? null : slots.get(index);
  if (!slot || slot.gameId !== d.game_id) return;
  slot.ftEl.innerHTML =
    `<span class="done">${d.result} · ${d.outcome}</span>` +
    `<span>${d.plies}수</span>` +
    `<span>평균 cp손실 ${num(d.mean_cp_loss)}</span>`;
  slot.card.classList.add('idle');
}

function onSummary(d) {
  const cells = d.cells || {};
  const keys = Object.keys(cells).sort();
  progEl.textContent = `${d.done ?? 0} / ${d.total ?? 0} 판 완료`;

  stripEl.innerHTML = keys.map(k => {
    const c = cells[k];
    return `<span class="chip"><b>${k}</b> <span class="w">${c.win}승</span> ` +
           `<span class="d">${c.draw}무</span> <span class="l">${c.loss}패</span></span>`;
  }).join('') || '<span class="chip">아직 끝난 판 없음</span>';

  summaryBody.innerHTML = keys.length
    ? keys.map(k => {
        const c = cells[k];
        return `<tr><td>${k}</td><td>${c.games}</td><td>${c.win}</td><td>${c.draw}</td>` +
               `<td>${c.loss}</td><td>${c.unfinished}</td><td>${c.error ?? 0}</td>` +
               `<td>${num(c.mean_cp_loss)}</td><td>${num(c.median_cp_loss)}</td>` +
               `<td>${pct(c.mean_conf)}</td><td>${pct(c.blunders)}</td></tr>`;
      }).join('')
    : '<tr><td colspan="11" style="text-align:center;color:var(--muted)">아직 결과 없음</td></tr>';
}

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { connEl.textContent = '연결됨'; connEl.className = 'sub on'; };
  es.onerror = () => { connEl.textContent = '끊김 — 재연결'; connEl.className = 'sub off'; };
  const on = (name, fn) => es.addEventListener(name, e => {
    try { fn(JSON.parse(e.data)); } catch (err) { console.error(name, err); }
  });
  on('game_start', onGameStart);
  on('move', onMove);
  on('game_end', onGameEnd);
  on('summary', onSummary);
}

connect();
</script>
</body>
</html>
