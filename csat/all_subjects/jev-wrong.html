 "수학", "section": "math-common", "number": 12, "selected": "4", "answer": "2", "points": "4", "visual": false, "state": {"question": "등비수열 \\(\\{a_n\\}\\)이\n\n\\[2(a_1+a_4+a_7)=a_4+a_7+a_{10}=6\\]\n\n을 만족시킬 때, \\(a_{10}\\)의 값은? [4점]", "passage": ""}, "options": ["\\(\\frac{22}{7}\\)", "\\(\\frac{24}{7}\\)", "\\(\\frac{26}{7}\\)", "\\(\\frac{30}{7}\\)", "\\(\\frac{32}{7}\\)"], "probs": {"4": 0.39, "3": 0.16, "1": 0.04, "5": 0.14, "2": 0.27}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/math/page-04.jpg", "page": 4}, {"id": "math-common:13", "subject": "수학", "section": "math-common", "number": 13, "selected": "1", "answer": "5", "points": "4", "visual": false, "state": {"question": "함수 \\(f(x)=x^2-4x-3\\)에 대하여 곡선 \\(y=f(x)\\) 위의 점 \\((1,-6)\\)에서의 접선을 \\(l\\)이라 하고, 함수 \\(g(x)=(x^3-2x)f(x)\\)에 대하여 곡선 \\(y=g(x)\\) 위의 점 \\((1,6)\\)에서의 접선을 \\(m\\)이라 하자. 두 직선 \\(l\\), \\(m\\)과 \\(y\\)축으로 둘러싸인 도형의 넓이는? [4점]", "passage": ""}, "options": ["21", "28", "35", "42", "49"], "probs": {"3": 0.18, "2": 0.18, "4": 0.2, "1": 0.23, "5": 0.21}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/math/page-05.jpg", "page": 5}, {"id": "math-common:14", "subject": "수학", "section": "math-common", "number": 14, "selected": "5", "answer": "4", "points": "4", "visual": true, "state": {"question": "그림과 같이 \\(\\overline{AB}=3\\), \\(\\overline{BC}=4\\)이고 \\(\\angle B=\\frac{\\pi}{2}\\)인 직각삼각형 ABC가 있다. 선분 AB를 \\(2:1\\)로 내분하는 점을 D, 점 A를 중심으로 하고 반지름의 길이가 \\(\\overline{AD}\\)인 원이 선분 AC와 만나는 점을 E, 직선 AB가 이 원과 만나는 점 중 D가 아닌 점을 F라 하고, 호 EF 위의 점 G를 \\(\\overline{CG}=2\\sqrt{6}\\)이 되도록 잡는다. 세 점 C, E, G를 지나는 원 위의 점 H가 \\(\\angle HCG=\\angle BAC\\)를 만족시킬 때, 선분 GH의 길이는? [4점]", "passage": "", "visual_description": "점 F, A, D, B가 이 순서로 하나의 수평선 위에 있고, B에서 C까지 수직선분이 위로 이어진다. B에는 AB와 BC가 직각임을 나타내는 작은 사각형 표시가 있다. 선분 AC가 그어져 직각삼각형 ABC를 이루며, A에는 AB와 AC 사이의 각을 표시하는 호가 있다. 중심이 A인 원이 수평선과 F 및 D에서 만나고 선분 AC와 E에서 만난다. G는 이 원의 위쪽 호 EF 위에서 E의 왼쪽에 있다. C, E, G, H를 지나는 또 다른 큰 원이 그려져 있으며, H는 큰 원의 왼쪽 위에 있고 C는 오른쪽에 있다. 선분 HC, HG, GC가 그어져 있고, 선분 CE도 그어져 있다. 작은 원과 큰 원은 G와 E에서 만난다."}, "options": ["\\(\\frac{6\\sqrt{15}}{5}\\)", "\\(\\frac{38\\sqrt{10}}{25}\\)", "\\(\\frac{14\\sqrt{3}}{5}\\)", "\\(\\frac{32\\sqrt{15}}{25}\\)", "\\(\\frac{8\\sqrt{10}}{5}\\)"], "probs": {"2": 0.12, "1": 0.21, "4": 0.26, "5": 0.34, "3": 0.07}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/math/page-05.jpg", "page": 5}, {"id": "math-common:15", "subject": "수학", "section": "math-common", "number": 15, "selected": "2", "answer": "4", "points": "4", "visual": false, "state": {"question": "함수 \\(f(x)\\)가\n\\[\nf(x)=\\begin{cases}\n-x^2 & (x<0)\\\\\nx^2-x & (x\\ge 0)\n\\end{cases}\n\\]\n이고, 양수 \\(a\\)에 대하여 함수 \\(g(x)\\)를\n\\[\ng(x)=\\begin{cases}\nax+a & (x<-1)\\\\\n0 & (-1\\le x<1)\\\\\nax-a & (x\\ge 1)\n\\end{cases}\n\\]\n이라 하자. 함수 \\(h(x)=\\displaystyle\\int_0^x \\bigl(g(t)-f(t)\\bigr)\\,dt\\)가 오직 하나의 극값을 갖도록 하는 \\(a\\)의 최댓값을 \\(k\\)라 하자. \\(a=k\\)일 때, \\(k+h(3)\\)의 값은? [4점]", "passage": ""}, "options": ["\\(\\frac{9}{2}\\)", "\\(\\frac{11}{2}\\)", "\\(\\frac{13}{2}\\)", "\\(\\frac{15}{2}\\)", "\\(\\frac{17}{2}\\)"], "probs": {"3": 0.18, "1": 0.19, "5": 0.2, "2": 0.24, "4": 0.19}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/math/page-06.jpg", "page": 6}, {"id": "math-geometry:25", "subject": "수학", "section": "math-geometry", "number": 25, "selected": "1", "answer": "5", "points": "3", "visual": false, "state": {"question": "좌표공간의 점 \\(\\mathrm{A}\\left(3,-\\frac{3}{2},-2\\right)\\)를 \\(yz\\)평면에 대하여 대칭이동한 점을 \\(\\mathrm{B}\\), 점 \\(\\mathrm{A}\\)를 원점에 대하여 대칭이동한 점을 \\(\\mathrm{C}\\)라 할 때, 선분 \\(\\mathrm{BC}\\)의 길이는? [3점]", "passage": ""}, "options": ["\\(\\sqrt{21}\\)", "\\(\\sqrt{22}\\)", "\\(\\sqrt{23}\\)", "\\(2\\sqrt{6}\\)", "\\(5\\)"], "probs": {"3": 0.17, "1": 0.26, "4": 0.16, "2": 0.16, "5": 0.25}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/math/page-18.jpg", "page": 18}, {"id": "math-geometry:26", "subject": "수학", "section": "math-geometry", "number": 26, "selected": "4", "answer": "2", "points": "3", "visual": false, "state": {"question": "양수 \\(a\\)에 대하여 두 초점이 \\(\\mathrm{F},\\mathrm{F}'\\)인 쌍곡선 \\(\\frac{x^2}{a^2}-\\frac{y^2}{a^2}=-1\\) 위의 점 \\(\\left(a,\\sqrt{2}a\\right)\\)에서의 접선이 \\(y\\)축과 만나는 점을 \\(\\mathrm{P}\\)라 하자. \\(\\overline{\\mathrm{PF}}\\times\\overline{\\mathrm{PF}'}=8\\)일 때, \\(a\\)의 값은? [3점]", "passage": ""}, "options": ["\\(\\sqrt{3}\\)", "\\(\\frac{4\\sqrt{3}}{3}\\)", "\\(\\frac{5\\sqrt{3}}{3}\\)", "\\(2\\sqrt{3}\\)", "\\(\\frac{7\\sqrt{3}}{3}\\)"], "probs": {"2": 0.29, "1": 0.28, "4": 0.3, "3": 0.1, "5": 0.03}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/math/page-18.jpg", "page": 18}, {"id": "math-probability:24", "subject": "수학", "section": "math-probability", "number": 24, "selected": "4", "answer": "1", "points": "3", "visual": false, "state": {"question": "두 사건 \\(A,\\ B\\)에 대하여\n\n\\[P(A)=\\frac{2}{5},\\quad P(B\\mid A)=\\frac{1}{4},\\quad P(A\\cup B)=1\\]\n\n일 때, \\(P(B)\\)의 값은? [3점]", "passage": ""}, "options": ["\\(\\frac{7}{10}\\)", "\\(\\frac{3}{4}\\)", "\\(\\frac{4}{5}\\)", "\\(\\frac{17}{20}\\)", "\\(\\frac{9}{10}\\)"], "probs": {"1": 0.05, "3": 0.16, "5": 0.36, "2": 0.04, "4": 0.39}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/math/page-09.jpg", "page": 9}, {"id": "math-probability:25", "subject": "수학", "section": "math-probability", "number": 25, "selected": "3", "answer": "2", "points": "3", "visual": true, "state": {"question": "주머니에 숫자 \\(1, 2, 3, 4, 5\\)가 하나씩 적혀 있는 흰 공 \\(5\\)개와 숫자 \\(2, 3, 4, 5, 6\\)이 하나씩 적혀 있는 검은 공 \\(5\\)개가 들어 있다. 이 주머니에서 임의로 \\(2\\)개의 공을 동시에 꺼낼 때, 꺼낸 \\(2\\)개의 공이 서로 같은 색이거나 꺼낸 \\(2\\)개의 공에 적힌 수가 서로 같을 확률은? [3점]", "passage": "", "visual_description": "문제 아래에 끈으로 입구를 묶은 주머니가 그려져 있다. 주머니 안에는 흰 공 5개와 검은 공 5개가 있다. 흰 공에는 각각 1, 2, 3, 4, 5가 적혀 있고, 검은 공에는 각각 2, 3, 4, 5, 6이 적혀 있다."}, "options": ["\\(\\frac{7}{15}\\)", "\\(\\frac{8}{15}\\)", "\\(\\frac{3}{5}\\)", "\\(\\frac{2}{3}\\)", "\\(\\frac{11}{15}\\)"], "probs": {"5": 0.25, "1": 0.11, "3": 0.28, "4": 0.14, "2": 0.22}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/math/page-10.jpg", "page": 10}, {"id": "math-probability:26", "subject": "수학", "section": "math-probability", "number": 26, "selected": "2", "answer": "5", "points": "3", "visual": false, "state": {"question": "평균이 \\(m\\)이고 표준편차가 \\(5\\)인 정규분포를 따르는 모집단에서 크기가 \\(36\\)인 표본을 임의추출하여 얻은 표본평균을 이용하여 구한 모평균 \\(m\\)에 대한 신뢰도 \\(99\\%\\)의 신뢰구간이 \\(1.2 \\leq m \\leq a\\)이다. \\(a\\)의 값은?\n\n(단, \\(Z\\)가 표준정규분포를 따르는 확률변수일 때, \\(\\mathrm{P}(|Z| \\leq 2.58)=0.99\\)로 계산한다.) [3점]", "passage": ""}, "options": ["\\(5.1\\)", "\\(5.2\\)", "\\(5.3\\)", "\\(5.4\\)", "\\(5.5\\)"], "probs": {"2": 0.45999999999999996, "5": 0.07, "4": 0.17, "3": 0.16, "1": 0.14}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/math/page-10.jpg", "page": 10}, {"id": "math-probability:27", "subject": "수학", "section": "math-probability", "number": 27, "selected": "2", "answer": "4", "points": "3", "visual": false, "state": {"question": "이산확률변수 \\(X\\)가 가지는 값이 \\(0\\)부터 \\(4\\)까지의 정수이고\n\n\\[\n\\mathrm{P}(X=x)=\n\\begin{cases}\n\\dfrac{|2x-1|}{12} & (x=0,\\ 1,\\ 2,\\ 3)\\\\\na & (x=4)\n\\end{cases}\n\\]\n\n일 때, \\(\\mathrm{V}\\left(\\dfrac{1}{a}X\\right)\\)의 값은? (단, \\(a\\)는 \\(0\\)이 아닌 상수이다.) [3점]", "passage": ""}, "options": ["36", "39", "42", "45", "48"], "probs": {"1": 0.22, "5": 0.17, "4": 0.18, "3": 0.16, "2": 0.27}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/math/page-11.jpg", "page": 11}, {"id": "math-probability:28", "subject": "수학", "section": "math-probability", "number": 28, "selected": "5", "answer": "2", "points": "4", "visual": true, "state": {"question": "이 시행을 \\(4\\)번 반복한 후 여섯 개의 상자에 들어 있는 모든 공의 개수의 합이 홀수일 때, \\(3\\)이 적힌 상자에 들어 있는 공의 개수가 \\(2\\)가 적힌 상자에 들어 있는 공의 개수보다 \\(1\\)개 더 많을 확률은? [4점]", "passage": "\\(16\\)개의 공과 \\(1\\)부터 \\(6\\)까지의 자연수가 하나씩 적혀 있는 여섯 개의 빈 상자가 있다. 한 개의 주사위를 사용하여 다음 시행을 한다.\n\n주사위를 한 번 던져 나온 눈의 수가 \\(k\\)일 때,\n\\(k\\)가 홀수이면\n\\(1,\\ 3,\\ 5\\)가 적힌 상자에 공을 각각 \\(1\\)개씩 넣고,\n\\(k\\)가 짝수이면\n\\(k\\)의 약수가 적힌 상자에 공을 각각 \\(1\\)개씩 넣는다.", "visual_description": "문항 아래 그림에는 왼쪽에 공 16개가 모여 있고, 그 오른쪽에 위가 열린 빈 상자 6개가 가로로 나란히 놓여 있다. 각 상자의 앞면에는 왼쪽부터 차례로 1, 2, 3, 4, 5, 6이 적혀 있다."}, "options": ["\\(\\dfrac{1}{8}\\)", "\\(\\dfrac{3}{16}\\)", "\\(\\dfrac{1}{4}\\)", "\\(\\dfrac{5}{16}\\)", "\\(\\dfrac{3}{8}\\)"], "probs": {"2": 0.24, "1": 0.22, "4": 0.1, "5": 0.26, "3": 0.18}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/math/page-11.jpg", "page": 11}, {"id": "physics-1:2", "subject": "물리학Ⅰ", "section": "physics-1", "number": 2, "selected": "1", "answer": "4", "points": "2", "visual": true, "state": {"question": "그림과 같이 균일한 자기장에 의해 자기화된 상태에 있는 크기와 모양이 같은 물체 A, B, C 중 2개를 꺼내어 하나는 수평면에 놓고 다른 하나는 높이 $h_0$에서 가만히 놓아 떨어뜨린다. 표는 두 물체가 닿을 때까지 걸린 시간 $T$를 나타낸 것이다. A, B, C는 강자성체, 상자성체, 반자성체를 순서 없이 나타낸 것이고, 균일한 자기장 영역에서 B와 C가 자기화된 방향은 서로 같다.\n\nA, B, C로 옳은 것은?", "passage": "표:\n\n| 수평면에 놓은 물체 | 떨어뜨린 물체 | $T\\,(\\mathrm{s})$ |\n|---|---|---|\n| B | A | $0.230$ |\n| C | A | $0.203$ |", "visual_description": "왼쪽 그림에서 서로 평행한 네 개의 화살표가 모두 위쪽을 향하며, 아래에는 ‘균일한 자기장’이라고 쓰여 있다. 자기장 영역 안에 같은 크기의 직사각형 물체 A, B, C가 왼쪽부터 나란히 놓여 있다. 오른쪽 그림에는 수평면 위에 물체 B가 놓여 있고, 그 수직 위에 물체 A가 있다. A의 아래쪽과 B의 위쪽 사이의 수직 거리가 $h_0$로 표시되어 있으며, A 옆에는 아래쪽을 향하는 화살표가 있다."}, "options": ["A: 강자성체, B: 상자성체, C: 반자성체", "A: 강자성체, B: 반자성체, C: 상자성체", "A: 상자성체, B: 강자성체, C: 반자성체", "A: 반자성체, B: 강자성체, C: 상자성체", "A: 반자성체, B: 상자성체, C: 강자성체"], "probs": {"5": 0.15, "3": 0.09, "1": 0.36, "4": 0.16, "2": 0.24}, "others": {"Luna": "5", "Terra": "5", "Sol": "4"}, "image": "images/physics-1/page-01.jpg", "page": 1}, {"id": "physics-1:7", "subject": "물리학Ⅰ", "section": "physics-1", "number": 7, "selected": "2", "answer": "3", "points": "2", "visual": true, "state": {"question": "그림 (가)와 같이 높이가 각각 \\(4h, h\\)인 지점에 가만히 놓은 물체 A, B가 빗면을 내려와 시간 \\(t=0\\)일 때 벽과 충돌을 시작하였다. 그림 (나)는 물체가 벽과 충돌하는 동안 A, B의 속력을 시간에 따라 나타낸 것이다. A, B의 질량은 각각 \\(2m, m\\)이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 물체의 크기, 모든 마찰과 공기 저항은 무시한다.)", "passage": "<보기>\nㄱ. \\(0\\sim t_0\\) 동안 물체가 받은 충격량의 크기는 A가 B의 2배이다.\nㄴ. \\(t_0\\sim 2t_0\\) 동안 A의 운동량 변화량의 크기는 \\(mv_0\\)이다.\nㄷ. 벽과 충돌하는 동안 물체가 받은 평균 힘의 크기는 A가 B의 2배이다.", "visual_description": "(가): 위와 아래에 각각 오른쪽 아래로 기울어진 빗면이 있고, 각 빗면의 오른쪽 끝은 수평면으로 이어져 수직 벽과 만난다. 위쪽 빗면의 물체 A는 수평면보다 높이 \\(4h\\)인 지점에 정지해 있고, 아래쪽 빗면의 물체 B는 수평면보다 높이 \\(h\\)인 지점에 정지해 있다. A와 B 옆에는 아래쪽 빗면 방향의 점선 화살표가 표시되어 있다. 각 수평면의 오른쪽 끝에 작은 물체가 벽과 맞닿아 있는 모습이 그려져 있다.\n(나): 세로축은 ‘속력’, 가로축은 ‘시간’이며 원점은 0이다. B의 속력 곡선은 \\(t=0\\)에서 \\(v_0\\)로 시작하여 아래로 굽어 감소하고 \\(t=t_0\\)에서 0이 된다. A의 속력 곡선은 \\(t=0\\)에서 \\(v_0\\)보다 높은 높이에서 시작하여 감소하고, \\(t=t_0\\)에서 \\(v_0\\)를 지나 \\(t=2t_0\\)에서 0이 된다. \\(v_0\\), \\(t_0\\), \\(2t_0\\) 위치에는 점선 보조선이 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"4": 0.18, "1": 0.1, "2": 0.41000000000000003, "5": 0.19, "3": 0.12}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/physics-1/page-02.jpg", "page": 2}, {"id": "physics-1:8", "subject": "물리학Ⅰ", "section": "physics-1", "number": 8, "selected": "1", "answer": "5", "points": "2", "visual": true, "state": {"question": "그림과 같이 관찰자 A에 대해 관찰자 B, C가 탄 우주선이 각각 속력 \\(0.7c, 0.9c\\)로 우주 정거장 P, Q를 잇는 직선과 나란하게 등속도 운동을 한다. A의 관성계에서, 정지해 있는 P와 Q 사이의 거리는 \\(d\\)이고 B, C가 탄 우주선의 길이는 같다. C의 관성계에서, C가 탄 우주선의 길이는 \\(L\\)이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, \\(c\\)는 빛의 속력이다.)", "passage": "<보기>\nㄱ. B의 관성계에서, B가 탄 우주선의 길이는 \\(L\\)보다 크다.\nㄴ. C의 관성계에서, Q가 C를 지나는 순간부터 P가 C를 지나는 순간까지 걸리는 시간은 \\(\\dfrac{d}{0.9c}\\)보다 작다.\nㄷ. P와 Q 사이의 거리는 B의 관성계에서가 C의 관성계에서보다 크다.", "visual_description": "왼쪽에 우주 정거장 P, 오른쪽에 우주 정거장 Q가 있으며 두 정거장을 잇는 수평 점선이 그려져 있다. 점선 아래의 양방향 거리 표시에서 P와 Q 사이가 \\(d\\)로 표시되어 있다. 관찰자 A는 두 정거장 사이 위쪽에 정지한 모습으로 표시되어 있다. 관찰자 B가 탄 위쪽 우주선은 오른쪽을 향하며, 오른쪽 방향 화살표에 \\(0.7c\\)가 표시되어 있다. 관찰자 C가 탄 아래쪽 우주선은 왼쪽을 향하며, 왼쪽 방향 화살표에 \\(0.9c\\)가 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "probs": {"2": 0.16, "1": 0.35, "3": 0.05, "4": 0.29, "5": 0.15}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/physics-1/page-02.jpg", "page": 2}, {"id": "physics-1:9", "subject": "물리학Ⅰ", "section": "physics-1", "number": 9, "selected": "5", "answer": "3", "points": "3", "visual": true, "state": {"question": "그림은 받침대 위에 있는 사람이 도르래를 통해 받침대와 연결되어 있는 줄 p를 연직 아래 방향으로 잡아당겨 정지해 있는 모습을 나타낸 것이다. 사람이 p를 당기는 힘의 크기는 \\(350\\,\\mathrm{N}\\)이고, 받침대의 무게는 \\(100\\,\\mathrm{N}\\)이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 줄의 질량과 모든 마찰은 무시한다.) [3점]", "passage": "<보기>\nㄱ. 사람의 무게는 \\(600\\,\\mathrm{N}\\)이다.\nㄴ. 받침대가 사람을 떠받치는 힘의 크기는 \\(200\\,\\mathrm{N}\\)이다.\nㄷ. 사람이 p에 작용하는 힘과 p가 사람에게 작용하는 힘은 작용 반작용 관계이다.", "visual_description": "천장에 고정된 도르래가 있고 줄이 도르래를 감싸 양쪽으로 연직 아래로 내려온다. 줄의 왼쪽 끝은 사람이 서 있는 받침대의 왼쪽 부분에 연결되어 있다. 사람은 오른쪽으로 내려온 줄 p의 끝을 손으로 잡고 아래 방향으로 당기고 있다. 직사각형 모양의 받침대에는 ‘받침대’라는 표시가 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"1": 0.07, "3": 0.28, "4": 0.23, "5": 0.37, "2": 0.05}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/physics-1/page-02.jpg", "page": 2}, {"id": "physics-1:10", "subject": "물리학Ⅰ", "section": "physics-1", "number": 10, "selected": "2", "answer": "5", "points": "3", "visual": true, "state": {"question": "그림과 같이 마찰이 없는 수평면에서 운동량의 크기가 \\(p\\)로 같고 질량이 각각 \\(4m, 2m, 3m\\)인 물체 A, B, C가 \\(x\\)축을 따라 등속도 운동을 하고 있다. A와 B가 충돌한 후, B와 C가 충돌한다. B가 A, C로부터 받은 충격량의 크기는 각각 \\(\\dfrac{3}{5}p, \\dfrac{1}{5}p\\)이다.\n\nB와 C가 충돌한 후, B의 운동량의 크기와 방향은? (단, A, B, C는 동일 직선상에서 운동한다.) [3점]", "passage": "", "visual_description": "오른쪽이 \\(+x\\)방향인 수평면 위에 세 물체 A, B, C가 왼쪽부터 이 순서로 놓여 있다. A와 B 위에는 각각 오른쪽 방향 화살표가 있고 각 화살표 위에 \\(p\\)가 표시되어 있다. C 위에는 왼쪽 방향 화살표가 있고 화살표 위에 \\(p\\)가 표시되어 있다."}, "options": ["크기: \\(\\dfrac{1}{5}p\\), 방향: \\(+x\\)방향", "크기: \\(\\dfrac{1}{5}p\\), 방향: \\(-x\\)방향", "크기: \\(\\dfrac{2}{5}p\\), 방향: \\(+x\\)방향", "크기: \\(\\dfrac{2}{5}p\\), 방향: \\(-x\\)방향", "크기: \\(\\dfrac{3}{5}p\\), 방향: \\(-x\\)방향"], "probs": {"2": 0.26, "4": 0.21, "3": 0.14, "5": 0.14, "1": 0.25}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/physics-1/page-02.jpg", "page": 2}, {"id": "physics-1:11", "subject": "물리학Ⅰ", "section": "physics-1", "number": 11, "selected": "5", "answer": "2", "points": "2", "visual": true, "state": {"question": "그림과 같이 단색광 P가 공기에서 매질 A에 입사각 \\(\\theta_1\\)로 입사한다. 매질 B와 공기의 경계면에서 P의 일부는 굴절각 \\(\\theta_2\\)로 굴절하여 진행하고 일부는 반사한 후 매질 C와 공기의 경계면에서 전반사한다. \\(\\theta_2>\\theta_1\\)이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "<보기>\nㄱ. 굴절률은 A가 B보다 크다.\nㄴ. P의 속력은 B에서가 C에서보다 크다.\nㄷ. P가 B와 공기의 경계면에서 전반사하게 하려면 \\(\\theta_1\\)을 증가시켜야 한다.", "visual_description": "밑변이 수평인 인접한 세 삼각형 모양의 매질 영역이 왼쪽부터 A, B, C로 표시되어 있고, 바깥 위쪽 영역은 ‘공기’로 표시되어 있다. 각 삼각형의 밑각에는 \\(60^\\circ\\)가 표시되어 있으며, A와 B의 경계 및 B와 C의 경계가 각각 기울어진 선으로 그려져 있다. 단색광 P는 왼쪽 아래에서 오른쪽 위로 진행하여 공기에서 A의 왼쪽 빗면으로 입사한다. 이 입사점의 점선 법선과 입사 광선 사이 각이 \\(\\theta_1\\)로 표시되어 있다. 광선은 A를 지나 A와 B의 경계에서 굴절되어 B 안에서 오른쪽 위로 진행한다. B와 공기의 수평 경계면에 도달한 광선의 일부는 공기 중 오른쪽 위로 굴절하며, 수직 점선 법선과 굴절 광선 사이 각이 \\(\\theta_2\\)로 표시되어 있다. 나머지 일부는 B 안에서 오른쪽 아래로 반사되어 B와 C의 경계를 지나 C로 들어간 뒤, C와 공기의 오른쪽 빗면 경계에서 반사되어 왼쪽 아래 방향으로 진행한다. A와 B의 경계 및 B와 C의 경계에서 광선과 경계가 만나는 곳에는 직각 표시가 있다. C와 공기의 경계에서의 입사 광선 연장 방향은 짧은 점선으로 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "probs": {"3": 0.13, "4": 0.25, "5": 0.25, "2": 0.16, "1": 0.21}, "others": {"Luna": "5", "Terra": "2", "Sol": "2"}, "image": "images/physics-1/page-02.jpg", "page": 2}, {"id": "physics-1:12", "subject": "물리학Ⅰ", "section": "physics-1", "number": 12, "selected": "2", "answer": "1", "points": "3", "visual": false, "state": {"question": "표는 입자 A, B, C의 질량과 운동 에너지를 나타낸 것이다.\n\n| 입자 | 질량 | 운동 에너지 |\n|---|---:|---:|\n| A | \\(m\\) | \\(E_0\\) |\n| B | \\(2m\\) | \\(8E_0\\) |\n| C | \\(3m\\) | \\(3E_0\\) |\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "<보기>\nㄱ. 속력은 A가 B보다 작다.\nㄴ. 운동량의 크기는 B가 C보다 작다.\nㄷ. 물질파 파장은 A가 C보다 짧다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"2": 0.61, "1": 0.29, "5": 0.02, "3": 0.02, "4": 0.06}, "others": {"Luna": "5", "Terra": "1", "Sol": "1"}, "image": "images/physics-1/page-03.jpg", "page": 3}, {"id": "physics-1:13", "subject": "물리학Ⅰ", "section": "physics-1", "number": 13, "selected": "3", "answer": "5", "points": "2", "visual": true, "state": {"question": "다음은 p-n 접합 발광 다이오드(LED)의 특성을 알아보는 실험이다.\n\n[실험 과정]\n(가) 그림과 같이 전압이 같은 직류 전원 3개, 동일한 저항 2개, 동일한 LED \\(\\mathrm{D}_1\\sim\\mathrm{D}_4\\), 스위치 \\(\\mathrm{S}_1\\), \\(\\mathrm{S}_2\\)를 이용하여 회로를 구성한다. X는 p형 반도체와 n형 반도체 중 하나이다.\n(나) \\(\\mathrm{S}_1\\)과 \\(\\mathrm{S}_2\\)의 연결 상태를 바꾸어 가며 \\(\\mathrm{D}_1\\sim\\mathrm{D}_4\\)에서 빛의 방출 여부를 관찰한다.\n\n[실험 결과]\n\n| \\(\\mathrm{S}_1\\) | \\(\\mathrm{S}_2\\) | 빛이 방출되는 LED |\n|---|---|---|\n| 닫힘 | 열림 | \\(\\mathrm{D}_2,\\ \\mathrm{D}_4\\) |\n| 열림 | a에 연결 | 없음 |\n| 열림 | b에 연결 | ㉠ |\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "<보기>\nㄱ. X는 p형 반도체이다.\nㄴ. \\(\\mathrm{S}_1\\)이 닫혀 있고 \\(\\mathrm{S}_2\\)가 열려 있을 때, \\(\\mathrm{D}_3\\)에는 역방향 전압이 걸린다.\nㄷ. ㉠은 \\(\\mathrm{D}_3,\\ \\mathrm{D}_4\\)이다.", "visual_description": "회로는 큰 삼각형 형태이다. 위 꼭짓점과 왼쪽 아래 꼭짓점을 잇는 왼쪽 변에는 두 영역으로 나뉜 LED \\(\\mathrm{D}_1\\)이 있으며, 왼쪽 아래 꼭짓점 쪽 영역에 X가 표시되어 있다. 위 꼭짓점과 오른쪽 아래 꼭짓점을 잇는 오른쪽 변에는 LED \\(\\mathrm{D}_2\\)가 있고, 삼각형 내부의 중앙 접점과 왼쪽 아래 꼭짓점을 잇는 가지에는 LED \\(\\mathrm{D}_3\\), 중앙 접점과 오른쪽 아래 꼭짓점을 잇는 가지에는 LED \\(\\mathrm{D}_4\\)가 있다. LED \\(\\mathrm{D}_1\\)과 \\(\\mathrm{D}_3\\)의 접합선은 왼쪽 위에서 오른쪽 아래로 기울어져 있고, LED \\(\\mathrm{D}_2\\)와 \\(\\mathrm{D}_4\\)의 접합선은 왼쪽 아래에서 오른쪽 위로 기울어져 있다. 위 꼭짓점과 중앙 접점 사이의 세로 가지에는 위에서부터 저항, 긴 극판이 아래쪽인 직류 전원, 열린 스위치 \\(\\mathrm{S}_1\\)이 차례로 연결되어 있다. 왼쪽 아래 꼭짓점에서 오른쪽으로 이어지는 아래쪽 가지에는 저항이 있고, 그 오른쪽에서 두 갈래로 나뉘어 위쪽 갈래에는 긴 극판이 오른쪽인 직류 전원과 접점 a가, 아래쪽 갈래에는 긴 극판이 왼쪽인 직류 전원과 접점 b가 연결되어 있다. 오른쪽 아래 꼭짓점에 연결된 전환 스위치 \\(\\mathrm{S}_2\\)는 a 또는 b에 연결될 수 있게 그려져 있다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"4": 0.26, "5": 0.22, "2": 0.13, "1": 0.1, "3": 0.29}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/physics-1/page-03.jpg", "page": 3}, {"id": "physics-1:14", "subject": "물리학Ⅰ", "section": "physics-1", "number": 14, "selected": "4", "answer": "2", "points": "3", "visual": true, "state": {"question": "그림은 동일 직선상에서 같은 가속도로 등가속도 운동을 하는 물체 A, B의 위치를 시간에 따라 나타낸 것이다. A, B의 속력은 각각 시간이 \\(t_0\\), \\(2t_0\\)일 때 0이다. A와 B가 만나는 순간 A, B의 속력은 각각 \\(v_A\\), \\(v_B\\)이다.\n\n\\(\\dfrac{v_A}{v_B}\\)는? [3점]", "passage": "", "visual_description": "위치를 세로축, 시간을 가로축으로 한 그래프이다. 두 축의 원점은 0으로 표시되어 있다. 원점에서 함께 출발하여 아래로 오목한 포물선 모양으로 진행하는 두 곡선 A와 B가 그려져 있으며, 두 곡선은 오른쪽에서 다시 만난다. A는 시간 \\(t_0\\)에서 꼭짓점을 가지며 그 위치는 \\(4d\\)이다. B는 시간 \\(2t_0\\)에서 꼭짓점을 가지며 그 위치는 \\(2d\\)이다. \\(t_0\\)와 \\(2t_0\\)에서 각각 위쪽으로 그은 점선이 해당 꼭짓점까지 이어지고, 위치축의 \\(4d\\)와 \\(2d\\)에서 각각 오른쪽으로 그은 점선이 해당 꼭짓점까지 이어진다. 두 곡선은 \\(2t_0\\)보다 오른쪽의 한 점에서 만난다."}, "options": ["\\(\\dfrac{3}{2}\\)", "\\(\\dfrac{5}{3}\\)", "\\(\\dfrac{7}{4}\\)", "\\(\\dfrac{9}{5}\\)", "\\(2\\)"], "probs": {"5": 0.28, "3": 0.12, "4": 0.27999999999999997, "1": 0.17, "2": 0.15}, "others": {"Luna": "2", "Terra": "5", "Sol": "2"}, "image": "images/physics-1/page-03.jpg", "page": 3}, {"id": "physics-1:15", "subject": "물리학Ⅰ", "section": "physics-1", "number": 15, "selected": "5", "answer": "1", "points": "3", "visual": true, "state": {"question": "그림과 같이 \\(xy\\)평면에 가늘고 무한히 긴 직선 도선 A, B, C가 고정되어 있다. B에는 세기가 \\(I_0\\)인 전류가 화살표 방향으로 흐르고, A와 C에는 각각 세기가 \\(I\\)인 전류가 흐른다. 표는 \\(xy\\)평면의 점 p, q, r에서 A, B, C의 전류에 의한 자기장의 세기를 나타낸 것이다.\n\n| 점 | A, B, C의 전류에 의한 자기장의 세기 |\n|---|---:|\n| p | \\(B_0\\) |\n| q | 0 |\n| r | ㉠ |\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "<보기>\nㄱ. C에 흐르는 전류의 방향은 \\(+x\\) 방향이다.\nㄴ. \\(I=4\\sqrt{2}I_0\\)이다.\nㄷ. ㉠은 \\(B_0\\)이다.", "visual_description": "원점 O에서 오른쪽이 +x, 위쪽이 +y인 좌표평면이다. 도선 A는 y축과, C는 x축과 겹친다. 격자의 가로·세로 한 칸은 d이다. B는 (0,4d)와 (4d,0)을 지나는 대각선이고 B의 I₀ 화살표는 왼쪽 위 방향을 가리킨다. 검은 점 p는 (2d,3d), q는 (3d,2d), r은 (2d,d)의 격자점에 놓여 있다. 좌표 수치는 원문의 격자 위치를 전사한 것이며 자기장 방향이나 크기는 표시되어 있지 않다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"1": 0.14, "4": 0.24, "3": 0.23, "5": 0.26, "2": 0.13}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/physics-1/page-03.jpg", "page": 3}, {"id": "physics-1:16", "subject": "물리학Ⅰ", "section": "physics-1", "number": 16, "selected": "4", "answer": "5", "points": "2", "visual": true, "state": {"question": "그림은 열기관에서 일정량의 이상 기체가 상태 A → B → C → D → A를 따라 순환하는 동안 기체의 부피와 절대 온도를 나타낸 것이다. A → B 과정과 C → D 과정은 부피가 일정한 과정이고, B → C 과정과 D → A 과정은 등온 과정이다. 표는 각 과정에서 기체가 흡수 또는 방출하는 열량을 나타낸 것이다.\n\n| 과정 | 흡수 또는 방출하는 열량 |\n|---|---:|\n| A → B | \\(2Q_0\\) |\n| B → C | \\(3Q_0\\) |\n| C → D | ㉠ |\n| D → A | \\(Q_0\\) |\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "<보기>\nㄱ. ㉠은 \\(2Q_0\\)이다.\nㄴ. 기체의 압력은 B에서가 D에서보다 크다.\nㄷ. 열기관의 열효율은 0.4이다.", "visual_description": "부피를 세로축, 절대 온도를 가로축으로 한 그래프이다. 원점은 0으로 표시되어 있다. 상태점 A, B, C, D가 직사각형의 네 꼭짓점에 놓여 있으며 A는 왼쪽 아래, B는 오른쪽 아래, C는 오른쪽 위, D는 왼쪽 위에 있다. A에서 B로 향하는 아래쪽 수평 화살표, B에서 C로 향하는 오른쪽 수직 화살표, C에서 D로 향하는 위쪽 수평 화살표, D에서 A로 향하는 왼쪽 수직 화살표가 그려져 있다. 각 상태점에서 좌표축 방향으로 점선 보조선이 이어져 있다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"3": 0.15, "4": 0.41, "2": 0.17, "5": 0.18, "1": 0.09}, "others": {"Luna": "5", "Terra": "5", "Sol": "3"}, "image": "images/physics-1/page-03.jpg", "page": 3}, {"id": "physics-1:17", "subject": "물리학Ⅰ", "section": "physics-1", "number": 17, "selected": "4", "answer": "5", "points": "2", "visual": true, "state": {"question": "이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "그림과 같이 두 변의 길이가 각각 $2d$, $3d$인 직사각형 금속 고리가 $xy$평면에서 $+x$방향으로 등속도 운동을 하며 세기가 각각 균일하고 방향이 $xy$평면에 수직인 자기장 영역 Ⅰ～Ⅳ를 지난다. 표는 금속 고리의 점 p에 흐르는 유도 전류 $I_p$의 세기와 방향을 p의 위치에 따라 나타낸 것이다. Ⅰ에서 자기장의 방향은 $xy$평면에서 수직으로 나오는 방향이다. 자기장의 세기는 Ⅰ에서 $B_0$이고, Ⅳ에서가 Ⅱ에서의 $1.5$배이다.\n\n[그림] $x$축은 오른쪽, $y$축은 위쪽을 향한다. 자기장 영역은 $0\\le x\\le5d$, $-d\\le y\\le2d$인 직사각형이며, $y=0$을 기준으로 위쪽은 $x=2d$에서 Ⅰ과 Ⅱ로, 아래쪽은 $x=3d$에서 Ⅲ과 Ⅳ로 나뉜다. 왼쪽 위는 Ⅰ, 오른쪽 위는 Ⅱ, 왼쪽 아래는 Ⅲ, 오른쪽 아래는 Ⅳ이다. Ⅰ에는 $xy$평면에서 수직으로 나오는 방향을 나타내는 점들이 표시되어 있고 $B_0$가 적혀 있다. $x$축에는 $d$, $2d$, $3d$, $4d$, $5d$가, $y$축에는 $-d$, $0$, $d$, $2d$가 표시되어 있다. 자기장 영역 왼쪽에는 가로 길이 $2d$, 세로 길이 $3d$인 직사각형 금속 고리가 있으며, 고리 오른쪽 변의 중앙에 점 p가 있다. p에서 오른쪽을 향하는 화살표가 표시되어 있다.\n\n[표]\n| p의 위치 | $I_p$의 세기 | $I_p$의 방향 |\n|---|---:|---|\n| $x=1.5d$ | $0$ | 없음 |\n| $x=2.5d$ | $2I_0$ | $-y$ |\n| $x=3.5d$ | $I_0$ | $-y$ |\n\n<보기>\nㄱ. 자기장의 세기는 Ⅰ에서가 Ⅱ에서보다 작다.\nㄴ. 자기장의 방향은 Ⅲ에서와 Ⅳ에서가 서로 같다.\nㄷ. p의 위치가 $x=5.5d$일 때, $I_p$의 세기는 $I_0$이다.", "visual_description": "좌표평면 위의 직사각형 금속 고리와 네 자기장 영역 Ⅰ～Ⅳ, 자기장 방향을 나타내는 점 기호, 좌표 눈금 및 유도 전류 표가 제시되어 있다. 상세 내용은 context에 기술되어 있다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"3": 0.12, "4": 0.44, "2": 0.16, "5": 0.21, "1": 0.07}, "others": {"Luna": "4", "Terra": "5", "Sol": "5"}, "image": "images/physics-1/page-04.jpg", "page": 4}, {"id": "physics-1:20", "subject": "물리학Ⅰ", "section": "physics-1", "number": 20, "selected": "4", "answer": "1", "points": "3", "visual": true, "state": {"question": "이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "그림 (가)와 같이 $x$축상에서 점전하 A, B, C가 각각 $x=-d$, $x=d$, $x=x_C$에 고정되어 있다. 그림 (나)는 (가)에서 C의 위치를 $x=-x_C$로 옮겨 고정한 것이다. A와 B는 전하량의 크기가 같다. 그림 (다)는 (가), (나)에서 양(+)전하 P의 위치를 $x$축상에서 옮기며 고정할 때, $0\\le x<d$인 구간에서 P에 작용하는 전기력 $F_P$를 각각 나타낸 것이다. 전기력의 방향은 $+x$방향이 양(+)이다.\n\n[그림 (가)] 수평한 $x$축 위에 왼쪽부터 A, 원점 $0$, 양(+)전하 P, B, C가 놓여 있다. A의 위치는 $-d$, B의 위치는 $d$, C의 위치는 $x_C$로 표시되어 있다. P는 $0$과 $d$ 사이에 있다.\n\n[그림 (나)] 수평한 $x$축 위에 왼쪽부터 C, A, 원점 $0$, 양(+)전하 P, B가 놓여 있다. C의 위치는 $-x_C$, A의 위치는 $-d$, B의 위치는 $d$로 표시되어 있다. P는 $0$과 $d$ 사이에 있다.\n\n[그림 (다)] 가로축은 $x$, 세로축은 $F_P(\\mathrm{N})$이며, 가로축에는 $0$, $x_0$, $d$가 표시되어 있고 세로축에는 $0$, $8$, $10$이 표시되어 있다. 실선 곡선은 $x=0$에서 $F_P=8\\,\\mathrm{N}$로 시작하여 처음에는 약간 감소했다가 위로 휘어 증가하며, $x=x_0$에서 $F_P=10\\,\\mathrm{N}$을 지난 뒤 $x=d$에 가까워질수록 급격히 증가한다. 점선 곡선은 $x=0$에서 $F_P=0$으로 시작해 잠시 음의 값으로 내려갔다가 다시 증가하여 $x=x_0$에서 $F_P=0$을 지나고, 이후 양의 값으로 급격히 증가하여 $x=d$에 가까워질수록 위로 발산한다. $x=x_0$과 $x=d$에는 세로 점선이 있다. 점선 곡선의 $x_0$ 오른쪽 부분을 가리키는 표시 ㉠이 있다.\n\n<보기>\nㄱ. 전하량의 크기는 A가 C보다 작다.\nㄴ. (다)의 ㉠은 (나)에서 P에 작용하는 전기력이다.\nㄷ. P가 $x=x_0$에 있을 때, A와 B로부터 받는 전기력의 크기는 $6\\,\\mathrm{N}$보다 작다.", "visual_description": "점전하 A, B, C와 양전하 P의 두 배치 (가), (나), 그리고 $0\\le x<d$에서 P에 작용하는 전기력을 나타낸 실선 및 점선 그래프 (다)가 제시되어 있다. 상세 내용은 context에 기술되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"1": 0.14, "2": 0.22, "3": 0.15, "4": 0.27, "5": 0.22}, "others": {"Luna": "4", "Terra": "1", "Sol": "1"}, "image": "images/physics-1/page-04.jpg", "page": 4}, {"id": "physics-2:5", "subject": "물리학Ⅱ", "section": "physics-2", "number": 5, "selected": "3", "answer": "2", "points": "2", "visual": true, "state": {"question": "그림 (가)는 파장이 \\(\\lambda_1\\)인 단색광을 이중 슬릿에 비추었을 때 슬릿으로부터 충분히 멀리 떨어진 스크린에 간섭무늬가 생긴 모습을 나타낸 것이다. 그림 (나)는 (가)에서 \\(\\lambda_1\\)을 \\(\\lambda_2\\)로 변화시켰을 때 스크린에 간섭무늬가 생긴 모습을 나타낸 것이다. (가), (나)에서 스크린상의 점 O에는 가장 밝은 무늬의 중심이, 점 P에는 O로부터 각각 첫 번째 밝은 무늬의 중심과 두 번째 어두운 무늬의 중심이 생겼다.\n\n\\(\\dfrac{\\lambda_2}{\\lambda_1}\\)로 가장 적절한 것은?", "passage": "", "visual_description": "(가)와 (나) 각각에서 왼쪽의 단색광 화살표가 세로 방향의 이중 슬릿을 향하고, 오른쪽에 세로로 긴 스크린이 있다. (가)의 입사광에는 \\(\\lambda_1\\), (나)의 입사광에는 \\(\\lambda_2\\)가 표시되어 있다. 각 스크린에는 수평 띠 모양의 밝고 어두운 간섭무늬가 세로 방향으로 반복된다. 두 그림 모두 스크린 왼쪽 가장자리의 같은 높이에 점 O와 그보다 위쪽의 점 P가 표시되어 있다. (가)에서는 O가 중앙의 가장 밝은 띠 중심에 있고 P가 O 위의 첫 번째 밝은 띠 중심에 있다. (나)에서는 O가 중앙의 가장 밝은 띠 중심에 있고 P가 O 위의 두 번째 어두운 띠 중심에 있다."}, "options": ["\\(\\dfrac{1}{2}\\)", "\\(\\dfrac{2}{3}\\)", "\\(\\dfrac{3}{4}\\)", "\\(\\dfrac{4}{5}\\)", "\\(\\dfrac{5}{6}\\)"], "probs": {"2": 0.18, "3": 0.32, "1": 0.06, "5": 0.21, "4": 0.23}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/physics-2/page-01.jpg", "page": 1}, {"id": "physics-2:7", "subject": "물리학Ⅱ", "section": "physics-2", "number": 7, "selected": "4", "answer": "5", "points": "3", "visual": true, "state": {"question": "그림은 극판 사이의 간격, 극판의 면적이 같은 평행판 축전기 A, B가 저항값이 각각 \\(R\\), \\(2R\\)인 저항, 전압이 \\(V\\)로 일정한 전원에 연결되어 완전히 충전된 상태를 나타낸 것이다. A, B는 유전율이 각각 \\(\\varepsilon_A\\), \\(\\varepsilon_B\\)인 유전체로 채워져 있고, A, B에 저장된 전기 에너지는 서로 같다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "<보기>\nㄱ. 각 저항에 흐르는 전류의 세기는 서로 같다.\nㄴ. \\(\\varepsilon_A:\\varepsilon_B=4:1\\)이다.\nㄷ. 축전기에 충전된 전하량은 A가 B의 2배이다.", "visual_description": "회로 그림에서 왼쪽과 오른쪽에 각각 직사각형 모양의 병렬 연결 부분이 있고, 이 두 부분은 서로 직렬로 연결되어 있다. 왼쪽 병렬 연결의 위쪽 가지에는 축전기 A가 있으며 축전기 내부는 \\(\\varepsilon_A\\)로 표시되어 있고, 아래쪽 가지에는 저항 \\(R\\)이 있다. 오른쪽 병렬 연결의 위쪽 가지에는 축전기 B가 있으며 축전기 내부는 \\(\\varepsilon_B\\)로 표시되어 있고, 아래쪽 가지에는 저항 \\(2R\\)이 있다. 전체 회로의 아래쪽 도선에는 전압 \\(V\\)인 직류 전원이 연결되어 있다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"3": 0.11, "4": 0.47, "2": 0.22, "5": 0.1, "1": 0.1}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/physics-2/page-02.jpg", "page": 2}, {"id": "physics-2:11", "subject": "물리학Ⅱ", "section": "physics-2", "number": 11, "selected": "1", "answer": "2", "points": "3", "visual": true, "state": {"question": "다음은 광전 효과 실험이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "[실험 과정]\n(가) 그림과 같이 세기가 일정한 단색광 A, B, C를 각각 발생시키는 광원과 전압에 따른 광전류의 최댓값 \\(I_{\\max}\\), 정지 전압 \\(V_S\\)를 측정하는 광전 효과 실험 장치를 구성한다.\n(나) 금속판에 동시에 비추는 단색광의 종류를 바꾸어 가며 \\(I_{\\max}\\)와 \\(V_S\\)를 측정하여 표에 기록한다.\n\n[실험 결과]\n| 실험 | 단색광의 종류 | \\(I_{\\max}\\) | \\(V_S\\) |\n|---|---|---|---|\n| Ⅰ | A | \\(2I_0\\) | \\(V_0\\) |\n| Ⅱ | A, B | \\(2I_0\\) | ㉠ |\n| Ⅲ | B, C | \\(I_0\\) | \\(2V_0\\) |\n\n<보기>\nㄱ. ㉠은 \\(2V_0\\)이다.\nㄴ. 진동수는 A가 B보다 크다.\nㄷ. 방출되는 광전자의 최대 운동 에너지는 Ⅰ에서가 Ⅲ에서보다 크다.", "visual_description": "실험 장치 그림에서 왼쪽 위의 ‘광원’이 오른쪽 아래 방향으로 빛을 내보내며, 빛은 원형 진공관 내부의 오른쪽 위에 있는 ‘금속판’에 입사한다. 입사하는 빛은 ‘단색광’으로 표시되어 있다. 원형 진공관 내부에는 금속판과 마주 보는 작은 원형 전극이 있다. 진공관과 연결된 직사각형 회로의 오른쪽 가지에는 전류계 A가, 가운데 가로 가지에는 전압계 V가 있다. 아래쪽에는 ‘전원 장치’가 연결되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"1": 0.63, "3": 0.05, "5": 0.05, "4": 0.03, "2": 0.24}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/physics-2/page-02.jpg", "page": 2}, {"id": "physics-2:12", "subject": "물리학Ⅱ", "section": "physics-2", "number": 12, "selected": "4", "answer": "5", "points": "3", "visual": true, "state": {"question": "그림 (가)와 같이 위성 A는 행성을 중심으로 원 궤도를 따라 운동하고, 위성 B는 행성을 한 초점으로 하는 타원 궤도를 따라 운동한다. 점 p는 A와 B의 궤도가 교차하는 지점이다. 그림 (나)는 A와 B의 가속도 크기 \\(a\\)를 시간 \\(t\\)에 따라 나타낸 것이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, A와 B에는 행성에 의한 중력만 작용한다.) [3점]", "passage": "<보기>\nㄱ. B의 속력은 \\(t_1\\)일 때가 \\(t_2\\)일 때보다 크다.\nㄴ. \\(t_1\\)일 때, B는 p를 지난다.\nㄷ. A와 B의 공전 주기는 서로 같다.", "visual_description": "(가): 점선으로 그린 원 궤도와 가로로 긴 타원 궤도가 겹쳐 있다. 원 궤도의 중심에는 작은 원과 함께 ‘행성’이 표시되어 있으며, 행성은 타원 궤도의 왼쪽 초점에 해당하는 위치에 있다. 원 궤도의 왼쪽 위에 위성 A가 있고 궤도를 따라 왼쪽 아래 방향을 가리키는 화살표가 있다. 타원 궤도의 오른쪽에 위성 B가 있고 위쪽 방향을 가리키는 화살표가 있다. 두 궤도의 아래쪽 교차점은 p로 표시되어 있다.\n(나): 세로축은 가속도 크기 \\(a\\), 가로축은 시간 \\(t\\)이며 원점은 \\(0\\)이다. 세로축에는 아래에서부터 \\(4a_0\\), \\(9a_0\\), \\(36a_0\\)가 표시되어 있다. A의 그래프는 \\(a=9a_0\\)인 수평선이다. B의 그래프는 \\(t=0\\)에서 \\(36a_0\\)로 시작하여 급하게 감소하고 \\(t_1\\)에서 A의 그래프와 만난 뒤, \\(4a_0\\) 부근에서 최솟값을 갖는다. 이후 증가하여 \\(t_2\\)에서 \\(36a_0\\)에 이르는 뾰족한 최댓값을 갖고 다시 감소한다. \\(t_1\\)과 \\(t_2\\)에서 가로축까지 수직 점선이 그어져 있고, \\(9a_0\\) 높이에는 세로축부터 그래프 오른쪽까지 수평 점선이 그어져 있다. 각 그래프 오른쪽에 A와 B가 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ"], "probs": {"4": 0.51, "2": 0.25, "1": 0.19, "3": 0.01, "5": 0.04}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/physics-2/page-03.jpg", "page": 3}, {"id": "physics-2:13", "subject": "물리학Ⅱ", "section": "physics-2", "number": 13, "selected": "4", "answer": "1", "points": "2", "visual": true, "state": {"question": "그림 (가)는 원점 O에서 각각 \\(d\\)만큼 떨어져 \\(x\\)축상에 고정되어 있는 점전하 A, B 주위의 전기력선을 방향 표시 없이 나타낸 것이다. 그림 (나)는 (가)에서 \\(y\\)축상에 점전하 C를 고정했을 때, \\(y\\)축상의 \\(y=-d\\)인 점에서 A, B, C에 의한 전기장의 방향이 \\(y\\)축과 \\(45^\\circ\\)의 각을 이루는 것을 나타낸 것이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "<보기>\nㄱ. 전하량의 크기는 A가 B보다 작다.\nㄴ. (가)에서 \\(x\\)축상의 \\(-d<x<d\\)인 구간에 전기장의 세기가 \\(0\\)인 지점이 있다.\nㄷ. B와 C는 전하의 종류가 같다.", "visual_description": "(가): 수평 \\(x\\)축과 수직 \\(y\\)축이 원점 O에서 교차한다. 점전하 A는 \\(x=-d\\), 점전하 B는 \\(x=d\\)에 있으며 각각 작은 원으로 표시되어 있다. 방향 화살표가 없는 여러 전기력선이 그려져 있다. 여러 선이 A와 B를 서로 연결하며, A의 왼쪽에서 출발해 A와 B 사이로 이어지는 위아래 대칭의 곡선들이 보인다. B에서는 A보다 더 많은 선이 모이거나 뻗으며, B의 오른쪽과 위아래 바깥쪽으로 열린 곡선들이 이어진다.\n(나): 수평 \\(x\\)축과 수직 \\(y\\)축이 원점 O에서 교차한다. A는 \\(x=-d\\), B는 \\(x=d\\)에 있다. C는 음의 \\(y\\)축 아래쪽에 있다. \\(y=-d\\)인 점이 검은 점으로 표시되어 있으며, 이 점에서 오른쪽 위 방향으로 향하는 화살표가 그려져 있다. 화살표와 위쪽 \\(y\\)축 방향 사이의 각이 \\(45^\\circ\\)로 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"1": 0.12, "4": 0.37, "2": 0.2, "5": 0.2, "3": 0.11}, "others": {"Luna": "1", "Terra": "3", "Sol": "1"}, "image": "images/physics-2/page-03.jpg", "page": 3}, {"id": "physics-2:14", "subject": "물리학Ⅱ", "section": "physics-2", "number": 14, "selected": "5", "answer": "3", "points": "2", "visual": true, "state": {"question": "그림과 같이 동일한 재질의 원통형 금속 막대 X, Y, Z와 스위치 \\(S_1\\), \\(S_2\\)를 전압이 \\(V\\)로 일정한 전원에 연결하여 회로를 구성하였다. X, Y, Z의 길이는 \\(L\\)로 모두 같고, 단면적은 각각 \\(A\\), \\(2A\\), \\(4A\\)이다. \\(S_1\\)은 X, Y의 길이가 각각 절반인 지점에, \\(S_2\\)는 Y, Z의 길이가 각각 절반인 지점에 연결되어 있다. \\(S_1\\)과 \\(S_2\\)가 모두 열려 있을 때, 회로 전체에서 소비되는 전력은 \\(P_0\\)이다.\n\n\\(S_1\\)과 \\(S_2\\)가 모두 닫혀 있을 때, 회로 전체에서 소비되는 전력은? (단, 금속 막대의 비저항은 일정하다.)", "passage": "", "visual_description": "회로의 왼쪽과 오른쪽에 세로 도선이 있고, 세 개의 수평 원통형 금속 막대 X, Y, Z가 위에서부터 차례로 두 세로 도선 사이에 병렬로 연결되어 있다. X가 가장 가늘고, Y가 그보다 굵으며, Z가 가장 굵다. X의 양 끝 위에는 막대 전체 길이가 \\(L\\)임을 나타내는 치수선이 있다. Z의 왼쪽 끝부터 중앙까지는 \\(L/2\\)를 나타내는 치수선이 있다. X와 Y의 중앙 지점을 연결하는 세로 가지에 열린 스위치 \\(S_1\\)이 있고, Y와 Z의 중앙 지점을 연결하는 세로 가지에 열린 스위치 \\(S_2\\)가 있다. 아래쪽 도선에는 전압 \\(V\\)의 전원이 있으며, 전원의 긴 극판이 왼쪽, 짧은 극판이 오른쪽이다."}, "options": ["\\(\\dfrac{13}{4}P_0\\)", "\\(\\dfrac{7}{2}P_0\\)", "\\(\\dfrac{15}{4}P_0\\)", "\\(4P_0\\)", "\\(\\dfrac{17}{4}P_0\\)"], "probs": {"3": 0.21, "1": 0.17, "5": 0.24, "2": 0.19, "4": 0.19}, "others": {"Luna": "4", "Terra": "1", "Sol": "1"}, "image": "images/physics-2/page-03.jpg", "page": 3}, {"id": "physics-2:15", "subject": "물리학Ⅱ", "section": "physics-2", "number": 15, "selected": "4", "answer": "2", "points": "3", "visual": true, "state": {"question": "그림 (가)와 같이 종이면에 수직으로 들어가는 균일한 자기장 영역에 하나의 도선으로 이루어진 ‘8자’ 모양의 고리가 종이면에 고정되어 있다. 고리의 왼쪽 원과 오른쪽 원의 반지름은 각각 \\(2d\\), \\(d\\)이다. 그림 (나)는 (가)에서 자기장의 세기를 시간에 따라 나타낸 것이다.\n\n시간이 \\(2t_0\\)일 때, 고리에 유도되는 기전력의 크기는? (단, 도선의 표면은 절연되어 있고, 도선의 굵기는 무시한다.) [3점]", "passage": "", "visual_description": "(가): 종이면에 수직으로 들어가는 자기장을 나타내는 여러 개의 ‘×’ 표시가 직사각형 영역에 균일하게 배열되어 있다. 그 안에 하나의 도선이 왼쪽의 큰 원과 오른쪽의 작은 원을 이루며 가운데에서 교차하여 옆으로 누운 ‘8’ 모양을 만든다. 교차 부분에는 별도의 전기적 접점 표시가 없으며, 문제 조건에 도선 표면은 절연되어 있다고 되어 있다. 왼쪽 원의 중심에서 원주까지의 점선 반지름에 \\(2d\\), 오른쪽 원의 중심에서 원주까지의 점선 반지름에 \\(d\\)가 표시되어 있다.\n(나): 세로축은 ‘자기장의 세기’, 가로축은 ‘시간’이다. 그래프는 원점에서 시작하는 직선이며 시간이 증가함에 따라 자기장의 세기가 일정하게 증가한다. 가로축에는 \\(t_0\\), \\(2t_0\\), \\(3t_0\\), \\(4t_0\\)가 같은 간격으로 표시되어 있고, 세로축에는 \\(B_0\\), \\(2B_0\\), \\(3B_0\\)가 같은 간격으로 표시되어 있다. 직선은 \\(t=3t_0\\)와 \\(2B_0\\) 눈금의 교점을 지난다. \\(t=4t_0\\)에서는 \\(3B_0\\) 눈금보다 아래에 있다. 각 눈금 위치에는 점선 격자가 그려져 있다."}, "options": ["\\(\\dfrac{B_0\\pi d^2}{t_0}\\)", "\\(\\dfrac{2B_0\\pi d^2}{t_0}\\)", "\\(\\dfrac{10B_0\\pi d^2}{3t_0}\\)", "\\(\\dfrac{9B_0\\pi d^2}{2t_0}\\)", "\\(\\dfrac{15B_0\\pi d^2}{2t_0}\\)"], "probs": {"2": 0.1, "3": 0.2, "1": 0.22, "5": 0.11, "4": 0.37}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/physics-2/page-03.jpg", "page": 3}, {"id": "physics-2:16", "subject": "물리학Ⅱ", "section": "physics-2", "number": 16, "selected": "5", "answer": "3", "points": "3", "visual": true, "state": {"question": "그림 (가)는 초점 거리가 \\(f\\)인 볼록 렌즈로부터 거리 \\(a\\)만큼 떨어진 지점에 크기가 \\(h\\)인 물체가 놓인 모습을, (나)는 \\(a\\)에 따른 상의 크기를 나타낸 것이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "<보기>\nㄱ. ㉠은 \\(2f\\)이다.\nㄴ. 상의 크기는 \\(a=\\dfrac{2}{3}f\\)일 때가 \\(a=\\dfrac{5}{3}f\\)일 때의 \\(\\dfrac{5}{2}\\)배이다.\nㄷ. \\(a=3f\\)일 때, 상과 렌즈 사이의 거리는 \\(\\dfrac{3}{2}f\\)이다.", "visual_description": "(가): 수평 광축 위에 세로로 선 볼록 렌즈가 있다. 렌즈 오른쪽의 광축 위에 위쪽을 향하는 물체 화살표가 있고, 화살표 옆에 ‘물체’, 높이에 \\(h\\)가 표시되어 있다. 물체보다 오른쪽의 광축 위에는 검은 점과 ‘초점’이라는 표시가 있다. 렌즈 중심에서 물체까지의 수평 거리는 \\(a\\), 렌즈 중심에서 초점까지의 수평 거리는 \\(f\\)로 표시되어 있다.\n(나): 세로축은 ‘상의 크기’, 가로축은 \\(a\\)이며 원점은 \\(0\\)이다. \\(a=f\\) 위치에 수직 점선이 있고, 그래프는 이 선을 경계로 두 갈래이다. \\(0<a<f\\)에서는 그래프가 세로축의 \\(h\\) 높이 부근에서 시작하여 \\(a=f\\)에 가까워질수록 급격히 증가한다. \\(a>f\\)에서는 그래프가 \\(a=f\\) 직후 매우 큰 값에서 시작하여 \\(a\\)가 증가할수록 감소한다. 오른쪽 곡선이 \\(h\\) 높이의 수평 점선과 만나는 지점에서 가로축으로 수직 점선이 내려가며, 그 가로축 위치가 ㉠로 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"4": 0.12, "1": 0.18, "2": 0.13, "5": 0.32, "3": 0.25}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/physics-2/page-03.jpg", "page": 3}, {"id": "physics-2:17", "subject": "물리학Ⅱ", "section": "physics-2", "number": 17, "selected": "4", "answer": "1", "points": "2", "visual": true, "state": {"question": "그림과 같이 \\(xy\\)평면의 원점 O에서 물체를 \\(x\\)축과 \\(30^\\circ\\)의 각을 이루며 속력 \\(v\\)로 발사하였더니, 물체가 점 p, q, r를 지나, \\(x\\)축과 \\(\\theta\\)의 각을 이루며 점 s를 지난다. 물체는 \\(xy\\)평면상의 영역 Ⅰ, Ⅱ에서 가속도가 서로 다른 등가속도 운동을 한다. p와 r는 각각 Ⅰ, Ⅱ에서 \\(x\\)축과 물체 사이의 거리가 최대인 점이고, q와 s는 각각 \\(x=L\\), \\(x=4L\\)인 \\(x\\)축상의 점이다. p와 \\(y\\)축 사이의 거리는 \\(L\\)이고, \\(\\tan\\theta=\\frac{1}{2\\sqrt{3}}\\)이다.\n\nr와 \\(x\\)축 사이의 거리는? (단, 물체의 크기는 무시한다.)", "passage": "", "visual_description": "좌표평면에서 원점 O를 지나 오른쪽으로 \\(x\\)축이, 위쪽으로 \\(y\\)축이 그려져 있다. O에서 오른쪽 위 방향으로 향하는 화살표에 \\(v\\)가 표시되어 있고, 이 방향과 \\(x\\)축 사이의 각이 \\(30^\\circ\\)로 표시되어 있다. 물체의 점선 궤적은 O에서 시작하여 위로 휘어 올라가 최고점 p를 지난 뒤 아래로 내려와 \\(x\\)축 위의 q를 지난다. p와 q는 같은 수직 점선 위에 있으며, q 아래에 \\(L\\)이 표시되어 있다. 이후 궤적은 \\(x\\)축 아래로 내려가 최저점 r를 지나 다시 올라가 \\(x\\)축 위의 s에 이른다. s 아래에는 \\(4L\\)이 표시되어 있다. s에서 궤적의 접선 방향으로 오른쪽 위를 향하는 화살표가 있으며, 이 방향과 \\(x\\)축 사이의 각이 \\(\\theta\\)로 표시되어 있다. q의 왼쪽 위쪽 영역은 ‘영역 Ⅰ’, q부터 오른쪽으로 이어지는 \\(x\\)축 아래쪽의 회색 영역은 ‘영역 Ⅱ’로 표시되어 있다. \\(x\\)축에는 q와 s 사이에 눈금 하나가 있다."}, "options": ["\\(\\frac{3\\sqrt{3}}{10}L\\)", "\\(\\frac{7\\sqrt{3}}{20}L\\)", "\\(\\frac{2\\sqrt{3}}{5}L\\)", "\\(\\frac{9\\sqrt{3}}{20}L\\)", "\\(\\frac{\\sqrt{3}}{2}L\\)"], "probs": {"1": 0.15, "2": 0.18, "3": 0.14, "4": 0.42, "5": 0.11}, "others": {"Luna": "1", "Terra": "3", "Sol": "1"}, "image": "images/physics-2/page-04.jpg", "page": 4}, {"id": "physics-2:19", "subject": "물리학Ⅱ", "section": "physics-2", "number": 19, "selected": "2", "answer": "3", "points": "2", "visual": true, "state": {"question": "그림과 같이 높이 \\(2h\\)인 곳에서 가만히 놓은 물체가 궤도를 따라 운동하여 수평면의 구간 Ⅰ을 지나고 높이 \\(3h\\)인 수평 구간 Ⅱ에서 정지한다. Ⅰ, Ⅱ에서 이동하는 동안 물체에는 수평 방향으로 같은 크기의 일정한 힘이 각각 작용하며, 물체가 Ⅱ에서 이동하는 데 걸리는 시간은 Ⅰ을 지나는 데 걸리는 시간의 \\(\\sqrt{3}\\)배이다. Ⅰ과 Ⅱ에서 역학적 에너지 변화량의 크기는 각각 \\(E_{\\mathrm I}\\), \\(E_{\\mathrm{II}}\\)이다.\n\n\\(\\frac{E_{\\mathrm I}}{E_{\\mathrm{II}}}\\)은? (단, 물체는 동일 연직면상에서 운동하고, 물체의 크기, 공기 저항, 모든 마찰은 무시한다.)", "passage": "", "visual_description": "점선으로 표시된 수평면을 기준으로 궤도가 그려져 있다. 왼쪽에서 높이 \\(2h\\)인 경사면 위에 기울어진 사각형 물체가 놓여 있고, 궤도는 오른쪽 아래로 내려가 수평면 높이의 평평한 바닥 구간으로 이어진다. 이 바닥의 회색 수평 부분 아래에 ‘구간 Ⅰ’이 표시되어 있다. 이어서 궤도는 오른쪽 위로 올라가 높이 \\(3h\\)인 평평한 수평 구간으로 연결된다. 위쪽의 회색 수평 부분 아래에 ‘구간 Ⅱ’가 표시되어 있다. 구간 Ⅱ의 끝부분 위에 사각형 물체가 있고 그 위에 ‘정지’가 표시되어 있다. 수평면에서 왼쪽 출발 높이까지의 수직 거리는 \\(2h\\), 수평면에서 구간 Ⅱ 높이까지의 수직 거리는 \\(3h\\)로 표시되어 있다. 점선 기준선 오른쪽에는 ‘수평면’이 표시되어 있다."}, "options": ["\\(\\frac{13}{9}\\)", "\\(\\frac{14}{9}\\)", "\\(\\frac{5}{3}\\)", "\\(\\frac{16}{9}\\)", "\\(2\\)"], "probs": {"5": 0.1, "1": 0.17, "4": 0.24, "2": 0.31, "3": 0.18}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/physics-2/page-04.jpg", "page": 4}, {"id": "politics-law:5", "subject": "정치와 법", "section": "politics-law", "number": 5, "selected": "4", "answer": "5", "points": "3", "visual": true, "state": {"question": "다음 자료에 대한 분석 및 추론으로 옳은 것은? [3점]", "passage": "갑국의 시기별 정부 형태는 전형적인 의원 내각제 또는 전형적인 대통령제 중 어느 하나에 해당한다. t∼t+3 시기에 갑국의 의회 전체 의석수는 200석으로 변동이 없으며, t 시기의 정부 형태는 직전 시기의 정부 형태와 동일하고, t+3 시기의 정부 형태는 직후 시기의 정부 형태와 동일하다.\n\n◦ t 시기에 행정부 수반이 국가 원수의 지위를 동시에 가지며, 과반 의석을 차지한 정당이 존재함.\n◦ t 시기에 비해 t+1 시기에 의회 의석수는 A당이 10석 감소, B당이 20석 감소, C당이 30석 증가함.\n◦ t+2 시기에 행정부 수반은 A당 소속이고, t+2 시기 C당의 의회 의석수는 t 시기 C당 의회 의석수의 50%임.\n◦ t+2 시기에 비해 t+3 시기에 의회 의석수는 B당이 44석 감소, C당이 23석 증가함.\n◦ t+1 시기와 t+2 시기의 정당별 의회 의석률은 다음과 같음.\n\n<t+1 시기>\n사선 무늬: 45%\n더하기표 무늬: 30%\n점 무늬: 25%\n\n<t+2 시기>\n사선 무늬: 55%\n더하기표 무늬: 40%\n점 무늬: 5%\n\n* 사선 무늬, 더하기표 무늬, 점 무늬는 각각 A∼C당 중 하나이고, t+1 시기와 t+2 시기의 서로 같은 무늬는 같은 정당을 의미함.\n\n* 의원 내각제인 경우, 각 시기에 최초 구성된 내각은 해당 시기 동안 변경 없이 지속되며, 단독 내각 성립이 가능하다면 연립 내각은 구성되지 않음.\n** 각 시기의 정부 형태는 해당 시기 내에서 동일하며, 각 시기 내 정당별 의회 의석률 변화와 행정부 수반의 당적 변화는 없음.\n*** 갑국에는 A∼C당만 존재하고 무소속 의원은 없음.", "visual_description": "자료 안에 원그래프 두 개가 좌우로 배치되어 있다. 왼쪽 원그래프의 제목은 ‘<t+1 시기>’이고, 사선 무늬 영역 45%, 더하기표 무늬 영역 30%, 점 무늬 영역 25%로 구성되어 있다. 오른쪽 원그래프의 제목은 ‘<t+2 시기>’이고, 사선 무늬 영역 55%, 더하기표 무늬 영역 40%, 점 무늬 영역 5%로 구성되어 있다. 오른쪽 그래프의 5% 표기는 작은 점 무늬 부문에서 바깥쪽으로 연결된 선 옆에 있다. 그래프 아래에는 사선 무늬, 더하기표 무늬, 점 무늬를 보여 주는 범례가 있다."}, "options": ["t 시기와 t+1 시기의 정부 형태가 서로 다르다면, t+1 시기에 의회 의원이 각료를 겸직할 수 없다.", "t 시기에 행정부 수반이 B당 소속이라면, t+2 시기에 비해 t 시기에 행정부 수반이 제출한 법률안이 의회에서 통과될 가능성이 높다.", "t+3 시기의 정부 형태와 행정부 수반 소속 정당이 t+2 시기와 같다면, t+2 시기와 t+3 시기 모두 야당 의석수가 여당보다 많다.", "t∼t+3 시기 중 정부 형태가 2회 변경되었다면, t+1 시기와 t+2 시기 모두 행정부 수반이 법률안에 대한 거부권을 가진다.", "t∼t+3 시기 중 정부 형태가 3회 변경되었다면, t+3 시기에 A당이 단독으로 내각을 구성하였을 것이다."], "probs": {"3": 0.19, "1": 0.17, "5": 0.11, "2": 0.26, "4": 0.27}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/politics-law/page-01.jpg", "page": 1}, {"id": "politics-law:8", "subject": "정치와 법", "section": "politics-law", "number": 8, "selected": "3", "answer": "2", "points": "2", "visual": false, "state": {"question": "다음 사례에 대한 법적 판단으로 옳은 것은?", "passage": "온라인 쇼핑몰을 운영하는 갑(25세)이 ○○ 운동화 모조품을 진품으로 속이고 판매하다 사기 혐의로 고발되자, 갑은 ‘을이 수사 기관에서 허위 진술해 주면 100만 원을 지급하겠다’는 사회 질서에 반하는 계약을 을과 체결하였다. 한편 병(18세)은 갑이 판매하는 ○○ 운동화 모조품을 진품으로 믿고 계약을 체결하였다. 이후 병이 형 몰래 형의 휴대폰을 사용하여 송금하고 갑에게 자신이 미성년자라서 형의 이름으로 입금하였다고 말하여, 갑은 <u>병이 미성년자임을 알게 되었다.<\/u> 이후 병은 구입한 운동화를 친구 정(18세)에게 아무런 대가 없이 선물하였다. 다음 날 이러한 사실 전부를 알게 된 병의 법정 대리인 A가 정의 법정 대리인 B에게 이야기하여 B도 비로소 병과 정의 운동화 증여에 대해 알게 되었다."}, "options": ["을이 갑과의 계약에 따른 진술을 하였다면, 갑은 을에게 100만 원을 지급하여야 한다.", "병이 미성년자임을 갑이 알게 되었을 당시 갑은 병과의 ○○ 운동화 매매 계약 체결의 의사 표시를 철회할 수 있다.", "A가 갑과 병의 ○○ 운동화 매매 계약을 취소하더라도 갑은 병에게 ○○ 운동화 모조품 인도에 대하여 채무 불이행에 따른 손해 배상 책임을 진다.", "A는 병과 정의 ○○ 운동화 증여 계약을 취소할 수 없다.", "병은 B에게 병과 정의 ○○ 운동화 증여 계약을 취소할 것인지에 대한 확답을 촉구할 수 있다."], "probs": {"2": 0.26, "1": 0.06, "5": 0.27, "4": 0.14, "3": 0.27}, "others": {"Luna": "2", "Terra": "5", "Sol": "2"}, "image": "images/politics-law/page-02.jpg", "page": 2}, {"id": "politics-law:11", "subject": "정치와 법", "section": "politics-law", "number": 11, "selected": "4", "answer": "2", "points": "2", "visual": false, "state": {"question": "다음 자료에 대한 설명으로 옳은 것은? (단, A, B는 각각 현실주의, 자유주의 중 하나임.)", "passage": "◇◇칼럼\n\n유엔 기후 변화 협약 당사국 총회에서 온실가스 감축 의무를 규정한 ㉠ 교토 의정서가 채택되었다. ○○ 지역 국가 연합은 이번 합의를 국제 협력의 전환점으로 평가했다. 이는 국제 사회의 규범과 제도를 통한 협력을 강조하는 A 관점을 지지하는 사례로 풀이된다. 하지만 △△국은 이번 합의가 자국을 포함한 일부 선진국에게만 과도한 감축 의무를 부과하는 합의라고 비판하며 비준을 거부하기로 했다. 이는 국가 이익을 국제 협력보다 중시하는 B 관점을 선명하게 보여준다."}, "options": ["A는 국가 간 협동에 따른 국제 사회의 집단적 대응을 불신한다.", "B는 국가 간 힘의 균형이 이루어질 때 국제 분쟁 발생 가능성이 낮다고 본다.", "B와 달리 A는 국제 사회의 무정부성을 전제하며 국가를 국제 사회에서 가장 중요한 행위자로 간주한다.", "㉠과 같은 국제법의 법원(法源)은 국가 간의 명시적 합의이므로 국제기구는 체결 당사자가 될 수 없다.", "다자간 합의를 통해 국제법으로 인정된 ㉠은 원칙적으로 국제 사회의 모든 국가에 대해 법적 구속력을 가진다."], "probs": {"3": 0.01, "1": 0.02, "2": 0.06, "4": 0.83, "5": 0.08}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/politics-law/page-03.jpg", "page": 3}, {"id": "politics-law:14", "subject": "정치와 법", "section": "politics-law", "number": 14, "selected": "1", "answer": "2", "points": "3", "visual": false, "state": {"question": "다음 사례에 대한 법적 판단으로 옳은 것은? [3점]", "passage": "갑은 법률혼 관계의 아내가 A를 출산한 후 사망하여 A를 홀로 양육하다 A가 3세 되던 해에 B를 양육하던 을과 법률혼을 하였다. B는 법률혼 관계에 있던 을과 병 사이에서 출생한 자녀로, 을과 병이 이혼하면서 을이 단독 친권자로 지정되었다. 갑과 법률혼을 한 을은 그 해에 C를 출산하였고, 다음 해 갑은 행위 능력이 있는 B의 동의를 받아 B를 적법하게 입양하였다. 1년 후 병이 사망하여 B는 병으로부터 상당한 재산을 상속받았다. 다음 해 갑은 을의 부정행위를 이유로 을과 협의 이혼하였고, 그해 말 갑은 갑작스런 사고로 유언 없이 사망하였다."}, "options": ["갑과 을이 이혼 당시 A의 친권자, C의 친권자를 협의하여 정하지 않으면 법원은 직권으로 친권자를 지정하여야 한다.", "을은 B가 병으로부터 상속받은 재산을 관리하지 못한다.", "B가 양자로 입양된 때에 갑은 B와 친족이지만 을은 A와 친족이 아니다.", "B가 양자로 입양된 때에 병은 B와 친족이지만 C는 B와 친족이 아니다.", "갑의 사망 당시 A와 C는 갑의 상속인이지만 B는 갑의 상속인이 아니다."], "probs": {"5": 0.15, "2": 0.18, "4": 0.19, "1": 0.4, "3": 0.08}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/politics-law/page-03.jpg", "page": 3}, {"id": "politics-law:15", "subject": "정치와 법", "section": "politics-law", "number": 15, "selected": "3", "answer": "5", "points": "2", "visual": true, "state": {"question": "다음 자료에 대한 옳은 분석만을 <보기>에서 있는 대로 고른 것은?", "passage": "갑국의 의회 전체 의석수는 400석으로 지역구 의석수와 비례 대표 의석수가 동일하다. 유권자는 지역구 의원 선출을 위해 후보자에게 1표, 비례 대표 의원 선출을 위해 정당에 1표를 행사한다. 지역구 의원 선거에서 선거구 수는 100개이며 각 선거구별로 같은 수의 의회 의원이 득표순으로 선출된다. 비례 대표 의석은 전국을 하나의 선거구로 하여 정당 득표율에 의회 전체 의석수를 곱하여 산출된 수의 정수(整數)만큼 각 정당의 의석으로 배정한 후, 정당별로 배정된 의석수에서 해당 정당의 지역구 의석수를 뺀 나머지 의석을 각 정당의 비례 대표 의석으로 배분한다. 다음은 갑국의 최근 의회 의원 선거 결과이다.\n\n[막대그래프: 갑국의 최근 의회 의원 선거 결과]\n가로축에는 왼쪽부터 A당, B당, C당, D당이 표시되어 있다. 세로축은 백분율을 나타내며 0, 20, 40, 60에 눈금이 표시되어 있다. 각 정당마다 흰색 막대인 ‘지역구 의석률(%)’과 회색 막대인 ‘정당 득표율(%)’이 나란히 제시되어 있다. A당은 지역구 의석률 19%, 정당 득표율 15%이다. B당은 지역구 의석률 45%, 정당 득표율 55%이다. C당은 지역구 의석률 26%, 정당 득표율 20%이다. D당은 지역구 의석률 10%, 정당 득표율 10%이다.\n\n갑국은 현재의 의회 전체 의석수와 지역구 의원 선거의 선거구 수를 유지하면서 선거구 재획정 없이 다음과 같은 두 가지 선거 제도 개편안을 검토하고 있다.\n\n◦ 지역구 의석수와 비례 대표 의석수의 비는 <1안>에서는 1 : 3, <2안>에서는 현행과 동일하다.\n◦ 지역구 의원 선출 방식의 경우 <1안>에서는 1차 투표에서 50% 초과 득표한 후보자가 있으면 당선인으로 확정하고, 당선인이 없으면 1위와 2위 득표자를 대상으로 2차 투표하여 최다 득표자를 당선인으로 결정한다. <2안>에서는 현행과 동일하게 당선인을 결정한다.\n◦ 비례 대표 의석 배분 방식의 경우 <1안>에서는 현행과 동일하며, <2안>에서는 전국을 하나의 선거구로 하여 정당 득표율에 비례 대표 의석수를 곱하여 산출된 수의 정수(整數)만큼 각 정당의 비례 대표 의석으로 배분한다.\n\n* 갑국에는 A～D당만 존재하고, 무소속 의원은 없으며, 투표율은 100%이고 무효표는 없음.\n** <2안>의 경우, 최근 의회 의원 선거 결과를 기준으로 판단함.\n\n<보기>\nㄱ. <1안>의 경우, 지역구 의원 선거에서 1차 투표의 최다 득표자가 2차 투표에서 낙선될 가능성을 배제할 수 없다.\nㄴ. <1안>과 달리 현행 지역구 의원 선거의 선거구제는 동일 선거구 내 당선자 간 표의 등가성 문제가 발생할 수 있는 제도이다.\nㄷ. <2안> 적용 결과와 달리 현행에서는 의회 전체 의석수의 과반을 차지한 정당이 존재한다.", "visual_description": "자료 중간에 두 계열의 세로 막대그래프가 있다. 가로축에는 A당, B당, C당, D당이 왼쪽부터 배열되어 있고, 세로축에는 0, 20, 40, 60의 눈금과 가로 점선이 있다. 범례에서 흰색 막대는 ‘지역구 의석률(%)’, 회색 막대는 ‘정당 득표율(%)’을 뜻한다. 각 막대 위 수치는 A당 19와 15, B당 45와 55, C당 26과 20, D당 10과 10이며, 각 정당에서 흰색 막대가 먼저, 회색 막대가 그 오른쪽에 있다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"5": 0.3, "1": 0.29, "3": 0.3, "4": 0.06, "2": 0.05}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/politics-law/page-03.jpg", "page": 3}, {"id": "politics-law:20", "subject": "정치와 법", "section": "politics-law", "number": 20, "selected": "3", "answer": "4", "points": "2", "visual": false, "state": {"question": "다음 자료에 대한 법적 판단으로 옳은 것은?", "passage": "◦ □□ 행정 법원은 갑이 제기한 수사 경력 자료 삭제 거부 처분의 취소 소송 진행 중, 소년부 법원에서 불처분 결정된 사건의 수사 경력 자료의 삭제 및 보존 기간을 규정하지 않은 ○○법 조항에 대하여 헌법 재판소에 A를 제청하였다. 헌법 재판소는 해당 조항으로 인해 수사 경력 자료가 일률적으로 당사자가 사망할 때까지 보존되는 것은 침해의 최소성에 위배되며, 달성되는 공익에 비해 당사자가 입을 수 있는 불이익이 더 크다고 보아 헌법에 합치되지 않는다고 결정하였다.\n◦ 가정 폭력 피해자인 을은 가정 폭력 가해자인 전(前) 배우자가 아무런 제한 없이 그 자녀의 가족 관계 증명서를 발급받을 수 있도록 한 △△법 조항이 자신의 개인 정보 자기 결정권을 침해한다며 헌법 재판소에 B를 청구하였다. 헌법 재판소는 △△법 조항이 정당한 입법 목적 달성을 위한 적합한 수단이지만 필요한 범위를 넘어선 것일 뿐 아니라 이로 인해 침해되는 을의 기본권이 이를 통해 달성하려는 공익보다 중하다고 보아 헌법에 합치되지 않는다고 결정하였다."}, "options": ["□□ 행정 법원이 헌법 재판소에 A를 제청하기 위해서는 갑이 □□ 행정 법원에 필수적으로 A 제청 신청을 하여야 한다.", "□□ 행정 법원이 제청한 A는 수사 경력 자료 삭제 거부 처분을 심판 대상으로 하였다.", "을이 청구한 B는 △△법 조항의 위헌 여부를 판단하는 위헌 심사형 헌법 소원 심판이다.", "을이 청구한 B와 달리 □□ 행정 법원이 제청한 A는 구체적 사건의 재판에 적용되는 법률의 위헌 여부가 재판의 전제가 될 것을 요구한다.", "헌법 재판소는 ○○법 조항과 달리 △△법 조항이 헌법상 과잉 금지의 원칙에 위배된다고 판단하였다."], "probs": {"1": 0.05, "4": 0.26, "5": 0.15, "2": 0.02, "3": 0.52}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/politics-law/page-04.jpg", "page": 4}, {"id": "russian-1:1", "subject": "러시아어Ⅰ", "section": "russian-1", "number": 1, "selected": "1", "answer": "3", "points": "2", "visual": true, "state": {"question": "밑줄 친 부분과 발음이 같은 것은?", "passage": "<u>э<\/u>кзамен", "visual_description": "교실에서 세 학생이 각자 책상에 앉아 시험지를 보고 있는 흑백 삽화이다. 앞쪽 중앙의 학생은 시험지에 답을 쓰고 있고, 뒤쪽 왼편과 오른편에도 학생이 한 명씩 앉아 있다. 삽화 아래에 밑줄 친 단어 “экзамен”이 인쇄되어 있다."}, "options": ["вн<u>у<\/u>к", "диал<u>о<\/u>г", "ин<u>о<\/u>гда", "<u>к<\/u>вартира", "откр<u>ы<\/u>тка"], "probs": {"2": 0.19, "3": 0.12, "1": 0.29, "5": 0.26, "4": 0.14}, "others": {"Luna": "3", "Terra": "3", "Sol": "5"}, "image": "images/russian-1/page-01.jpg", "page": 1}, {"id": "russian-1:2", "subject": "러시아어Ⅰ", "section": "russian-1", "number": 2, "selected": "5", "answer": "2", "points": "2", "visual": false, "state": {"question": "밑줄 친 부분과 발음이 같은 것만을 <보기>에서 고른 것은?", "passage": "Папа в<u>о<\/u>дит сына в школу.\n\n<보기>\na. Они см<u>о<\/u>трят кино.\nb. Мы д<u>о<\/u>лжны работать.\nc. Мы х<u>о<\/u>дим на занятия вместе.\nd. Я редко л<u>о<\/u>жусь спать поздно."}, "options": ["a, b", "a, c", "b, c", "b, d", "c, d"], "probs": {"3": 0.16, "4": 0.16, "5": 0.22999999999999998, "2": 0.21, "1": 0.24}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/russian-1/page-01.jpg", "page": 1}, {"id": "social-culture:1", "subject": "사회·문화", "section": "social-culture", "number": 1, "selected": "4", "answer": "5", "points": "2", "visual": false, "state": {"question": "밑줄 친 ㉠～㉤과 같은 현상의 일반적인 특징에 대한 설명으로 옳은 것은?", "passage": "길이 약 1 mm의 투명한 예쁜꼬마선충(Caenorhabditis elegans)은 유전적 특징이 인간의 DNA와 유사한 것으로 밝혀졌다. 이 선충은 <u>㉠ 짧은 수명과 빠른 세대 교체<\/u> 덕분에 <u>㉡ 세포 발달과 노화 과정<\/u>을 규명하는 데 적합하다. 특히 이 선충은 신경 세포와 신경망 구조가 밝혀져 있어 <u>㉢ 신경계의 기능과 발달 원리<\/u>를 파악하는 데 큰 기여를 했다. <u>㉣ 예쁜꼬마선충의 변이에 따른 진화와 적응의 과정<\/u>은 <u>㉤ 인간 질병의 유전적 기반<\/u>을 이해하는 데도 중요한 단서를 제공한다."}, "options": ["㉠과 같은 현상은 인과 관계가 불분명하다.", "㉡과 같은 현상은 몰가치적이다.", "㉢과 같은 현상은 확실성의 원리가 적용된다.", "㉣과 같은 현상은 보편성과 특수성이 공존한다.", "㉤과 같은 현상은 개연성의 원리가 적용된다."], "probs": {"2": 0.05, "1": 0.03, "3": 0.02, "4": 0.76, "5": 0.14}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/social-culture/page-01.jpg", "page": 1}, {"id": "social-culture:5", "subject": "사회·문화", "section": "social-culture", "number": 5, "selected": "2", "answer": "1", "points": "3", "visual": true, "state": {"question": "다음 자료에 대한 옳은 설명만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "연구자 갑은 요즘 청소년들이 게임을 하지 않으면 친구 관계를 유지하기 어렵다는 기사를 접했다. 이후 갑은 친구와의 관계에 대한 인식이 청소년의 게임 의존에 미치는 영향을 파악하고자\n\n(가) ____________________\n\n를 가설로 설정하고 연구를 진행하였다. 이를 위해 갑은 A 기관이 공개한 청소년 대상 설문 조사 자료에서 <u>㉠ 친구와의 관계에 대한 인식을 측정하는 문항<\/u>과 게임 의존 정도를 측정하는 문항의 응답 결과에 대해 청소년 1,000명을 무작위로 추출하여 분석하였다. 자료 분석 결과, 친구와의 관계에 대한 긍정적 인식 정도가 청소년 게임 의존 정도에 미치는 영향은 통계적으로 유의미한 부(-)의 관계인 것으로 나타났다. 분석 결과를 토대로 갑은\n\n(나) ____________________\n\n라고 제언하였다.\n\n<보기>\nㄱ. ㉠은 갑의 연구에서 1차 자료 수집을 위한 조사 도구이다.\nㄴ. (가)에는 ‘친구와의 관계에 대한 인식이 긍정적일수록 청소년의 게임 의존도가 높을 것이다.’가 들어갈 수 있다.\nㄷ. (나)에는 ‘청소년의 게임 과의존을 예방하기 위해서는 친구와의 관계를 긍정적으로 형성해 가는 것이 필요하다.’가 들어갈 수 없다.", "visual_description": "자료 전체가 사각형 틀 안에 있다. 본문 중 (가)와 (나)는 각각 가로로 긴 빈 사각형 안의 중앙 아래쪽에 표시되어 있으며, 문장이 이 빈칸의 앞뒤로 이어진다."}, "options": ["ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"1": 0.15, "2": 0.54, "3": 0.02, "4": 0.2, "5": 0.09}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/social-culture/page-01.jpg", "page": 1}, {"id": "social-culture:7", "subject": "사회·문화", "section": "social-culture", "number": 7, "selected": "1", "answer": "2", "points": "2", "visual": false, "state": {"question": "다음 자료에 대한 설명으로 옳은 것은?", "passage": "최근 주목받고 있는 애니메이션 ○○는 갑국의 일부 젊은이들이 즐겨온 을국의 아이돌 음악에 갑국 대중음악의 색깔을 입혀 갑국에서 창작된 작품이다. ○○에는 갑국 대중음악 요소를 을국 아이돌 가수의 노래에 녹여낸 새로운 음악 형식이 나타난다. 갑국은 온라인 동영상 플랫폼을 통해 ○○를 수출하였고, ○○는 갑국뿐만 아니라 을국에서 선풍적인 인기를 얻은 후 병국을 포함하여 세계적인 흥행을 일으키고 있다. 이후, 을국의 아이돌 음악은 병국의 음원 시장을 장악하며 젊은이들이 열광하는 음악 장르 중 하나로 자리 잡았다."}, "options": ["갑국에서는 자극 전파에 의한 문화 변동이 나타난다.", "갑국과 병국 모두에서 문화 공존이 나타난다.", "을국과 병국 모두에서 문화 융합이 나타난다.", "을국과 병국 모두에서 직접 전파에 의한 문화 변동이 나타난다.", "갑국, 을국과 달리 병국에서는 문화 동화가 나타난다."], "probs": {"4": 0.08, "3": 0.07, "1": 0.62, "5": 0.09, "2": 0.14}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/social-culture/page-02.jpg", "page": 2}, {"id": "social-culture:8", "subject": "사회·문화", "section": "social-culture", "number": 8, "selected": "1", "answer": "5", "points": "3", "visual": true, "state": {"question": "다음 자료에 대한 설명으로 옳은 것은? [3점]", "passage": "A대학교 26학번 ㉠예비 대학생이 되신 걸 축하합니다!\n입학 후 하고 싶은 일을 메모지에 적어서 붙여 주세요.\n\n갑의 메모지: 재활 관련 지식을 잡지에서 찾아보며 고등학교 때부터 스포츠 트레이너가 되려고 준비했습니다. 관련 자격증을 취득하여 학과 내 재활 봉사 소모임을 만들고 싶어요. 국제 의료 봉사 단체에서 경험도 쌓고 싶습니다.\n- 갑, 간호학과 입학 예정\n\n을의 메모지: 저는 기후 관련 환경 단체에서 활동도 하고 싶고, 가족과 여행도 가고 싶어요. 대학원 진학과 대기업 취업으로 고민하고 있는데, 무엇이든 적극적으로 도전해 보겠습니다.\n- 을, 전자공학과 입학 예정\n\n병의 메모지: 군대 가기 전까지 인권 관련 연구소에서 실태 조사와 분석 경험을 쌓고 싶어요. 그리고 ㉡교환 학생으로 해외에 나가 견문을 넓히고 싶어요.\n- 병, 사회학과 입학 예정", "visual_description": "게시판 형태의 그림이다. 맨 위에 안내문이 붙어 있고, 그 아래에 갑, 을, 병의 메모지 세 장이 위에서 아래로 차례로 압정에 고정되어 있다. 갑의 메모지는 오른쪽 아래가 위로 기울고, 을과 병의 메모지는 오른쪽 아래가 아래로 기울어져 있다."}, "options": ["㉠과 달리 ㉡은 성취 지위이다.", "자료에서 역할 갈등과 예기 사회화의 사례를 확인할 수 있다.", "갑의 메모지에 적혀 있는 비공식 조직의 개수가 을의 메모지에 적혀 있는 1차 집단의 개수보다 1개 많다.", "을의 메모지에 적혀 있는 공식적 사회화 기관의 개수와 자발적 결사체의 개수는 같다.", "병의 메모지에 적혀 있는 이익 사회의 개수는 갑의 메모지에 적혀 있는 비공식적 사회화 기관의 개수와 같다."], "probs": {"2": 0.24, "4": 0.17, "1": 0.33999999999999997, "3": 0.12, "5": 0.13}, "others": {"Luna": "5", "Terra": "5", "Sol": "4"}, "image": "images/social-culture/page-02.jpg", "page": 2}, {"id": "social-culture:10", "subject": "사회·문화", "section": "social-culture", "number": 10, "selected": "4", "answer": "3", "points": "2", "visual": true, "state": {"question": "다음 자료에 대한 옳은 분석만을 <보기>에서 고른 것은?", "passage": "다음은 갑국과 을국의 세대별 계층 구성 현황과 사회 이동 현황을 나타낸 것이다. 단, □와 ▧는 해당 칸에 들어갈 값을 표기하지 않은 것이다.\n\n<갑국> (단위: %)\n| 구분 | 부모 세대 A | 부모 세대 B | 부모 세대 C | 계 |\n|---|---:|---:|---:|---:|\n| 자녀 세대 A | 10 | □ | 15 | 45 |\n| 자녀 세대 B | 5 | 20 | 5 | 30 |\n| 자녀 세대 C | □ | □ | 10 | 25 |\n| 계 | 20 | 50 | 30 | 100 |\n\n<을국> (단위: %)\n| 구분 | 부모 세대 D | 부모 세대 E | 부모 세대 F | 계 |\n|---|---:|---:|---:|---:|\n| 자녀 세대 D | 5 | 5 | 0 | 10 |\n| 자녀 세대 E | ▧ | 35 | ▧ | 60 |\n| 자녀 세대 F | ▧ | 20 | 10 | 30 |\n| 계 | 10 | 60 | 30 | 100 |\n\n* □는 세대 간 상승 이동, ▧는 세대 간 하강 이동에 해당함.\n** 갑국에서 A～C, 을국에서 D～F는 각각 상층, 중층, 하층 중 하나임.\n*** 세대 간 이동은 부모 세대와 자녀 세대의 계층을 비교하여 판단함.\n\n<보기>\nㄱ. 갑국에서는 계층 대물림 비율이 세대 간 이동 비율보다 높다.\nㄴ. 을국에서는 세대 간 상승 이동 비율과 세대 간 하강 이동 비율이 동일하다.\nㄷ. 부모 세대 중층의 경우, 세대 간 이동 비율은 갑국이 을국보다 낮다.\nㄹ. 부모 세대의 계층 구조는 갑국은 모래시계형, 을국은 다이아몬드형이다.", "visual_description": "갑국과 을국의 자료가 좌우에 각각 하나씩 표로 제시되어 있다. 갑국 표에서 값이 표기되지 않은 상승 이동 칸은 연한 회색으로 채워져 있으며, 자녀 세대 A·부모 세대 B 칸, 자녀 세대 C·부모 세대 A 칸, 자녀 세대 C·부모 세대 B 칸이다. 을국 표에서 값이 표기되지 않은 하강 이동 칸은 점무늬로 채워져 있으며, 자녀 세대 E·부모 세대 D 칸, 자녀 세대 E·부모 세대 F 칸, 자녀 세대 F·부모 세대 D 칸이다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"2": 0.12, "3": 0.09, "1": 0.19, "5": 0.29, "4": 0.31}, "others": {"Luna": "3", "Terra": "5", "Sol": "3"}, "image": "images/social-culture/page-02.jpg", "page": 2}, {"id": "social-culture:14", "subject": "사회·문화", "section": "social-culture", "number": 14, "selected": "5", "answer": "4", "points": "3", "visual": true, "state": {"question": "다음은 학생의 응답에 대한 교사의 채점 결과이다. 이에 대한 설명으로 옳은 것은? (단, A～D는 각각 질문지법, 면접법, 실험법, 문헌 연구법 중 하나임.) [3점]", "passage": "※ 제시된 진술이 자료 수집 방법 A, B, C, D의 특징으로 맞으면 ‘○’, 틀리면 ‘×’를 쓰시오.\n\n| 진술 | A | B | C | D | 채점 결과 |\n|---|---:|---:|---:|---:|---:|\n| 연구자와 연구 대상자 간의 언어적 상호 작용이 필수적이다. | × | × | ○ | ○ | 2점 |\n| 기존의 연구 동향이나 성과를 파악하는 데 주로 활용된다. | ○ | ○ | × | × | 1점 |\n| 연구자가 직접 수집한 자료를 계량화하여 양적 연구에 주로 활용한다. | ○ | × | × | ○ | 0점 |\n| (가) | ○ | × | ○ | × | ㉠ |\n\n* 교사는 각 진술에 대한 학생 응답을 채점하며, 옳은 응답에는 1점, 틀린 응답에는 0점을 부여함. 각 진술별 만점은 4점임.", "visual_description": "자료 수집 방법 A, B, C, D에 대한 학생의 ○·× 응답과 각 진술의 채점 결과가 표로 제시되어 있다. 표의 내용은 context에 행과 열 순서대로 전사되어 있다."}, "options": ["B는 연구 대상자와의 정서적 교감을 중시한다.", "D는 연구 대상자로부터의 반응을 통해 자료를 수집한다.", "C와 달리 A는 다수를 대상으로 자료를 수집하기 적합하다.", "(가)에 ‘인위적 통제 상황에서 처치로 인한 변화를 관찰한다.’가 들어간다면 ㉠은 ‘1점’이다.", "㉠이 ‘2점’이면 (가)에 ‘현지에서 연구 대상자와 함께 생활하며 관심을 갖는 연구 현상을 관찰한다.’가 들어갈 수 없다."], "probs": {"5": 0.42, "3": 0.18, "4": 0.21, "1": 0.11, "2": 0.08}, "others": {"Luna": "2", "Terra": "4", "Sol": "4"}, "image": "images/social-culture/page-03.jpg", "page": 3}, {"id": "social-culture:15", "subject": "사회·문화", "section": "social-culture", "number": 15, "selected": "3", "answer": "5", "points": "3", "visual": true, "state": {"question": "다음 자료에 대한 분석으로 옳은 것은? (단, A～C는 각각 사회 보험, 공공 부조, 사회 서비스 중 하나임.) [3점]", "passage": "갑국에는 사회 보장 제도 A～C만 존재하고, 모두 우리나라의 사회 보장 제도와 동일하다. A는 선별적 복지의 이념을, B는 상호 부조의 원리를 기반으로 하는 제도이다. C는 국민의 인간다운 생활을 보장하고 삶의 질이 향상되도록 상담이나 돌봄 등 여러 방법을 활용하여 지원하는 제도이다.\n\nt년에 중복 수혜자 중 B의 혜택을 받는 사람 수와 t+30년에 중복 수혜자 중 A의 혜택을 받는 사람 수는 각각 전체 인구의 10%이다. 금전적 지원이 원칙인 두 제도의 혜택을 동시에 받는 사람 수는 t년이 전체 인구의 5%이고, t+30년은 전체 인구의 2%이다. 단, 갑국의 t년과 t+30년 전체 인구는 동일하다.\n\n<전체 인구 중 A～C 수혜자의 비율>\n(단위: %)\n\n| 구분 | A 수혜자 | B 수혜자 | C 수혜자 | 3중 수혜자 | 전체 수혜자 |\n|---|---:|---:|---:|---:|---:|\n| t년 | 20 | 60 | 15 | 0 | 82 |\n| t+30년 | 15 | 75 | 20 | 2 | 95 |\n\n* 중복 수혜자: A, B, C 중 2개 이상의 혜택을 받는 사람\n** 3중 수혜자: A, B, C의 혜택을 모두 받는 사람\n*** 전체 수혜자: A, B, C 중 1개 이상의 혜택을 받는 사람", "visual_description": "t년과 t+30년의 전체 인구 중 A 수혜자, B 수혜자, C 수혜자, 3중 수혜자, 전체 수혜자의 비율을 비교하는 표가 제시되어 있다. 단위는 %이며, 표의 수치는 context에 행과 열 순서대로 전사되어 있다."}, "options": ["t년에 공공 부조의 혜택만을 받는 사람 수는 사회 서비스의 혜택만을 받는 사람 수보다 적다.", "t+30년에 사회 보험의 혜택만을 받는 사람 수가 전체 수혜자 수의 70%이다.", "전체 인구 중 중복 수혜자가 아닌 사람 수는 t+30년이 t년보다 많다.", "중복 수혜자 중 정부 재정으로 비용을 전액 충당하는 것을 원칙으로 하는 제도의 혜택을 받는 사람 수는 t년이 t+30년보다 많다.", "강제 가입 원칙이 적용되는 제도와 비금전적 지원을 원칙으로 하는 제도의 혜택을 동시에 받는 사람 수는 t년과 t+30년이 동일하다."], "probs": {"1": 0.13, "3": 0.41, "5": 0.07, "4": 0.19, "2": 0.2}, "others": {"Luna": "3", "Terra": "3", "Sol": "5"}, "image": "images/social-culture/page-03.jpg", "page": 3}, {"id": "social-culture:17", "subject": "사회·문화", "section": "social-culture", "number": 17, "selected": "5", "answer": "4", "points": "3", "visual": false, "state": {"question": "다음 자료에 대한 설명으로 가장 적절한 것은? [3점]", "passage": "갑국의 A 종교 신자들이 종교 탄압에서 벗어나기 위해 국교가 A 종교인 을국으로 이주하는 일이 빈번해졌다. 이에 갑국은 사회 통합 실현을 목적으로 종교의 자유를 보장하는 ㉠ 정책을 실시하였다. 이로 인해 갑국 국민들은 누구나 자신들의 신념에 따라 종교 활동을 자유롭게 할 수 있게 되었다. 한편, B 인종에게는 주거 환경이 우수한 지역에 위치한 주택의 일정 비율을 우선 배정하는 ㉡ 정책을 실시하였다. B 인종은 갑국에서 가장 높은 인구 비중을 차지함에도 불구하고 지배 세력과 인종이 다르다는 이유로 낙후된 주거 지역에서 모여 살아야 했기 때문이다. 이후 주거 여건은 일부 개선되었지만, A 종교 신자와 달리 B 인종은 여전히 사회의 다양한 영역에서 차별받으며 살고 있다."}, "options": ["㉠은 선천적 요인에 의한 사회적 차별을 시정하려는 것이다.", "㉡은 수적 열세로 인한 사회적 차별을 시정하려는 것이다.", "㉠은 사회적 차별을, ㉡은 역차별을 시정하려는 것이다.", "사회적 소수자로 규정되는지의 여부가 사회적 상황에 따라 달라지는 것을 A 종교 신자의 사례에서 확인할 수 있다.", "의식적 차원의 노력만으로는 사회적 차별 해소에 근본적인 한계가 있음을 B 인종의 사례에서 확인할 수 있다."], "probs": {"5": 0.72, "1": 0.02, "3": 0.1, "4": 0.09, "2": 0.07}, "others": {"Luna": "5", "Terra": "4", "Sol": "4"}, "image": "images/social-culture/page-04.jpg", "page": 4}, {"id": "social-culture:18", "subject": "사회·문화", "section": "social-culture", "number": 18, "selected": "1", "answer": "2", "points": "2", "visual": false, "state": {"question": "다음 글에서 사회·문화 현상을 바라보는 필자의 관점에 대한 옳은 설명만을 <보기>에서 고른 것은?", "passage": "사회 체계는 물리적 환경과 사회적 조건 속에서 상호 작용하는 개인들의 집합체로 이루어져 있으며, 개인들은 근본적으로 최고의 만족을 추구하는 경향이 강하다. 이러한 개인들이 구축한 관계는 사회적으로 합의된 문화적 가치와 규범에 의해 매개되어 사회 체계의 효율적인 작동을 가능하게 한다.\n\n<보기>\nㄱ. 사회가 스스로 균형을 유지하려는 속성을 지닌다고 본다.\nㄴ. 개인이 현상에 의미를 부여하는 자율적 주체라는 점을 강조한다.\nㄷ. 지배 집단의 이익을 대변하는 논리로 활용될 수 있다는 비판을 받는다.\nㄹ. 개별 구성원에 대한 사회 구조의 영향력을 간과한다는 비판을 받는다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"1": 0.33, "3": 0.03, "5": 0.31, "2": 0.24, "4": 0.09}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/social-culture/page-04.jpg", "page": 4}, {"id": "social-culture:20", "subject": "사회·문화", "section": "social-culture", "number": 20, "selected": "2", "answer": "3", "points": "2", "visual": true, "state": {"question": "다음 자료는 갑국과 을국의 인구 변화 양상에 관한 예측 내용을 요약한 것이다. 이에 대한 분석 및 추론으로 옳은 것은?", "passage": "요약\n\n○ t년 대비 t+50년 전체 인구는 갑국의 경우 0.5배, 을국의 경우 2배가 되어 t+50년에 갑국과 을국의 전체 인구는 동일한 것으로 나타남.\n\n○ 표는 갑국과 을국의 t년 총부양비와 노령화 지수, t년 대비 t+50년의 인구 변화를 나타낸 것임.\n\n| 구분 | t년 총부양비 | t년 노령화 지수 | t년 대비 t+50년 유소년 인구/전체 인구 | t년 대비 t+50년 부양 인구/전체 인구 |\n|---|---:|---:|---|---|\n| 갑국 | 150 | 200 | 감소 | 변화 없음 |\n| 을국 | 25 | 100 | 변화 없음 | 감소 |\n\n○ 노령화 지수, 유소년(노년) 부양비, 총부양비의 산출식은 다음과 같음.\n\n· 노령화 지수 = $\\dfrac{\\text{노년 인구(65세 이상 인구)}}{\\text{유소년 인구(0\\sim14세 인구)}}\\times100$\n\n· 유소년(노년) 부양비 = $\\dfrac{\\text{유소년(노년) 인구}}{\\text{부양 인구(15\\sim64세 인구)}}\\times100$\n\n· 총부양비 = 유소년 부양비 + 노년 부양비\n\n○ 다음 조건을 기준으로 사회 문제의 가능성을 판단함.\n\n· 전체 인구 중 부양 인구의 비율과 경제 성장 동력은 정(+)의 관계임.\n\n· 노령화 지수와 세대 간 갈등 정도는 정(+)의 관계임.", "visual_description": "모서리 일부가 접힌 종이 모양의 큰 ‘요약’ 상자 안에 글머리표로 된 설명, 갑국과 을국을 비교하는 표, 세 개의 산출식, 사회 문제 가능성 판단 조건이 위에서 아래로 배치되어 있다. 표의 열 머리글에서 ‘t년’은 ‘총부양비’와 ‘노령화 지수’를 묶고, ‘t년 대비 t+50년’은 ‘유소년 인구/전체 인구’와 ‘부양 인구/전체 인구’를 묶는다."}, "options": ["t년 갑국의 유소년 부양비는 노년 부양비보다 크다.", "t년 갑국의 노년 인구는 t년 을국의 노년 인구의 8배이다.", "t년 갑국의 부양 인구는 t+50년 을국의 유소년 인구의 8배이다.", "t년 대비 t+50년에 경제 성장 동력은 갑국과 을국 모두 약화될 것이다.", "t년 대비 t+50년에 세대 간 갈등 정도는 갑국이 커지고, 을국은 변함이 없을 것이다."], "probs": {"1": 0.16, "5": 0.16, "4": 0.09, "2": 0.37, "3": 0.22}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/social-culture/page-04.jpg", "page": 4}, {"id": "spanish-1:1", "subject": "스페인어Ⅰ", "section": "spanish-1", "number": 1, "selected": "2", "answer": "1", "points": "1", "visual": false, "state": {"question": "밑줄 친 낱말과 강세의 위치가 같은 것은? [1점]", "passage": "A: ¿De qué material es tu <u>bolso<\/u>?\nB: Es de piel."}, "options": ["cena", "final", "mujer", "reloj", "pared"], "probs": {"2": 0.32, "1": 0.24, "4": 0.19, "5": 0.13, "3": 0.12}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/spanish-1/page-01.jpg", "page": 1}, {"id": "successful-career:4", "subject": "성공적인 직업생활", "section": "successful-career", "number": 4, "selected": "1", "answer": "2", "points": "3", "visual": true, "state": {"question": "다음 학생 A의 [NCS 직업기초능력 평가 결과]를 분석한 내용으로 옳은 것은? [3점]", "passage": "[NCS 직업기초능력 평가 결과]\n\n※ 점수가 높을수록 우수한 능력을 갖추었음을 의미함.", "visual_description": "오각형 방사형 그래프이다. 위쪽부터 시계 방향으로 ‘수리 능력’, ‘조직 이해 능력’, ‘자원 관리 능력’, ‘정보 능력’, ‘의사소통 능력’의 다섯 축이 있다. 중심에서 바깥쪽으로 1점, 2점, 3점, 4점, 5점의 동심 오각형 눈금이 표시되어 있다. 범례에서 검은 실선과 원형 점은 ‘학생 A’, 검은 점선과 원형 점은 ‘학급 평균’을 나타낸다. 학생 A의 점수는 수리 능력 4점, 조직 이해 능력 2점, 자원 관리 능력 3점, 정보 능력 4점, 의사소통 능력 3점이다. 학급 평균은 수리 능력 3점, 조직 이해 능력 3점, 자원 관리 능력 3점, 정보 능력 3점, 의사소통 능력 4점으로 표시되어 있다."}, "options": ["A가 학급 평균에 비해 우수한 능력은 기초 능력군에 속한다.", "A가 가장 낮은 점수를 받은 능력의 하위 영역에는 ‘국제 감각’이 있다.", "A가 학급 평균과 동일한 점수를 받은 능력의 하위 영역에는 ‘자기 관리 능력’이 있다.", "A가 가장 높은 점수를 받은 능력의 향상 방법으로 ‘협력, 이해와 같은 협상 전략을
