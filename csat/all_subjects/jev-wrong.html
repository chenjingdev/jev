것다 옳다 이것 한 입가심 허여 볼까\n자라가 ⓒ <u>깜짝<\/u> 놀래여 여보 당신이 뉘라 허시오\n호랑이 깜짝 놀래 에끼 이것 보아라 도리줌치 속에 배암 잡어 넣어 놓은 것같이 생긴 것이 인사성은 밝네 나는 ㉠ <u>이 산중<\/u> 지키는 호 생원 어른이로다\n자라가 호랑이란 말을 듣고서 겁짐에 바로 일러 나는 명색이 자라 새끼요\n[중모리] 호랑이 ⓓ <u>반기 듣고<\/u> 얼시구나 좋을시고 내 평생에 원하기를 왕배탕이 원일러니 오늘날 만났구나 맛진 진미를 먹어 보자 으르르르앙 허고 달려드니 자라 듣고 깜짝 놀래여 아이고 내 자라 아니요 이놈 그러면 무엇인고 내가 두꺼비요 두꺼비 같으면 더욱 좋다 너를 산 채로 불에 살라 술에 타 먹었으면 만병회춘 명약이라니 너를 먹으리라 아이고 내 남생이요 남생이 같으면 더욱 좋다 습기에는 제일이라 허니 너를 산 채로 먹으리라\n[아니리] 별주부 듣고 기가 막혀 이 급살 맞어 죽을 놈이 동의보감을 얼마나 통달허였는지 보는 대로 약 취해 먹기로만 드니 기왕 죽을 바에는 속임수나 한번 써 보고 죽을 밖에 없구나 허고 목을 길게 내놓으며 네 이놈 호랑아 내 목 나간다\n호랑이 ⓔ <u>깜짝<\/u> 놀래 에끼 이것 목 나온다 고만 나오시오 하루 수천 발 나오겠소 대체 당신 명색이 무엇이오\n나는 수국 전옥주부 공신 사대손 별주부 별나리로다 이놈 내 목 이 모양 된 내력을 들어 보아라\n[자진모리] 우리 ㉡ <u>수궁<\/u> 퇴락허여 영덕전 새로 질 제 일천팔백 칸 기와를 내 손으로 올리다가 추녀 끝에 뚝 떨어져 목으로 절칵 꺼꾸러져 이 모양이 되얏기로 명의다려 문의한즉 호랑이 쓸개를 열 보만 먹으면 목이 즉효헌다기로 우리 수궁 도리랑귀신 잡어 타고 호랑이 사냥을 나왔더니 쓸개 한 보 못 주겠느냐 도리랑귀신 게 있느냐 이 호랑이 배 갈라라 앞으로 기어들며 도리랑 도리랑 허고 달려들어 호랑이 아랫도리를 꽉 물고 뺑 돌아 놓으니\n[아니리] 호랑이 ⓕ <u>질색허여<\/u> 아이고 별나리 이것 좀 놓아주시오 이놈 잔말 말고 쓸개만 내놓아라 호랑이 그 육중헌 놈이 자라에게 매달려 애걸을 허는듸\n[중모리] 별나리 전에 비나이다 나는 오대독신으로 오십이 다 되도록 슬하 일점혈육이 없소 만일 내가 죽게 되면 선영에 죄가 망극허오 차라리 내 왼눈이나 하나 빼 잡수시오 이놈 잔말 말고 쓸개만 내놔라 여기만 놓아주면 당장에 쓸개를 드리리다\n[아니리] 별주부 가만히 생각한즉 쓸개 주겠다고 놓아 달라는 것이 얼주검이 된 모양이라 꽉 물었던 호랑이 아랫도리를 슬그머니 늦춰 놓으니\n[휘모리] 호랑이 몽그랏다 후다닥 뛰어갈 제 급한 난리 화살 닫듯 조총에서 철환 닫듯 오림에서 조조 닫듯 산을 넘고 바다 건너 홀연히 간 곳 없네\n[아니리] 전라도 해남에서 냅다 뛴 놈이 의주 압록강 가에서 숨을 내쉬고 한편을 살펴보는데 남생이 한 마리가 뾰쪼롬허고 내다보니 별주부로 알았것다 에끼 저놈 그 새 저기 쫓아왔구나 게서 또 후다닥 빼 놓은 것이 함경도 ㉢ <u>세수람 고개<\/u>에다 덜럼 올라앉어 장담을 허것다 내 용맹이나 된 게 여기까지 살아왔지 잡놈 같았으면 하마 그놈 뱃속에 굳었으렷다\n- 작자 미상, ｢수궁가｣ -"}, "options": ["㉠은 공동의 문제를 해결하기 위한 모족의 노력이 나타나는 공간으로, 이곳에서 자라와 호랑이의 화해가 이루어진다.", "㉡은 자라가 자신의 내력을 소개하며 언급한 공간으로, 자라는 호랑이와의 만남을 예상하고 이곳에서 이를 대비하였다.", "㉢은 호랑이가 안도감을 나타내는 공간으로, 이곳에서 호랑이는 살아남은 것을 자신의 능력을 넘어서는 뜻밖의 행운이라고 여겼다.", "㉠은 자라가 자신의 행위로 인해 위험에 빠지게 된 공간이며, ㉡은 자라가 위험에서 벗어나고자 언급한 공간이다.", "㉠은 호랑이의 지위가 다른 존재의 발언을 통해 확인되는 공간이며, ㉢은 호랑이가 다른 존재와의 비교를 통해 자신의 위엄을 부정하는 공간이다."], "probs": {"4": 0.15, "5": 0.17, "2": 0.09, "1": 0.1, "3": 0.49}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/korean/page-07.jpg", "page": 7}, {"id": "korean-common:22", "subject": "국어", "section": "korean-common", "number": 22, "selected": "1", "answer": "5", "points": "2", "visual": false, "state": {"question": "(가)～(다)에 대한 설명으로 가장 적절한 것은?", "passage": "[22～26] 다음 글을 읽고 물음에 답하시오.\n\n(가)\n\n두고 온 것들이 빛나는 때가 있다\n<b>빛나는 때를 위해<\/b> 소금을 뿌리며\n<b>우리는 이 저녁을<\/b> 떠돌고 있는가\n<b>사방을 둘러보아도<\/b>\n등불 하나 켜 든 이 보이지 않고\n등불 뒤에 속삭이며 <b>밤을 지키는<\/b>\n<b>발자국 소리 들리지 않는다<\/b>\n잊혀진 목소리가 살아나는 때가 있다\n잊혀진 ㉠ <b>한 목소리<\/b> 잊혀진 다른 목소리의 끝을 찾아\n목메이게 부르짖다 잦아드는 때가 있다\n잦아드는 ㉡ 외마디 소리를 찾아 <b>칼날 세우고<\/b>\n<b>우리는 이 새벽길<\/b> 숨가쁘게 넘고 있는가\n하늘 올려보아도\n함께 어둠 지새던 <b>별 하나 눈뜨지 않는다<\/b>\n그래도 <b>두고 온 것들은<\/b> 빛나는가\n빛을 뿜으면서 한 번은 되살아나는가\n우리가 뿌린 <b>소금들<\/b> 반짝반짝 별빛이 되어\n<b>오던 길 환히 비춰 주고<\/b> 있으니\n\n- 이시영, 「그리움」 -\n\n(나)\n\n감나무 잎새를 흔드는 게\n어찌 ⓐ <u>바람뿐이랴.<\/u>\n감나무 잎새를 반짝이는 게\n어찌 햇살뿐이랴.\n아까는 ⓑ <u>오색딱다구리<\/u>가\n따다다닥 찍고 가더니\n봐 봐, 시방은 ⓒ <u>청설모<\/u>가\n쪼르르 타고 내려오네.\n사랑이 끝났기로서니\n그리움마저 사라지랴,\n그 그리움 날로 자라면\n주먹송이처럼 커 갈 땡감들.\n때론 머리 위로 ⓓ <u>흰 구름<\/u> 이고\n때론 온종일 ⓔ <u>장대비<\/u> 맞아 보게.\n이별까지 나눈 마당에\n기다림은 웬 것이랴만,\n<b>감나무 그늘에 평상을 놓고<\/b>\n그래 그래, <b>밤이면 잠 뒤척여<\/b>\n산이 우는 소리도 들어 보고\n새벽이면 퍼뜩 깨어나\n계곡 물소리도 들어 보게.\n그 기다림 날로 익으니\n서러움까지 <b>익어선<\/b>\n저 <b>짙푸른 감들<\/b>, 마침내\n<b>형형 등불을 밝힐 것이라면<\/b>\n세상은 어찌 환하지 않으랴.\n하늘은 어찌 부시지 않으랴.\n\n- 고재종, 「감나무 그늘 아래」 -\n\n(다)\n\n천지간에 만물이 소리를 내게 만드는 것은 무엇인가? 초목은 움직이지 않으면 그 자체로 소리가 나지 않으나 바람이 불면 소리가 난다. 그런즉 초목이 소리를 내게 하는 것은 바람이다. 금석은 때리지 않으면 그 자체로는 소리가 나지 않으나 물건이 때리면 소리가 난다. 그런즉 금석이 소리를 내게 하는 것은 물건이다. 무릇 크고 작은 만물이 소리를 내는 것은 또한 반드시 그렇게 만드는 것이 있다. 사람이 세상에 태어나면 안으로는 오장이 있고 밖으로는 형체가 있지만 그것만으로 어찌 소리를 내겠는가. 기(氣)가 안에 쌓이고 밖으로 드러난 뒤라야 소리가 나는 것이다. 그런즉 사람이 소리를 내게 하는 것은 기이다.\n\n소리는 한 가지가 아니니, 쓸모없는 소리가 있고 쓸모 있는 소리가 있다. 재채기 소리와 코 고는 소리는 사람의 소리 가운데 쓸모없는 것이고, 탄식하고 담소하는 소리는 사람의 소리 가운데 쓸모 있는 것이다. 쓸모 있는 소리에는 아름다운 소리와 추한 소리가 있다. 사람이 그 소리를 듣고 좋아하면 아름다운 소리이고, 미워하면 추한 소리이다. 아름다운 소리에는 실상이 있는 소리가 있고 흩어지는 소리가 있다. 입에서 나와 글로 쓰이지 못하면 흩어지는 소리가 되고, 입에서 나와 글로 쓰이면 실상이 있는 소리가 된다. 실상이 있는 소리에는 바른 것이 있고 삿된 것이 있다. 또 바른 것 같으면서 삿된 것도 있고, 혹 삿된 것 같으면서 바른 것도 있다. ㉢ 사람의 소리로서 남에게 듣기 좋고, 남에게 듣기 좋아 글로 쓰이고, 글로 쓰였으면서 바름에 합당하다면 그것을 일컬어 ㉣ 좋은 소리라 한다. 좋은 소리를 내는 것은 참으로 어려운 일이구나.\n\n최립은 좋은 소리를 내는 사람에 가깝다. 그의 문장이 비록 완성된 것은 아니지만 그 뜻은 바름을 향한다. 그러니 학업을 게을리하지 않는다면 바르게 되는 데 무슨 어려움이 있겠는가. 내가 들으니 소리를 내는 만물은 그 본체가 크면 그 소리 또한 크고, 그 본체가 작으면 그 소리 또한 작다고 한다. 최립은 소리가 크니 그 본체가 큰 것을 알 만하다. 사람의 본체는 마음이니 그의 마음이 가히 크다고 하겠다. 내가 또 들으니 크게 부딪치면 큰 소리가 나며, 작게 부딪치면 작은 소리가 난다고 한다. 큰 바람이 초목을 움직이면 천지를 뒤흔들 듯하나, 작은 바람이 불면 한 번 살랑거림에 불과할 뿐이다. 금석을 치는 것도 또한 이와 같다. 사람의 소리는 기가 크면 그 소리가 크게 나고 기가 작으면 그 소리가 작게 나니, 최립의 기는 가히 크다고 하겠다.\n\n- 이이, 「최립에게 주는 글」 -"}, "options": ["(가)는 계절을 나타내는 소재로 시적 분위기를 조성하고 있다.", "(나)는 자연을 관조하며 시적 상황을 탈속적 태도로 바라보고 있다.", "(다)는 글쓴이와 타인의 생각을 비교하며 세태를 비판하고 있다.", "(가)와 (다)는 모두, 연쇄적 표현을 통해 주체의 태도 변화 과정을 보여 주고 있다.", "(나)와 (다)는 모두, 가정적 표현을 통해 대상의 속성을 드러내고 있다."], "probs": {"3": 0.2, "1": 0.25, "4": 0.13, "2": 0.25, "5": 0.17}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/korean/page-08.jpg", "page": 8}, {"id": "korean-common:31", "subject": "국어", "section": "korean-common", "number": 31, "selected": "5", "answer": "2", "points": "2", "visual": false, "state": {"question": "(가), (나)에 대한 설명으로 가장 적절한 것은?", "passage": "(가)\n\n온성이 몇 리런고 ㉠ <u>우리 말이 지쳤구나<\/u>\n서성 밖에 잠깐 쉬어 말 얻어 먹이려니\n홀연히 소주 장사 앞에 와 팔려 하니\n그 술을 먹어 보자 ㉡ <u>촌인(村人)의 솜씨 아녀<\/u>\n분명 관가 술일네 그 곡절 모를쏘냐\n이 사람이 술 즐김을 태수가 들었더라\n미리 독에 빚어 예 와서 기다린 지\n여러 날이 되었더라 ㉢ <u>수상히 오는 손을<\/u>\n나인 줄 짐작하고 짐짓 싸게 파는구나\n자연히 이 소식을 바람결에 들으니\n알은체 무엇 하리 담뱃대 둘을 주고\n한 병을 기울이니 감홍로와 진배없네\n㉣ <u>유심터라 이 부사야 너 언제 날 알더냐<\/u>\n여기에서 종성 가기 오십 리가 된다 하니\n바삐 가는 저문 길에 얼음 밑에 빠지고나\n버선 행전 다 적시고 동태가 되었더라\n이 몰골 이 거동을 남 뵈기 부끄럽다\n만인 중에 출두하고 남여 위에 높게 앉아\n㉤ <u>억지로 발 드리운들 그 누가 저어하리<\/u>\n\n(중략)\n\n여러 달 주리다가 혹시 혹시 출두하면\n음식은 장하건만 하나나 살로 가랴\n여러 날 칩떨다가 더운 방에 들어오면\n가슴에 열이 나니 먹느니 냉수로다\n뉘라서 어사 벼슬 좋다고 하던가\n봉고파출* 쾌한 일가 형문 곤장 차마 하랴\n못할 일 마지못하니 제 심정 글러지고\n송사 진 이 원통하여 몹쓸 말 지어내니\n모르는 이 어이 알리 그 말을 곧이듣네\n고맙단 이 잠깐이오 원수는 대대로다\n괴롭기는 저 혼자라 못할 것이 어사로다\n- 구강, 「북새곡」 -\n\n* 봉고파출 : 어사가 고을 원을 파면하고 관가의 창고를 잠금.\n\n(나)\n\n이 시름 저 시름 여러 가지 시름 ⓐ <u>방패연<\/u>에 세세히 적어\n정월 대보름에 서풍이 고이 불 제 하얀 실 한 얼레를 끝까지\n풀어 띄울 제 큰 잔에 술을 부어 마지막 전송하자 둥게 둥게\n둥둥 떠서 높고 높이 솟아올라 백룡의 굽이같이 굼틀뒤틀 뒤틀\n어져 구름 속에 들거고나 동해 바다 건너가서 외로이 섰는\n나무에 걸렸다가\n풍소소 우낙락할 제* 자연 소멸 하여라\n- 작자 미상, 사설시조 -\n\n* 풍소소(風蕭蕭) 우낙락(雨落落)할 제 : 바람 솔솔 불고 비가 후둑후둑 내릴 때에.\n\n(다)\n\n강원도 설화지를 제 크기로 ⓑ <u>연<\/u>을 지어\n대사(大絲) 황사(黃絲) 백사(白絲) 줄을 통 얼레에 살이 없이\n바람이 한창인 제 삼간 퇴김 사간 근두* 반공에 솟아올라 구름에\n걸쳤으니 풍력도 있거니와 줄맥*이 없이 그러하랴\n먼 데 임 줄맥을 길게 대어 낚아 올까 하노라\n- 작자 미상, 사설시조 -\n\n* 삼간 퇴김 사간 근두 : 갖은 재주를 부려 연을 날리는 것을 말함.\n* 줄맥(脈) : 줄의 힘."}, "options": ["(가)는 남의 말을 인용하여 목적지의 위험성을 드러내고 있다.", "(가)는 대구와 대조 표현을 함께 사용하여 화자의 괴로운 처지를 드러내고 있다.", "(나)는 가상의 존재에 빗대는 표현을 사용하여 자연 현상의 변화를 드러내고 있다.", "(나)는 방위의 의미를 포함한 두 어휘를 사용하여 대상이 서로 반대 방향으로 이동함을 드러내고 있다.", "(가)와 (나)는 모두, 색채를 나타내는 표현을 통해 배경 속에서 대상의 움직임을 뚜렷하게 드러내고 있다."], "probs": {"4": 0.15, "1": 0.24, "5": 0.33, "3": 0.12, "2": 0.16}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/korean/page-12.jpg", "page": 12}, {"id": "korean-common:34", "subject": "국어", "section": "korean-common", "number": 34, "selected": "2", "answer": "3", "points": "3", "visual": false, "state": {"question": "<보기>를 참고하여 (가)～(다)를 감상한 내용으로 적절하지 않은 것은? [3점]", "passage": "(가)\n\n온성이 몇 리런고 ㉠ <u>우리 말이 지쳤구나<\/u>\n서성 밖에 잠깐 쉬어 말 얻어 먹이려니\n홀연히 소주 장사 앞에 와 팔려 하니\n그 술을 먹어 보자 ㉡ <u>촌인(村人)의 솜씨 아녀<\/u>\n분명 관가 술일네 그 곡절 모를쏘냐\n이 사람이 술 즐김을 태수가 들었더라\n미리 독에 빚어 예 와서 기다린 지\n여러 날이 되었더라 ㉢ <u>수상히 오는 손을<\/u>\n나인 줄 짐작하고 짐짓 싸게 파는구나\n자연히 이 소식을 바람결에 들으니\n알은체 무엇 하리 담뱃대 둘을 주고\n한 병을 기울이니 감홍로와 진배없네\n㉣ <u>유심터라 이 부사야 너 언제 날 알더냐<\/u>\n여기에서 종성 가기 오십 리가 된다 하니\n바삐 가는 저문 길에 얼음 밑에 빠지고나\n버선 행전 다 적시고 동태가 되었더라\n이 몰골 이 거동을 남 뵈기 부끄럽다\n만인 중에 출두하고 남여 위에 높게 앉아\n㉤ <u>억지로 발 드리운들 그 누가 저어하리<\/u>\n\n(중략)\n\n여러 달 주리다가 혹시 혹시 출두하면\n음식은 장하건만 하나나 살로 가랴\n여러 날 칩떨다가 더운 방에 들어오면\n가슴에 열이 나니 먹느니 냉수로다\n뉘라서 어사 벼슬 좋다고 하던가\n봉고파출* 쾌한 일가 형문 곤장 차마 하랴\n못할 일 마지못하니 제 심정 글러지고\n송사 진 이 원통하여 몹쓸 말 지어내니\n모르는 이 어이 알리 그 말을 곧이듣네\n고맙단 이 잠깐이오 원수는 대대로다\n괴롭기는 저 혼자라 못할 것이 어사로다\n- 구강, 「북새곡」 -\n\n* 봉고파출 : 어사가 고을 원을 파면하고 관가의 창고를 잠금.\n\n(나)\n\n이 시름 저 시름 여러 가지 시름 ⓐ <u>방패연<\/u>에 세세히 적어\n정월 대보름에 서풍이 고이 불 제 하얀 실 한 얼레를 끝까지\n풀어 띄울 제 큰 잔에 술을 부어 마지막 전송하자 둥게 둥게\n둥둥 떠서 높고 높이 솟아올라 백룡의 굽이같이 굼틀뒤틀 뒤틀\n어져 구름 속에 들거고나 동해 바다 건너가서 외로이 섰는\n나무에 걸렸다가\n풍소소 우낙락할 제* 자연 소멸 하여라\n- 작자 미상, 사설시조 -\n\n* 풍소소(風蕭蕭) 우낙락(雨落落)할 제 : 바람 솔솔 불고 비가 후둑후둑 내릴 때에.\n\n(다)\n\n강원도 설화지를 제 크기로 ⓑ <u>연<\/u>을 지어\n대사(大絲) 황사(黃絲) 백사(白絲) 줄을 통 얼레에 살이 없이\n바람이 한창인 제 삼간 퇴김 사간 근두* 반공에 솟아올라 구름에\n걸쳤으니 풍력도 있거니와 줄맥*이 없이 그러하랴\n먼 데 임 줄맥을 길게 대어 낚아 올까 하노라\n- 작자 미상, 사설시조 -\n\n* 삼간 퇴김 사간 근두 : 갖은 재주를 부려 연을 날리는 것을 말함.\n* 줄맥(脈) : 줄의 힘.\n\n<보기>\n이 시가들은 경험의 실상과 외적 대상을 다양한 모습으로 표현한다. (가)는 장면 속에서 묘사된 행위를 통해 정서나 의미를 드러내기도 하고, 화자를 대상화하며 해학의 대상으로 삼기도 한다. (나)와 (다)는 동일한 소재를 중심으로 시상을 전개하며, 구체적이고 생동감 있는 표현을 통해 대상이 그 자체로 부각되는 모습을 보여 준다. 하지만 (나)는 화자가 가지고 있는 정서를 대상과 행위에 담아내고, (다)는 대상으로부터 화자의 정서가 촉발되는 모습을 보여 준다."}, "options": ["(가)에서 얼음물에 빠져 ‘버선 행전’ 다 적시는 대목은 경험을 실감 나게 보여 주면서 화자를 장면 속에서 대상화하여 ‘동태가 되었더라’라고 우스꽝스럽게 표현하는군.", "(나)는 정월 보름날에 ‘큰 잔에 술을’ 붓는 행위로 예를 갖추며 연을 ‘마지막 전송’하는 모습을 통해 평안함에 대한 화자의 바람을 담아내는군.", "(다)에서 연이 ‘솟아올라 구름’에 걸치는 것을 보고 화자가 연줄의 힘을 빌려 ‘먼 데 임’에게 가려고 하는 것은 대상의 역동성이 화자의 욕망을 불러일으키는 모습을 보여 주는군.", "(가)에서 ‘가슴에 열’이 나서 ‘냉수’를 먹는 행위는 임무 수행에서 느낄 수 있는 고충을 드러내고, (나)에서 근심을 ‘세세히 적’는 행위는 문제 해소를 원하는 화자의 마음을 보여 주는군.", "(나)는 연이 ‘굼틀뒤틀 뒤틀어져’ 올라가는 모습을 생동감 있게 묘사하여, (다)는 연의 재료를 ‘강원도 설화지’로 구체적으로 제시하고 ‘크기’까지 언급함으로써 대상 자체를 부각하는군."], "probs": {"2": 0.37, "5": 0.12, "4": 0.19, "3": 0.24, "1": 0.08}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/korean/page-12.jpg", "page": 12}, {"id": "korean-geography:1", "subject": "한국지리", "section": "korean-geography", "number": 1, "selected": "5", "answer": "4", "points": "2", "visual": true, "state": {"question": "다음 <조건>을 만족하는 곳을 지도의 A～E에서 고른 것은?", "passage": "<조건 1> : (배타적 경제 수역에 위치) OR (통상 기선의 적용을 받는 영해에 위치)\n<조건 2> : 호미곶 기점을 지나는 위선과 우리나라 영토 최남단을 지나는 위선 사이에 위치\n<조건 3> : 동경 127° 30′ 00″～동경 131° 52′ 22″ 사이에 위치\n<조건 4> : <조건 1>～<조건 3>을 모두 만족하는 곳 중 같은 날의 일출 시각이 가장 늦은 곳\n\n* X OR Y : X 조건과 Y 조건 중 하나만 만족해도 되는 것을 의미함.", "visual_description": "한반도와 주변 해역을 나타낸 지도이다. 육지와 섬의 해안선이 그려져 있고, 바다는 서쪽에 ‘황해’, 동쪽에 ‘동해’, 남쪽에 ‘남해’라고 표시되어 있다. 여러 기점이 작은 흰색 원으로 표시되고 실선으로 이어져 있으며, 범례에서 작은 흰색 원은 ‘기점’이라고 되어 있다. 해역 경계에는 점선이 그려져 있고 범례에서 점선은 ‘영해선’이라고 되어 있다. A～E는 검은 점과 지시선으로 위치가 표시되어 있다. A는 한반도 중북부 서쪽 해상의 영해선 바깥쪽에 있다. B는 제주도 남동쪽 해상에서 점선으로 둘러싸인 구역 밖에 있다. C는 대한해협 부근에서 한반도 남동쪽 해안의 기점보다 남쪽에 있다. D와 E는 한반도 동해안 중부의 같은 위도 부근에 있으며, D는 해안과 영해선 사이에 있고 E는 영해선 동쪽 바깥에 있다. 지도 동북쪽 해상에는 섬을 중심으로 한 점선 원과 그보다 동쪽의 점선 원이 보인다."}, "options": ["A", "B", "C", "D", "E"], "probs": {"2": 0.26, "1": 0.03, "3": 0.16, "5": 0.45, "4": 0.1}, "others": {"Luna": "4", "Terra": "3", "Sol": "2"}, "image": "images/korean-geography/page-01.jpg", "page": 1}, {"id": "korean-geography:2", "subject": "한국지리", "section": "korean-geography", "number": 2, "selected": "4", "answer": "5", "points": "2", "visual": true, "state": {"question": "다음 자료의 ㉠～㉣에 대한 설명으로 옳은 것은?", "passage": "동해안의 ㉠ 석호 중 하나였던 풍호는 화력 발전소의 폐기물 매립과 골프장 건설로 사라졌다. 또한 최근 건설된 방파제로 인해 모래 이동의 균형이 깨져서 일부 구간의 ㉡ 사빈과 ㉢ 해안 사구의 침식이 일어나고 있다. 이를 완화하기 위해 ㉣ 그로인을 설치하였지만 침식은 지속되고 있다. 이 지역의 해안 변화는 인간의 개발로 지형이 얼마나 쉽게 변형되는지를 보여준다.\n\n<2024년 항공 사진>", "visual_description": "항공 사진에는 왼쪽 아래의 육지, 중앙에서 오른쪽으로 이어지는 밝은 모래 해안, 위쪽과 오른쪽의 바다가 보인다. 검은 곡선으로 ‘2017년 해안선’이 표시되어 있으며, 이 선은 현재의 밝은 모래 해안보다 바다 쪽에 놓인 구간이 있다. ㉡, ㉢, ㉣은 사진 왼쪽 위쪽 해안 부근을 각각 지시한다. ㉡은 해안의 밝은 모래 구간을, ㉢은 해안 뒤쪽의 육지 쪽 지형을, ㉣은 해안에서 바다 쪽으로 돌출된 짧은 구조물을 가리킨다. 사진 오른쪽에는 해안에서 바다로 길게 뻗은 뒤 꺾인 방파제 구조물이 있다. 오른쪽 아래 축척 막대에는 ‘0’과 ‘200 m’가 표시되어 있다."}, "options": ["㉠은 최종 빙기에 형성되었다.", "㉡은 파랑 에너지가 집중되는 곶(串)에 잘 발달한다.", "㉢의 지하수는 바닷물보다 염도가 높다.", "㉣을 설치하는 주목적은 풍속을 낮추어 모래를 퇴적시키는 것이다.", "㉢은 ㉡에 비해 지표면의 퇴적물 평균 입자 크기가 작다."], "probs": {"3": 0.08, "1": 0.21, "4": 0.42, "2": 0.04, "5": 0.25}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/korean-geography/page-01.jpg", "page": 1}, {"id": "korean-geography:5", "subject": "한국지리", "section": "korean-geography", "number": 5, "selected": "5", "answer": "3", "points": "2", "visual": true, "state": {"question": "그래프는 지도에 표시된 네 지역군의 인구 자료를 나타낸 것이다. (가)～(라) 지역군에 대한 설명으로 옳은 것은?", "passage": "", "visual_description": "왼쪽은 2024년 인구를 나타낸 산점도이다. 가로축은 ‘성비’이며 눈금은 95, 100, 105, 110, 115, 120, 125이다. 세로축은 ‘인구’이고 단위는 ‘(만 명)’이며 눈금은 0부터 140까지 20 간격이다. 점선 격자가 있다. 네 점의 대략적인 위치는 (가)가 성비 약 102, 인구 약 127만 명, (나)가 성비 약 105, 인구 약 90만 명, (다)가 성비 약 101, 인구 약 30만 명, (라)가 성비 약 115, 인구 약 35만 명이다. 그래프 아래에는 왼쪽에 ‘(2024)’, 오른쪽에 ‘(통계청)’이 적혀 있다.\n오른쪽 대한민국 지도에는 네 지역군이 서로 다른 음영과 무늬로 표시되어 있다. (가)는 수도권 남서쪽의 서해안에 접한 지역, (나)는 충청권 내륙의 서로 인접한 여러 지역, (다)는 강원 영동의 동해안에 접한 지역, (라)는 영남 남동부의 동해안에 접한 지역이다. 제주도는 오른쪽 아래 삽입 지도에 윤곽만 표시되어 있다."}, "options": ["(가)에는 기업도시가 위치한다.", "(나)와 (라)는 충청권에 위치한다.", "(다)는 (나)보다 노년 부양비가 높다.", "(다)는 (라)보다 제조업 출하액이 많다.", "(라)는 (가)보다 남성 인구가 많다."], "probs": {"1": 0.11, "3": 0.38, "4": 0.02, "5": 0.48, "2": 0.01}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/korean-geography/page-01.jpg", "page": 1}, {"id": "korean-geography:6", "subject": "한국지리", "section": "korean-geography", "number": 6, "selected": "5", "answer": "2", "points": "2", "visual": true, "state": {"question": "그래프는 지도에 표시된 네 지역과 강릉 간의 (가), (나) 계절별 강수량 차이를 나타낸 것이다. 이에 대한 설명으로 <u>옳은<\/u> 것은?\n(단, (가), (나)는 각각 겨울(12～2월), 여름(6～8월) 중 하나임.)", "passage": "그래프 주석:\n* 강수량 차이는 (가), (나) 계절의 각 지역 강수량에서 강릉의 각 계절 강수량을 뺀 값임.\n** 1991～2020년의 평년값임. (기상청)", "visual_description": "왼쪽에는 세로 막대그래프, 오른쪽에는 대한민국 지도와 제주도 확대 삽입도가 있다. 막대그래프의 세로축 단위는 mm이며 눈금은 -300, -200, -100, 0, 100, 200, 300이다. 가로축에는 A, B, C, D가 있다. 범례에서 흰색 막대는 (가), 회색 막대는 (나)이다. 대략적인 막대 높이는 A의 (가) 약 270, (나) 약 10, B의 (가) 약 230, (나) 약 -70, C의 (가) 약 200, (나) 약 60, D의 (가) 약 -200, (나) 약 210이다. 지도에는 네 개의 검은 점이 표시되어 있다. 한 점은 한강 하류의 서울 일대에, 한 점은 동해상의 울릉도 위치에, 한 점은 남동 해안의 부산 일대에, 한 점은 제주도 북부의 제주 일대에 표시되어 있다."}, "options": ["C는 강릉보다 최한월 평균 기온이 낮다.", "A는 B보다 무상 일수가 많다.", "D는 C보다 연 강수량이 많다.", "A와 D의 위도 차이는 B와 C의 위도 차이보다 크다.", "A～D 중 여름 강수 집중률이 가장 높은 곳은 A이다."], "probs": {"1": 0.13, "5": 0.28, "4": 0.22, "2": 0.16, "3": 0.21}, "others": {"Luna": "5", "Terra": "4", "Sol": "5"}, "image": "images/korean-geography/page-02.jpg", "page": 2}, {"id": "korean-geography:7", "subject": "한국지리", "section": "korean-geography", "number": 7, "selected": "2", "answer": "1", "points": "2", "visual": false, "state": {"question": "다음 글은 지리적 표시 농산물에 대한 것이다. 이에 대한 설명으로 <u>옳은 것만<\/u>을 <보기>에서 고른 것은? (단, (가)～(다)는 각각 고창, 괴산, 창녕 중 하나임.)", "passage": "지리적 표시제는 농산물의 특징이 생산 지역의 지리적 특성에 기인하는 경우 그 지역의 특산물임을 표시하는 제도이다. 예를 들어, 소백산맥이 지나는 □(가)□은 기후와 토양이 ㉠ 옥수수 재배에 유리해 전국에서 옥수수 재배 면적이 가장 넓다. 서해안에 위치한 □(나)□은 해풍을 맞고 자란 색이 진하고 당도가 높은 복분자와 이를 활용한 특산품이 유명하다. 대구광역시와 접하는 □(다)□은 낙동강 유역 평야 지대로 유기질 성분이 풍부한 토양에서 양파를 재배한다. 이들 지역의 찰옥수수, 복분자, 양파는 각각 지리적 표시 농산물로 등록되어 있다.\n\n<보기>\nㄱ. (가)는 경지 면적 중 밭이 논보다 넓다.\nㄴ. (나)는 (가)보다 맥류 생산량이 많다.\nㄷ. (나)는 전북, (다)는 경북에 위치한다.\nㄹ. ㉠은 식량 작물 중 국내 자급률이 가장 높다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"3": 0.11, "1": 0.05, "4": 0.03, "2": 0.63, "5": 0.18}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/korean-geography/page-02.jpg", "page": 2}, {"id": "korean-geography:8", "subject": "한국지리", "section": "korean-geography", "number": 8, "selected": "5", "answer": "3", "points": "3", "visual": true, "state": {"question": "다음은 한국지리 수업 장면의 일부이다. 교사의 질문에 옳게 답한 학생만을 있는 대로 고른 것은? [3점]", "passage": "교사: 지도의 A～H 지역 중 두 지역을 선택한 후 해당 지역의 특징을 설명해 볼까요?\n갑: A와 F에는 혁신도시가 있습니다.\n을: B와 G에는 대규모 완성차 조립 공장이 있습니다.\n병: C와 D는 도청 소재지입니다.\n정: E에는 금강 하굿둑이, H에는 영산강 하굿둑이 있습니다.", "visual_description": "대한민국의 시·군 경계가 표시된 지도에서 A～H의 각 문자가 선으로 회색 음영 지역을 가리킨다. A의 선은 강원도 원주시 경계 안의 음영 지역, B의 선은 충청남도 아산시 경계 안의 음영 지역, C의 선은 충청남도 홍성군 경계 안의 음영 지역, D의 선은 전북특별자치도 전주시 경계 안의 음영 지역, E의 선은 전북특별자치도 군산시 경계 안의 음영 지역, F의 선은 전라남도 나주시 경계 안의 음영 지역, G의 선은 울산광역시 경계 안의 음영 지역, H의 선은 전라남도 목포시 경계 안의 음영 지역에 각각 닿아 있다. 지도 아래에는 0～50 km 축척 막대가 있다. 지도 오른쪽에는 교사와 갑·을·병·정의 얼굴 그림 및 말풍선이 배치되어 있다."}, "options": ["갑, 을", "갑, 정", "을, 병", "갑, 병, 정", "을, 병, 정"], "probs": {"2": 0.23, "1": 0.18, "4": 0.15, "3": 0.1, "5": 0.34}, "others": {"Luna": "5", "Terra": "4", "Sol": "4"}, "image": "images/korean-geography/page-02.jpg", "page": 2}, {"id": "korean-geography:9", "subject": "한국지리", "section": "korean-geography", "number": 9, "selected": "4", "answer": "3", "points": "3", "visual": true, "state": {"question": "다음 자료의 (가)～(라)에 해당하는 지역으로 옳은 것은? [3점]", "passage": "최근 극한 기후 현상에 대한 관심이 높아지고 있다. 기상청은 극한 기후의 현황을 파악하기 위해 다양한 지표를 활용하고 있다. 대표적으로 폭염 일수(일 최고 기온이 33℃ 이상인 날의 연중 일수), 한파 일수(일 최저 기온이 -12℃ 이하인 날의 연중 일수), 호우 일수(일 강수량이 80 mm 이상인 날의 연중 일수) 등이 있다.\n\n그래프 주석:\n* 폭염 일수와 한파 일수는 원의 가운데 값임.\n** 1991～2020년의 평년값임. (기상청)", "visual_description": "원 크기가 호우 일수를 나타내는 산점도이다. 가로축은 ‘한파 일수’이며 0, 5, 10, 15, 20(일) 눈금이 있다. 세로축은 ‘폭염 일수’이며 0, 5, 10, 15, 20, 25(일) 눈금이 있다. (가)의 원 중심은 대략 한파 일수 1일, 폭염 일수 23일이고 원은 작다. (나)의 원 중심은 대략 한파 일수 6일, 폭염 일수 15.5일이고 원은 매우 작다. (다)의 원 중심은 한파 일수 0일 부근, 폭염 일수 11.5일 부근이고 네 원 중 가장 크다. (라)의 원 중심은 한파 일수 18일 부근, 폭염 일수 12일 부근이고 중간 크기이다. 범례 ‘호우 일수(일)’에는 크기가 다른 원 세 개가 겹쳐 있으며 6, 3, 1이 표시되어 있다."}, "options": ["(가) 남해, (나) 안동, (다) 밀양, (라) 춘천", "(가) 남해, (나) 춘천, (다) 밀양, (라) 안동", "(가) 밀양, (나) 안동, (다) 남해, (라) 춘천", "(가) 밀양, (나) 춘천, (다) 남해, (라) 안동", "(가) 안동, (나) 남해, (다) 밀양, (라) 춘천"], "probs": {"4": 0.35, "2": 0.1, "3": 0.21, "1": 0.33, "5": 0.01}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/korean-geography/page-02.jpg", "page": 2}, {"id": "korean-geography:10", "subject": "한국지리", "section": "korean-geography", "number": 10, "selected": "4", "answer": "2", "points": "3", "visual": true, "state": {"question": "그래프는 지도에 표시된 네 지역과 구미의 A～D 제조업 업종별 출하액을 나타낸 것이다. 이에 대한 설명으로 <u>옳은<\/u> 것은?\n(단, A～D는 각각 1차 금속, 자동차 및 트레일러, 전자 부품․컴퓨터․영상․음향 및 통신 장비, 화학 물질 및 화학 제품(의약품 제외) 제조업 중 하나임.) [3점]", "passage": "그래프 주석:\n* 종사자 수 10인 이상 사업체를 대상으로 함.\n** 사업체가 2개 이하인 경우에는 제외함.\n(2023) (통계청)", "visual_description": "왼쪽은 묶은 세로 막대그래프이고 오른쪽은 대한민국 지도이다. 그래프 세로축 단위는 조 원이며 0부터 80까지 10 간격 눈금이 있다. 가로축에는 (가), (나), (다), (라), 구미가 있다. 범례는 A가 흰색, B가 사선 무늬, C가 연한 회색, D가 진한 회색 막대이다. 대략적인 출하액은 다음과 같다. (가): A 약 71, B는 표시되지 않음, C 약 45, D 약 23. (나): A 약 36, B 약 68, C 약 5, D 약 3. (다): A는 표시되지 않음, B는 표시되지 않음, C 약 42, D는 표시되지 않음. (라): A는 매우 작음, B 약 1, C는 매우 작음, D 약 30. 구미: A 약 3, B 약 32, C 약 4, D 약 3.\n지도에는 시·군 경계가 표시되어 있고 네 지역이 회색으로 강조되어 있다. 강조된 행정 구역은 경기도 서해안의 화성시, 경상북도 동해안의 포항시, 남동 해안의 울산광역시, 전라남도 남해안의 여수시이며, 각 음영은 해당 행정 구역의 경계를 따라 채워져 있다. 제주도는 별도 삽입도로 제시되어 있다."}, "options": ["(다)는 구미보다 제조업 종사자 수가 많다.", "(가)는 (나)보다 제조업 사업체당 출하액이 많다.", "(다)는 (라)보다 1차 금속 제조업 사업체 수가 많다.", "업종별 출하액에서 수도권이 차지하는 비율은 A가 B보다 높다.", "C는 D에서 생산된 최종 제품을 주요 재료로 이용한다."], "probs": {"2": 0.23, "1": 0.11, "3": 0.04, "5": 0.26, "4": 0.36}, "others": {"Luna": "5", "Terra": "2", "Sol": "2"}, "image": "images/korean-geography/page-02.jpg", "page": 2}, {"id": "korean-geography:14", "subject": "한국지리", "section": "korean-geography", "number": 14, "selected": "5", "answer": "3", "points": "3", "visual": true, "state": {"question": "다음 자료에 대한 설명으로 옳은 것은? (단, (가)～(라)는 각각 지도에 표시된 네 통근·통학 경로 중 하나로, 출발 지역은 경기의 시·군, 도착 지역은 서울의 구에 해당함.) [3점]", "passage": "지도에는 경기도와 서울의 행정 구역 경계가 있다. 경기도의 네 출발 지역은 진한 회색, 서울의 네 도착 지역은 연한 회색이다. 각 경로에는 (가), (나), (다), (라)의 이름이 직접 적혀 있지 않다.\n실선 화살표는 서울 북서쪽에 인접한 진한 회색 지역에서 서울 남서부의 연한 회색 구로 향한다.\n긴 파선 화살표는 서울 북동쪽의 넓은 진한 회색 지역에서 서울 북동부의 연한 회색 구로 향한다.\n점선 화살표는 서울 남쪽의 넓은 진한 회색 지역에서 서울 중앙부, 한강 북쪽의 연한 회색 구로 향한다.\n일점쇄선 화살표는 서울 남서쪽에 인접한 작은 진한 회색 지역에서 서울 남동부, 한강 남쪽의 연한 회색 구로 향한다.\n서울 부분은 확대 지도에 구 경계와 한강을 함께 보여 준다. 경기도 지도에는 0~20km 축척이 있다.\n\n◦ (가)～(라) 출발 지역 중 서울 전체로의 통근·통학 비율이 가장 높은 지역은 (가)의 출발 지역이다.\n◦ (가)～(라) 도착 지역 중 타 시·군·구에서 통근·통학 유입 인구가 가장 많은 지역은 (나)의 도착 지역이다.\n◦ (가), (나), (라)는 모두 출발 지역보다 도착 지역의 주간 인구 지수가 높다.\n\n* 2020년 기준임.", "visual_description": "큰 지도는 경기도의 시·군 경계와 중앙의 서울을 나타낸다. 네 출발 지역은 진한 회색이며 서울을 기준으로 북동쪽, 서쪽, 남서쪽, 남쪽에 있다. 화살표들이 각 출발 지역에서 서울 방향으로 이어진다. 오른쪽 위의 서울 확대 지도에는 구 경계와 한강이 표시되어 있고, 네 개의 연한 회색 도착 지역 및 이들을 가리키는 화살표가 있다. 범례에는 진한 회색이 ‘출발 지역’, 연한 회색이 ‘도착 지역’이라고 제시되어 있다."}, "options": ["(라)의 출발 지역에는 수도권 1기 신도시가 위치한다.", "(가)의 도착 지역은 (나)의 출발 지역보다 국가에서 산업 단지 조성을 시작한 시기가 늦다.", "(나)의 도착 지역은 (라)의 도착 지역보다 상주인구가 많다.", "(다)의 출발 지역은 (가)의 출발 지역보다 지역 내 주택 유형에서 아파트 비율이 높다.", "(가), (라)의 도착 지역은 한강 이남, (나), (다)의 도착 지역은 한강 이북에 위치한다."], "probs": {"4": 0.13, "1": 0.13, "2": 0.06, "3": 0.21, "5": 0.47}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/korean-geography/page-03.jpg", "page": 3}, {"id": "korean-geography:15", "subject": "한국지리", "section": "korean-geography", "number": 15, "selected": "1", "answer": "4", "points": "2", "visual": true, "state": {"question": "다음 자료는 지형 답사를 위한 계획서의 일부이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 고른 것은?", "passage": "• 답사 지역: 강원특별자치도 삼척시\n\n왼쪽에는 등고선 지도가 있고 오른쪽에는 ‘답사 장소 / 활동 내용’ 표가 있다.\n\n[지도]\n등고선, 하천, 시가지가 표시되어 있다. 지도 오른쪽 위의 회색 면적은 ‘시가지’로 표시되어 있다. 지도 중앙부에는 굽은 하천의 유로가 표시되어 있으며 지도 오른쪽 아래까지 이어진다. 지도 위쪽 중앙의 (가)는 시가지 내부 또는 인접 지역에 있으며, 점선으로 둘러싸인 길쭉하게 굽은 영역이다. (가)의 왼쪽에는 ‘1910년대 유로’라는 글자와 화살표가 표시되어 있다. 지도 왼쪽 아래의 (나)는 현재 하천 남쪽에 있고, 점선 원으로 둘러싸여 있다. 지도 아래쪽 중앙의 (다)는 현재 하천 남쪽에 있으며, 말발굽 또는 U자처럼 굽은 점선 영역으로 표시되어 있다. 오른쪽 산지의 등고선 부근에는 ‘100’, ‘50’이 적혀 있다. 오른쪽 아래 축척 막대는 0～250 m이다.\n\n[답사 장소와 활동 내용]\n(가): 하천 직강 공사 이후 조성된 시가지에서 1910년대 하천 유로의 위치를 찾는다.\n(나): 계단 모양의 지형에 올라 ㉠ <u>붉은색 토양<\/u>이 분포하는 와지를 촬영한다.\n(다): 퇴적층에 분포하는 둥근 자갈을 관찰하고, 퇴적 과정을 추론한다.\n\n<보기>\nㄱ. (나)의 농경지는 주로 논으로 이용된다.\nㄴ. (다)는 구하도이다.\nㄷ. (나)는 (가)보다 홍수 시 침수 가능성이 크다.\nㄹ. ㉠은 기반암의 용식으로 형성된 지형이다.", "visual_description": "답사 계획서 안에 삼척시의 등고선 지도와 표가 나란히 있다. 지도에는 현재 하천, ‘1910년대 유로’, 회색 시가지, (가)～(다)의 점선 표시 영역, 등고선 높이 50과 100, 0～250 m 축척이 나타난다. (가)는 시가지 쪽의 길쭉한 곡선형 영역, (나)는 하천 남쪽 산지의 둥근 영역, (다)는 하천 남쪽 평탄부의 U자형 영역이다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"3": 0.1, "1": 0.58, "5": 0.01, "2": 0.04, "4": 0.27}, "others": {"Luna": "3", "Terra": "1", "Sol": "4"}, "image": "images/korean-geography/page-03.jpg", "page": 3}, {"id": "korean-geography:16", "subject": "한국지리", "section": "korean-geography", "number": 16, "selected": "3", "answer": "5", "points": "3", "visual": true, "state": {"question": "다음은 한국지리 온라인 수업 장면의 일부이다. 답글의 내용이 옳은 학생을 고른 것은? (단, (가)～(다)는 각각 농림어업, 사업 서비스업, 제조업 중 하나임.) [3점]", "passage": "[‘한국지리 온라인 수업’이라는 제목의 온라인 수업 화면]\n교사: 다음은 지역 내 총생산에서 (가)～(다)의 생산액 상위 4개 시·도를 순서대로 나타낸 것입니다. 이에 대해 답글을 달아 볼까요?\n\n(가) 생산액 상위 4개 시·도: 경기 > 충남 > 울산 > 경남\n(나) 생산액 상위 4개 시·도: 경북 > 전남 > 충남 > 경남\n(다) 생산액 상위 4개 시·도: 서울 > 경기 > 부산 > 대전\n\n* 사업 서비스업은 전문, 과학 및 기술 서비스업과 사업 시설 관리, 사업 지원 및 임대 서비스업을 말함.\n** 2023년 기준임.\n\n갑: 경기는 (다)가 (가)보다 생산액이 많아요.\n을: 사업체의 수도권 집중도는 (가)가 (다)보다 높아요.\n병: 1960년대 산업별 취업자 수는 (가)가 (나)보다 많아요.\n정: 국내 총생산에서 차지하는 비율은 (나)가 (다)보다 높아요.\n무: 2000년 생산액 대비 2023년 생산액의 증가율은 (다)가 (가)보다 높아요.", "visual_description": "컴퓨터 창 형태의 온라인 수업 화면이다. 상단에는 안경을 쓴 교사의 얼굴 그림과 말풍선이 있고, 그 아래에 (가)～(다)의 순위 자료와 각주가 제시되어 있다. 하단에는 갑, 을, 병, 정, 무 학생의 작은 얼굴 그림과 각 답글이 세로로 배열되어 있다."}, "options": ["갑", "을", "병", "정", "무"], "probs": {"5": 0.12, "3": 0.28, "1": 0.19, "4": 0.19, "2": 0.22}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/korean-geography/page-04.jpg", "page": 4}, {"id": "korean-geography:17", "subject": "한국지리", "section": "korean-geography", "number": 17, "selected": "4", "answer": "1", "points": "3", "visual": true, "state": {"question": "다음 자료의 (가)～(라) 지역에 대한 설명으로 옳은 것은? (단, (가)～(라)는 각각 지도에 표시된 네 지역 중 하나임.) [3점]", "passage": "한국고용정보원에서 2024년 발표한 자료는 한 지역의 20～39세 여성 인구를 65세 이상 인구로 나눈 값이 0.5 미만인 지역을 소멸 위험 지역으로 분류하였다.\n\n[산점도]\n세로축: 20～39세 여성 인구 비율(%), 눈금 5, 10, 15\n가로축: 65세 이상 인구 비율(%), 눈금 0, 10, 20, 30, 40\n가로축 10, 20, 30 지점에는 세로 점선이 있고, 세로축 5와 10 지점에는 가로 점선이 있다.\n(가): 65세 이상 인구 비율 약 20%, 20～39세 여성 인구 비율 약 11%\n(나): 65세 이상 인구 비율 약 15%, 20～39세 여성 인구 비율 약 9%\n(다): 65세 이상 인구 비율 약 27%, 20～39세 여성 인구 비율 약 8%\n(라): 65세 이상 인구 비율 약 36%, 20～39세 여성 인구 비율 약 5%\n자료 하단에는 ‘(2024)’와 ‘(행정안전부)’가 표시되어 있다.\n\n[지도]\n대한민국의 시·군 경계가 표시된 지도에서 네 지역이 회색으로 칠해져 있다. 첫 번째 지역은 경기 북부의 서쪽 경계에 닿아 있으며 남북으로 긴 다각형이고, 두 번째 지역은 그 남동쪽에 맞닿은 작은 다각형이다. 세 번째 지역은 국토 중앙부에서 첫 번째·두 번째 지역의 남동쪽에 떨어져 있는 다각형이며, 네 번째 지역은 경상북도 북부 내륙의 동쪽 경계 가까이에 있는 다각형이다. 네 회색 지역은 서로 떨어져 있으나, 경기 북부의 첫 번째 지역과 작은 두 번째 지역만 경계를 맞대고 있다. 제주도와 울릉도·독도는 별도 삽입 지도로 표시되어 있다. 축척 막대는 0～40 km이다.", "visual_description": "왼쪽에는 네 점 (가)～(라)가 표시된 산점도가 있고, 오른쪽에는 시·군 경계를 나타낸 대한민국 지도와 회색으로 강조된 네 지역이 있다. 산점도에서 (가)는 (나)보다 오른쪽 위, (다)는 (나)보다 오른쪽 아래, (라)는 가장 오른쪽 아래에 있다."}, "options": ["(가)는 (다)보다 총인구가 많다.", "(나)는 (라)보다 총부양비가 높다.", "(다)는 (나)보다 지역 내 총생산이 많다.", "(다)와 (라)는 군(郡)이다.", "(가)～(라)는 모두 소멸 위험 지역으로 분류된다."], "probs": {"2": 0.07, "1": 0.22, "3": 0.0, "5": 0.24, "4": 0.47000000000000003}, "others": {"Luna": "4", "Terra": "1", "Sol": "1"}, "image": "images/korean-geography/page-04.jpg", "page": 4}, {"id": "korean-geography:18", "subject": "한국지리", "section": "korean-geography", "number": 18, "selected": "1", "answer": "5", "points": "2", "visual": false, "state": {"question": "다음 글의 ㉠～㉢에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "우리나라는 국토 개발 과정에서 ㉠ 수도권과 비수도권 간의 공간 불평등이 심화되었다. 수도권은 국토 면적의 약 12%를 차지하지만, 인구와 경제력은 절반 이상이 수도권에 집중되어 있다. 이러한 상황에서 비수도권 지역에서는 초광역권 형성을 통해 발전을 모색하고 있다. 대표적으로 ㉡ 충청권에서는 ‘충청광역연합’이 출범하였고, ㉢ 호남권에서는 ‘광주·전남 특별광역연합’이 추진되고 있다.\n\n<보 기>\nㄱ. ㉠은 수도권으로의 역류 효과가 컸기 때문이다.\nㄴ. ㉡은 ㉢보다 최근 10년간 인구 순 이동자 수가 많다.\nㄷ. ㉢은 ㉡보다 권역 내 인구 1위 도시와 3위 도시 간 인구 차이가 크다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"2": 0.23, "5": 0.12, "4": 0.08, "1": 0.51, "3": 0.06}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/korean-geography/page-04.jpg", "page": 4}, {"id": "korean-geography:19", "subject": "한국지리", "section": "korean-geography", "number": 19, "selected": "5", "answer": "2", "points": "2", "visual": true, "state": {"question": "다음 자료의 (가)～(라)와 A 지역에 대한 설명으로 옳은 것은? (단, (가)～(라)와 A는 각각 지도에 표시된 다섯 지역 중 하나임.)", "passage": "※ (가)～(라) 지역을 지도에서 모두 선택하고 남은 지역 A를 쓰시오.\n\n(가) 북한강과 남한강이 합류하는 곳이 있으며, 이 지역에서 합류한 물은 팔당호로 흘러 수도권의 상수원으로 이용된다.\n(나) 고속 철도가 개통되면서 접근성이 향상되었고, 2018년 동계 올림픽 개회식이 열린 곳이다.\n(다) 혁신도시와 기업도시가 있으며, 의료 기기 산업 클러스터가 조성되어 있다.\n(라) 도자기 축제를 개최하며, 지리적 표시 농산물로 등록된 쌀이 유명하다.\n\n[지도]\n경기도 동부와 강원특별자치도의 시·군 경계가 표시된 지도에서 다섯 내륙 지역이 회색으로 칠해져 있다. 서쪽 끝의 회색 지역은 경기도 동남부에 있고, 그 북동쪽의 진한 회색 지역과 경계를 맞댄다. 진한 회색 지역은 동쪽의 남북으로 긴 회색 지역과도 경계를 맞댄다. 남북으로 긴 회색 지역은 그 북동쪽의 넓은 회색 지역과 맞닿아 있고, 넓은 회색 지역은 다시 동쪽 끝의 회색 지역과 맞닿아 있다. 다섯 지역 가운데 동쪽 끝의 지역을 포함해 어느 지역도 동해안에 직접 닿지 않으며, 동쪽 끝의 회색 지역과 해안 사이에는 별도의 시·군 지역이 있다. 축척 막대는 0～25 km이다.\n\n지도 아래 문구: 모두 옳게 선택한 경우, 남은 지역은 [ A ]이다.", "visual_description": "상단에는 (가)～(라)의 설명을 담은 4행 표가 있고, 그 아래에 시·군 경계 지도와 회색으로 표시된 다섯 후보 지역이 있다. 지도 아래에는 남은 지역을 A로 쓰는 직사각형 입력 칸이 있다."}, "options": ["A에는 영동 지방과 영서 지방을 구분하는 대관령이 위치한다.", "A와 (가)는 모두 홍천군의 경계와 맞닿아 있다.", "A는 (나)보다 고랭지 배추 재배 면적이 넓다.", "A는 (다)보다 인구 밀도가 높다.", "A와 (라)는 행정 구역상 같은 도(道)에 속한다."], "probs": {"3": 0.12, "4": 0.19, "5": 0.26, "2": 0.18, "1": 0.25}, "others": {"Luna": "2", "Terra": "3", "Sol": "2"}, "image": "images/korean-geography/page-04.jpg", "page": 4}, {"id": "korean-geography:20", "subject": "한국지리", "section": "korean-geography", "number": 20, "selected": "1", "answer": "2", "points": "3", "visual": true, "state": {"question": "지도는 세 시기의 인구 규모에 따른 10대 도시를 나타낸 것이다. 이에 대한 설명으로 옳은 것은? (단, (가)～(다)는 각각 1960년, 1985년, 2024년 중 하나임.) [3점]", "passage": "[세 개의 대한민국 지도]\n각 지도에는 인구 규모에 따른 10대 도시의 현재 시청 위치가 검은 점으로 표시되어 있다. 각 지도는 왼쪽부터 (가), (나), (다)이다. 지도에 도시명이나 시기별 연도는 적혀 있지 않다.\n\n(가): 북서부 수도권에 가까이 모인 점 4개가 있다. 충청권 내륙에 1개, 호남권 내륙에 1개, 영남권에 4개(내륙 1개와 동남부 해안 부근의 3개)가 있다.\n(나): 북서부 수도권에 가까이 모인 점 5개가 있다. 충청권 내륙에 1개, 호남권 내륙에 1개, 영남권에 3개(내륙 1개와 동남부 해안 부근의 2개)가 있다.\n(다): 북서부 수도권에 점 2개가 있다. 충청권 내륙에 남북으로 떨어진 점 2개가 있다. 호남권에는 북부 내륙, 남부 내륙, 서남부 해안 부근에 각각 점 1개씩 총 3개가 있다. 영남권에는 내륙 1개와 남동부 해안 부근 2개, 총 3개가 있다.\n\n* 10대 도시는 각 시기의 시(市)를 기준으로 선정한 후, 현재 지도에 해당 시기의 시청 위치를 표시함.\n(통계청)", "visual_description": "세 개의 남한 윤곽 지도에 각 10개씩 검은 원점이 있다. 제주도는 지도 아래에 윤곽만 있고 점은 없다. 지도 오른쪽 위에는 동쪽 섬들을 표시한 작은 삽입 지도가 있다. 점들의 지역별 분포는 본문에 전사되어 있다."}, "options": ["(가)는 2024년, (나)는 1985년이다.", "1960년 10대 도시에 포함된 도시 수는 호남권이 충청권보다 많다.", "1985년과 2024년의 인구 규모 상위 1～3위에 포함된 도시는 같다.", "1985년 대비 2024년 10대 도시 중 영남권에 위치한 도시 수는 증가하였다.", "1960년 대비 2024년 10대 도시에 새롭게 포함된 도시는 모두 수도권에 위치한다."], "probs": {"5": 0.05, "2": 0.13, "1": 0.45, "3": 0.29, "4": 0.08}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/korean-geography/page-04.jpg", "page": 4}, {"id": "korean-history:2", "subject": "한국사", "section": "korean-history", "number": 2, "selected": "1", "answer": "3", "points": "2", "visual": true, "state": {"question": "밑줄 친 ‘이 나라’에 대한 설명으로 옳은 것은?", "passage": "유물은 고구려를 계승한 <u>이 나라<\/u> 제3대 왕 문왕의 배우자인 효의 황후의 묘지(墓誌)이다. 여기에는 문왕의 연호인 ‘보력’, ‘경운’과 황후의 성씨, 황후의 사망 일자, 그리고 사망 당시의 나이 등이 기록되어 있다. 이 묘지가 출토된 무덤은 대형 돌방무덤으로 고구려 후기 양식을 이어받은 것이다.", "visual_description": "직사각형의 회색 석판 형태 묘지 사진이 제시되어 있다. 석판 표면에는 세로 방향의 흐릿한 글자들이 있다. 사진 왼쪽에는 묘지의 일부 글자를 확대해 나타낸 듯한 세로 표기가 있으며, 위쪽에는 ‘寶曆’과 그 옆의 한글 ‘보력’, 아래쪽에는 ‘慶雲’과 그 옆의 한글 ‘경운’이 적혀 있다. 각각의 표기에서 화살표가 석판 위의 작은 네모 표시를 가리킨다."}, "options": ["골품제를 실시하였다.", "평양으로 천도하였다.", "주자감을 설치하였다.", "4군 6진을 개척하였다.", "노비안검법을 시행하였다."], "probs": {"5": 0.07, "3": 0.06, "1": 0.49, "4": 0.18, "2": 0.2}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/korean-history/page-01.jpg", "page": 1}, {"id": "korean-history:8", "subject": "한국사", "section": "korean-history", "number": 8, "selected": "4", "answer": "5", "points": "2", "visual": true, "state": {"question": "(가) 사건의 영향으로 가장 적절한 것은?", "passage": "이 수자기는 (가) 당시 어재연 장군이 이끈 조선군이 광성보에서 미군과 맞서 싸울 때 걸었던 깃발입니다. 이때 미군이 전리품으로 가져갔던 수자기는 우여곡절 끝에 2007년 ‘장기 대여’ 형식으로 돌아왔지만, 현재는 미국 해군 사관 학교 박물관에 소장되어 있습니다.\n\n우리 곁을 떠난 수자기", "visual_description": "텔레비전 화면 형태의 자료이다. 화면 왼쪽에는 중앙에 큰 한자 ‘帥’가 적힌 직사각형 깃발 사진이 있고, 오른쪽에는 여성 진행자가 서서 말하고 있다. 위쪽 말풍선 안에 본문이 적혀 있으며, 화면 아래쪽의 짙은 띠에는 ‘우리 곁을 떠난 수자기’라고 적혀 있다."}, "options": ["삼별초가 조직되었다.", "나당 연합군이 결성되었다.", "미쓰야 협정이 체결되었다.", "인천 상륙 작전이 전개되었다.", "전국 각지에 척화비가 건립되었다."], "probs": {"2": 0.03, "3": 0.03, "4": 0.82, "5": 0.11, "1": 0.01}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/korean-history/page-02.jpg", "page": 2}, {"id": "korean-history:12", "subject": "한국사", "section": "korean-history", "number": 12, "selected": "1", "answer": "2", "points": "2", "visual": true, "state": {"question": "다음 자료를 활용한 탐구 활동으로 가장 적절한 것은?", "passage": "황무지 개간 문제에 관한 한국 당국과의 간담 건\n\n발신: 하야시 공사\n수신: 고무라 외무대신\n\n황무지 개간 문제에 관하여 민심이 불온한 상황임에도 한국 정부의 대신들은 그 진압에 노력하지 않고 도리어 크게 위험한 생각을 품고 암암리에 이에 동조하였으며, 심지어는 금전을 보내면서 그들의 환심을 사려고 합니다. …(중략)… 황무지 개간 문제가 여론을 격앙시킨 원인 중 하나였던 것은 사실이기 때문에, 지금 우리 쪽에서 이 안건을 무리하게 관철하려 한다면 큰 혼란을 야기할 가능성이 높다고 생각됩니다.", "visual_description": "테두리가 있는 문서 형태의 자료이다. 상단 중앙에 제목이 있고, 그 아래 왼쪽에 발신자와 수신자가 차례로 적혀 있다. 이어 황무지 개간 문제에 관한 본문이 인쇄되어 있으며, 문서 오른쪽 아래 모서리는 종이가 말려 올라간 것처럼 표현되어 있다."}, "options": ["호포제 시행의 목적을 파악한다.", "보안회의 활동 내용을 조사한다.", "원산 총파업의 전개 과정을 살펴본다.", "백두산정계비의 건립 배경을 찾아본다.", "베트남에 국군이 파병된 이유를 알아본다."], "probs": {"5": 0.01, "3": 0.09, "1": 0.66, "4": 0.06, "2": 0.18}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/korean-history/page-03.jpg", "page": 3}, {"id": "korean-history:13", "subject": "한국사", "section": "korean-history", "number": 13, "selected": "1", "answer": "4", "points": "2", "visual": true, "state": {"question": "(가)에 대한 설명으로 옳은 것은?", "passage": "(가) 디지털 자료관\n\n국무원 | 임시 의정원 | 법원 | 구미 위원부 | 파리 위원부\n\n자료명: 『자유 한국(LA CORÉE LIBRE)』\n\n[자료 해설]\n(가)의 외교 담당 기관인 파리 위원부와 구미 위원부는 일제의 침략성을 폭로하는 한편, 우리의 독립 의지와 독립의 정당성을 국제 사회에 알리는 역할을 수행하였다. 파리 위원부의 기관지인 『자유 한국』은 이러한 목적으로 간행되었다. 이를 통해 (가)이/가 전개한 외교 노력과 함께 국제 정세에 대한 당시 우리나라 독립운동가들의 인식도 확인할 수 있다.", "visual_description": "태블릿 컴퓨터 화면을 본뜬 자료이다. 화면 상단에는 무선 통신 아이콘, ‘PM 12:27’, ‘99%’와 배터리 아이콘이 보인다. 오른쪽 위에 ‘(가) 디지털 자료관’이라고 적혀 있다. 그 아래에는 ‘국무원’, ‘임시 의정원’, ‘법원’, ‘구미 위원부’, ‘파리 위원부’라고 적힌 탭이 가로로 배열되어 있고, 오른쪽 끝에는 삼각형 재생 모양의 버튼이 있다. ‘파리 위원부’ 탭이 강조되어 있다. 하단 왼쪽에는 ‘LA CORÉE LIBRE’라는 큰 제목과 태극 문양이 인쇄된 문서 표지 사진이 있고, 오른쪽에는 [자료 해설] 본문이 있다."}, "options": ["한성순보를 발행하였다.", "식목도감을 설치하였다.", "육영 공원을 설립하였다.", "연통제와 교통국을 조직하였다.", "경제 협력 개발 기구[OECD]에 가입하였다."], "probs": {"2": 0.05, "1": 0.43, "4": 0.43, "5": 0.03, "3": 0.06}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/korean-history/page-03.jpg", "page": 3}, {"id": "korean-history:20", "subject": "한국사", "section": "korean-history", "number": 20, "selected": "3", "answer": "4", "points": "3", "visual": true, "state": {"question": "밑줄 친 ‘가입’이 이루어진 시기를 연표에서 옳게 고른 것은? [3점]", "passage": "우리 외교의 향후 방향\n-다자·통일·실리 외교의 추진-\n\n우리나라가 제46차 유엔(국제 연합) 총회에서 유엔 회원국들의 축복 속에 161번째 정회원국이 됨으로써 마침내 태극기가 유엔 본부 앞에 휘날리게 되었습니다.\n더욱 뜻깊은 것은 우리가 희망하였던 대로 북한도 같은 날 우리와 함께 유엔에 동시 <u>가입<\/u>하여 남북한의 유엔 회원국 시대가 열린 것입니다.\n…(중략)…\n정부는 앞으로 유엔을 중심으로 한 ‘다자 외교’ 활동에 적극적으로 참여함으로써 국제 사회에서 우리의 국력과 국제적 위상에 맞는 역할과 기여를 다하고자 합니다.", "visual_description": "자료 아래에 가로로 이어진 연표형 표가 있다. 표는 여섯 개의 세로 열로 나뉜다. 맨 왼쪽의 첫 번째 열은 위쪽 칸에 기호가 없고 아래에 ‘남북 협상’이 적혀 있다. 이어지는 다섯 열은 위쪽 칸에 차례대로 ‘(가)’, ‘(나)’, ‘(다)’, ‘(라)’, ‘(마)’가 적혀 있다. 각 기호 아래의 사건은 다음과 같다. (가): ‘정전(휴전) 협정 체결’, (나): ‘7·4 남북 공동 성명 발표’, (다): ‘6월 민주 항쟁’, (라): ‘6·15 남북 공동 선언 채택’, (마): ‘10·4 남북 공동 선언(남북 관계 발전과 평화 번영을 위한 선언) 합의’."}, "options": ["(가)", "(나)", "(다)", "(라)", "(마)"], "probs": {"5": 0.03, "2": 0.07, "1": 0.03, "4": 0.08, "3": 0.79}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/korean-history/page-04.jpg", "page": 4}, {"id": "korean-language:36", "subject": "국어", "section": "korean-language", "number": 36, "selected": "1", "answer": "2", "points": "3", "visual": true, "state": {"question": "윗글과 <보기>를 바탕으로 <자료>를 탐구한 것으로 적절하지 않은 것은? [3점]", "passage": "한글은 음소 문자이다. 그렇다면 ‘ㅁ’은 소리일까, 문자일까?\n‘ㅁ’은 문자이다. 기호는 형식과 내용의 결합으로 이루어져 있는데, 문자 자체는 형식이고 그 문자가 나타내는 소리가 내용이다. 예컨대 ‘ㅁ’은 [마]의 초성에서 나는 소리인 양순 비음을 나타내는 형식이고, 내용은 양순 비음이다. 형식과 내용의 결합은 자의적이다. ‘ㅏ’로 소리 [a]를 나타내는데 ‘아’로도 소리 [a]를 나타내는 것, 그리고 현대 국어에서는 연구개 비음을 ‘ㅇ’으로 나타내는 데 비해 15세기 국어에서는 ‘ㆁ’으로 나타낸 것은 이를 보여 준다.\n<한글 맞춤법>에 따르면 한글 자모는 자음자 ‘ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ’ 14자, 모음자 ‘ㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ’ 10자 총 24자이다. ‘자모’는 자음자와 모음자를 아울러 이르는 말이다. 24자 외의 자모는 2개 이상의 자모를 ‘어울러 쓴 것’이다.\n24자모는 각각 하나의 소리를 나타내는 것이 일반적이지만, ‘ㅛ’처럼 반모음과 단모음의 연쇄인 <u>이중 모음([jo])<\/u>을 나타내는 것도 있다. 어울러 쓴 모음자 중에는 단모음을 나타내는 것도 있고, 이중 모음을 나타내는 것도 있다. ‘ㅔ’와 ‘ㅘ’는 각각 ‘ㅓ’와 ‘ㅣ’, ‘ㅗ’와 ‘ㅏ’를 어울러 쓴 것인데, ‘ㅔ’는 <u>단모음([e])<\/u>을, ‘ㅘ’는 <u>이중 모음([wa])<\/u>을 나타낸다. ‘ㄱ’ 두 개를 어울러 쓴 ‘ㄲ’도 초성에서 하나의 소리, 즉 된소리 [k’]를 나타내는데, 15세기 국어에서는 ‘ㅅ’과 ‘ㄱ’을 어울러 쓴 합용 병서 ‘ㅺ’으로 [k’]를 나타냈다.\n한편 어울러 쓴 자모 하나가 두 종류의 소리와 결합한 경우도 있고, 반대로 하나의 이중 모음이 어울러 쓴 자모 두 종류와 결합한 경우도 있다. <표준 발음법>에 따르면 ‘ㅚ’, ‘ㅟ’는 각각 단모음으로 발음하지만 이중 모음으로도 발음할 수 있다. 이는 어울러 쓴 모음자 ‘ㅚ’가 단모음, 이중 모음 두 종류의 소리와 결합한 것으로 전자의 예이다. 이에 비해 이중 모음 [we]는 어울러 쓴 모음자 ‘ㅞ’로 나타내는데, ‘ㅚ’로도 나타낼 수 있다. 이는 후자의 예이다.\n형식과 내용의 결합은 변할 수 있다. ‘ㆁ’은 내용은 그대로이면서 형식이 바뀐 예이다. 현대 국어와 달리 ‘ㅔ’는 15세기 국어에서는 이중 모음([əj])을 나타냈는데, 이는 형식은 그대로이면서 내용이 변한 예이다. 형식과 내용이 모두 변한 경우도 있다.\n\n<보기>\n◦ 『훈민정음』(해례본)에는 <한글 맞춤법>의 한글 자모 24자 외에 ‘ㆆ, ㅿ, ㆁ, ㆍ’ 4자가 더 있었다.\n◦ 15세기 국어에서 ‘ㅄ, ㅳ, ㅴ …’의 합용 병서는 초성에서 두 소리의 연쇄로 발음되는 자음군을 나타냈다.\n◦ 15세기 국어의 ‘ㅿ’은 15세기 국어의 ‘ㅅ’과 같은 조음 위치의 유성 마찰음을 나타냈다.\n◦ 15세기 국어에서는 경구개음이 자음 체계에 존재하지 않아서 구개음화가 발생하지 않았다.\n\n<자료>\n구분 | ㉠ | ㉡ | ㉢ | ㉣ | ㉤\n15세기 국어 | 앗겨(← 앗기어) | 이 | 어버 |  | 즐기디\n현대 국어 | 아껴(← 아끼어) | 입때 | 어버이 | 가득 | 즐기지", "visual_description": "<자료>는 6열 3행 표이다. 첫 행에는 왼쪽부터 빈 칸, ㉠, ㉡, ㉢, ㉣, ㉤이 있고, 둘째 행은 ‘15세기 국어’, 셋째 행은 ‘현대 국어’로 표시되어 있다. 각 번호 아래에서 15세기 국어 형태와 현대 국어 형태가 세로로 대응한다."}, "options": ["㉠을 보니, 15세기 국어의 ‘ㅕ’는 현대 국어의 ‘ㅕ’와 형식도 같고 내용도 반모음과 단모음의 연쇄인 이중 모음으로 같군.", "㉡을 보니, 15세기 국어의 ‘ㅵ’은 ‘ㅂ’이 나타내는 소리와 ‘ㅼ’이 나타내는 소리의 연쇄였고, ‘ㅵ’의 ‘ㅼ’은 현대 국어의 ‘ㄸ’과 형식과 내용이 모두 달랐군.", "㉢을 보니, 15세기 국어의 ‘ㅿ’은 형식과 내용이 모두 소멸되었군.", "㉣을 보니, 15세기 국어의 ‘ㆍ’는 형식이 소멸되었고 내용은 다른 소리로 변했군.", "㉤을 보니, ‘ㅈ’은 ‘ㅔ’와 마찬가지로 15세기 국어와 현대 국어에서 형식은 같고 내용은 다르군."], "probs": {"1": 0.37, "2": 0.1, "3": 0.14, "5": 0.24, "4": 0.15}, "others": {"Luna": "3", "Terra": "2", "Sol": "2"}, "image": "images/korean/page-17.jpg", "page": 17}, {"id": "korean-language:37", "subject": "국어", "section": "korean-language", "number": 37, "selected": "2", "answer": "4", "points": "2", "visual": false, "state": {"question": "<보기>의 [조건]이 모두 실현된 문장으로 적절한 것은?", "passage": "<보기>\n[조건]\n◦ 관형사가 관형어로 쓰일 것.\n◦ 선어말 어미를 통한 높임 표현이 나타날 것.\n◦ 자릿수가 하나인 서술어와 둘인 서술어를 포함할 것."}, "options": ["편찮으신 음악 선생님을 세 학생이 보건실로 조심히 모셨다.", "아버지께서는 언제나 책을 몇 장 읽으시다 잠자리에 드셨다.", "끊임없는 노력으로 할아버지께서는 결국 시험에 합격하셨다.", "유난히 길어진 추위에 할머니께서는 온갖 걱정을 다 하셨다.", "저 가게에서 파는 떡이 정말 맛있다며 삼촌은 입맛을 다셨다."], "probs": {"1": 0.26, "5": 0.06, "2": 0.3, "4": 0.21, "3": 0.17}, "others": {"Luna": "1", "Terra": "4", "Sol": "4"}, "image": "images/korean/page-17.jpg", "page": 17}, {"id": "korean-language:39", "subject": "국어", "section": "korean-language", "number": 39, "selected": "4", "answer": "1", "points": "2", "visual": false, "state": {"question": "<학습 활동>을 수행한 결과로 적절한 것은?", "passage": "<학습 활동>\n\n국어의 의존 형태소에는 접사, 조사, 어미 등이 있다. 이들은 각각 새로운 단어를 만들거나, 문법적 의미를 더해 주는 등 다양한 기능을 한다. 제시된 자료 ㉠～㉢을 분석해 보자.\n\n㉠: 발표가 <u>시작되자<\/u> 참석자들은 모두 목소리를 <u>낮췄다.<\/u>\n㉡: 비에 <u>젖은<\/u> 옷들을 <u>말리는<\/u> 데 시간을 다 <u>빼앗겼다.<\/u>\n㉢: 나는 내일 <u>친구랑<\/u> <u>만나<\/u> <u>미술관이랑<\/u> <u>영화관에<\/u> <u>가.<\/u>"}, "options": ["㉠의 ‘시작되자’와 ‘낮췄다’의 접미사는 모두 어근에 결합하여 어근의 품사와는 다른 품사의 단어를 파생하였다.", "㉠의 ‘낮췄다’와 ㉡의 ‘빼앗겼다’는 모두 사동의 의미를 더해 주는 접미사가 결합하여 형성된 단어이다.", "㉠의 ‘시작되자’와 ㉡의 ‘말리는’은 모두 피동의 의미를 더해 주는 접미사가 결합하여 형성된 단어이다.", "㉢의 ‘친구랑’과 ‘미술관이랑’의 조사는 앞말의 받침 유무에 따른 이형태 관계에 있고, 모두 앞말을 부사어로 기능하게 한다.", "㉢의 ‘만나’와 ‘가’의 어미는 모두 문장을 종결하는 동일한 문법적 기능을 한다."], "probs": {"1": 0.13, "2": 0.1, "3": 0.01, "5": 0.04, "4": 0.72}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/korean/page-18.jpg", "page": 18}, {"id": "korean-language:41", "subject": "국어", "section": "korean-language", "number": 41, "selected": "2", "answer": "4", "points": "2", "visual": true, "state": {"question": "다음은 (나)에 달린 댓글이다. 참여자들의 소통 양상으로 적절하지 않은 것은?", "passage": "[40～43] (가)는 온라인 알림 메시지, (나)는 학생의 블로그이다. 물음에 답하시오.\n\n(가)\n[온라인 알림 메시지 화면]\n상단에 ‘□□ 시립 도서관’이 표시되어 있고, 뒤로 가기, 검색, 메뉴 아이콘이 있다.\n\n□□ 시립 도서관\n알림 메시지 도착\n※ 이 메시지는 수신에 동의한 회원에게만 발송됩니다.\n\n‘상호 대차’ 이용 안내\n\n1. 상호 대차란?\n우리 도서관에 없는 도서를 협력 관계에 있는 도내 다른 도서관에 신청하여 이용자가 지정한 도서관에서 받아 볼 수 있는 도서 대출 서비스\n\n2. 이용 안내 및 유의 사항\n• 신청 권수 및 대출 기간: 월 5권 이내, 14일간\n• 수령 기간: 도착 문자 수신일로부터 3업무일 이내\n※ 정기 휴관일(월요일) 및 공휴일 제외(일요일은 운영)\n※ 미수령 시 자동 반납 및 3일간 재신청 불가\n• 수령 시간: 09:00～18:00\n※ 도서관 자료실 운영 시간(09:00～22:00)과 상이함.\n• 신청 절차: 누리집 로그인 → 도서 검색 → 상호 대차 신청 → 수령 도서관 지정 → 신청 완료\n\n□□ 시립 도서관 누리집 바로 가기\n\n(나)\n[학생의 블로그 화면]\n상단에 ‘블로그’ 표시, ‘이 블로그에서 검색’ 검색창, 검색 아이콘, 메뉴 아이콘이 있다.\n\n도서관 상호 대차, 저처럼 실수하진 마세요!\n공개 유형: 전체 공개　　　　　　　　　게시 일시: 2025. 10. 17. 20:32\n\n안녕하세요. 명호입니다!\n수행평가에 쓸 책을 구하지 못해 막막했는데, □□ 시립 도서관에서 보낸 ‘상호 대차’ 온라인 알림 메시지가 떠올랐어요!!!\n\n[점선 테두리 안 왼쪽에는 ‘상호 대차에 대한 자세한 내용은 우측을 클릭해 주세요.’라는 문구가 있고, 오른쪽에는 ‘상호 대차!’라는 글자가 있는 동영상 미리 보기와 재생 아이콘, 그 아래 ‘https://video.lib.□□’가 있다.]\n\n바로 검색했더니 이웃 도시의 △△ 도서관에 찾던 책이 있었어요.\nⓐ <u>상호 대차를 신청하고 며칠 뒤인 일요일에 도착 문자를 받았답니다!<\/u>\n수령 기간이 ‘도착 문자 수신일로부터 3업무일 이내’라고 되어 있었지만, ‘업무일’이 뭔지 잘 몰랐고, ‘로부터’는 당연히 문자 메시지 수신일을 포함한다고 생각해서, 화요일이 수령 마감일이라고 생각했어요. 그런데 화요일에 갑자기 일이 생겨 못 갔고, 3일간 재신청할 수 없다고 생각해 좌절했답니다.\n그런데! 목요일 아침! ⓑ <u>도서관으로부터 문자 메시지가 와서 오늘 내로 신청 도서를 수령하라는 것이 아니겠어요?<\/u> 전화를 했더니 ‘업무일’은 휴관일 제외, ‘수신일로부터 3업무일’은 ‘수신일+3업무일’이라고 알려 주셨어요. 정말 기뻤답니다. :)\n\n자료실 운영 시간을 오후 10시까지로 알고 있어 여유 있게 도서관으로 갔지만…, 수령 마감 시간은 오후 6시더라고요. 도착한 건 오후 6시 25분…. 안타깝게도 책을 놓쳤습니다.\n[고개를 숙이고 눈물을 흘리는 작은 동물 그림]\n\nⓒ <u>결국 그다음 주 화요일에 다시 신청해서 그 주 목요일에야 책을 받을 수 있었어요.<\/u>\n여러 도서관의 누리집을 확인했는데 운영 방식의 큰 틀은 같았지만, 도서관마다 대출 권수나 수령 시간 등 약간의 차이가 있었어요. ⓓ <u>다음 세 가지 유의 사항을 꼭 확인해 봐야지 저 같은 실수는 하지 않을 거예요.<\/u>\n\n[접힌 종이 모양의 상자 안에 손가락 모양 기호와 함께 다음 세 항목이 적혀 있다.]\n☝ ‘업무일’ 계산 시 휴관일을 제외함.\n☝ ‘수신일로부터 ○업무일’의 날짜 계산: 수신일+○업무일\n☝ 수령 시간과 자료실 운영 시간이 다를 수 있음.\n\n비록 좀 늦어지긴 했지만, 상호 대차 덕분에 큰 도움을 받았어요!\n한 곳의 도서관만으로는 원하는 책을 구하기 어려운 경우도 있는데, 도서관끼리 연결되어 있으니 마치 하나의 거대한 도서관을 이용한 것처럼 책을 빌리기 편했어요.\n이렇게 좋은 서비스를 모르는 친구들이 많아서, 상호 대차를 소개하는 카드 뉴스를 만들어 우리 학교 누리 소통망에 게시할 예정이에요. ⓔ <u>완성되면 블로그에도 올릴게요.<\/u>\n\n#상호대차　#도서관　#업무일　　　　　　♥ 공감 56　💬 댓글 5\n\n[댓글은 답글 관계를 선으로 나타낸 대화형 배치이다.]\n살구: 알려 주신 상호 대차 덕분에 꼭 필요했던 책들 중 대부분을 구했어요. 이 과정에서 명호 님의 실수담이 큰 도움이 되었어요.\n└ 태양: 살구 님, 그렇다면 책을 다는 못 구하신 건가요? 그럼 전국 단위 상호 대차인 국립중앙도서관의 ‘책바다’를 이용해 보세요.\n꽃잎: 도착 문자가 언제 올지도 모르는데, 명호 님처럼 ‘수신일+3업무일’ 동안 예상 못 한 일이 생길 수도 있잖아요. 도서 수령 기간을 늘리면 좋겠어요.\n└ 동동: 저도 수령 마감일을 넘겨서 재신청 불가 기간 동안 책을 못 빌렸어요. 10업무일 정도로 기간을 늘려 달라고 도서관에 건의해 보려고요.\n　└ 바다: 기간을 늘리면 좋긴 할 텐데, 10업무일은 너무 긴 것 같아요. 그 책을 급히 찾는 또 다른 사람이 있을 수 있잖아요.", "visual_description": "댓글 상자에서 ‘태양’은 ‘살구’의 댓글에 들여쓰기된 답글로 연결되어 있다. ‘동동’은 ‘꽃잎’의 댓글에 들여쓰기된 답글이고, ‘바다’는 다시 ‘동동’의 댓글 아래 더 깊게 들여쓰기된 답글로 연결되어 있다."}, "options": ["‘살구’는 (나)를 문제 해결을 위한 유용한 정보로 수용하고, 이를 적용해 자신에게 긍정적 결과가 있었음을 밝히고 있다.", "‘태양’은 ‘살구’의 상호 대차 이용 경험에 대해 자신이 이해한 바를 질문하고, 도움이 될 만한 정보를 제시하고 있다.", "‘꽃잎’은 (나)에서처럼 예측하기 어려운 상황이 발생할 수 있음을 언급하고, 이를 근거로 자신의 바람을 드러내고 있다.", "‘동동’은 ‘꽃잎’의 생각을 자신의 경험과 연결 짓고, 재신청 불가 기간 연장에 대한 자신의 계획을 밝히고 있다.", "‘바다’는 ‘동동’이 제시한 의견에 일부 공감하고, 그 의견이 실현됐을 때 발생할 것으로 예상되는 문제를 언급하고 있다."], "probs": {"3": 0.03, "1": 0.06, "4": 0.06, "2": 0.79, "5": 0.06}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/korean/page-19.jpg", "page": 19}, {"id": "korean-speech:38", "subject": "국어", "section": "korean-speech", "number": 38, "selected": "3", "answer": "1", "points": "2", "visual": false, "state": {"question": "(가)와 (나)의 의사소통 양상에 대한 설명으로 적절하지 않은 것은?", "passage": "[38～42] (가)는 방송 대담의 일부이고, (나)는 이를 바탕으로 시사 동아리 학생들이 나눈 대화이며, (다)는 ‘학생 1’이 (가)와 (나)를 바탕으로 작성한 비평문이다. 물음에 답하시오.\n\n(가)\n진행자 : 시청자 여러분, 안녕하십니까? 전문가의 안목을 더해 사회 현상을 바라보는 ‘시사 더하기’입니다. 요즘 드라마 ○○○이 세계적으로 인기인데요, 웹툰을 원작으로 한 이런 영상들이 최근 많아졌습니다. 오늘은 웹툰 영상화 유행 현상에 대해 영상 분야의 전문가와 웹툰 분야의 전문가를 모시고 말씀 들어 보겠습니다. 먼저 이 현상이 왜 나타났다고 보시는지 두 분 말씀 부탁드립니다.\n전문가 1 : 인터넷 기반 동영상 제공 서비스인 OTT의 활성화로 영상 산업이 급속도로 성장했기 때문이죠. 이에 따라 저희 업계에서는 영상화할 이야기를 웹툰에서 발굴하고 확보하는 일이 많아졌습니다.\n전문가 2 : 웹툰에는 초능력처럼 실사로 구현하기 어려운 소재가 많이 등장하는데요. 영상 제작에서 특수 효과 기술이 발달한 점도 저희 웹툰이 많이 영상화되는 데 일조했죠.\n진행자 : ㉠ <u>영상 산업의 성장과 기술의 발달이 복합적으로 작용한 결과군요.<\/u> 이 현상은 양쪽 산업의 경제적 측면에도 기여했을 것 같은데요, 이번에는 웹툰 산업 입장부터 들어 보겠습니다.\n전문가 2 : 저희 웹툰 산업의 입장에서는 이미 만들어진 작품의 저작권을 판매할 수 있어 수익 창출의 기회가 늘어났습니다.\n전문가 1 : 저희 영상 쪽도 이미 인기를 끈 웹툰을 영상으로 제작함으로써 흥행 실패로 인해 손실을 입을 위험 부담을 덜 수 있습니다. 결과적으로 수익성을 높이는 것이지요.\n\n(나)\n학생 1 : 우리 이번 주 ‘시사 더하기’에서 다룬 현상에 대해 비평문을 쓰기로 했잖아. 웹툰 영상화가 정말 유행이더라. 둘 다 방송 봤지?\n학생 2 : 응. ㉡ <u>웹툰 영상화가 이 정도로 유행인 줄 몰랐는데 방송에서까지 다루는 것을 보고 체감이 됐어.<\/u>\n학생 3 : ○○○이 세계적으로 인기라고 방송에서 그랬잖아. 이 작품이 모두가 공감할 수 있는 내용을 다뤄서 그런 듯해.\n학생 1 : 방송에서 웹툰 영상화 유행 현상의 원인을 다뤘잖아. 원인에 대해서 너희는 어떻게 생각해?\n학생 2 : 방송에서 영상 산업의 성장을 언급했는데, 웹툰 플랫폼들의 해외 진출이 웹툰 영상화의 유행에 더 영향을 미친 것 같아.\n학생 3 : 특수 효과 기술의 발달도 전문가가 말했는데, 나도 기술 발달이 더 주요한 원인인 것 같아.\n학생 1 : 그럼 이제 웹툰 영상화 유행 현상에 대한 각자의 관점을 말해 보자. ㉢ <u>대부분 이 현상을 긍정적으로 볼 것 같은데,<\/u> 너희들 생각은 어때?\n학생 2 : 내 생각은 좀 달라. 웹툰 원작 영상은 원작의 이야기를 재탕하는 데 불과한 것 같아. 이런 영상이 많아지면 영상 전반의 다양성을 해치게 될 거야. 또 웹툰 작가들이 영상화에 유리한 작품만 창작하려는 경향이 생길 것 같아.\n학생 1 : 그러네. ㉣ <u>그렇게 되면 웹툰이나 영상을 즐기는 이들이 신작에 대해 갖는 기대치와 만족도까지 줄어들겠다.<\/u>\n학생 3 : 그 점도 일리가 있네. 그런데 웹툰 영상화는 이미 만들어진 작품으로 추가 수익을 낼 수 있는 기회라고 전문가가 그랬잖아. 웹툰 창작자가 추가 수익으로 경제적 안정을 얻으면 좋은 웹툰을 만드는 데 전념할 수 있게 될 거야.\n학생 2 : ㉤ <u>듣고 보니 경제적 안정 덕분에 좋은 웹툰을 창작하는 데 전념할 수 있게 된다는 네 말이 더 맞는 것 같아.<\/u>\n학생 1 : 그럼 내가 방송 내용과 우리 대화를 바탕으로 비평문을 써 볼게."}, "options": ["(가)는 (나)와 달리, 대화 참여자 중 한 명이 나머지 두 명에게 발언을 요청하고 있다.", "(가)는 (나)와 달리, 대화 참여자 중 두 명이 각각 특정 집단을 대표하며 발언하고 있다.", "(가)는 (나)와 달리, 대화 참여자 중 한 명이 나머지 두 명의 발언 순서를 정하고 있다.", "(나)는 (가)와 달리, 대화에 직접 참여한 참여자들만을 청자로 상정하고 있다.", "(나)는 (가)와 달리, 대화 주제에 대한 긍정적, 부정적 관점의 발화가 모두 이루어지고 있다."], "probs": {"1": 0.19, "3": 0.56, "5": 0.07, "2": 0.08, "4": 0.1}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/korean/page-14.jpg", "page": 14}, {"id": "life-ethics:9", "subject": "생활과 윤리", "section": "life-ethics", "number": 9, "selected": "3", "answer": "1", "points": "3", "visual": false, "state": {"question": "다음을 주장한 사상가의 입장으로 가장 적절한 것은? [3점]", "passage": "시민 불복종은 거의 정의로운 사회의 자유롭고 평등한 사람들 사이에서 사회 협동체의 원칙이 존중되지 않고 있음을 선언하는 행위이다. 이는 신중하고 양심적인 신념의 표현이기 때문에 공개 석상에서 이루어지는 비폭력적 행위이다. 시민 불복종은 경고나 훈계일 수는 있어도 위협일 수는 없다."}, "options": ["시민 불복종이 빈번한 국가의 체제가 부정의할 수는 없다.", "시민 불복종은 정치적 원칙에 근거해 정당화되어서는 안 된다.", "시민 불복종은 법에 대한 충실성을 불가피하게 거부하는 위법 행위이다.", "거의 정의로운 사회에는 헌법 원칙에 대한 의도적인 위반은 존재하지 않는다.", "시민 불복종의 대상이 되는 법은 불복종이 가져올 무질서의 가능성에 근거해 정해진다."], "probs": {"2": 0.06, "4": 0.26, "1": 0.12, "3": 0.52, "5": 0.04}, "others": {"Luna": "3", "Terra": "3", "Sol": "5"}, "image": "images/life-ethics/page-02.jpg", "page": 2}, {"id": "life-ethics:13", "subject": "생활과 윤리", "section": "life-ethics", "number": 13, "selected": "2", "answer": "4", "points": "3", "visual": true, "state": {"question": "다음은 갑, 을 사상가들의 가상 대화이다. 갑, 을의 입장으로 적절한 것만을 <보기>에서 고른 것은? [3점]", "passage": "갑: 인간은 자신의 모든 권리를 공동체에 완전히 양도합니다. 이것은 아무것도 남겨 두지 않는 양도여서, 각자는 모두에게 자신을 주기에 아무에게도 주지 않는 것입니다.\n\n을: 인간은 자신의 생명, 자유, 재산에 대한 소유를 보존하기 위해서가 아니라면 자연 상태의 자유를 단념하지도 사회 및 정부에 자신을 구속시키지도 않을 것입니다.\n\n<보기>\nㄱ. 갑: 개인은 다수의 전체 의지에 복종함으로써 자유를 보장받는다.\nㄴ. 을: 입법권은 어떤 정부 형태든 모든 국가에서 최고 권력이다.\nㄷ. 을: 사회 계약과 소유권 행사에는 인민의 동의가 필수적이다.\nㄹ. 갑과 을: 시민들은 정부를 교체할 수 있는 권력을 갖는다.", "visual_description": "두 인물의 흑백 초상 삽화가 좌우에 배치되어 있다. 왼쪽의 ‘갑’은 흰 가발을 쓴 인물이고, 오른쪽의 ‘을’은 긴 물결 머리의 인물이다. 각 인물 위의 말풍선이 해당 인물의 발언과 연결되어 있다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"1": 0.02, "4": 0.02, "2": 0.9, "5": 0.05, "3": 0.01}, "others": {"Luna": "4", "Terra": "1", "Sol": "4"}, "image": "images/life-ethics/page-03.jpg", "page": 3}, {"id": "life-ethics:17", "subject": "생활과 윤리", "section": "life-ethics", "number": 17, "selected": "4", "answer": "5", "points": "2", "visual": false, "state": {"question": "갑, 을 사상가들의 입장으로 가장 적절한 것은?", "passage": "갑: 덕은 실천 관행을 지지하는, 그리고 실천 관행에 내재하는 선의 성취를 가능하게 하는 성향으로 이해될 수 있다. 덕은 선에 대한 탐색을 지속하게 함으로써 자기 지식과 선에 관한 지식을 증진하게 하는 성향이다.\n\n을: 자연은 인류를 쾌락과 고통이라는 최고의 두 군주가 지배하도록 하였다. 오직 쾌락과 고통만이 우리가 무엇을 해야 하는가를 지시해 준다. 옳음과 그름의 기준은 이 둘의 왕좌에 매여 있다."}, "options": ["갑: 친밀도에 따른 차등적 대우는 유덕한 행위가 될 수 없다.", "갑: 행위 자체에 내재된 도덕적 속성으로 보편적 도덕 법칙을 세워야 한다.", "을: 국가의 입법 원리와 개인의 도덕 원리는 궁극적으로 같을 수 없다.", "을: 쾌락과 고통으로써 행위 결과를 평가할 수 있지만 행위 동기를 설명할 수는 없다.", "갑과 을: 도덕 행위의 실천적 고려 범위에서 공동체를 배제해서는 안 된다."], "probs": {"4": 0.37, "5": 0.13, "2": 0.14, "1": 0.13, "3": 0.23}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/life-ethics/page-04.jpg", "page": 4}, {"id": "life-ethics:18", "subject": "생활과 윤리", "section": "life-ethics", "number": 18, "selected": "2", "answer": "3", "points": "2", "visual": false, "state": {"question": "다음을 주장한 사상가의 입장으로 가장 적절한 것은?", "passage": "이성적으로만 보면 국가들이 전쟁을 중지하는 방식은 오직 무법칙적 자유를 포기하고 공법의 규제에 순응하여, 종국에는 모든 민족을 포함하는 단일 국가를 형성하는 것뿐이다. 그러나 국가들이 결코 이를 의욕하지 않을 것이다. 대신 국가들은 이러한 적극적 이념이 아니라, 전쟁을 회피하면서 지속적으로 확장되는 연맹이라는 소극적 대용물을 택함으로써 전쟁에 대한 성향이나 법의 통제를 꺼리는 성향을 중지할 수 있을 것이다."}, "options": ["영구 평화의 실현 이후 세계 공화국을 수립할 수 있다.", "영구 평화가 모든 전쟁의 영구적 종식을 요청하지는 않는다.", "대내 권력이 전제적일수록 전쟁을 일으킬 가능성은 증가한다.", "방문한 외국인이 내국인과 동일하게 행사할 수 있는 권리는 없다.", "연맹에 가입한 주권 국가들을 공통으로 규제하는 법은 불가능하다."], "probs": {"2": 0.77, "4": 0.01, "1": 0.08, "3": 0.02, "5": 0.12}, "others": {"Luna": "4", "Terra": "3", "Sol": "4"}, "image": "images/life-ethics/page-04.jpg", "page": 4}, {"id": "life-ethics:19", "subject": "생활과 윤리", "section": "life-ethics", "number": 19, "selected": "5", "answer": "3", "points": "3", "visual": true, "state": {"question": "(가)의 갑, 을 사상가들의 입장을 (나) 그림으로 탐구하고자 할 때, A～C에 들어갈 적절한 질문만을 <보기>에서 고른 것은? [3점]", "passage": "(가)\n갑: 우리는 절대 빈곤에 처한 사람들을 도울 의무가 있다. 빈민을 돕기 위한 기준은 수입의 단 1% 수준에서 시작할 수 있다. 이것은 중요한 희생 없이 쉽게 낼 수 있을 것이다.\n\n을: 특정 생활수준 이상이라면 빈민을 돕도록 강제하는 사회를 생각해 보자. 그런 강제만 없고 다른 것이 모두 같은 사회가 있다면, 누구든 거기로 갈 것이다. 개인의 재산 처분은 강제될 수 없다.\n\n(나)\n사상가 갑, 을의 입장을 탐구한다.\n\n<보기>\nㄱ. A: 빈민을 위한 자선은 도덕적으로 정당한 행위인가?\nㄴ. B: 원조 효과가 불확실하다면 원조 결정을 유보할 수 있는가?\nㄷ. B: 원조 대상이 받는 혜택이 원조 주체가 부담하는 비용을 초과해야 하는가?\nㄹ. C: 원조 행위는 원조 주체의 소유권을 필연적으로 침해하는가?", "visual_description": "(나)는 사상가의 입장을 판별하는 흐름도이다. 맨 위의 직사각형 ‘사상가 갑, 을의 입장을 탐구한다.’에서 아래의 마름모 A로 실선 화살표가 이어진다. A에서 ‘예’라고 표시된 실선 화살표가 아래의 마름모 B로 이어지고, B에서 ‘예’라고 표시된 실선 화살표가 아래의 물결 모양 밑변을 가진 상자 ‘갑의 입장’으로 이어진다. A에서 ‘아니요’라고 표시된 점선 화살표가 오른쪽으로 간 뒤 아래로 꺾여 마름모 C로 이어진다. C에서 ‘예’라고 표시된 실선 화살표가 아래의 물결 모양 밑변을 가진 상자 ‘을의 입장’으로 이어진다. 범례에는 직사각형이 ‘출발 조건’, 마름모가 ‘판단 내용’, 실선 화살표와 점선 화살표가 ‘판단 방향’, 물결 모양 밑변을 가진 상자가 ‘사상가의 입장’으로 표시되어 있다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"3": 0.03, "1": 0.05, "5": 0.73, "2": 0.12, "4": 0.07}, "others": {"Luna": "2", "Terra": "2", "Sol": "3"}, "image": "images/life-ethics/page-04.jpg", "page": 4}, {"id": "math-calculus:25", "subject": "수학", "section": "math-calculus", "number": 25, "selected": "2", "answer": "3", "points": "3", "visual": false, "state": {"question": "수열 \\(\\{a_n\\}\\)이 모든 자연수 \\(n\\)에 대하여\n\n\\[\\sqrt{9n^2-5}+2n<a_n<5n+1\\]\n\n을 만족시킬 때, \\(\\displaystyle \\lim_{n\\to\\infty}\\frac{(a_n+2)^2}{na_n+5n^2-2}\\)의 값은? [3점]", "passage": ""}, "options": ["\\(\\frac{1}{2}\\)", "\\(\\frac{3}{2}\\)", "\\(\\frac{5}{2}\\)", "\\(\\frac{7}{2}\\)", "\\(\\frac{9}{2}\\)"], "probs": {"3": 0.26, "2": 0.29, "4": 0.07, "1": 0.08, "5": 0.3}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/math/page-14.jpg", "page": 14}, {"id": "math-calculus:26", "subject": "수학", "section": "math-calculus", "number": 26, "selected": "3", "answer": "1", "points": "3", "visual": true, "state": {"question": "그림과 같이 곡선 \\(y=\\sqrt{x}+x\\ln x\\)와 \\(x\\)축 및 두 직선 \\(x=1\\), \\(x=2\\)로 둘러싸인 부분을 밑면으로 하는 입체도형이 있다. 이 입체도형을 \\(x\\)축에 수직인 평면으로 자른 단면이 모두 정삼각형일 때, 이 입체도형의 부피는? [3점]", "passage": "", "visual_description": "좌표축이 비스듬한 원근법으로 그려져 있다. 오른쪽 아래 방향의 축은 \\(x\\), 오른쪽 위 방향의 축은 \\(y\\)로 표시되어 있고, 두 축의 교점 부근에 \\(O\\)가 표시되어 있다. \\(x\\)축 위쪽에는 \\(y=\\sqrt{x}+x\\ln x\\)로 표시된 증가하는 곡선이 있다. \\(x=1\\)과 \\(x=2\\) 위치가 표시되어 있으며, 곡선과 \\(x\\)축 사이의 밑면 위에 여러 정삼각형 단면이 세워진 입체도형이 회색 음영으로 그려져 있다. 단면의 밑변은 \\(x\\)축에서 곡선까지 이어지고, 각 정삼각형의 꼭짓점은 밑면 위쪽에 있다. 일부 보이지 않는 모서리는 점선으로 표시되어 있다."}, "options": ["\\(\\frac{\\sqrt{3}(3+8\\ln 2)}{16}\\)", "\\(\\frac{\\sqrt{3}(5+12\\ln 2)}{24}\\)", "\\(\\frac{\\sqrt{3}(1+12\\ln 2)}{16}\\)", "\\(\\frac{\\sqrt{3}(1+2\\ln 2)}{4}\\)", "\\(\\frac{\\sqrt{3}(1+9\\ln 2)}{12}\\)"], "probs": {"1": 0.17, "2": 0.22, "3": 0.37, "5": 0.14, "4": 0.1}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/math/page-14.jpg", "page": 14}, {"id": "math-calculus:27", "subject": "수학", "section": "math-calculus", "number": 27, "selected": "1", "answer": "2", "points": "3", "visual": false, "state": {"question": "매개변수 \\(t\\)로 나타내어진 곡선\n\n\\[x=e^{4t}(1+\\sin^2 \\pi t),\\qquad y=e^{4t}(1-3\\cos^2 \\pi t)\\]\n\n를 \\(C\\)라 하자. 곡선 \\(C\\)가 직선 \\(y=3x-5e\\)와 만나는 점을 P라 할 때, 곡선 \\(C\\) 위의 점 P에서의 접선의 기울기는? [3점]", "passage": ""}, "options": ["\\(\\dfrac{3\\pi-4}{\\pi+4}\\)", "\\(\\dfrac{3\\pi-2}{\\pi+6}\\)", "\\(\\dfrac{3\\pi}{\\pi+8}\\)", "\\(\\dfrac{3\\pi+2}{\\pi+10}\\)", "\\(\\dfrac{3\\pi+4}{\\pi+12}\\)"], "probs": {"3": 0.15, "1": 0.29, "5": 0.28, "2": 0.18, "4": 0.1}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/math/page
