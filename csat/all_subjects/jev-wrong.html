<script>const DATA=[{"id": "agriculture:6", "subject": "농업 기초 기술", "section": "agriculture", "number": 6, "selected": "4", "answer": "5", "points": "3", "visual": false, "state": {"question": "위 인터뷰에서 알 수 있는 농장주의 재배 방식을 토양 재배 방식과 비교했을 때 갖는 특징으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "[5~6] 다음은 채소 재배에 관한 인터뷰이다. 물음에 답하시오.\n\n리포터: 안녕하세요. 온실에 붉은 열매가 탐스럽게 익어 가고 있네요.\n농장주: 네, 이 작물은 라이코펜(lycopene)이라는 항산화 물질을 많이 함유하고 있어 붉은색을 띤답니다.\n리포터: 이 작물을 재배하는 특별한 이유가 있으신가요?\n농장주: 온실에서는 연속 착과되어 연중 출하할 수 있고, 비상품과도 주스, 케첩 등 가공용으로 다양하게 활용할 수 있기 때문입니다.\n리포터: 그런데 제가 알고 있는 토양 재배 방식과는 다른 것 같네요.\n농장주: 네, 코이어 배지에 작물을 심어 생육 시기에 맞게 양액을 공급하여 재배하고 있습니다.\n리포터: 아, 그렇군요.\n\n<보기>\nㄱ. 시설 설비 비용이 많이 든다.\nㄴ. 염류 집적으로 인한 장해가 적다.\nㄷ. 근권부의 전기 전도도 조절이 수월하다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"3": 0.26, "1": 0.03, "5": 0.21, "2": 0.03, "4": 0.47}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/agriculture/page-02.jpg", "page": 2}, {"id": "agriculture:9", "subject": "농업 기초 기술", "section": "agriculture", "number": 9, "selected": "2", "answer": "5", "points": "2", "visual": false, "state": {"question": "다음 대화에서 (가)에 들어갈 돼지의 사양 관리로 가장 적절한 것은?", "passage": "아빠: 돼지 위턱에 이 줄을 걸어서 나무에 묶어 주겠니?\n아들: 네, 그런데 이 작업을 왜 하는 거예요?\n아빠: 응, 돼지의 후퇴성을 이용하여 보정하기 위한 거란다.\n아들: 아, 그래서 큰 돼지가 앞으로 움직이지 못하는 거군요.\n아빠: 그래, 그렇지. 이 특성을 이용하면 (가)를 안전하게 할 수 있단다."}, "options": ["젖떼기", "꼬리 자르기", "초유 먹이기", "탯줄 자르기", "백신 접종하기"], "probs": {"2": 0.63, "1": 0.03, "4": 0.02, "5": 0.31, "3": 0.01}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/agriculture/page-02.jpg", "page": 2}, {"id": "agriculture:14", "subject": "농업 기초 기술", "section": "agriculture", "number": 14, "selected": "1", "answer": "5", "points": "3", "visual": true, "state": {"question": "다음 대화에서 (가)에 들어갈 병원체와 같은 범주로 분류되는 병원체가 원인인 식물의 병으로 옳은 것은? (단, 병원체는 세균, 진균, 바이러스, 파이토플라즈마로만 한정한다.) [3점]", "passage": "귀농인: 안녕하세요. 저는 딸기를 촉성재배하고 있습니다. 최근 열매 표면에 회색의 가루들이 생겼고, 일부는 부패하는 문제가 발생하여 연락드렸습니다.\n연구사: 사진을 보니 (가)에 의해 발생하는 병해입니다. 이 병의 포자는 저온 다습한 조건에서 주로 발생합니다.\n귀농인: 어떻게 하면 방제할 수 있나요?\n연구사: 우선 병이 확산하지 않도록 발병한 과실을 제거한 후, 약제를 살포하세요. 그리고 저온기이므로 야간에는 난방을 하여 온실 내 습도를 낮추고, 주간에는 환기를 하여 통풍을 좋게 해 보세요.", "visual_description": "대화는 왼쪽의 ‘귀농인’ 여성과 오른쪽의 ‘연구사’ 여성의 말풍선으로 제시되어 있다. 첫 번째 귀농인의 말풍선 오른쪽에는 열매 표면에 회색 가루처럼 보이는 비교적 넓고 불규칙한 병반 또는 피복이 나타난 딸기 그림이 있다."}, "options": ["무 무름병", "벼 흰잎마름병", "뽕나무 오갈병", "담배 모자이크병", "옥수수 깜부기병"], "probs": {"5": 0.05, "3": 0.03, "1": 0.64, "4": 0.04, "2": 0.24}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/agriculture/page-03.jpg", "page": 3}, {"id": "agriculture:15", "subject": "농업 기초 기술", "section": "agriculture", "number": 15, "selected": "3", "answer": "2", "points": "3", "visual": true, "state": {"question": "다음 퍼즐이 완성될 때 세로 낱말에 해당하는 떡과 같은 방법으로 가공하는 떡의 종류로 옳은 것만을 <보기>에서 고른 것은? (단, 가공 방법은 치기, 지지기로만 구분한다.) [3점]", "passage": "[가로 낱말]\nA: 산과 만나면 응고하여 커드를 형성하는 단백질로, 우유 단백질의 약 80%를 차지한다.\nB: 식품을 소금, 당, 유기산 용액에 담가 저장 기간을 연장하는 가공법이다. 이 방법으로 가공한 식품에는 김치, 피클 등이 있다.\nC: 중경 제초에 쓰는 소농기구이다. 삼각형의 날과 가는 목을 꼬부리고 자루를 끼운 형태이다.\n\n<보기>\nㄱ. 절편\nㄴ. 주악\nㄷ. 가래떡\nㄹ. 부꾸미", "visual_description": "낱말 퍼즐은 세 개의 가로 낱말 A, B, C와 굵은 테두리로 표시된 세 칸짜리 세로 낱말로 이루어져 있다. A는 왼쪽에서 오른쪽으로 세 칸이며 첫째 칸에 ‘카’가 인쇄되어 있고 셋째 칸이 세로 낱말의 맨 위 칸과 겹친다. B는 세로 낱말의 가운데 칸에서 시작해 바로 오른쪽의 ‘임’이 인쇄된 칸으로 이어진다. C는 ‘호’가 인쇄된 칸에서 시작해 오른쪽의 세로 낱말 맨 아래 칸으로 이어지는 두 칸이다. A, B, C 표시는 각 해당 가로 낱말의 시작 부분에 작게 인쇄되어 있다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"5": 0.15, "2": 0.23, "1": 0.23, "4": 0.12, "3": 0.27}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/agriculture/page-03.jpg", "page": 3}, {"id": "agriculture:16", "subject": "농업 기초 기술", "section": "agriculture", "number": 16, "selected": "2", "answer": "4", "points": "2", "visual": false, "state": {"question": "다음 사례에 나타난 농업인 A, B의 농산물 거래 방식에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "청년 농업인 사례\n\n• 농업인 A는 ○○ 농업 법인을 창업하여 직접 생산한 농산물을 온라인에서 개인 소비자에게 판매하고 있다. 법인의 자체 쇼핑몰 홈페이지를 만들어 소비자와 쌍방향으로 소통하며 고객의 구매 수요를 파악하고 있다.\n• 농업인 B는 마을 사람들과 작목반을 조직하여 농산물을 도매 시장 법인을 통해 공동 판매 3원칙을 지키며 소비자에게 판매하고 있다. 작목반 구성원과 재배 기술을 공유하며 농산물의 품질을 높이고자 노력한 결과, 시세보다 높은 가격을 받으며 품질을 인정받고 있다.\n\n<보기>\nㄱ. 농업인 A는 전자 상거래 유형 중 ‘B2G’로 거래한다.\nㄴ. 농업인 B는 작목반 구성원과 수취 가격을 평준화한다.\nㄷ. 농업인 A의 농산물 유통 경로는 농업인 B보다 단순하다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"1": 0.01, "2": 0.56, "3": 0.01, "4": 0.4, "5": 0.01}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/agriculture/page-03.jpg", "page": 3}, {"id": "agriculture:17", "subject": "농업 기초 기술", "section": "agriculture", "number": 17, "selected": "2", "answer": "3", "points": "2", "visual": true, "state": {"question": "다음 대화에서 알 수 있는 친환경 방제법과 같은 범주에 속하는 사례로 적절한 것은? (단, 친환경 방제법은 경종적, 물리적, 생물적, 화학적 방제로만 한정한다.)", "passage": "[대화]\n손녀: 할머니, 배추잎에 구멍이 많이 뚫려 있어요.\n할머니: 아이고, 벌레가 생겼구나!\n손녀: 어떡해요? 이제 다 먹지 못하는 거 아니에요?\n할머니: 걱정 말거라. 이것을 사용해 보자.\n손녀: 우리는 배추를 유기농으로 키우는데, 이걸 사용해도 되나요?\n할머니: 이것은 은행잎에서 추출한 성분으로 만든 친환경 농자재란다.", "visual_description": "배추가 심긴 재배대 앞에서 ‘손녀’와 ‘할머니’가 대화한다. 할머니는 배추를 가리키거나 손에 든 분무기로 배추에 액체를 뿌리고 있다. 대화의 중간 순서를 나타내는 작은 칸에 위쪽으로 ‘1’, ‘2’, 아래쪽으로 ‘3’이 적혀 있다."}, "options": ["돌려짓기하여 고추의 역병을 방제하였다.", "마일즈응애를 이용하여 버섯응애를 방제하였다.", "난황유를 살포하여 오이의 목화진딧물을 방제하였다.", "황색 끈끈이 트랩으로 참외의 온실가루이를 방제하였다.", "태양열을 이용한 토양 소독으로 양파의 노균병을 방제하였다."], "probs": {"4": 0.1, "1": 0.17, "5": 0.07, "3": 0.29, "2": 0.37}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/agriculture/page-04.jpg", "page": 4}, {"id": "agriculture:18", "subject": "농업 기초 기술", "section": "agriculture", "number": 18, "selected": "3", "answer": "2", "points": "2", "visual": true, "state": {"question": "다음 글에서 알 수 있는 작물에 대한 분류로 옳은 것만을 <보기>에서 고른 것은?", "passage": "볏과에 속하는 이 작물은 대맥(大麥)이라 불리며 가을에 파종하여 이듬해 초여름에 수확한다. 과거 우리나라에서는 전년도 가을에 수확한 식량이 바닥난 후부터 이 작물을 수확하기 전까지의 기간을 ‘춘궁기(春窮期)’라 불렀으며, 작물의 이름을 따서 ‘○○고개’라고도 불렀다. 이 작물은 식량 또는 차, 주정, 사료 등의 가공 원료로 이용된다.\n\n<보기>\nㄱ. 생육 형태에 따라 주형 작물이다.\nㄴ. 이용 용도에 따라 유료 작물이다.\nㄷ. 생육 온도에 따라 저온성 작물이다.\nㄹ. 재배 기간에 따라 여러해살이 작물이다.", "visual_description": "제시문 오른쪽에 길고 가는 줄기 끝에 tion": "사람의 유전 형질 (가)는 대립유전자 A와 a에 의해, (나)는 대립유전자 B와 b에 의해 결정된다. (가)와 (나)의 유전자 중 하나는 상염색체에, 나머지 하나는 X 염색체에 있다. 표는 사람 P와 Q의 세포 Ⅰ～Ⅳ에서 A, b, ㉠, ㉡의 유무와 X 염색체 수를 나타낸 것이다. Ⅰ～Ⅳ 중 3개는 P의 세포이고 나머지 1개는 Q의 세포이다. ㉠과 ㉡은 a와 B를 순서 없이 나타낸 것이고, ⓐ와 ⓑ는 1과 2를 순서 없이 나타낸 것이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 돌연변이와 교차는 고려하지 않으며, Ⅰ～Ⅳ는 중기의 세포이다.)", "passage": "표:\n| 세포 | 대립유전자 A | 대립유전자 b | 대립유전자 ㉠ | 대립유전자 ㉡ | X 염색체 수 |\n|---|---|---|---|---|---|\n| Ⅰ | ? | × | × | × | ? |\n| Ⅱ | ? | × | ○ | × | ⓐ |\n| Ⅲ | ○ | ? | × | ○ | ? |\n| Ⅳ | ? | ? | ? | × | ⓑ |\n(○: 있음, ×: 없음)\n\n<보기>\nㄱ. ㉠은 B이다.\nㄴ. ⓐ는 2이다.\nㄷ. Ⅲ은 P의 세포이다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"2": 0.3, "3": 0.12, "1": 0.15, "5": 0.15, "4": 0.28}, "others": {"Luna": "1", "Terra": "3", "Sol": "5"}, "image": "images/biology-1/page-02.jpg", "page": 2}, {"id": "biology-1:13", "subject": "생명과학Ⅰ", "section": "biology-1", "number": 13, "selected": "5", "answer": "2", "points": "2", "visual": true, "state": {"question": "다음은 민말이집 신경 A와 B의 흥분 전도와 전달에 대한 자료이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, A와 B에서 흥분의 전도는 각각 1회 일어났고, 휴지 전위는 \\(-70\\,\\mathrm{mV}\\)이다.)", "passage": "◦ 그림은 A와 B의 지점 \\(d_1\\sim d_4\\)의 위치를, 표는 ㉠ A와 B의 P에 <u>역치 이상의 자극을 동시에 1회<\/u> 주고 경과된 시간이 \\(3\\,\\mathrm{ms}\\), \\(4\\,\\mathrm{ms}\\), \\(5\\,\\mathrm{ms}\\)일 때 A의 \\(d_1\\sim d_4\\)에서의 막전위를 나타낸 것이다.\n◦ P는 \\(d_1\\sim d_4\\) 중 하나이고, Ⅰ～Ⅳ는 \\(d_1\\sim d_4\\)를 순서 없이, \\(t_1\\sim t_3\\)은 \\(3\\,\\mathrm{ms}\\), \\(4\\,\\mathrm{ms}\\), \\(5\\,\\mathrm{ms}\\)를 순서 없이, ⓐ～ⓓ는 \\(-80\\), \\(-70\\), \\(-60\\), \\(+30\\)을 순서 없이 나타낸 것이다. ㉮와 ㉯ 중 한 곳에만 시냅스가 있다.\n\nA의 막전위(mV)\n| 시간 | Ⅰ | Ⅱ | Ⅲ | Ⅳ |\n|---|---|---|---|---|\n| \\(t_1\\) | ⓐ | ⓑ | ⓑ | ⓒ |\n| \\(t_2\\) | ⓑ | ⓑ | ⓒ | ⓓ |\n| \\(t_3\\) | ⓑ | ⓒ | ⓓ | ⓐ |\n\n◦ A와 B를 구성하는 모든 뉴런의 흥분 전도 속도는 \\(1\\,\\mathrm{cm/ms}\\)로 같고, ㉠이 \\(4\\,\\mathrm{ms}\\)일 때 B의 \\(d_1\\)과 \\(d_4\\)에서의 막전위는 서로 같다.\n◦ A와 B 각각에서 <u>활동 전위가 발생하였을<\/u> 때, 각 지점에서의 막전위 변화는 그림과 같다.\n\n<보기>\nㄱ. P는 \\(d_1\\)이다.\nㄴ. ⓓ는 \\(+30\\)이다.\nㄷ. ㉠이 \\(t_1\\)일 때, B의 Ⅰ에서의 막전위는 \\(-70\\,\\mathrm{mV}\\)이다.", "visual_description": "첫 번째 그림에는 수평으로 놓인 민말이집 신경 A와 B가 위아래로 나란히 그려져 있다. 두 신경의 왼쪽 끝에는 가지가 있는 별 모양 구조가 있고, 오른쪽 끝에도 가지가 있는 종말 모양 구조가 있다. 아래에는 거리 눈금이 있으며 \\(d_1\\)은 \\(0\\,\\mathrm{cm}\\), \\(d_2\\)는 \\(2\\,\\mathrm{cm}\\), \\(d_3\\)는 \\(3\\,\\mathrm{cm}\\), \\(d_4\\)는 \\(6\\,\\mathrm{cm}\\) 위치이다. 각 지점을 지나는 세로 점선이 표시되어 있다. B에는 점선 둥근 사각형으로 표시된 두 후보 위치가 있으며, 왼쪽 후보 ㉮는 \\(d_1\\)과 \\(d_2\\) 사이에서 \\(d_1\\)에 가깝고, 오른쪽 후보 ㉯는 \\(d_3\\)과 \\(d_4\\) 사이에 있다.\n두 번째 그림은 활동 전위가 발생했을 때의 막전위 변화 그래프이다. 세로축은 ‘막전위(mV)’이고 \\(+30\\), \\(0\\), \\(-60\\), \\(-70\\), \\(-80\\)이 표시되어 있다. 가로축은 ‘시간(ms)’이고 \\(0,1,2,3,4\\)가 표시되어 있으며, \\(0\\) 아래에는 ‘자극’과 위쪽 화살표가 있다. 곡선은 처음 \\(-70\\,\\mathrm{mV}\\) 부근에 있다가 약 \\(1\\,\\mathrm{ms}\\) 이후 급격히 상승하여 약 \\(2\\,\\mathrm{ms}\\)에서 \\(+30\\,\\mathrm{mV}\\)에 이르고, 이후 급격히 하강하여 약 \\(3\\,\\mathrm{ms}\\)에서 \\(-70\\,\\mathrm{mV}\\) 아래로 내려간 뒤 약 \\(4\\,\\mathrm{ms}\\)에 \\(-70\\,\\mathrm{mV}\\) 부근으로 돌아온다. \\(+30\\), \\(-60\\), \\(-70\\), \\(-80\\,\\mathrm{mV}\\) 높이에 점선 보조선이 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "probs": {"1": 0.07, "2": 0.31, "3": 0.07, "4": 0.05, "5": 0.5}, "others": {"Luna": "5", "Terra": "2", "Sol": "2"}, "image": "images/biology-1/page-03.jpg", "page": 3}, {"id": "biology-1:16", "subject": "생명과학Ⅰ", "section": "biology-1", "number": 16, "selected": "4", "answer": "1", "points": "2", "visual": false, "state": {"question": "다음은 사람 면역 결핍 바이러스(HIV)의 숙주 세포를 알아보기 위한 실험이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 제시된 조건 이외는 고려하지 않는다.)", "passage": "[실험 과정 및 결과]\n(가) 정상인 Ⅰ과 HIV에 감염된 사람 Ⅱ의 혈액에서 전체 림프구 중 ⓐ <u>세포독성 T 림프구<\/u>의 비율과 전체 림프구 중 ⓑ <u>보조 T 림프구<\/u>의 비율을 확인하고, ⓐ와 ⓑ를 각각 분리하였다.\n(나) (가)에서 분리한 ⓐ와 ⓑ에 각각 HIV를 넣고 일정 시간 동안 배양한 후, ⓐ와 ⓑ에서 HIV의 증식 여부를 확인하였다.\n(다) (가)와 (나)에서 확인한 결과는 표와 같다.\n\n| 구분 | Ⅰ ⓐ | Ⅰ ⓑ | Ⅱ ⓐ | Ⅱ ⓑ |\n|---|---:|---:|---:|---:|\n| 비율(%) | 28 | 48 | 44 | 20 |\n| HIV의 증식 여부 | × | ○ | × | ? |\n\n(○: 증식됨, ×: 증식 안 됨)\n\n<보기>\nㄱ. ⓑ는 HIV의 숙주 세포이다.\nㄴ. (가)에서 \\(\\frac{\\text{전체 림프구 중 ⓑ의 비율}}{\\text{전체 림프구 중 ⓐ의 비율}}\\)은 Ⅰ에서가 Ⅱ에서보다 작다.\nㄷ. ⓑ는 형질 세포로부터 B 림프구로의 분화를 촉진한다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ"], "probs": {"3": 0.0, "4": 0.67, "5": 0.0, "2": 0.04, "1": 0.28}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/biology-1/page-03.jpg", "page": 3}, {"id": "biology-1:17", "subject": "생명과학Ⅰ", "section": "biology-1", "number": 17, "selected": "4", "answer": "2", "points": "3", "visual": false, "state": {"question": "이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 제시된 염색체 비분리 이외의 돌연변이와 교차는 고려하지 않으며, A, a, B, b, D, d 각각의 1개당 DNA 상대량은 1이다.) [3점]", "passage": "다음은 어떤 가족의 유전 형질 (가)～(다)에 대한 자료이다.\n\n◦ (가)～(다)의 유전자 중 2개는 X 염색체에 있고, 나머지 1개는 상염색체에 있다.\n◦ (가)는 대립유전자 A와 a에 의해, (나)는 대립유전자 B와 b에 의해, (다)는 대립유전자 D와 d에 의해 결정된다. A는 a에 대해, B는 b에 대해, D는 d에 대해 각각 완전 우성이다.\n◦ (가)～(다) 중 2개는 우성 형질이고, 나머지 1개는 열성 형질이다.\n◦ 표는 이 가족 구성원의 성별, ㉠～㉢의 발현 여부, 체세포 1개당 b와 d의 DNA 상대량을 나타낸 것이다. ㉠～㉢은 (가)～(다)를 순서 없이 나타낸 것이다.\n\n| 구성원 | 성별 | ㉠ | ㉡ | ㉢ | DNA 상대량 b | DNA 상대량 d |\n|---|---|---|---|---|---:|---:|\n| 아버지 | 남 | × | ○ | × | 1 | ? |\n| 어머니 | 여 | ○ | × | ○ | 1 | ? |\n| 자녀 1 | 남 | ○ | × | ○ | ? | 1 |\n| 자녀 2 | 여 | × | ○ | ○ | ? | ? |\n| 자녀 3 | 남 | ○ | ○ | × | 1 | 1 |\n| 자녀 4 | 남 | × | × | ○ | ? | ? |\n\n(○: 발현됨, ×: 발현 안 됨)\n\n◦ 부모 중 한 명의 생식세포 형성 과정에서 성염색체 비분리가 1회 일어나 염색체 수가 비정상적인 생식세포 G가 형성되었다. G가 정상 생식세포와 수정되어 자녀 4가 태어났으며, 자녀 4는 클라인펠터 증후군의 염색체 이상을 보인다.\n◦ 자녀 4를 제외한 이 가족 구성원의 핵형은 모두 정상이다.\n\n<보기>\nㄱ. (가)의 유전자는 X 염색체에 있다.\nㄴ. G는 감수 1분열에서 염색체 비분리가 일어나 형성된 정자이다.\nㄷ. 자녀 2에게서 a, B, D를 모두 갖는 생식세포가 형성될 수 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "probs": {"4": 0.56, "1": 0.1, "5": 0.1, "3": 0.21, "2": 0.03}, "others": {"Luna": "1", "Terra": "5", "Sol": "2"}, "image": "images/biology-1/page-04.jpg", "page": 4}, {"id": "biology-2:2", "subject": "생명과학Ⅱ", "section": "biology-2", "number": 2, "selected": "5", "answer": "1", "points": "2", "visual": false, "state": {"question": "이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "다음은 동물의 구성 단계에 대한 자료이다. ㉠과 ㉡은 기관과 세포를 순서 없이 나타낸 것이다.\n\n◦ ㉠은 생명체의 구조적, 기능적 기본 단위이다.\n◦ 여러 종류의 <u>ⓐ<\/u> 조직이 모여 ㉡을 이룬다.\n\n<보기>\nㄱ. ㉠은 세포이다.\nㄴ. 적혈구는 ⓐ의 예이다.\nㄷ. ㉡이 모여 조직계를 이룬다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ"], "probs": {"2": 0.02, "5": 0.83, "1": 0.07, "4": 0.06, "3": 0.02}, "others": {"Luna": "5", "Terra": "5", "Sol": "1"}, "image": "images/biology-2/page-01.jpg", "page": 1}, {"id": "biology-2:4", "subject": "생명과학Ⅱ", "section": "biology-2", "number": 4, "selected": "5", "answer": "3", "points": "2", "visual": true, "state": {"question": "이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "그림 (가)와 (나)는 세균과 식물 세포를 순서 없이 나타낸 것이다.\n\n<보기>\nㄱ. (가)는 단백질을 갖는다.\nㄴ. (나)는 핵막을 갖는다.\nㄷ. (가)와 (나)는 모두 유전 물질을 갖는다.", "visual_description": "(가)는 모서리가 둥근 사각형의 두 겹 바깥 경계 안에 여러 구조가 그려진 세포 모식도이다. 내부에는 큰 빈 주머니 모양 구조, 막으로 둘러싸인 큰 원형 구조와 그 안의 작은 진한 원, 여러 겹으로 포개진 납작한 막 구조, 내부 주름이 있는 타원형 구조 여러 개, 작은 점들이 보인다.\n(나)는 둥근 막대 모양 세포의 모식도이다. 바깥 둘레에 짧고 가는 돌기들이 다수 있으며, 한쪽 끝에는 길고 굽은 꼬리 모양 구조가 있다. 내부에는 작은 점들과 꼬여 있는 실 모양 구조가 보인다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"4": 0.21, "1": 0.02, "2": 0.02, "5": 0.44, "3": 0.31}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/biology-2/page-01.jpg", "page": 1}, {"id": "biology-2:5", "subject": "생명과학Ⅱ", "section": "biology-2", "number": 5, "selected": "4", "answer": "1", "points": "2", "visual": true, "state": {"question": "이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "표 (가)는 세포막을 통한 물질 이동 방식의 특징을, (나)는 (가)의 특징 중 이동 방식 Ⅰ과 Ⅱ가 갖는 특징의 개수를 나타낸 것이다. Ⅰ과 Ⅱ는 능동 수송과 촉진 확산을 순서 없이 나타낸 것이다.\n\n(가)\n특징\n• 막단백질을 이용한다.\n• 저농도에서 고농도로 물질이 이동한다.\n• \\(\\mathrm{Na^+-K^+}\\) 펌프를 통해 \\(\\mathrm{Na^+}\\)이 이동하는 방식이다.\n\n(나)\n| 이동 방식 | 특징의 개수 |\n|---|---:|\n| Ⅰ | 3 |\n| Ⅱ | ㉠ |\n\n<보기>\nㄱ. Ⅰ은 능동 수송이다.\nㄴ. ㉠은 2이다.\nㄷ. Ⅱ에 의한 물질의 이동에는 ATP가 사용된다.", "visual_description": "표 (가)는 ‘특징’이라는 머리글 아래에 세 가지 특징을 글머리표로 제시한다. 표 (나)는 ‘이동 방식’과 ‘특징의 개수’라는 두 열로 이루어져 있으며, Ⅰ의 특징 개수는 3, Ⅱ의 특징 개수는 ㉠으로 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ"], "probs": {"5": 0.01, "1": 0.16, "3": 0.01, "2": 0.03, "4": 0.79}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/biology-2/page-01.jpg", "page": 1}, {"id": "biology-2:8", "subject": "생명과학Ⅱ", "section": "biology-2", "number": 8, "selected": "3", "answer": "4", "points": "3", "visual": true, "state": {"question": "이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "표는 생물 A～D에서 4가지 특징의 유무를 나타낸 것이다. A～D는 갯지렁이, 말미잘, 지네, 창고기를 순서 없이 나타낸 것이다.\n\n| 특징 | A | B | C | D |\n|---|:---:|:---:|:---:|:---:|\n| 탈피를 한다. | ? | ? | ? | ○ |\n| 원구가 항문이 된다. | ? | ⓐ | ○ | ? |\n| 몸의 대칭성은 방사 대칭성이다. | ⓑ | × | ? | × |\n| (가) | ○ | ○ | ○ | ○ |\n\n(○: 있음, ×: 없음)\n\n<보기>\nㄱ. ⓐ와 ⓑ는 모두 ‘○’이다.\nㄴ. B와 D에는 모두 체절이 있다.\nㄷ. ‘배엽을 형성한다.’는 (가)에 해당한다.", "visual_description": "행에는 네 가지 특징, 열에는 생물 A, B, C, D가 배치된 표이다. 왼쪽 위 머리글 칸에는 대각선이 그어져 있고 ‘특징’과 ‘생물’이 표시되어 있다. ○는 있음, ×는 없음을 뜻하며 나머지 일부 칸에는 ?, ⓐ, ⓑ가 표시되어 있다. 각 칸의 내용은 본문 표와 같다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"2": 0.04, "1": 0.13, "4": 0.22, "5": 0.05, "3": 0.56}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/biology-2/page-02.jpg", "page": 2}, {"id": "biology-2:12", "subject": "생명과학Ⅱ", "section": "biology-2", "number": 12, "selected": "3", "answer": "5", "points": "3", "visual": true, "state": {"question": "이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 돌연변이는 고려하지 않는다.) [3점]", "passage": "다음은 이중 가닥 DNA X와 mRNA Y에 대한 자료이다.\n\n◦ X는 서로 상보적인 단일 가닥 X₁과 X₂로 구성되어 있다.\n◦ X₁과 X₂ 중 하나로부터 Y가 전사되었다. X의 염기 개수는 100개이고, Y의 염기 개수는 50개이다.\n◦ 표는 Ⅰ과 Ⅱ를 구성하는 염기 수를 나타낸 것이고, Ⅰ과 Ⅱ는 각각 X₁과 X₂ 중 하나이다. ㉠～㉣은 아데닌(A), 사이토신(C), 구아닌(G), 타이민(T)을 순서 없이 나타낸 것이고, ㉢은 퓨린 계열 염기이다.\n\n| 가닥 | 염기 수: ㉠ | 염기 수: ㉡ | 염기 수: ㉢ | 염기 수: ㉣ |\n|---|---:|---:|---:|---:|\n| Ⅰ | 10 | ? | 10 | ? |\n| Ⅱ | 30 | 10 | ? | ? |\n\n◦ G의 개수는 X₂에서가 X₁에서보다 많고, X₂에서 \\(\\dfrac{G+T}{A+C}\\)는 1보다 작다.\n◦ Y에서 ㉡의 개수는 ㉣의 개수보다 많다.\n\n<보기>\nㄱ. ㉡은 아데닌(A)이다.\nㄴ. X에서 염기 간 수소 결합의 총개수는 110개이다.\nㄷ. Y는 X₁로부터 전사되었다.", "visual_description": "가닥 Ⅰ과 Ⅱ의 염기 수를 나타내는 표가 있다. 열 머리글은 ㉠, ㉡, ㉢, ㉣이며, Ⅰ행은 10, ?, 10, ?, Ⅱ행은 30, 10, ?, ?로 표시되어 있다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"1": 0.15, "5": 0.2, "4": 0.22, "2": 0.17, "3": 0.26}, "others": {"Luna": "3", "Terra": "2", "Sol": "5"}, "image": "images/biology-2/page-02.jpg", "page": 2}, {"id": "biology-2:14", "subject": "생명과학Ⅱ", "section": "biology-2", "number": 14, "selected": "5", "answer": "4", "points": "2", "visual": false, "state": {"question": "이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 돌연변이는 고려하지 않는다.)", "passage": "다음은 어떤 세포에서 복제 중인 이중 가닥 DNA에 대한 자료이다.\n\n◦ 이중 가닥 DNA를 구성하는 단일 가닥 Ⅰ과 Ⅱ는 각각 30개의 염기로 구성되고, 서로 상보적이다. Ⅰ의 염기 서열은 다음과 같다. ⓐ와 ⓑ는 각각 5′ 말단과 3′ 말단 중 하나이고, ㉠은 A, C, G, T 중 하나이다.\n\nⓐ-GTC㉠TCTGCT㉠AGCGT㉠CCTAAGTT㉠CATA-ⓑ\n\n◦ Ⅰ을 주형으로 하여 선도 가닥 (가)가 합성되었고, Ⅱ를 주형으로 하여 지연 가닥이 합성되는 과정에서 가닥 (나)와 (다)가 합성되었다. (가)는 30개의 염기로, (나)와 (다)는 각각 15개의 염기로 구성된다.\n◦ (가)는 프라이머 X를, (나)는 프라이머 Y를, (다)는 프라이머 Z를 가지고, X, Y, Z 각각을 구성하는 염기의 개수는 서로 같다.\n◦ X와 Y에서 \\(\\frac{A}{C}\\)는 서로 같다.\n◦ X, Y, Z와 각각의 주형 가닥 사이의 염기 간 수소 결합의 총개수는 각각 12개, 13개, 14개 중 서로 다른 하나이다.\n\n<보 기>\nㄱ. ⓐ는 3′ 말단이다.\nㄴ. ㉠은 사이토신(C)이다.\nㄷ. (나)가 (다)보다 먼저 합성되었다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "probs": {"4": 0.19, "1": 0.18, "2": 0.16, "5": 0.26, "3": 0.21}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/biology-2/page-03.jpg", "page": 3}, {"id": "biology-2:15", "subject": "생명과학Ⅱ", "section": "biology-2", "number": 15, "selected": "5", "answer": "2", "points": "2", "visual": false, "state": {"question": "이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "다음은 동물 종 P의 집단 Ⅰ과 Ⅱ에 대한 자료이다.\n\n◦ Ⅰ과 Ⅱ는 각각 하디ㆍ바인베르크 평형이 유지되는 집단이고, Ⅰ과 Ⅱ를 구성하는 개체 수는 서로 다르다.\n◦ P의 유전 형질 (가)는 상염색체에 있는 대립유전자 A와 A*에 의해 결정되고, (가) 발현 대립유전자는 A와 A* 중 하나이다. A와 A* 사이의 우열 관계는 분명하다.\n◦ Ⅰ에서 유전자형이 ㉠인 개체들을 제외한 나머지 개체들을 합쳐서 구한 A의 빈도는 \\(\\frac{5}{7}\\)이고, Ⅱ에서 유전자형이 ㉡인 개체들을 제외한 나머지 개체들을 합쳐서 구한 A*의 빈도는 \\(\\frac{4}{5}\\)이다. ㉠과 ㉡은 AA*와 A*A*를 순서 없이 나타낸 것이다.\n◦ \\(\\frac{\\text{Ⅰ에서 (가) 발현 대립유전자의 수}}{\\text{Ⅱ에서 유전자형이 ㉡인 개체 수}}=\\frac{3}{5}\\)이다.\n◦ \\(\\frac{\\text{Ⅰ에서 (가)가 발현된 개체 수}}{\\text{Ⅱ에서 (가) 발현 대립유전자의 수}}=\\frac{1}{25}\\)이다.\n\n<보 기>\nㄱ. Ⅰ의 개체 수는 Ⅱ의 개체 수의 3배이다.\nㄴ. (가) 발현 대립유전자는 A*이다.\nㄷ. 유전자형이 AA*인 개체에서 (가)가 발현된다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ"], "probs": {"5": 0.25, "3": 0.13, "1": 0.19, "4": 0.2, "2": 0.23}, "others": {"Luna": "5", "Terra": "2", "Sol": "2"}, "image": "images/biology-2/page-03.jpg", "page": 3}, {"id": "biology-2:16", "subject": "생명과학Ⅱ", "section": "biology-2", "number": 16, "selected": "2", "answer": "5", "points": "3", "visual": true, "state": {"question": "이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 제시된 조건 이외는 고려하지 않는다.) [3점]", "passage": "다음은 효모의 알코올 발효에 대한 실험이다.\n\n[실험 과정 및 결과]\n(가) 포도당이 포함된 배양액에 효모를 넣고 밀폐시킨 후, O₂가 없는 조건에서 배양한다.\n(나) 시간에 따른 배양액 내 효모의 수와 물질 ㉠과 ㉡의 농도를 측정한 결과는 그림과 같다. ㉠과 ㉡은 각각 에탄올과 포도당 중 하나이다.\n\n<보 기>\nㄱ. ㉠은 포도당이다.\nㄴ. 구간 Ⅰ에서 아세트알데하이드가 환원된다.\nㄷ. 단위 시간당 생성되는 CO₂의 양은 구간 Ⅰ에서가 구간 Ⅱ에서보다 많다.", "visual_description": "그래프의 가로축은 ‘시간’이며 오른쪽으로 증가한다. 왼쪽 세로축은 ‘효모의 수’이고 위쪽 화살표가 있으며, 오른쪽 세로축은 ‘농도(상댓값)’이고 위쪽 화살표가 있다. 원점에는 양쪽 모두 0이 표시되어 있다. 점선 곡선 하나는 왼쪽의 낮은 값에서 시작해 증가한 뒤 높은 값에서 거의 수평이 되며, 그 끝부분에 ‘효모’가 표시되어 있다. 실선 곡선 하나는 왼쪽의 낮은 값에서 시작해 증가한 뒤 중간 높이에서 완만해지며, 오른쪽 끝에 ‘㉠’이 표시되어 있다. 다른 점선 곡선 하나는 왼쪽의 높은 값에서 시작해 감소하여 가로축 가까이에서 거의 수평이 되며, 오른쪽 끝에 ‘㉡’이 표시되어 있다. 그래프의 앞부분에 세로로 좁은 회색 구간 Ⅰ이 있고, 뒷부분에 세로로 좁은 회색 구간 Ⅱ가 있다. 각 회색 구간 위에는 해당 구간의 양 끝을 나타내는 양방향 화살표가 있다. 구간 Ⅰ에서 효모의 수를 나타내는 점선 곡선과 ㉠을 나타내는 실선 곡선은 증가하고, ㉡을 나타내는 점선 곡선은 감소한다. 구간 Ⅱ에서 세 곡선은 모두 거의 수평이다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "probs": {"2": 0.65, "5": 0.28, "1": 0.02, "3": 0.03, "4": 0.01}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/biology-2/page-03.jpg", "page": 3}, {"id": "biology-2:18", "subject": "생명과학Ⅱ", "section": "biology-2", "number": 18, "selected": "2", "answer": "1", "points": "3", "visual": true, "state": {"question": "다음은 어떤 진핵생물의 유전자 x와 돌연변이 유전자 y, z의 발현에 대한 자료이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 제시된 돌연변이 이외의 핵산 염기 서열 변화는 고려하지 않는다.) [3점]", "passage": "◦ x, y, z로부터 각각 폴리펩타이드 X, Y, Z가 합성된다.\n◦ x의 DNA 이중 가닥 중 한 가닥의 염기 서열은 다음과 같다. (가)는 8개의 염기로, (나)는 6개의 염기로 구성된다.\n\n5′-ATCAT　(가)　T　(나)　ATC-3′\n\n◦ 표는 X, Y, Z를 구성하는 모든 아미노산과 각 아미노산의 수를 나타낸 것이다. ⓐ와 ⓑ는 1과 2를 순서 없이 나타낸 것이다.\n\n구분 | 라이신 | 류신 | 메싸이오닌 | 발린 | 아르지닌\nX | 2 | 0 | 2 | 1 | 1\nY | 1 | ⓐ | 1 | 0 | 0\nZ | ⓑ | 1 | ? | 1 | ?\n\n◦ y는 x의 전사 주형 가닥에서 1개의 사이토신(C)이 1회 결실된 것이다.\n◦ z는 y의 전사 주형 가닥에서 연속된 2개의 동일한 염기가 1회 결실된 것이다.\n◦ X, Y, Z의 합성은 개시 코돈 AUG에서 시작하여 종결 코돈에서 끝나며, 표는 유전부호를 나타낸 것이다.\n\n[유전부호 표]\nUUU, UUC: 페닐알라닌\nUUA, UUG, CUU, CUC, CUA, CUG: 류신\nAUU, AUC, AUA: 아이소류신\nAUG: 메싸이오닌\nGUU, GUC, GUA, GUG: 발린\nUCU, UCC, UCA, UCG, AGU, AGC: 세린\nCCU, CCC, CCA, CCG: 프롤린\nACU, ACC, ACA, ACG: 트레오닌\nGCU, GCC, GCA, GCG: 알라닌\nUAU, UAC: 타이로신\nUAA, UAG, UGA: 종결 코돈\nCAU, CAC: 히스티딘\nCAA, CAG: 글루타민\nAAU, AAC: 아스파라진\nAAA, AAG: 라이신\nGAU, GAC: 아스파트산\nGAA, GAG: 글루탐산\nUGU, UGC: 시스테인\nUGG: 트립토판\nCGU, CGC, CGA, CGG, AGA, AGG: 아르지닌\nGGU, GGC, GGA, GGG: 글리신\n\n<보기>\nㄱ. X에 있는 2개의 라이신을 암호화하는 각 코돈의 염기 서열은 서로 같다.\nㄴ. Y가 합성될 때 사용된 종결 코돈은 UAA이다.\nㄷ. Z는 1개의 메싸이오닌을 가진다.", "visual_description": "DNA 한 가닥의 염기 서열에서 (가)와 (나)가 빈 직사각형 칸으로 표시되어 있으며, X, Y, Z의 아미노산 수 표와 표준 유전부호표가 함께 제시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ"], "probs": {"2": 0.32, "3": 0.24, "1": 0.09, "4": 0.15, "5": 0.2}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/biology-2/page-04.jpg", "page": 4}, {"id": "biology-2:19", "subject": "생명과학Ⅱ", "section": "biology-2", "number": 19, "selected": "5", "answer": "3", "points": "2", "visual": true, "state": {"question": "표 (가)는 진화의 요인의 특징을, (나)는 (가)의 특징 중 진화의 요인 ㉠～㉢이 갖는 특징의 개수를 나타낸 것이다. ㉠～㉢은 돌연변이, 병목 효과, 창시자 효과를 순서 없이 나타낸 것이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "(가)\n특징\n∙ 유전적 부동의 한 현상이다.\n∙ 원래의 집단에서 적은 수의 개체가 다른 지역으로 이주하여 새로운 집단을 형성할 때 나타나는 현상이다.\n∙ ⓐ\n\n(나)\n진화의 요인 | 특징의 개수\n㉠ | 0\n㉡ | 1\n㉢ | 2\n\n<보기>\nㄱ. ㉠은 돌연변이이다.\nㄴ. 자연재해에 의해 집단의 크기가 급격히 감소할 때 대립 유전자의 빈도가 달라지는 현상은 ㉡에 해당한다.\nㄷ. ‘유전자풀의 변화 요인이다.’는 ⓐ에 해당한다.", "visual_description": "왼쪽 표 (가)에는 세 가지 특징이 글머리표로 나열되어 있고, 세 번째 특징은 빈 칸 ⓐ로 표시되어 있다. 오른쪽 표 (나)에는 진화의 요인 ㉠, ㉡, ㉢과 특징의 개수 0, 1, 2가 각각 대응되어 있다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"1": 0.24, "5": 0.32, "4": 0.13, "2": 0.12, "3": 0.19}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/biology-2/page-04.jpg", "page": 4}, {"id": "biology-2:20", "subject": "생명과학Ⅱ", "section": "biology-2", "number": 20, "selected": "5", "answer": "2", "points": "3", "visual": true, "state": {"question": "다음은 이중 가닥 DNA x와 제한 효소에 대한 자료이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "◦ x는 40개의 염기쌍으로 이루어져 있고, x 중 한 가닥의 염기 서열은 다음과 같다. (가)는 10개의 염기로, (나)는 6개의 염기로, (다)는 10개의 염기로 구성되어 있다.\n\n5′-AGGCG　(가)　CG　(나)　CG　(다)　GGTGG-3′\n\n◦ 그림은 제한 효소 PvuⅠ, SacⅠ, XhoⅠ, XmaⅠ이 인식하는 염기 서열과 절단 위치를 나타낸 것이다.\n\nPvuⅠ:\n5′-CGAT↓CG-3′\n3′-GCTA↑GC-5′\n\nSacⅠ:\n5′-GAGCT↓C-3′\n3′-C↑TCGAG-5′\n\nXhoⅠ:\n5′-C↓TCGAG-3′\n3′-GAGCT↑C-5′\n\nXmaⅠ:\n5′-C↓CCGGG-3′\n3′-GGGCC↑C-5′\n\n(↓, ↑: 절단 위치)\n\n◦ x를 시험관 Ⅰ～Ⅴ에 넣고 제한 효소를 첨가하여 완전히 자른 결과 생성된 DNA 조각 수와 각 DNA 조각의 염기 수는 표와 같다. ⓐ～ⓓ는 PvuⅠ, SacⅠ, XhoⅠ, XmaⅠ을 순서 없이 나타낸 것이고, Ⅴ에 첨가한 제한 효소는 ⓐ～ⓓ 중 2가지이다.\n\n시험관 | Ⅰ | Ⅱ | Ⅲ | Ⅳ | Ⅴ\n첨가한 제한 효소 | ⓐ | ⓑ | ⓒ | ⓓ | ?\n생성된 DNA 조각 수 | 2 | 2 | 3 | 3 | 4\n생성된 각 DNA 조각의 염기 수 | 28, 52 | 32, 48 | 12, 16, 52 | 20, 22, 38 | 12, 16, 20, 32\n\n<보기>\nㄱ. (나)의 5′ 말단 염기는 구아닌(G)이다.\nㄴ. Ⅴ에 첨가한 제한 효소는 XhoⅠ과 XmaⅠ이다.\nㄷ. Ⅳ에서 생성된 DNA 조각 중 염기 개수가 20개인 조각에서 사이토신(C)의 개수는 7개이다.", "visual_description": "DNA x의 한 가닥 염기 서열에서 (가), (나), (다)가 각각 빈 직사각형 칸으로 표시되어 있다. 네 제한 효소 각각에 대해 두 상보 가닥의 인식 서열과 엇갈리거나 마주 보는 절단 위치가 점선으로 표시되어 있으며, 시험관별 제한 효소, 생성된 DNA 조각 수, 각 조각의 염기 수를 나타낸 표가 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ"], "probs": {"1": 0.16, "2": 0.16, "3": 0.15, "4": 0.18, "5": 0.35}, "others": {"Luna": "5", "Terra": "5", "Sol": "4"}, "image": "images/biology-2/page-04.jpg", "page": 4}, {"id": "chemistry-1:3", "subject": "화학Ⅰ", "section": "chemistry-1", "number": 3, "selected": "1", "answer": "3", "points": "2", "visual": true, "state": {"question": "그림은 이온 \\(\\ma nts": "3", "visual": true, "state": {"question": "다음은 \\(\\mathrm{A}(g)\\)로부터 \\(\\mathrm{B}(g)\\)가 생성되는 반응의 화학 반응식과 활성화 에너지(\\(E_a\\))이다.\n\n\\[\\mathrm{A}(g)\\rightarrow \\mathrm{B}(g)\\qquad E_a\\]\n\n그림은 온도 \\(T_1\\)과 \\(T_2\\)에서 \\(\\mathrm{A}(g)\\)의 분자 운동 에너지 분포를 각각 나타낸 것이고, 표는 3개의 동일한 강철 용기에 \\(\\mathrm{A}(g)\\) 1 mol을 각각 넣고 반응시킨 실험 (가)～(다)에 대한 자료이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 촉매의 부피는 무시한다.) [3점]", "passage": "그림: 가로축은 ‘운동 에너지’, 세로축은 ‘\\(\\mathrm{A}(g)\\)의 분자수(상댓값)’이다. 원점에 0이 표시되어 있고, 가로축의 한 눈금에 \\(a\\)가 표시되어 있다. 두 곡선은 원점에서 시작해 봉우리를 지난 뒤 가로축 쪽으로 낮아진다. \\(T_1\\) 곡선은 왼쪽에 있고 더 높고 좁은 봉우리를 가지며, \\(T_2\\) 곡선은 오른쪽에 있고 더 낮고 넓은 봉우리를 가진다.\n\n| 실험 | 첨가한 촉매 | 온도 | \\(E_a\\) |\n|---|---|---|---|\n| (가) | 부촉매 | \\(T_1\\) | \\(x\\) |\n| (나) | 없음 | \\(T_1\\) | \\(a\\) |\n| (다) | 없음 | \\(T_2\\) | \\(a\\) |\n\n<보기>\nㄱ. \\(T_1>T_2\\)이다.\nㄴ. \\(x>a\\)이다.\nㄷ. 초기 반응 속도는 (다) > (나) > (가)이다.", "visual_description": "분자 운동 에너지 분포를 나타낸 좌표 그래프와 실험 (가)～(다)의 촉매, 온도, 활성화 에너지를 정리한 표가 함께 제시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"4": 0.32, "5": 0.05, "1": 0.16, "3": 0.08, "2": 0.39}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/chemistry-2/page-01.jpg", "page": 1}, {"id": "chemistry-2:7", "subject": "화학Ⅱ", "section": "chemistry-2", "number": 7, "selected": "2", "answer": "4", "points": "3", "visual": true, "state": {"question": "\\(a\\)의 부호(㉠)와 \\(P\\)의 크기(㉡)로 옳은 것은? (단, 외부 압력은 \\(1\\,\\mathrm{atm}\\)으로 일정하고, 피스톤의 질량과 마찰은 무시한다.) [3점]", "passage": "다음은 온도 \\(T\\)에서 \\(\\mathrm{A}(g)\\)가 반응하여 \\(\\mathrm{B}(g)\\)와 \\(\\mathrm{C}(g)\\)를 생성하는 반응의 열화학 반응식이다.\n\n\\[\n2\\mathrm{A}(g)\\rightleftharpoons \\mathrm{B}(g)+\\mathrm{C}(g)\\qquad \\Delta H=a\\,\\mathrm{kJ}\n\\]\n\n그림 (가)는 실린더에 \\(\\mathrm{A}(g)\\)가 들어 있는 초기 상태를, (나)는 (가)에서 반응이 진행될 때 반응 시간에 따른 실린더 속 기체의 부피를 나타낸 것이다. 시간 \\(t\\)에서 평형에 도달했을 때, \\(\\mathrm{A}(g)\\)의 몰 분율은 0.2이고 \\(\\mathrm{B}(g)\\)의 부분 압력은 \\(P\\,\\mathrm{atm}\\)이다. 실린더 안과 밖의 열 출입은 없다.", "visual_description": "(가)는 세로형 실린더와 움직이는 수평 피스톤을 나타낸다. 피스톤 위에는 ‘1 atm’이 표시되어 있고, 피스톤 아래에는 ‘A(g)’, ‘T, 1 L’가 표시되어 있다. (나)는 반응 시간에 따른 실린더 속 기체의 부피 그래프이다. 가로축은 ‘반응 시간’, 세로축은 ‘실린더 속 기체의 부피(L)’이다. 곡선은 시간 0에서 부피 1로 시작하여 처음에는 빠르게 증가하고 점차 완만해져 수평한 일정값에 도달한다. 평형에 도달한 수평 부분의 한 지점에서 가로축의 \\(t\\)까지 세로 점선이 그어져 있다."}, "options": ["㉠ \\(+\\), ㉡ \\(P=0.4\\)", "㉠ \\(+\\), ㉡ \\(P<0.4\\)", "㉠ \\(-\\), ㉡ \\(P>0.4\\)", "㉠ \\(-\\), ㉡ \\(P=0.4\\)", "㉠ \\(-\\), ㉡ \\(P<0.4\\)"], "probs": {"2": 0.41, "1": 0.36, "4": 0.03, "5": 0.11, "3": 0.09}, "others": {"Luna": "1", "Terra": "4", "Sol": "4"}, "image": "images/chemistry-2/page-02.jpg", "page": 2}, {"id": "chemistry-2:9", "subject": "화학Ⅱ", "section": "chemistry-2", "number": 9, "selected": "4", "answer": "3", "points": "3", "visual": false, "state": {"question": "액체 상태의 (가)～(라)에 대한 설명으로 <u>옳은 것만<\/u>을 <보기>에서 있는 대로 고른 것은? (단, X와 Y는 임의의 원소 기호이다.) [3점]", "passage": "표는 2주기 14～17족 원소 X와 Y의 수소 화합물 (가)～(라)의 기준 끓는점에 대한 자료이다. (가)와 (나)는 각각 \\(\\mathrm{XH}_m\\)과 \\(\\mathrm{YH}_n\\) 중 하나이고, (다)와 (라)는 각각 \\(\\mathrm{X}_2\\mathrm{H}_{2m-2}\\)와 \\(\\mathrm{Y}_2\\mathrm{H}_{2n-2}\\) 중 하나이다.\n\n| 수소 화합물 | (가) | (나) | (다) | (라) |\n|---|---:|---:|---:|---:|\n| 기준 끓는점(℃) | −162 | −33 | 114 | −89 |\n\n<보기>\nㄱ. 분자 사이에 수소 결합이 존재하는 물질은 2가지이다.\nㄴ. 분자 사이의 쌍극자·쌍극자 힘은 (나)가 (가)보다 크다.\nㄷ. (나)와 (라)를 각각 구성하는 원소의 종류는 같다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"1": 0.08, "3": 0.24, "5": 0.13, "2": 0.18, "4": 0.37}, "others": {"Luna": "1", "Terra": "3", "Sol": "3"}, "image": "images/chemistry-2/page-02.jpg", "page": 2}, {"id": "chemistry-2:10", "subject": "화학Ⅱ", "section": "chemistry-2", "number": 10, "selected": "3", "answer": "5", "points": "3", "visual": true, "state": {"question": "이에 대한 설명으로 <u>옳은 것만<\/u>을 <보기>에서 있는 대로 고른 것은? (단, \\(\\mathrm{N}_2\\), \\(\\mathrm{O}_2\\), \\(\\mathrm{CO}_2\\)의 분자량은 각각 28, 32, 44이고, 기체 상수는 \\(0.08\\,\\mathrm{atm\\cdot L/(mol\\cdot K)}\\)이며, 모든 기체는 반응하지 않는다.) [3점]", "passage": "그림 (가)는 \\(\\mathrm{N}_2(g)\\)와 \\(\\mathrm{O}_2(g)\\)의
