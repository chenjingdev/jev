\\;V_1\\,\\mathrm{L}\\)’와 ‘\\(\\chi_{\\mathrm{SO_3}}=0.5\\)’가 표시되어 있다.\n\n(나)는 위쪽에 움직이는 수평 피스톤이 있는 직사각형 실린더이다. 피스톤 위에는 ‘\\(1\\,\\mathrm{atm}\\)’이 표시되어 있고, 피스톤을 가리키는 선과 ‘피스톤’이라는 글자가 있다. 피스톤 아래 기체 공간에는 ‘\\(T_1\\,\\mathrm{K},\\;V_2\\,\\mathrm{L}\\)’와 ‘\\(P_{\\mathrm{SO_3}}=0.4\\,\\mathrm{atm}\\)’이 표시되어 있다.\n\n(나)와 (다) 사이에는 오른쪽 방향 화살표가 있으며 화살표 왼쪽에 위에서부터 ‘압력 변화’, ‘온도 변화’가 적혀 있다.\n\n(다)는 (나)보다 가로 폭이 짧은 직사각형 실린더이며, 수평 피스톤은 (나)의 피스톤보다 낮은 위치에 그려져 있어 피스톤 아래 기체 공간이 줄어든 모습이다. 피스톤 위에 작은 추가 놓여 있고, 추를 가리키는 선과 ‘추’라는 글자가 있다. 피스톤 아래 기체 공간에는 ‘\\(T_2\\,\\mathrm{K}\\)’와 ‘\\(P_{\\mathrm{SO_3}}=0.4\\,\\mathrm{atm}\\)’이 표시되어 있다."}, "options": ["㉠ \\(3V_1<V_2\\), ㉡ \\(T_1<T_2\\)", "㉠ \\(3V_1<V_2\\), ㉡ \\(T_1>T_2\\)", "㉠ \\(3V_1=V_2\\), ㉡ \\(T_1<T_2\\)", "㉠ \\(3V_1>V_2\\), ㉡ \\(T_1<T_2\\)", "㉠ \\(3V_1>V_2\\), ㉡ \\(T_1>T_2\\)"], "probs": {"1": 0.43, "3": 0.03, "4": 0.22, "5": 0.12, "2": 0.2}, "others": {"Luna": "1", "Terra": "4", "Sol": "4"}, "image": "images/chemistry-2/page-04.jpg", "page": 4}, {"id": "chinese-1:1", "subject": "중국어Ⅰ", "section": "chinese-1", "number": 1, "selected": "2", "answer": "1", "points": "1", "visual": true, "state": {"question": "그림의 발음 기호 중 두 개를 조합하여 만들 수 있는 발음에 해당하는 글자는? [1점]", "passage": "도시 건물과 불꽃이 있는 그림 위에 발음 기호 ‘l’, ‘j’, ‘iǔ’, ‘iàn’이 각각 표시되어 있다.", "visual_description": "도시의 여러 고층 건물과 밤하늘의 불꽃을 배경으로 네 개의 발음 기호가 배치되어 있다. ‘l’은 왼쪽 위, ‘j’는 가운데 왼쪽, ‘iǔ’는 가운데 오른쪽, ‘iàn’은 오른쪽 위에 있다."}, "options": ["九", "亮", "球", "寄", "甜"], "probs": {"4": 0.08, "3": 0.13, "2": 0.55, "5": 0.07, "1": 0.17}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/chinese-1/page-01.jpg", "page": 1}, {"id": "chinese-1:2", "subject": "중국어Ⅰ", "section": "chinese-1", "number": 2, "selected": "2", "answer": "3", "points": "2", "visual": false, "state": {"question": "밑줄 친 부분과 성조 배열이 같은 것만을 <보기>에서 고른 것은?", "passage": "我们是<u>高中<\/u>同学。\n\n<보기>\na. 弟弟　　b. 今天　　c. 飞机　　d. 马上"}, "options": ["a, b", "a, d", "b, c", "b, d", "c, d"], "probs": {"2": 0.26, "1": 0.21, "4": 0.21, "5": 0.14, "3": 0.18}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/chinese-1/page-01.jpg", "page": 1}, {"id": "chinese-1:5", "subject": "중국어Ⅰ", "section": "chinese-1", "number": 5, "selected": "4", "answer": "1", "points": "2", "visual": false, "state": {"question": "빈칸 (a), (b)에 들어갈 말로 알맞은 것은?", "passage": "◦ 这 (a) 都让我很难忘记。\n◦ 我向同学们 (b) 下星期的安排。"}, "options": ["(a) 一切　(b) 说明", "(a) 所有　(b) 说明", "(a) 全部　(b) 告诉", "(a) 一切　(b) 告诉", "(a) 所有　(b) 告诉"], "probs": {"2": 0.03, "1": 0.18, "4": 0.47, "3": 0.16, "5": 0.16}, "others": {"Luna": "2", "Terra": "1", "Sol": "1"}, "image": "images/chinese-1/page-01.jpg", "page": 1}, {"id": "chinese-1:28", "subject": "중국어Ⅰ", "section": "chinese-1", "number": 28, "selected": "5", "answer": "2", "points": "2", "visual": false, "state": {"question": "문장 표현이 옳은 것만을 고른 것은?", "passage": "a. 这个苹果红红的，香香的。\nb. 我很喜欢吃不甜甜的面包。\nc. 她把礼物包得美美丽丽的。\nd. 他开开心心地玩儿着游戏。"}, "options": ["a, b", "a, d", "b, c", "b, d", "c, d"], "probs": {"4": 0.0, "3": 0.01, "2": 0.4, "5": 0.57, "1": 0.02}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/chinese-1/page-04.jpg", "page": 4}, {"id": "chinese-1:29", "subject": "중국어Ⅰ", "section": "chinese-1", "number": 29, "selected": "1", "answer": "5", "points": "2", "visual": false, "state": {"question": "문장 표현이 옳은 것은?", "passage": ""}, "options": ["今年比去年没那么热。", "我比足球更喜欢篮球。", "他的身体比以前好得很。", "姐姐没有弟弟还爱画画儿。", "这双鞋比那双贵不了几块钱。"], "probs": {"3": 0.13, "4": 0.06, "5": 0.24, "2": 0.2, "1": 0.37}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/chinese-1/page-04.jpg", "page": 4}, {"id": "commerce-economics:18", "subject": "상업 경제", "section": "commerce-economics", "number": 18, "selected": "3", "answer": "5", "points": "3", "visual": true, "state": {"question": "다음은 A 국의 수입 및 A～D 국의 경제 통합 상황을 나타낸 것이다. 이에 대한 설명으로 적절한 것만을 <보기>에서 고른 것은? (단, 경제 통합 형태는 B. Balassa의 분류에 따른다.) [3점]", "passage": "A 국은 B～D 국 중 수입 가격이 가장 낮은 국가로부터 세탁기를 수입하고 있음.\n\n교역 상대 | 수입 단가\nB 국 | US $ 950\nC 국 | US $ 930\nD 국 | US $ 900\n\n※ 수입 가격 = 수입 단가 + 수입 관세\n   수입 관세 = 수입 단가 × 수입 관세율\n※ 변경 전·후 수입 단가는 변화 없음.\n\n[변경 전]\n- A 국은 B 국과 FTA 협정을 체결·발효 즉시 수입 관세 철폐, C 국과 D 국은 관세동맹을 체결·발효\n- A 국은 수입 관세율을 C 국과 D 국에 대해 6% 적용\n\n[변경 전 도식]\n점선 테두리로 표시된 ‘FTA’ 영역 안에 B 국과 A 국이 있다. 별도의 점선 테두리로 표시된 ‘관세동맹’ 영역 안에 C 국과 D 국이 있다. C 국에서 A 국으로 향하는 화살표와 D 국에서 A 국으로 향하는 화살표에 각각 ‘6%’가 표시되어 있다.\n\n[변경 후]\n- A 국은 B 국과의 FTA 협정을 폐기, C 국과 D 국은 경제동맹을 체결·발효\n- A 국은 수입 관세율을 B 국에 대해 10%, C 국과 D 국에 대해 15% 적용\n\n[변경 후 도식]\nB 국, A 국, 그리고 점선 테두리로 표시된 ‘경제동맹’ 영역 안의 C 국과 D 국이 배치되어 있다. B 국에서 A 국으로 향하는 화살표에 ‘10%’가 표시되어 있고, C 국에서 A 국으로 향하는 화살표와 D 국에서 A 국으로 향하는 화살표에 각각 ‘15%’가 표시되어 있다.\n\n<보 기>\nㄱ. [변경 전] A 국과 B 국은 역외 공동 관세를 부과하고, C 국과 D 국은 역내 생산 요소의 이동이 자유롭다.\nㄴ. [변경 전] A 국이 세탁기 10대를 수입할 때, A 국의 관세 수입은 US $ 540이다.\nㄷ. [변경 후] C 국과 D 국은 공동 경제 정책을 수행할 것이다.\nㄹ. A 국이 세탁기를 수입하는 국가는 [변경 전] B 국에서 [변경 후] D 국으로 바뀔 것이다.", "visual_description": "상단에는 교역 상대와 수입 단가를 나타낸 2열 표가 있으며, 오른쪽에는 수입 가격과 수입 관세의 계산식이 제시되어 있다. 하단에는 [변경 전]과 [변경 후]를 좌우로 나란히 비교하는 두 개의 상자가 있다. 각 상자에는 경제 통합 상황에 관한 글과 국가 간 관계를 원, 점선 경계, 화살표 및 관세율로 나타낸 도식이 포함되어 있다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"5": 0.25, "2": 0.02, "4": 0.11, "1": 0.01, "3": 0.61}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/commerce-economics/page-04.jpg", "page": 4}, {"id": "commerce-economics:19", "subject": "상업 경제", "section": "commerce-economics", "number": 19, "selected": "5", "answer": "4", "points": "3", "visual": true, "state": {"question": "다음은 A～C 국의 [1월 경상수지]와 [2월 대외 거래]이다. 1월 대비 [2월 대외 거래]를 반영한 A～C 국의 1～2월 누적 경상수지에 대한 설명으로 옳은 것은? (단, 국제 거래는 A～C 국 사이에서만 이루어지며, 제시된 자료 외에는 고려하지 않는다.) [3점]", "passage": "[1월 경상수지] (단위: 억 달러)\n\n구분 | A 국 | B 국 | C 국\n상품수지 | ×× | -10 | 20\n서비스수지 | -5 | ×× | 15\n본원소득수지 | 5 | 20 | ××\n이전소득수지 | -1 | 4 | -3\n\n[2월 대외 거래]\n- A 국이 B 국에 상품 수입 대금 5억 달러 지급\n- A 국이 자국에서 일하고 있는 C 국 국적의 6개월 미만 거주 근로자에게 임금 3억 달러 지급\n- B 국이 C 국에 건설 공사비 2억 달러, 기부금 1억 달러 지급\n- C 국이 B 국의 선박 회사를 통해 A 국으로 상품을 수출하여 대금 10억 달러를 수취하고, B 국에 운송비 2억 달러 지급", "visual_description": "테두리가 있는 자료 상자 안에 [1월 경상수지] 표와 [2월 대외 거래] 목록이 위아래로 배치되어 있다. 표에서 ‘××’는 A 국 상품수지, B 국 서비스수지, C 국 본원소득수지 칸에 각각 표시되어 있다."}, "options": ["A 국의 상품수지는 적자 폭이 축소되었다.", "B 국의 이전소득수지는 흑자 폭이 확대되었다.", "C 국의 본원소득수지는 적자 폭이 확대되었다.", "B 국과 C 국의 서비스수지는 변동이 없다.", "A～C 국 중 경상수지 흑자 폭이 확대된 국가는 A 국과 C 국이다."], "probs": {"4": 0.07, "1": 0.14, "5": 0.39999999999999997, "2": 0.26, "3": 0.13}, "others": {"Luna": "3", "Terra": "4", "Sol": "4"}, "image": "images/commerce-economics/page-04.jpg", "page": 4}, {"id": "earth-science-1:2", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 2, "selected": "3", "answer": "4", "points": "2", "visual": true, "state": {"question": "그림은 어느 뇌우의 생성과 소멸 과정에서 나타나는 공기의 흐름을 나타낸 것이다. (가), (나), (다)는 성숙 단계, 소멸 단계, 적운 단계를 순서 없이 나타낸 것이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "<보기>\nㄱ. (가)는 적운 단계이다.\nㄴ. 번개 발생 빈도는 대체로 (가)가 (나)보다 낮다.\nㄷ. 강수량은 (나)가 (다)보다 많다.", "visual_description": "세 개의 세로 단면 그림이 왼쪽부터 (가), (나), (다)로 배열되어 있다. 각 그림의 아래에는 회색 지면이 있고, 세로축은 높이(km)이며 0, 4, 8, 12가 표시되어 있다. 각 그림에는 약 6 km 높이를 지나는 점선이 있고 그 오른쪽에 ‘0°C’가 표시되어 있다. (가)에서는 지면 부근의 양쪽에서 중심으로 모여드는 화살표와 중심부에서 아래쪽으로 향하는 여러 화살표가 나타나며, 위쪽에서도 주로 아래로 향하는 화살표들이 있다. (나)에서는 지면 부근에서 중심으로 모여 위로 향하는 화살표들과 중심부에서 아래로 향하는 화살표들이 함께 나타나고, 상층에서는 위로 올라간 뒤 양쪽 바깥으로 퍼지는 화살표들이 나타난다. (다)에서는 지면 부근의 양쪽에서 중심으로 모인 공기가 중심을 따라 위로 향하며, 약 6 km 높이까지 상승하는 화살표들만 나타난다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"2": 0.17, "3": 0.24, "4": 0.19, "5": 0.21, "1": 0.19}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/earth-science-1/page-01.jpg", "page": 1}, {"id": "earth-science-1:3", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 3, "selected": "5", "answer": "4", "points": "3", "visual": true, "state": {"question": "그림은 위도에 따른 연평균 강수량과 증발량을 순서 없이 나타낸 것이다.\n\n이 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "<보기>\nㄱ. (증발량 - 강수량) 값은 A가 B보다 작다.\nㄴ. A의 해역에 남극 순환류가 흐른다.\nㄷ. C에서는 대기 대순환의 직접 순환이 나타난다.", "visual_description": "가로축은 위도이며 왼쪽부터 60°S, 30°, 0°, 30°, 60°N이 표시되어 있다. 세로축은 왼쪽이 강수량(cm/년), 오른쪽이 증발량(cm/년)이며 양쪽 모두 0, 100, 200 눈금이 있다. 실선과 점선으로 된 두 곡선이 그려져 있다. 실선은 60°S 부근에서 약 40으로 시작해 남반구 중위도에서 약 100까지 높아졌다가 30°S 부근에서 약 75로 낮아지고, 적도 부근에서 약 190까지 크게 높아진다. 이후 북반구 저위도에서 약 90까지 낮아진 뒤 북반구 중위도에서 약 100 안팎으로 조금 높아지고, 60°N 부근에서 약 60으로 낮아진다. 점선은 60°S 부근의 약 10에서 시작해 30°S 방향으로 증가하고, 남반구 저위도에서 약 150까지 높아졌다가 적도 부근에서 약 120으로 낮아진다. 이후 북반구 저위도에서 약 160까지 높아진 뒤 고위도로 갈수록 낮아져 60°N 부근에서 약 30이 된다. 세로로 음영 처리된 좁은 띠 A는 약 50°S 부근, B는 약 30°S 부근, C는 약 30°N 부근에 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ"], "probs": {"5": 0.29, "3": 0.11, "1": 0.29, "4": 0.24, "2": 0.07}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/earth-science-1/page-01.jpg", "page": 1}, {"id": "earth-science-1:4", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 4, "selected": "4", "answer": "5", "points": "2", "visual": true, "state": {"question": "다음은 어느 지질 구조의 형성 과정을 알아보기 위한 탐구이다.\n\n이 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "[탐구 목표]\n◦ (     ㉠     )의 형성 과정을 설명할 수 있다.\n\n[탐구 과정]\n(가) Ⅰ과 같이 지점토 판 세 개를 수평으로 쌓는다.\n(나) Ⅱ와 같이 중심부가 위로 볼록하게 구부러지도록 변형시킨다.\n(다) Ⅲ과 같이 구부러진 지점토 판의 위쪽을 지점토 칼로 수평으로 자른다.\n(라) 잘린 지점토 판 위에 Ⅳ와 같이 새로운 지점토 판을 수평으로 쌓는다.\n\n<보기>\nㄱ. ‘경사 부정합’은 ㉠에 해당한다.\nㄴ. Ⅱ에서 배사 구조의 형태가 나타난다.\nㄷ. (다)는 지층의 침식 과정에 해당한다.", "visual_description": "탐구 과정 아래에 Ⅰ→Ⅱ→Ⅲ→Ⅳ 순서의 그림이 있다. Ⅰ은 서로 다른 명암의 직사각형 지점토 판 세 개가 수평으로 쌓인 모습이다. Ⅱ는 세 판 모두 중심부가 위로 볼록한 곡선 형태로 함께 구부러진 모습이다. Ⅲ은 구부러진 판의 위쪽을 손에 든 칼로 수평 방향으로 자르는 모습이며, 절단선 위의 볼록한 부분이 분리되어 있다. Ⅳ는 아래쪽의 구부러진 판들이 윗면에서 수평으로 잘려 있고, 그 위에 새로운 직사각형 판 한 개가 수평으로 놓인 모습이다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"2": 0.03, "1": 0.02, "3": 0.04, "5": 0.12, "4": 0.79}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/earth-science-1/page-01.jpg", "page": 1}, {"id": "earth-science-1:5", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 5, "selected": "5", "answer": "1", "points": "2", "visual": true, "state": {"question": "그림 (가)는 깊이에 따른 지하 온도 분포와 암석의 용융 곡선을, (나)는 (가)의 ㉠과 ㉡ 과정에 의해 생성된 마그마의 특성을 나타낸 것이다. A와 B는 유문암질 마그마와 현무암질 마그마를 순서 없이 나타낸 것이다.\n\n이 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "<보기>\nㄱ. 마그마가 생성되기 시작하는 온도는 ㉠이 ㉡보다 낮다.\nㄴ. B가 분출하여 굳으면 주로 현무암이 된다.\nㄷ. 섭입대에서 A는 주로 ㉠에 의해 생성된다.", "visual_description": "(가)의 위쪽 가로축은 온도(°C)이고 0, 500, 1000, 1500 눈금이 있다. 세로축은 아래로 증가하는 깊이(km)이며 50, 100 눈금이 있다. 굵은 검은 지하 온도 분포 곡선은 왼쪽 위에서 오른쪽 아래로 휘어진다. 왼쪽 긴 파선 용융 곡선은 위쪽에서 왼쪽 아래로 굽어 내려온다. 중앙 짧은 점선 용융 곡선은 상부에서 왼쪽 아래로 향하다 중간 깊이부터 오른쪽 아래로 굽어 내려온다. 오른쪽 가는 실선 용융 곡선은 오른쪽 아래로 기울어진다. ㉠은 얕은 깊이에서 지하 온도 분포 곡선 위의 점에서 오른쪽 점으로 향하는 수평 화살표이며 왼쪽 긴 파선을 가로지른다. ㉡은 더 깊은 곳에서 오른쪽 가는 실선 위의 점에서 중앙 짧은 점선 위의 점으로 향하는 수평 왼쪽 화살표이며 지하 온도 분포 곡선을 가로지른다. (나)는 세로축이 위쪽을 가리키는 온도, 가로축이 오른쪽을 가리키는 SiO₂ 함량(%)인 도표이다. 점선 원 A는 왼쪽 위, B는 오른쪽 아래에 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"3": 0.16, "4": 0.24, "2": 0.17, "5": 0.27, "1": 0.16}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/earth-science-1/page-01.jpg", "page": 1}, {"id": "earth-science-1:7", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 7, "selected": "4", "answer": "2", "points": "2", "visual": true, "state": {"question": "그림 (가)와 (나)는 어느 날 같은 시각의 지상 일기도와 적외 영상을 각각 나타낸 것이다.\n\n이 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "<보기>\nㄱ. (가)에서 폐색 전선이 나타난다.\nㄴ. 구름 최상부의 온도는 ㉠ 영역이 ㉡ 영역보다 높다.\nㄷ. A 지점의 지상에서는 주로 북풍 계열의 바람이 분다.", "visual_description": "(가)는 동아시아 부근의 지상 일기도이다. 위도 30°N과 40°N, 경도 120°와 130°E가 표시되어 있다. 등압선에는 1004, 1008, 1012가 표시되어 있고, 오른쪽 아래에는 H가 있다. 중국 동부에서 한반도 남부를 지나 북동쪽으로 이어지는 전선이 그려져 있다. 전선의 남서쪽 부분에는 한쪽에 검은 삼각형들이 있고, 북동쪽 부분에는 한쪽에 검은 반원들이 있다. 삼각형이 있는 부분과 반원이 있는 부분은 한 지점에서 이어진다. A는 한반도 동쪽 해상에서 전선의 남동쪽에 표시되어 있다.\n(나)는 같은 지역의 흑백 적외 영상이다. 위도 30°N과 40°N, 경도 120°와 130°E가 표시되어 있다. 중국 남동부에서 한반도와 일본 부근까지 넓고 밝은 구름대가 분포한다. ㉠은 영상 왼쪽 위쪽의 어두운 영역 안에 점선 원으로 표시되어 있고, ㉡은 한반도 북서쪽 부근의 비교적 밝은 구름 영역 안에 점선 원으로 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "probs": {"1": 0.19, "2": 0.03, "3": 0.07, "5": 0.05, "4": 0.66}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/earth-science-1/page-02.jpg", "page": 2}, {"id": "earth-science-1:8", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 8, "selected": "5", "answer": "1", "points": "3", "visual": true, "state": {"question": "그림은 지질 시대에 일어난 주요 사건을 시간 순서대로 나타낸 것이다.\n\nA, B, C 기간에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "<보기>\nㄱ. A에 생성된 지층에서 에디아카라 동물군 화석이 발견된다.\nㄴ. B에 팔레오기와 네오기 사이의 지질 시대 경계가 포함된다.\nㄷ. C에 대서양이 형성되기 시작하였다.", "visual_description": "오른쪽을 향한 화살표로 표시된 시간축 위에 네 사건이 왼쪽부터 순서대로 표시되어 있다. 첫 번째는 ‘최초의 다세포 생물 출현’, 두 번째는 ‘최초의 육상 식물 출현’, 세 번째는 ‘최초의 속씨식물 출현’, 네 번째는 ‘화폐석 멸종’이다. A는 첫 번째 사건부터 두 번째 사건까지의 기간, B는 두 번째 사건부터 세 번째 사건까지의 기간, C는 세 번째 사건부터 네 번째 사건까지의 기간으로 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ"], "probs": {"2": 0.05, "1": 0.28, "3": 0.11, "4": 0.07, "5": 0.49}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/earth-science-1/page-02.jpg", "page": 2}, {"id": "earth-science-1:9", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 9, "selected": "4", "answer": "3", "points": "3", "visual": true, "state": {"question": "그림 (가)는 서로 다른 해에 우리나라에 영향을 준 태풍 A와 B의 이동 경로를, (나)는 A와 B 중 어느 태풍의 영향을 받는 동안 관측소 P에서 36시간 동안 관측한 기압, 풍속, 풍향의 변화를 나타낸 것이다.\n\n이 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "<보기>\nㄱ. (나)는 A의 관측 자료이다.\nㄴ. P에서의 풍속은 \\(t_1\\)일 때가 \\(t_4\\)일 때보다 빠르다.\nㄷ. 태풍의 중심과 P 사이의 거리는 \\(t_1\\)일 때가 \\(t_3\\)일 때보다 멀다.", "visual_description": "(가)는 한반도와 일본 부근의 지도이며 40°N과 130°E가 표시되어 있다. 관측소 P는 한반도 남동부 부근에 검은 점으로 표시되어 있다. 태풍 A의 경로는 한반도 서쪽 해상에서 북상하여 한반도를 지난 뒤 북동쪽으로 굽어 이어지며, 끝에는 소멸을 나타내는 ×가 있다. 태풍 B의 경로는 일본 남서쪽 해상에서 북동쪽으로 진행하여 일본 열도를 따라가며, 끝에는 소멸을 나타내는 ×가 있다. 범례에는 ‘×: 소멸’이라고 표시되어 있다.\n(나)는 시간에 따른 풍향, 풍속, 기압의 변화를 한 좌표 평면에 나타낸 그래프이다. 가로축은 오른쪽 방향의 ‘시간’이며 \\(t_1,t_2,t_3,t_4,t_5\\)가 차례로 표시되어 있다. 왼쪽 바깥쪽의 풍향 눈금은 아래에서 위로 E, S, W, N, E이고, 왼쪽 안쪽의 풍속 축은 ‘풍속(m/s)’이며 0, 5, 10, 15, 20의 눈금이 있다. 오른쪽 축은 ‘기압(hPa)’이며 아래에서 위로 978, 988, 998, 1008, 1018의 눈금이 있다. 검은 점들로 나타낸 풍향은 처음 E 부근에서 시작하여 N과 E 사이로 높아진 뒤 \\(t_2\\) 전후까지 E 부근에 있고, \\(t_2\\)와 \\(t_3\\) 사이에 그래프 아래쪽의 E 부근으로 급변한다. 이후 S 쪽으로 올라가다가 \\(t_4\\) 무렵 W 부근에 이르고, 그 뒤 W 부근에서 완만히 높아진다. 가는 실선으로 나타낸 풍속은 처음 약 3 m/s이고 굴곡을 보이며 증가하여 \\(t_2\\)와 \\(t_3\\) 사이에서 약 8 m/s에 이른 뒤 잠시 낮아진다. \\(t_3\\) 직후 약 11 m/s까지 높아졌다가, \\(t_3\\)와 \\(t_4\\) 사이에서 약 18 m/s로 급격히 상승한 뒤 하강하며, 이후 약 4～7 m/s 범위에서 변한다. 굵은 실선으로 나타낸 기압은 처음 약 1008 hPa에서 시작하여 낮아지고, \\(t_3\\)와 \\(t_4\\) 사이에서 약 984 hPa로 최저가 된 뒤 다시 높아져 끝부분에서 약 1007 hPa가 된다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"3": 0.27, "4": 0.27, "2": 0.08, "5": 0.24, "1": 0.14}, "others": {"Luna": "3", "Terra": "5", "Sol": "3"}, "image": "images/earth-science-1/page-02.jpg", "page": 2}, {"id": "earth-science-1:10", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 10, "selected": "2", "answer": "5", "points": "2", "visual": true, "state": {"question": "그림은 은하 A와 B를 구성하는 주계열성의 평균 나이와 평균 광도를 나타낸 것이다. A와 B는 나선 은하와 타원 은하를 순서 없이 나타낸 것이다. 은하를 구성하는 주계열성의 총광도는 A와 B가 같다.\n\n이 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "<보기>\nㄱ. 주계열성의 평균 표면 온도는 A가 B보다 높다.\nㄴ. 주계열성의 총개수는 A가 B보다 많다.\nㄷ. 태양보다 질량이 큰 주계열성의 총광도는 A가 B보다 작다.", "visual_description": "그래프의 가로축은 오른쪽 방향의 ‘평균 광도’이고, 세로축은 ‘평균 나이(억 년)’이다. 세로축에는 50과 100의 눈금이 표시되어 있다. A는 B보다 왼쪽 위에 있으며 평균 나이는 100억 년보다 높고 평균 광도는 더 작다. B는 오른쪽 아래에 있으며 평균 나이는 50억 년과 100억 년 사이이고 평균 광도는 더 크다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ"], "probs": {"2": 0.46, "3": 0.05, "5": 0.25, "1": 0.07, "4": 0.17}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/earth-science-1/page-02.jpg", "page": 2}, {"id": "earth-science-1:11", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 11, "selected": "5", "answer": "2", "points": "2", "visual": false, "state": {"question": "표는 주계열성 X가 중심별인 어느 외계 행성계에 속한 행성 ㉠, ㉡, ㉢이 X로부터 단위 시간당 단위 면적에서 받는 복사 에너지양 S와 각 행성의 공전 궤도 반지름을 나타낸 것이다. ㉠, ㉡, ㉢은 모두 생명 가능 지대에 위치한다.\n\n이 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "표:\n| 행성 | \\(S\\) (지구 = 1) | 공전 궤도 반지름 (AU) |\n|---|---:|---:|\n| ㉠ | 0.73 | 0.7 |\n| ㉡ | 1 | (　) |\n| ㉢ | (　) | 0.75 |\n\n<보기>\nㄱ. 주계열 단계에 머무는 시간은 X가 태양보다 짧다.\nㄴ. 공전 궤도 반지름은 ㉡이 ㉢보다 작다.\nㄷ. X의 광도가 계속 증가할 경우, 생명 가능 지대를 가장 먼저 벗어나는 것은 ㉢이다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "probs": {"3": 0.2, "1": 0.22, "5": 0.23, "2": 0.12, "4": 0.23}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/earth-science-1/page-02.jpg", "page": 2}, {"id": "earth-science-1:12", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 12, "selected": "1", "answer": "3", "points": "3", "visual": true, "state": {"question": "표는 중심핵에서 핵융합 반응이 일어나고 있는 별 (가), (나), (다)의 질량과 광도 계급을 나타낸 것이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "표:\n| 별 | 질량(태양 = 1) | 광도 계급 |\n|---|---:|:---:|\n| (가) | 1 | V |\n| (나) | 5 | V |\n| (다) | 1 | III |\n\n<보기>\nㄱ. 대류가 일어나는 영역의 평균 깊이는 (가)가 (나)보다 얕다.\nㄴ. 단위 시간당 에너지 생성량은 (가)가 (다)보다 많다.\nㄷ. 중심핵의 온도는 (나)가 (다)보다 낮다.", "visual_description": "별 (가), (나), (다)의 질량과 광도 계급을 나타낸 3행 표이다. 열은 왼쪽부터 ‘별’, ‘질량(태양 = 1)’, ‘광도 계급’이다. 각 행의 값은 본문에 전사되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"5": 0.03, "3": 0.08, "1": 0.83, "4": 0.01, "2": 0.05}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/earth-science-1/page-03.jpg", "page": 3}, {"id": "earth-science-1:13", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 13, "selected": "4", "answer": "1", "points": "3", "visual": true, "state": {"question": "그림은 빅뱅 우주론에 따라 우주가 팽창하는 동안 우주 초기에 헬륨 원자핵이 생성될 때 A, B, C의 상대적 질량비(%)를 일정한 시간 간격에 따라 나타낸 것이다. A, B, C는 양성자, 중성자, 헬륨 원자핵을 순서 없이 나타낸 것이다.\n\n이 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "<보기>\nㄱ. B는 중성자이다.\nㄴ. 우주 배경 복사는 \\(T\\) 시기에 방출된 빛이다.\nㄷ. \\(T\\) 시기 후 수소 원자핵과 헬륨 원자핵의 개수비는 약 \\(3:1\\)이다.", "visual_description": "그래프의 가로축은 오른쪽 방향 화살표가 있는 ‘시간’, 세로축은 ‘질량비(%)’이며 세로축에 0, 50, 100이 표시되어 있다. A의 곡선은 처음에 약 85%로 수평에 가깝다가 중간 이후 감소하여 약 75%에서 수평에 가까워진다. B의 곡선은 처음에 약 15%로 수평에 가깝다가 중간 이후 감소하여 0에 가까워진다. C의 곡선은 처음에 0에 가깝다가 중간 이후 증가하여 약 25%에서 수평에 가까워진다. 그래프 오른쪽에는 세로로 음영 처리된 시간 구간이 있고, 그 위에 왼쪽을 가리키는 화살표가 있는 가로선과 \\(T\\)가 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ"], "probs": {"3": 0.04, "2": 0.09, "1": 0.2, "4": 0.48, "5": 0.19}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/earth-science-1/page-03.jpg", "page": 3}, {"id": "earth-science-1:16", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 16, "selected": "2", "answer": "1", "points": "3", "visual": true, "state": {"question": "그림은 표준 우주 모형에 따라 팽창하는 우주에서 우주의 팽창 속도를, 표는 A, B, C 시기의 물리량을 나타낸 것이다.\n\n이 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "표:\n| 물리량 | A | B | C |\n|---|---:|---:|---:|\n| 우주 팽창 속도(현재 = 1) | 0.96 | 0.93 | 0.90 |\n| 우주 구성 요소 중 암흑 에너지 비율(%) | (　　) | 15 | 48 |\n| 우주 배경 복사 온도(상댓값) | 1.0 | 2.1 | (　　) |\n\n<보기>\nㄱ. \\(\\dfrac{\\text{암흑 에너지 밀도}}{\\text{물질 밀도}}\\)는 A가 C보다 크다.\nㄴ. A, B, C 중 우주 배경 복사의 온도는 C가 가장 낮다.\nㄷ. A에 우주는 감속 팽창한다.", "visual_description": "우주 팽창 속도와 시간의 관계를 나타낸 선 그래프가 표 왼쪽에 있다. 가로축은 오른쪽 방향 화살표가 있는 ‘시간’이고 오른쪽 끝에 ‘현재’가 표시되어 있다. 세로축은 ‘우주 팽창 속도’이며 0.8, 1.0, 1.2가 표시되어 있고, 1.0 위치에 가로 점선이 있다. 곡선은 왼쪽의 1.2에서 급격히 하강하여 1.0 아래로 내려가고, 약 0.9에서 최솟값을 이룬 뒤 다시 상승하여 현재에 1.0에 도달한다. 표의 값과 빈칸은 본문에 전사되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ"], "probs": {"4": 0.06, "1": 0.02, "2": 0.77, "3": 0.13, "5": 0.02}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/earth-science-1/page-03.jpg", "page": 3}, {"id": "earth-science-1:17", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 17, "selected": "1", "answer": "4", "points": "3", "visual": true, "state": {"question": "이 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 고지자기극은 고지자기 방향으로 추정한 지리상 북극이고, 지리상 북극은 변하지 않았다.) [3점]", "passage": "그림은 지괴 A와 B의 시기별 고지자기극의 위치와 이로부터 추정한 \\(100\\,\\mathrm{Ma}\\)의 A와 B의 위치를 나타낸 것이다. A와 B는 각각 동일 경도를 따라 이동하였다.\n\n<보기>\nㄱ. 현재 A는 B보다 고위도에 위치한다.\nㄴ. \\(150\\,\\mathrm{Ma}\\sim100\\,\\mathrm{Ma}\\) 동안 평균 이동 속도는 A가 B보다 느리다.\nㄷ. \\(200\\,\\mathrm{Ma}\\)부터 \\(100\\,\\mathrm{Ma}\\)까지 A의 이동 방향은 남쪽이다.", "visual_description": "구면 위에 위도선과 경도선이 그려져 있다. 위쪽에는 ‘지리상 북극’이 표시되어 있고, 중앙의 위도선에는 위에서 아래로 \\(60^\\circ\\), \\(30^\\circ\\), \\(0^\\circ\\)가 표시되어 있다. 검은 점은 ‘A에서 구한 고지자기극’, 흰 점은 ‘B에서 구한 고지자기극’이다. A의 검은 점들은 동일한 경도선을 따라 아래에서 위로 \\(200\\), \\(150\\), \\(100\\)으로 표시되어 있으며, \\(200\\)은 \\(60^\\circ\\) 위도선 부근, \\(150\\)은 그보다 위쪽, \\(100\\)은 북극에 더 가까운 곳에 있다. B의 흰 점들은 A의 점들보다 오른쪽의 동일한 경도선을 따라 아래에서 위로 \\(100\\), \\(150\\), \\(200\\)으로 표시되어 있으며, \\(100\\)은 \\(60^\\circ\\) 위도선 아래쪽, \\(150\\)은 \\(60^\\circ\\) 위도선 위쪽, \\(200\\)은 그보다 위쪽에 있다. 구면의 왼쪽 \\(30^\\circ\\) 위도선 부근에는 회색 지괴와 ‘\\(100\\,\\mathrm{Ma}\\)의 A 위치’가 표시되어 있고, 오른쪽 같은 위도 부근에는 회색 지괴와 ‘\\(100\\,\\mathrm{Ma}\\)의 B 위치’가 표시되어 있다. 범례의 단위는 ‘Ma(백만 년 전)’이다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "probs": {"4": 0.21, "1": 0.32, "2": 0.18, "3": 0.14, "5": 0.15}, "others": {"Luna": "3", "Terra": "5", "Sol": "4"}, "image": "images/earth-science-1/page-04.jpg", "page": 4}, {"id": "earth-science-1:18", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 18, "selected": "5", "answer": "1", "points": "3", "visual": true, "state": {"question": "이 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 중심별의 시선 속도 변화는 행성과의 공통 질량 중심에 대한 공전에 의해서만 나타나며, 행성의 공전 궤도면은 관측자의 시선 방향과 나란하다.) [3점]", "passage": "그림 (가)는 어느 외계 행성계에서 중심별과 행성이 공통 질량 중심에 대하여 원 궤도로 공전할 때, 식 현상을 일으키는 행성에 의한 중심별의 상대적 밝기 변화를 일정한 시간 간격(\\(\\Delta t\\))에 따라 나타낸 것이다. (나)는 \\(t_2\\)일 때 중심별의 위치를 공전 궤도에 나타낸 것이다.\n\n<보기>\nㄱ. 중심별의 시선 속도는 \\(t_2\\)일 때가 \\(t_4\\)일 때보다 크다.\nㄴ. \\(t_2\\) 이후 처음으로 식 현상이 끝난 직후의 시간은 \\(t_2+20\\Delta t\\)이다.\nㄷ. 행성의 공전 주기는 \\(360\\Delta t\\)이다.", "visual_description": "(가)는 세로축이 ‘밝기(상댓값)’, 가로축이 ‘시간’인 그래프이다. 가로축에는 왼쪽부터 일정한 간격으로 \\(t_1,t_2,t_3,t_4,t_5\\)가 표시되어 있고, \\(t_1\\)과 \\(t_2\\) 사이의 간격에 \\(\\Delta t\\)가 표시되어 있다. 밝기는 \\(t_1\\)부터 \\(t_2\\)까지 \\(1.0000\\)으로 일정하고, \\(t_2\\)부터 \\(t_3\\)까지 직선으로 감소하여 \\(0.9975\\)가 된다. 이후 \\(t_3\\)부터 \\(t_5\\)까지 \\(0.9975\\)로 일정하다. \\(t_2,t_3,t_4\\) 위치에는 세로 점선이 그어져 있고, \\(0.9975\\) 위치에는 가로 점선이 있다.\n(나)는 타원처럼 보이는 ‘중심별의 공전 궤도’가 그려져 있다. 궤도의 중앙 부근에 검은 점과 ‘공통 질량 중심’이라는 표시가 있다. 관측자의 ‘시선 방향’ 화살표는 그림 왼쪽에서 오른쪽을 향한다. 중심별은 궤도의 오른쪽 아래 부분에 검은 점으로 표시되고 그 옆에 \\(t_2\\)가 적혀 있다. \\(t_2\\) 위치의 왼쪽 위에는 중심별의 공전 방향을 나타내는 반시계 방향의 곡선 화살표가 표시되어 있다. 공통 질량 중심에서 오른쪽으로 향하는 수평 점선과 공통 질량 중심에서 \\(t_2\\) 위치로 향하는 선 사이의 각이 \\(10^\\circ\\)로 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"5": 0.22, "4": 0.21, "1": 0.19, "3": 0.16, "2": 0.22}, "others": {"Luna": "5", "Terra": "1", "Sol": "5"}, "image": "images/earth-science-1/page-04.jpg", "page": 4}, {"id": "earth-science-1:19", "subject": "지구과학Ⅰ", "section": "earth-science-1", "number": 19, "selected": "5", "answer": "2", "points": "2", "visual": false, "state": {"question": "이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "표는 별 (가), (나), (다)의 물리량을 나타낸 것이다. (가), (나), (다) 중 백색 왜성은 2개, 주계열성은 1개이다.\n\n| 별 | 표면 온도(상댓값) | 겉보기 등급 | 지구로부터의 거리(상댓값) |\n|---|---:|---:|---:|\n| (가) | 4 | 10 | 1 |\n| (나) | 2 | 15 | 4 |\n| (다) | 1 | 5 | 0.4 |\n\n<보기>\nㄱ. (가)는 주계열성이다.\nㄴ. 반지름은 (나)가 (가)의 \\(1.5\\)배보다 크다.\nㄷ. \\(\\dfrac{\\text{(가)의 절대 등급}-\\text{(다)의 절대 등급}}{\\text{(나)의 절대 등급}-\\text{(다)의 절대 등급}}\\)은 \\(\\dfrac{1}{2}\\)보다 작다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ"], "probs": {"2": 0.2, "5": 0.39999999999999997, "1": 0.13, "3": 0.17, "4": 0.1}, "others": {"Luna": "3", "Terra": "2", "Sol": "2"}, "image": "images/earth-science-1/page-04.jpg", "page": 4}, {"id": "earth-science-2:9", "subject": "지구과학Ⅱ", "section": "earth-science-2", "number": 9, "selected": "3", "answer": "5", "points": "2", "visual": true, "state": {"question": "다음은 색등급도를 이용하여 성단의 거리를 구하고, 성간 소광 효과를 고려하여 거리를 보정하는 탐구이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "[탐구 과정]\n(가) 표준 주계열과 성단 A의 색등급도가 각각 그려진 투명 용지 Ⅰ과 Ⅱ를 준비한다.\n(나) Ⅰ을 Ⅱ 위에 놓고, ( ㉠ )을/를 같게 유지하면서 A의 주계열성들이 표준 주계열에 겹치게 한다.\n(다) 겹쳐진 Ⅰ과 Ⅱ에서 전향점의 ㉡ <u>겉보기 등급(\\(m_V\\))<\/u>과 절대 등급(\\(M_V\\))의 차(\\(m_V-M_V\\))를 이용하여 A까지의 거리 \\(d_1\\)을 구한다.\n(라) A의 성간 소광량(\\(A_V\\)) 0.124를 이용하여 보정된 A까지의 거리 \\(d_2\\)를 구한다.\n\n[탐구 결과]\n과정 | 결과\n(다) | 보정 전 A까지의 거리: ( \\(d_1\\) )\n(라) | 보정 후 A까지의 거리: ( \\(d_2\\) )\n\n<보기>\nㄱ. 색지수는 ㉠에 해당한다.\nㄴ. ㉡은 거리 지수이다.\nㄷ. \\(\\dfrac{d_2}{d_1}<1\\)이다.", "visual_description": "탐구 과정 (가)에 두 개의 색등급도가 나란히 제시되어 있다. 왼쪽 그래프는 아래에 Ⅰ이 표시되어 있고 그래프 안에 ‘표준 주계열’이라는 표지가 있다. 가로축은 ‘색지수 \\((B-V)\\)’이며 눈금은 -0.5, 0, 0.5, 1, 1.5, 2이다. 세로축은 ‘절대 등급 \\((M_V)\\)’이며 위에서 아래로 -4, -2, 0, 2, 4, 6, 8, 10의 눈금이 표시되어 있다. 굵은 곡선은 왼쪽 위에서 시작해 아래쪽으로 갈수록 대체로 오른쪽으로 이동하며, 아래쪽에서 오른쪽으로 휘어진다.\n오른쪽 그래프는 아래에 Ⅱ가 표시되어 있고 그래프 안에 ‘성단 A’라는 표지가 있다. 가로축은 ‘색지수 \\((B-V)\\)’이며 눈금은 -0.5, 0, 0.5, 1, 1.5, 2이다. 세로축은 ‘겉보기 등급 \\((m_V)\\)’이며 위에서 아래로 2, 4, 6, 8, 10, 12, 14, 16의 눈금이 표시되어 있다. 다수의 점이 왼쪽 위에서 오른쪽 아래로 이어지는 좁은 띠를 이루며 분포하고, 그 주변에도 흩어진 점들이 있다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"2": 0.05, "3": 0.45, "5": 0.22, "1": 0.24, "4": 0.04}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/earth-science-2/page-02.jpg", "page": 2}, {"id": "earth-science-2:14", "subject": "지구과학Ⅱ", "section": "earth-science-2", "number": 14, "selected": "5", "answer": "2", "points": "2", "visual": true, "state": {"question": "그림은 퇴적층 A, B, C가 분포하는 어느 지역의 지질도이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "<보기>\nㄱ. A층의 경사 방향은 북쪽이다.\nㄴ. 단층이 나타난다.\nㄷ. 지층의 생성 순서는 C → B → A이다.", "visual_description": "직사각형 지질도이며 위쪽이 북쪽임을 나타내는 방위 표시가 오른쪽 위에 있다. 지형 등고선은 점선 곡선으로 그려져 있고 위에서 아래로 \\(500\\,\\mathrm{m}\\), \\(400\\,\\mathrm{m}\\), \\(300\\,\\mathrm{m}\\), \\(200\\,\\mathrm{m}\\), \\(100\\,\\mathrm{m}\\)가 표시되어 있다. 등고선들은 대체로 위쪽으로 볼록한 활 모양이다. 지층 경계는 대체로 좌우로 이어지는 곡선이다. 위에서부터 회색 A층, 흰색 B층, 회색 C층, 흰색 B층, 회색 C층이 차례로 표시되어 있다. \\(300\\,\\mathrm{m}\\)와 \\(200\\,\\mathrm{m}\\) 등고선 사이 부근에는 좌우를 가로지르는 굵은 검은 곡선이 있으며, 이 선을 경계로 위쪽에는 C가, 아래쪽에는 B가 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ"], "probs": {"2": 0.26, "1": 0.06, "4": 0.19, "3": 0.05, "5": 0.44}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/earth-science-2/page-03.jpg", "page": 3}, {"id": "earth-science-2:16", "subject": "지구과학Ⅱ", "section": "earth-science-2", "number": 16, "selected": "4", "answer": "3", "points": "3", "visual": true, "state": {"question": "그림은 어느 날 우리나라에서 관측한 금성과 하현달의 위치를 나타낸 것이다.\n\n이 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 달의 공전 궤도면은 황도면과 일치한다고 가정한다.) [3점]", "passage": "<보기>\nㄱ. 이날 남중 고도는 금성이 달보다 높다.\nㄴ. 이날 태양이 질 때의 방위각은 달이 질 때의 방위각보다 크다.\nㄷ. 관측한 계절은 가을이다.", "visual_description": "동쪽에서 남쪽까지의 하늘을 나타낸 직사각형 그림이다. 아래쪽 수평선은 ‘지평선’이며 왼쪽 끝에 ‘동’, 오른쪽 끝에 ‘남’이 표시되어 있다. 왼쪽 아래에서 오른쪽 위로 올라가는 점선 곡선이 두 개 있다. 위쪽 점선 곡선에는 ‘천구의 적도’가 적혀 있고, 그 곡선의 왼쪽 부분에 \\(0°\\)가 표시되어 있다. 아래쪽 점선 곡선의 중간 부근에는 \\(-20°\\)가 표시되어 있다. 금성은 지평선 가까이의 왼쪽 아래에 표시되어 있고, 달은 금성보다 오른쪽 위에 표시되어 있다. 달은 하현달을 나타내는 반달 모양으로 그려져 있으며, 달의 왼쪽 위쪽에 작은 화살표 모양의 표시가 있다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"3": 0.22, "5": 0.14, "1": 0.2, "2": 0.18, "4": 0.26}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/earth-science-2/page-03.jpg", "page": 3}, {"id": "earth-science-2:17", "subject": "지구과학Ⅱ", "section": "earth-science-2", "number": 17, "selected": "4", "answer": "2", "points": "3", "visual": false, "state": {"question": "표는 어느 지역에서 관측한 높이에 따른 기온($T_1$)과 각 높이의 공기가 단열 하강하여 높이 $0\\,\\mathrm{km}$인 지표에 도달했을 때의 온도($T_2$)를 나타낸 것이다. 지표 기온은 $20\\,^{\\circ}\\mathrm{C}$이고, 대기는 불포화 상태이다.\n\n| 높이($\\mathrm{km}$) | $T_1$($^{\\circ}\\mathrm{C}$) | $T_2$($^{\\circ}\\mathrm{C}$) |\n|---|---:|---:|\n| $3.0$ | $-4$ | $26$ |\n| $2.0$ | $0$ | (㉠) |\n| $1.5$ | (　　) | $15$ |\n| $0.5$ | $10$ | (　　) |\n\n이 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 건조 단열 감률은 일정하고, 제시된 높이 사이의 기온 감률은 각각 일정하다.) [3점]", "passage": "<보기>\nㄱ. ㉠은 $18$이다.\nㄴ. 높이 $0.5\\sim1.5\\,\\mathrm{km}$ 구간의 안정도는 중립이다.\nㄷ. 지표에서 $22\\,^{\\circ}\\mathrm{C}$로 가열된 공기 덩어리가 자발적으로 단열 상승할 수 있는 높이는 $2.0\\,\\mathrm{km}$보다 낮다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "probs": {"5": 0.22, "3": 0.16, "1": 0.15, "4": 0.39, "2": 0.08}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/earth-science-2/page-04.jpg", "page": 4}, {"id": "earth-science-2:18", "subject": "지구과학Ⅱ", "section": "earth-science-2", "number": 18, "selected": "4", "answer": "5", "points": "3", "visual": true, "state": {"question": "그림은 어느 해 우리나라에서 태양과 행성 A, B가 뜨는 시각을 나타낸 것이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "<보기>\nㄱ. $2$월 말 A는 충 부근에 위치한다.\nㄴ. 공전 궤도 반지름은 A가 B보다 크다.\nㄷ. 지구와의 회합 주기는 A가 B보다 짧다.", "visual_description": "가로축은 월로, $1$부터 $12$까지 각 월이 표시되어 있고 오른쪽 끝에 ‘(월)’이 적혀 있다. 세로축은 ‘뜨는 시각 (시)’이며, 위에서 아래로 $8, 6, 4, 2, 24, 22, 20, 18, 16$이 표시되어 있다. 월별 세로 격자선과 시각별 가로 격자선이 그려져 있다. 세 곡선이 있다. ‘태양’으로 표시된 가는 실선은 1월에 약 8시 바로 아래에서 시작하여 내려가며, 6월 무렵 약 5시와 6시 사이에서 가장 낮아진 뒤 다시 올라가 12월에는 약 8시 바로 아래에 이른다. ‘A’로 표시된 점선은 1월과 2월 사이에 8시보다 위에서 시작하여 오른쪽 아래로 거의 직선 형태로 내려가며, 3월 무렵 약 6시, 4월 무렵 약 4시, 6월 무렵 약 24시, 8월 무렵 약 20시를 지나 10월 무렵 16시에 이른다. A의 점선은 2월과 3월 사이에서 태양의 곡선과 교차하고, 4월과 5월 사이에서 B의 곡선과 교차한다. ‘B’로 표시된 굵은 실선은 1월 무렵 약 7시에서 시작해 계속 내려가며, 3월 무렵 약 5시, 5월 무렵 약 3시, 7월 무렵 약 1시, 9월 무렵 약 24시, 11월 무렵 약 22시를 지나 12월에는 약 19시에 이른다."}, "options": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ"], "probs": {"2": 0.31, "1": 0.16, "4": 0.33, "5": 0.15, "3": 0.05}, "others": {"Luna": "3", "Terra": "1", "Sol": "5"}, "image": "images/earth-science-2/page-04.jpg", "page": 4}, {"id": "earth-science-2:19", "subject": "지구과학Ⅱ", "section": "earth-science-2", "number": 19, "selected": "3", "answer": "5", "points": "2", "visual": true, "state": {"question": "그림은 가상의 소행성 A와 B가 태양을 공전하는 타원 궤도를 나타낸 것이다. 두 타원 궤도의 이심률은 $0.6$으로 같고, A의 근일점 거리는 B의 근일점 거리의 $4$배이다.\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "<보기>\nㄱ. A의 공전 궤도 긴반지름은 B의 근일점 거리의 $10$배이다.\nㄴ. A가 근일점에서 원일점까지 가는 동안 B는 태양을 $4$회 공전한다.\nㄷ. 태양과 소행성을 잇는 선분이 같은 시간 동안 쓸고 지나간 면적은 A가 B의 $2$배이다.", "visual_description": "가로로 긴 큰 타원과 그 안의 작은 타원이 그려져 있다. 두 타원의 긴축은 같은 수평 점선 위에 놓여 있다. 큰 타원의 오른쪽 초점 부근에 검은 점이 있고 ‘태양’이라고 표시되어 있다. 작은 타원은 태양을 한 초점으로 하며 큰 타원 내부의 오른쪽 부분에 그려져 있다. 큰 타원의 왼쪽 위 궤도 위에 검은 점과 ‘A’ 표시가 있고, 작은 타원의 왼쪽 위 궤도 위에 검은 점과 ‘B’ 표시가 있다. 큰 타원의 수평 긴축 점선에는 왼쪽 끝과 태양 사이에 짧은 세로 눈금 세 개가 표시되어 있다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"4": 0.05, "5": 0.14, "3": 0.39999999999999997, "1": 0.34, "2": 0.07}, "others": {"Luna": "4", "Terra": "5", "Sol": "5"}, "image": "images/earth-science-2/page-04.jpg", "page": 4}, {"id": "earth-science-2:20", "subject": "지구과학Ⅱ", "section": "earth-science-2", "number": 20, "selected": "2", "answer": "1", "points": "3", "visual": false, "state": {"question": "표는 두 해파 A와 B가 수심이 각각 $h_1$과 $h_2$인 해역 (가)와 (나)를 지날 때 주기와 파장을 나타낸 것이다. B는 (가)와 (나)에서 각각 심해파와 천해파 중 서로 다른 하나이고, $\\lambda_2$는 $2h_2$보다 짧다.\n\n| 해역 | 수심 | A의 주기 | A의 파장 | B의 주기 | B의 파장 |\n|---|---|---|---|---|---|\n| (가) | $h_1$ | $T$ | $\\lambda_1$ | $8T$ | $64\\lambda_1$ |\n| (나) | $h_2$ | $T$ | $\\lambda_2$ | $8T$ | $16\\lambda_2$ |\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 중력 가속도는 일정하다.) [3점]", "passage": "<보기>\nㄱ. $\\lambda_1=\\lambda_2$이다.\nㄴ. $h_1<h_2$이다.\nㄷ. B가 (가)를 지날 때 해수면의 물 입자는 타원 운동을 한다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"3": 0.16, "1": 0.26, "5": 0.11, "2": 0.28, "4": 0.19}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/earth-science-2/page-04.jpg", "page": 4}, {"id": "east-asia-history:1", "subject": "동아시아사", "section": "east-asia-history", "number": 1, "selected": "4", "answer": "5", "points": "2", "visual": true, "state": {"question": "밑줄 친 ‘이 지역’을 지도에서 옳게 고른 것은?", "passage": "신석기 시대 편\n\n[해설] <u>이 지역<\/u>에서 출토된 위의 토우는 역삼각형의 가면을 쓴 것처럼 보이는 얼굴 모습이 특징이다.\n\n동아시아 유물 사전\n\n[해설] <u>이 지역<\/u>에서 출토된 위의 토기는 표면에 새끼줄 무늬가 새겨져 있는 것이 특징으로 ○○ 문화를 대표하는 유물이다.", "visual_description": "펼친 책 모양의 자료가 지도 위에 배치되어 있다. 책의 왼쪽 면에는 ‘신석기 시대 편’이라는 제목 아래 사람 형태의 입체 유물이 있다. 유물은 두 다리로 서 있고 양팔을 좌우로 벌렸으며, 몸통에는 소용돌이 모양 무늬가 있고 얼굴 부분은 역삼각형처럼 보인다. 책의 오른쪽 면에는 ‘동아시아 유물 사전’이라는 제목 아래 원통형 토기 유물이 있다. 토기 표면에는 굵은 선과 소용돌이 형태의 무늬가 있으며 윗부분에는 돌출된 장식이 있다.\n\n아래 지도에는 동아시아의 해안선과 국경선이 표시되어 있고 다섯 지역이 흐리게 강조되어 있다. (가)는 한반도에서 서쪽으로 멀리 떨어진 대륙 내륙에 있다. (나)는 한반도의 북쪽 대륙 지역에 있다. (다)는 한반도 남서쪽에 있는 중국 동부 해안 부근에 있다. (라)는 한반도 안에 있다. (마)는 일본 열도의 혼슈 안에 있다."}, "options": ["(가)", "(나)", "(다)", "(라)", "(마)"], "probs": {"5": 0.13, "2": 0.11, "4": 0.36, "1": 0.13, "3": 0.27}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/east-asia-history/page-01.jpg", "page": 1}, {"id": "east-asia-history:2", "subject": "동아시아사", "section": "east-asia-history", "number": 2, "selected": "5", "answer": "2", "points": "3", "visual": true, "state": {"question": "밑줄 친 ‘이 국가’에 대한 설명으로 옳은 것은? [3점]", "passage": "○○ 신문　　　　　　　　　○○○○년 ○○월 ○○일\n\n효민황제 무덤, 정릉 발견\n\n▲ 묘실　　　　　　　　　▲ 갑옷 입은 기병 도용\n\n최근 산시성에서 북주의 군주인 우문각의 무덤이 발견되었다. 이 무덤에서 도용 등 다량의 부장품이 출토되었다. 기록에 따르면 <u>이 국가<\/u>가 동서로 분열된 이후, 우문각은 서쪽 지방을 근거지로 삼은 나라의 공제로부터 선양받아 북주를 개국하였으며, 얼마 후 일어난 정변으로 폐위되어 악양공으로 강등되어 살해되었다. 그는 훗날 효민황제로 추존되었으며, 능은 정릉이라고 불렸다.", "visual_description": "신문 기사 형식의 자료이다. 제목 아래 왼쪽 사진은 땅을 파내어 드러난 직사각형 묘실 내부를 위에서 내려다본 모습이며, 바닥으로 내려가는 계단과 여러 물체가 보인다. 사진 아래에는 ‘▲ 묘실’이라고 적혀 있다. 오른쪽 사진에는 갑옷을 입고 말에 탄 사람 형태의 회색 도용이 있으며, 사진 아래에는 ‘▲ 갑옷 입은 기병 도용’이라고 적혀 있다."}, "options": ["백제를 멸망시켰다.", "제(齊)와 대립하였다.", "대도를 수도로 삼았다.", "다이카 개신을 단행하였다.", "남북조의 혼란을 수습하였다."], "probs": {"3": 0.29, "4": 0.01, "5": 0.37, "2": 0.3, "1": 0.03}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/east-asia-history/page-01.jpg", "page": 1}, {"id": "east-asia-history:4", "subject": "동아시아사", "section": "east-asia-history", "number": 4, "selected": "2", "answer": "1", "points": "2", "visual": false, "state": {"question": "(가) 왕조에 대한 설명으로 옳은 것은?", "passage": "옛 기록을 살펴보건대, 헤이조쿄에서 [(가)]에 파견된 사절단 가운데 바다를 건너다 풍랑을 만나 생명을 다한 이도 있고, 도적을 만나 목숨을 잃은 이도 있었습니다. 하지만 육지에 도착하여 수도 장안에 이르기까지 굶주림이나 추위로 비참한 일을 겪었다는 기록은 찾아볼 수 없었습니다. 그런데 최근 소식에 따르면 전란으로 이미 [(가)]의 국세가 심히 쇠퇴하여 사절단의 안전이 우려된다고 합니다. 이에 삼가 청하옵건대 사절단의 파견 지속 여부에 관한 결정을 내려 주시기 바랍니다."}, "options": ["북쪽 지방에 선우 도호부를 설치하였다.", "재정 업무를 관장하는 대장성을 두었다.", "행성을 설치하고 다루가치를 파견하였다.", "농경민을 다스리는 남추밀원을 설립하였다.", "외교 사무 등을 담당하는 의부를 운영하였다."], "probs": {"3": 0.04, "4": 0.03, "5": 0.23, "2": 0.5599999999999999, "1": 0.14}, "others": {"Luna": "2", "Terra": "5", "Sol": "1"}, "image": "images/east-asia-history/page-01.jpg", "page": 1}, {"id": "east-asia-history:6", "subject": "동아시아사", "section": "east-asia-history", "number": 6, "selected": "2", "answer": "3", "points": "2", "visual": false, "state": {"question": "(가)～(다) 국가에 대한 설명으로 옳은 것은?", "passage": "(가) 이/가 국경에서 소란을 일으키자 그 병화(兵禍)가 우리의 수도에까지 이르렀다. 짐이 생각하건대 우리 (나) 은/는 (다) 와/과 바다를 사이에 두고 떨어져 있지만, 은혜와 예의를 베풀었으니 어려울 때 함께 적과 싸워 줄 마음이 있어야 할 것이다. 그런데 너희 (다) 은/는 (가) 와/과 서로 가까이 마주 보면서도 오랑캐의 소굴을 소탕하여 우리에게 보답하지 않으니, 어찌하여 여러 대에 걸쳐 특별한 대우를 받았다고 생각하는가?\n\n(가) 사람들은 예전에 왕에게 신하로 복속하면서 바닷가 모퉁이에 모여 살던 보잘 것 없는 종족이었는데, 우리와 함께 거란(요)을 멸망시키더니 드디어 우리를 모욕하고 그 간사함과 횡포가 더욱 심해지고 있다."}, "options": ["(가) - 별무반을 편성하였다.", "(가) - 누르하치가 건국하였다.", "(나) - 서하와 전쟁을 벌였다.", "(나) - 맹안·모극제를 운영하였다.", "(다) - 5대 10국의 혼란을 수습하였다."], "probs": {"2": 0.69, "1": 0.1, "3": 0.07, "5": 0.06, "4": 0.08}, "others": {"Luna": "5", "Terra": "3", "Sol": "3"}, "image": "images/east-asia-history/page-02.jpg", "page": 2}, {"id": "east-asia-history:7", "subject": "동아시아사", "section": "east-asia-history", "number": 7, "selected": "1", "answer": "3", "points": "2", "visual": true, "state": {"question": "밑줄 친 ‘이 전쟁’이 발생한 시기를 연표에서 옳게 고른 것은?", "passage": "우리나라 도자기는 고금을 통틀어 세계에서 가장 우수하다고 할 수 있다. 도자기 만드는 기술이 발달되어 외국에까지 공적을 끼쳤으니, <u>이 전쟁<\/u> 당시 포로가 되어 일본에 끌려간 조선인의 손에 의해 일본의 도자기업이 개량되고 발전하였다. 일본의 유명한 여러 도자기 가마가 팔산, 이삼평, 거관 등 우리 조선 도공들에 의해 만들어졌다. 그러므로 일본 도자기업의 역사를 논할 때 조선을 빼놓고 말할 수 없을 것이다.\n- 『○○일보』 -", "visual_description": "가로 연표에 왼쪽부터 ‘삼포(3포) 왜란’, ‘나가시노 전투’, ‘센고쿠 시대 통일’, ‘에도 막부 수립’, ‘사르후 전투’, ‘정묘호란’이 차례로 표시되어 있다. 연표의 칸은 (가)부터 (마)까지 표시되어 있으며, (가)에는 ‘삼포(3포) 왜란’, (나)에는 ‘나가시노 전투’, (다)에는 ‘센고쿠 시대 통일’, (라)에는 ‘에도 막부 수립’, (마)에는 ‘사르후 전투’가 들어 있고, ‘정묘호란’은 (마)의 오른쪽에 표시되어 있다."}, "options": ["(가)", "(나)", "(다)", "(라)", "(마)"], "probs": {"2": 0.02, "4": 0.01, "3": 0.01, "1": 0.95, "5": 0.01}, "others": {"Luna": "4", "Terra": "3", "Sol": "3"}, "image": "images/east-asia-history/page-02.jpg", "page": 2}, {"id": "east-asia-history:8", "subject": "동아시아사", "section": "east-asia-history", "number": 8, "selected": "5", "answer": "2", "points": "3", "visual": false, "state": {"question": "밑줄 친 ‘황제’의 재위 시기 동아시아에서 있었던 사실로 옳은 것은? [3점]", "passage": "국왕이 아뢰기를, “일개 섬 오랑캐가 지세가 험한 것을 믿고 입조(入朝)하지 않으며 감히 천자의 군대에 항거하고 있습니다. 신(臣)이 생각하건대 다시 배를 건조하고 양곡을 비축한 다음, 오랑캐의 죄상을 성토하고 함께 토벌에 나선다면 지난번과 달리 이번에는 반드시 성공할 것입니다.”라고 하였다. <u>황제<\/u>가 말하기를, “왕은 개경으로 돌아가 재상들과 깊이 의논한 다음 사람을 보내서 아뢰도록 하라.”라고 하였다."}, "options": ["금이 멸망하였다.", "남송이 정복되었다.", "천계령이 해제되었다.", "오닌의 난이 발생하였다.", "정화의 함대가 파견되었다."], "probs": {"1": 0.19, "3": 0.03, "5": 0.48, "2": 0.27, "4": 0.03}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/east-asia-history/page-02.jpg", "page": 2}, {"id": "east-asia-history:10", "subject": "동아시아사", "section": "east-asia-history", "number": 10, "selected": "1", "answer": "2", "points": "3", "visual": true, "state": {"question": "밑줄 친 ‘이 도시’를 지도에서 옳게 고른 것은? [3점]", "passage": "자료는 19세기 후반 <u>이 도시<\/u>의 모습입니다. 성안에는 과거 시험장, 순무부원, 장군아문, 해관이 보이고, 성 밖에는 ○○강에 인접한 외국 상관이 보입니다. 서양 상인을 감독하고 무역을 전담하는 상인 조합이 이 도시에서 활동하였으나, 전쟁 후에 폐지되었습니다. 이후 하단에 보이는 사면에 영국과 프랑스의 조계가 설치되었습니다.", "visual_description": "위쪽 자료 그림은 성곽과 수로가 표시된 도시 지도이다. 성안 위쪽에 ‘과거 시험장’, 중앙에 ‘순무부원’, 그 아래에 ‘장군아문’, 오른쪽 성벽 부근에 ‘해관’이 표시되어 있다. 성 밖 오른쪽에는 물길을 따라 ‘외국 상관’이 표시되어 있고, 그 아래쪽에 ‘사면’이 표시되어 있다. 순무부원 오른쪽과 장군아문 위쪽에 각각 ‘○○’로 가려진 지명이 있으며, 지도 위쪽에는 점선으로 표시된 가려진 표지가 하나 있다.\n\n아래 선택 지도는 중국 동부와 한반도, 일본, 타이완 및 동남아시아 일부를 나타낸다. 검은 점 다섯 개의 위치가 (가)～(마)로 표시되어 있다. (가)는 중국 남부 해안의 남중국해 연안, (나)는 중국 남동부 해안에서 타이완 해협 서쪽보다 더 남서쪽인 연안, (다)는 중국 동부 해안의 양쯔강 하구 부근, (라)는 중국 북동부의 보하이만 북쪽 연안 부근, (마)는 일본 혼슈 중동부의 태평양 연안에 있다."}, "options": ["(가)", "(나)", "(다)", "(라)", "(마)"], "probs": {"3": 0.25, "2": 0.23, "1": 0.38, "4": 0.13, "5": 0.01}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/east-asia-history/page-02.jpg", "page": 2}, {"id": "east-asia-history:13", "subject": "동아시아사", "section": "east-asia-history", "number": 13, "selected": "1", "answer": "5", "points": "3", "visual": false, "state": {"question": "(가)에 대한 설명으로 <u>옳은<\/u> 것은? [3점]", "passage": "동아시아사 신문\n\n동아시아에서 신흥 열강인 ○○와/과 □□의 충돌을 분석하다\n\n전쟁이 경과하면서 유럽의 채무국이던 ○○이/가 일약 채권국이 되자 그 경제 세력은 천하를 능가하게 되었다. 그에 따라 동아시아에서 ○○와/과 □□이/가 충돌하게 되자, 이에 야심이 남보다 매우 큰 ○○은/는 문호 개방과 기회 균등을 요구하며 열강의 세력권 분배를 타파하려 하였다. 이러한 상황이 일어난 원인은 열강이 전쟁 중에 있어 □□이/가 동아시아 시장을 거의 독점하면서 중국으로 하여금 (가)까지 조인하게 하였기 때문이다."}, "options": ["타이완이 일본에 할양되는 계기가 되었다.", "닉슨의 대아시아 정책 발표에 영향을 받았다.", "주력함 보유 비율을 조정하여 군비 축소를 규정하였다.", "서양 열강들이 일본의 산둥반도 이권 승인을 명시하였다.", "일본이 다롄 등을 조차하는 기간을 연장하는 근거가 되었다."], "probs": {"3": 0.07, "1": 0.71, "5": 0.14, "2": 0.03, "4": 0.05}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/east-asia-history/page-03.jpg", "page": 3}, {"id": "east-asia-history:16", "subject": "동아시아사", "section": "east-asia-history", "number": 16, "selected": "1", "answer": "4", "points": "3", "visual": true, "state": {"question": "(가) 사건이 전개된 시기에 있었던 사실로 옳은 것만을 <보기>에서 고른 것은? [3점]", "passage": "소설 속 이 장면은 (가) 당시 마오쩌둥을 추종하며 활동했던 ○○병의 폭력적인 모습을 묘사하고 있어요. 이 소설은 대약진 운동의 실패로 약화된 마오쩌둥의 정치적 위상을 재정립하고, 주자파 등을 숙청하기 위해 추진된 (가)을/를 배경으로 하고 있어요.\n\n문학으로 읽는 중국의 격동기\n세 명의 학생들이 키득거리며 두 아이를 밀쳐 내더니 그 가운데 장발의 선웨이가 쑹란핑에게 말했다. “우리 ○○병들인데 집을 몰수하러 왔다.” …(중략)… ○○병들은 쑹란핑네 집에서 오후 내내 부수고 슬쩍 하다가 더 이상 부술 것도 가져갈 것도 없자 휘파람을 불며 문을 나섰다. 그들의 주머니가 빵빵해진 뒤였다.\n- 위화, 『형제』 -\n\n<보기>\nㄱ. 베트남 공화국이 수립되었다.\nㄴ. 중·일 공동 성명이 발표되었다.\nㄷ. 일본과 타이완의 국교가 회복되었다.\nㄹ. 10월 유신의 선포로 유신 체제가 성립되었다.", "visual_description": "상단에는 소설 장면과 (가) 사건의 배경을 설명하는 말풍선이 있고, 그 아래 화면 형태의 틀 안에 ‘문학으로 읽는 중국의 격동기’라는 제목과 소설 인용문이 제시되어 있다. 화면 오른쪽에는 설명하는 여성의 삽화가 있다. 아래에는 <보기> 상자가 있다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"3": 0.1, "1": 0.45999999999999996, "5": 0.07, "2": 0.2, "4": 0.17}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/east-asia-history/page-04.jpg", "page": 4}, {"id": "east-asia-history:17", "subject": "동아시아사", "section": "east-asia-history", "number": 17, "selected": "5", "answer": "3", "points": "3", "visual": true, "state": {"question": "(가), (나)에 대한 설명으로 옳은 것은? [3점]", "passage": "동아시아사 연구\n\n[특집 기획] 전범 재판, 어떻게 이루어졌나?\n\n연합국은 일본의 전쟁 책임을 묻기 위해 (가)을/를 열어 도조 히데키 등을 기소하여 A급 전범으로 처벌하였다. 한편, B·C급 전범 재판은 아시아 곳곳에 설치된 전범 재판소에서 개별적으로 진행되었다. 이들 재판에서 일본에 의해 끌려가 포로 감시원 등으로 복무한 군속(軍屬)들도 전범으로 선고받았다. 이후 미국의 주도로 체결되면서 연합국과 일본 간 전쟁 상태의 공식적 종료를 명시한 (나)의 제11조에서 “일본은 연합국 군사 재판의 판결을 존중하고 형을 집행한다.”라고 규정하였다. 이 조항은 B·C급 전범에게도 그대로 적용되었다.", "visual_description": "신문 또는 잡지 기사처럼 꾸민 직사각형 자료이다. 맨 위 중앙에 ‘동아시아사 연구’라는 제목이 있고, 그 아래 회색 띠에 특집 제목이 있으며, 본문 안의 (가)와 (나)는 각각 작은 사각형 칸 안에 표시되어 있다."}, "options": ["(가) - 국제 연합[UN]이 창설되는 계기가 되었다.", "(가) - 연합국 최고 사령부[SCAP/GHQ] 설치의 배경이 되었다.", "(나) - 6·25 전쟁 중에 체결되었다.", "(나) - 경찰 예비대 창설의 원인이 되었다.", "(나) - 신헌법(평화 헌법) 제정에 영향을 끼쳤다."], "probs": {"2": 0.14, "3": 0.03, "1": 0.03, "4": 0.07, "5": 0.73}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/east-asia-history/page-04.jpg", "page": 4}, {"id": "east-asia-history:18", "subject": "동아시아사", "section": "east-asia-history", "number": 18, "selected": "3", "answer": "2", "points": "2", "visual": true, "state": {"question": "(가), (나) 국가에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "수신자: ○○○ 각하\n발신자: 저우언라이 외무부장\n\n우리 임시 정부를 대신하여 각하께 위대한 승리를 진심으로 축하드립니다. 우리는 각하의 숭고한 지도력과 (가)의 훌륭한 저항 정신에 대해 깊이 감탄하고 있습니다. 각하께서 잘 알고 계시듯이, 일전에 임시 대총통을 지내신 쑨원 선생께서 살아 계실 때 광둥에서 공산당과의 협력을 지원한 (가)은/는 폭력배 국가들과 인접하고 있으니 인류 공동의 적을 무찌르기 위해서 다른 평화 애호국들과 협력해야만 합니다. 최근 폭력배 국가가 정박 중이던 (나) 함대를 갑작스럽게 공격하면서 위험천만한 사건을 일으키자, (나)의 대통령께서 폭력배 국가를 적국으로 선포하였습니다. 이에 각하께서 평화 애호국들과 함께 전력을 다해 맞서 싸우신다면 폭력배 국가는 예상했던 것보다 더 빨리 무해해질 것입니다.\n\n<보기>\nㄱ. (가) - 수도를 충칭으로 옮겨 항일전을 전개하였다.\nㄴ. (나) - 타이완 등을 방위선에 포함하지 않는 선언을 발표하였다.\nㄷ. (가)와 (나) - 카이로 회담에 수뇌부가 연합국 대표로 참여하였다.", "visual_description": "겹쳐진 문서 형태의 틀 안에 수신자와 발신자, 편지 본문이 제시되어 있다. 그 아래 별도의 <보기> 상자에 ㄱ, ㄴ, ㄷ 진술이 배열되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"5": 0.15, "2": 0.07, "1": 0.31, "3": 0.37, "4": 0.1}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/east-asia-history/page-04.jpg", "page": 4}, {"id": "economics:1", "subject": "경제", "section": "economics", "number": 1, "selected": "3", "answer": "1", "points": "2", "visual": false, "state": {"question": "다음 자료에 대한 설명으로 옳은 것은? (단, A, B는 각각 가계, 기업 중 하나임.)", "passage": "경제 주체 A와 B 간의 화폐의 흐름으로 민간 경제 순환을 설명할 수 있다. 실물 제공에 대한 대가로 (가) 시장에서 B로부터 A로 이동하는 화폐는 A에게 ㉠ 판매 수입이 되고, (나) 시장에서 A로부터 B로 이동하는 화폐는 B에게 ㉡ 소득이 된다."}, "options": ["A는 이윤 극대화를 추구한다.", "A는 (가) 시장에서 수요자이다.", "B는 생산 활동의 주체이다.", "가족의 식사를 위한 식재료 구입은 (나) 시장에서 이루어진다.", "㉡과 달리 ㉠은 소비 활동의 원천이 된다."], "probs": {"5": 0.11, "1": 0.03, "3": 0.65, "4": 0.19, "2": 0.02}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/economics/page-01.jpg", "page": 1}, {"id": "economics:4", "subject": "경제", "section": "economics", "number": 4, "selected": "1", "answer": "3", "points": "2", "visual": false, "state": {"question": "다음 자료에 대한 분석으로 옳은 것은?", "passage": "X재 시장에서 소비자는 갑, 을만, 생산자는 A, B만 존재한다. 표는 X재 1개 추가 소비에 따른 소비자의 최대 지불 용의 금액과 X재 1개 추가 생산에 따른 생산자의 최소 요구 금액을 나타낸다. 단, 각 소비자와 생산자는 X재를 1개씩 3개까지 거래하고 X재는 시장 균형에서 거래된다.\n\n(단위: 달러)\n구분 | 최대 지불 용의 금액: 갑 | 최대 지불 용의 금액: 을 | 최소 요구 금액: A | 최소 요구 금액: B\n첫 번째 X재 | 9 | 6 | 3 | 5\n두 번째 X재 | 8 | 5 | 5 | 6\n세 번째 X재 | 7 | 3 | 7 | 9\n\n최근 정부는 ㉠ <u>을에게 X재 1개당 2달러의 보조금을 지급하는 정책을<\/u> 검토 중이다."}, "options": ["균형 거래량은 5개이다.", "시장 판매 수입은 21달러이다.", "가격이 4달러일 때 4개의 초과 수요가 발생한다.", "㉠이 시행되면 균형 가격은 2달러 상승한다.", "㉠이 시행되면 X재 시장의 생산자 잉여는 감소한다."], "probs": {"2": 0.25, "1": 0.39, "4": 0.1, "5": 0.13, "3": 0.13}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/economics/page-01.jpg", "page": 1}, {"id": "economics:6", "subject": "경제", "section": "economics", "number": 6, "selected": "3", "answer": "1", "points": "2", "visual": true, "state": {"question": "다음 자료에 대한 옳은 분석만을 <보기>에서 고른 것은?", "passage": "그림은 X재 시장에서 발생한 균형점의 이동을 나타낸다. t기에 X재와 대체 관계에 있는 Y재의 가격 변동으로 인해 균형점이 E에서 A로 이동하였다. t+1기에 X재 생산자 수의 변동, X재와 보완 관계에 있는 Z재의 가격 변동으로 인해 균형점이 A에서 B로 이동하였다. t+2기에 균형점이 B에서 E로 이동하였다. 단, Y재와 Z재는 모두 수요와 공급 법칙을 따르고 서로 연관 관계가 없다.\n\n<보기>\nㄱ. t기 Y재의 가격은 상승하였다.\nㄴ. t+1기 X재 생산자 수는 증가하였다.\nㄷ. t+1기 나타난 Z재 가격 변동 요인으로 Z재의 원료 가격 하락을 들 수 있다.\nㄹ. t+2기 균형점의 이동은 X재 수요의 변동만으로 나타났다.", "visual_description": "가격-수량 그래프가 있다. 세로축은 ‘가격’, 가로축은 ‘수량’이며 원점은 ‘0’으로 표시되어 있다. ‘공급’으로 표시된 우상향 직선과 ‘수요’로 표시된 우하향 직선이 점 E에서 교차한다. 공급선 위에서 E의 오른쪽 위에 점 A가 있고, 수요선 위에서 E의 오른쪽 아래에 점 B가 있다. E에서 A 방향으로 공급선과 평행한 우상향 화살표가 있고, E에서 B 방향으로 수요선과 평행한 우하향 화살표가 있다. 또한 A와 B는 같은 수량 위치에 있으며 A에서 B 방향으로 수직 하향 화살표가 표시되어 있다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"2": 0.36, "5": 0.07, "1": 0.16, "3": 0.38, "4": 0.03}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/economics/page-02.jpg", "page": 2}, {"id": "economics:9", "subject": "경제", "section": "economics", "number": 9, "selected": "4", "answer": "1", "points": "3", "visual": true, "state": {"question": "다음 자료에 대한 분석으로 옳은 것은? [3점]", "passage": "<자료 1>은 2024년 갑국의 경상 수지를 항목별로 나타낸 표이고, <자료 2>는 2024년 경상 수지 항목별 갑국 수취액 대비 을국과 병국 수취액의 비율을 각각 나타낸 표의 일부이다. 단, 국제 거래는 갑국과 을국 간, 갑국과 병국 간에만 이루어진다.\n\n<자료 1>\n경상 수지(억 달러)\n\n| 상품 수지 | 서비스 수지 | 본원 소득 수지 | 이전 소득 수지 |\n|---:|---:|---:|---:|\n| 100 | −25 | 30 | −15 |\n\n<자료 2>\n\n| 구분 | 갑국 수취액 대비 을국 수취액의 비율(%) | 갑국 수취액 대비 병국 수취액의 비율(%) |\n|---|---:|---:|\n| 상품 수지 | 30 | 20 |\n| 서비스 수지 | 300 | 50 |\n| 본원 소득 수지 | 25 | 25 |\n| 이전 소득 수지 | [가려져 있음] | [가려져 있음] |", "visual_description": "<자료 1>과 <자료 2>가 각각 표로 제시되어 있다. <자료 2>의 마지막 행인 ‘이전 소득 수지’ 행에서 두 비율 칸의 내용은 흰색의 불규칙한 물결 모양 띠로 가려져 보이지 않는다."}, "options": ["갑국의 상품 수지 수취액은 갑국의 상품 수지 지급액의 2배이다.", "을국의 서비스 수지는 적자이다.", "갑국은 해외 무상 원조액이 포함되는 항목의 지급액이 15억 달러보다 작다.", "을국은 해외 투자에 따른 배당금이 포함되는 항목의 수취액이 병국보다 크다.", "갑국의 경상 수지는 갑국의 통화량 감소 요인이다."], "probs": {"2": 0.26, "1": 0.22, "3": 0.11, "4": 0.3, "5": 0.11}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/economics/page-02.jpg", "page": 2}, {"id": "economics:10", "subject": "경제", "section": "economics", "number": 10, "selected": "5", "answer": "2", "points": "2", "visual": false, "state": {"question": "다음 자료에 대한 옳은 분석 및 추론만을 <보기>에서 있는 대로 고른 것은? (단, 제시된 자료 이외의 다른 조건은 고려하지 않음.)", "passage": "표는 갑의 동영상 공유 서비스 A, B, C가 제공하는 콘텐츠 이용에 따른 1년간 편익, 월 이용료, 사은품으로부터 얻는 편익을 나타낸다. 갑은 동영상 공유 서비스를 중도 해지 없이 1년 단위로 이용한다.\n\n(단위: 만 원)\n\n| 구분 | A | B | C |\n|---|---:|---:|---:|\n| 콘텐츠 이용에 따른 1년간 편익 | 50 | 40 | 50 |\n| 월 이용료 | 3 | 2 | 2.5 |\n| 사은품으로부터 얻는 편익 | (가) | (나) | 0 |\n\n1차 년도에 갑은 A～C 중 A를 선택하여 1년 동안 이용하였는데, 만료 시점에 A～C의 조건이 변경되었음을 알게 되었다. A는 월 이용료가 1회 면제되고 동일한 사은품이 제공된다. B는 사은품이 제공되지 않고, 이용 가능 콘텐츠가 증가하여 갑에게 ㉠ 추가 편익이 발생한다. C는 B에서 제공되었던 동일한 사은품이 제공된다. 이에 갑은 2차 년도에 A～C 중 하나를 다시 선택하고자 한다. 단, 동일한 사은품으로부터 얻는 편익은 변함이 없고 갑은 편익과 기회비용만을 고려하여 합리적으로 선택한다.\n\n<보기>\nㄱ. (가)가 ‘9’이면 (나)는 ‘8’이 될 수 있다.\nㄴ. ㉠이 7만 원보다 작고 (나)가 3보다 작으면 2차 년도에 갑은 A를 선택한다.\nㄷ. 2차 년도에 갑이 C를 선택한다면 (나)는 ‘2’가 될 수 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"4": 0.23, "1": 0.1, "2": 0.21, "5": 0.3, "3": 0.16}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/economics/page-02.jpg", "page": 2}, {"id": "economics:11", "subject": "경제", "section": "economics", "number": 11, "selected": "5", "answer": "4", "points": "2", "visual": false, "state": {"question": "표는 갑국의 연도별 고용 관련 지표의 전년 대비 변화율을 나타낸다. 이에 대한 옳은 분석만을 <보기>에서 고른 것은?", "passage": "(전년 대비, 단위: %)\n\n| 구분 | t년 | t+1년 | t+2년 |\n|---|---:|---:|---:|\n| 15세 이상 인구 | 3 | 10 | -10 |\n| 취업자 수 | 8 | 12 | 0 |\n| 비경제 활동 인구 | -5 | 11 | -10 |\n\n<보기>\nㄱ. t+1년 고용률은 t년보다 낮다.\nㄴ. t+1년 경제 활동 참가율은 t년보다 낮다.\nㄷ. t+2년 15세 이상 인구는 t년과 같다.\nㄹ. t+2년 실업률은 t+1년보다 낮다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"2": 0.11, "1": 0.17, "4": 0.25, "3": 0.07, "5": 0.4}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/economics/page-03.jpg", "page": 3}, {"id": "economics:12", "subject": "경제", "section": "economics", "number": 12, "selected": "5", "answer": "4", "points": "3", "visual": true, "state": {"question": "다음 자료에 대한 분석 및 추론으로 옳은 것은? [3점]", "passage": "그림은 갑국 국민 경제 균형점의 이동을 나타낸다. 국민 경제 균형점 E가 t기에 순수출 변동에 의해서만 A로 이동하였다. t+1기에는 정부의 세율 조정과 수입 원자재 가격 변동에 의해서 균형점이 A에서 B로 이동하였으나 물가 수준은 변하지 않았다. 단, 총수요 곡선은 우하향하는 직선이고 총공급 곡선은 우상향하는 직선이다.", "visual_description": "좌표 그림의 세로축은 ‘물가’, 가로축은 ‘실질 GDP’로 표시되어 있고 원점에는 ‘0’이 표시되어 있다. 점 E에서 세로축 방향과 가로축 방향으로 각각 점선 안내선이 그어져 있다. 점 A는 E의 오른쪽 위에 있으며, E에서 A를 향하는 우상향 화살표가 있다. 점 B는 A의 왼쪽에 있고 A와 같은 높이에 있으며, A에서 B를 향하는 왼쪽 방향의 수평 화살표가 있다. B는 E의 왼쪽 위에 있다. 점 A에서는 아래쪽으로 짧은 세로 점선 안내선이 그어져 있다."}, "options": ["t기에 총공급은 감소하였다.", "t기에 순수출은 감소하였다.", "t+1기에 정부는 세율을 인하하였다.", "t+1기에 수입 원자재 가격은 상승하였다.", "t+1기에 시행된 세율 조정 대신 지급 준비율이 인하되었더라도 균형점의 이동 방향은 같다."], "probs": {"5": 0.56, "3": 0.06, "1": 0.11, "4": 0.24, "2": 0.03}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/economics/page-03.jpg", "page": 3}, {"id": "economics:13", "subject": "경제", "section": "economics", "number": 13, "selected": "2", "answer": "5", "points": "2", "visual": true, "state": {"question": "그림은 형성 평가지이다. 이에 대한 설명으로 옳은 것은?", "passage": "《형성 평가》\n이름: ○○○\n\n[문제] 표는 갑의 9월 모든 수입과 지출 내역을 나타낸다. <질문 1>, <질문 2>에 답하시오. [질문 1개당 맞으면 1점, 틀리면 0점을 부여함.]\n\n(단위: 만 원)\n\n| 수입 항목 | 수입 금액 | 지출 항목 | 지출 금액 |\n|---|---:|---|---:|\n| 월급 | 650 | 재산세 | ㉠ |\n| 명절 상여금 | 100 | 식료품비 | 200 |\n| 주식 배당금 | 30 | 교육비 | 120 |\n| 경조금 | 20 | 대출 이자 | 80 |\n\n* 처분 가능 소득 = 소득 - 비소비 지출\n** 저축 = 처분 가능 소득 - 소비 지출\n\n<질문 1> 소득 대비 처분 가능 소득의 비율은? ( 80 ) %\n<질문 2> 소득 대비 저축의 비율은? ( ㉡ ) %\n\n점수 / 배점　2점 / 2점", "visual_description": "한 장의 형성 평가지가 직사각형 테두리 안에 제시되어 있다. 상단 중앙에 ‘《형성 평가》’, 오른쪽에 ‘이름: ○○○’이 있다. <질문 1>의 괄호 안에는 ‘80’이 기입되어 있다. 하단 오른쪽의 점수표에는 ‘점수 / 배점’ 옆에 ‘2점 / 2점’이 표시되어 있으며, 첫 번째 ‘2’가 손글씨처럼 기입되어 있다."}, "options": ["㉠은 ‘80’이고, ㉡은 ‘55’이다.", "근로 소득은 650만 원이다.", "사업 소득은 30만 원이다.", "이전 소득은 비경상 소득의 5배이다.", "총지출 대비 소비 지출의 비율은 70%보다 낮다."], "probs": {"4": 0.02, "5": 0.07, "3": 0.01, "1": 0.36, "2": 0.54}, "others": {"Luna": "2", "Terra": "5", "Sol": "5"}, "image": "images/economics/page-03.jpg", "page": 3}, {"id": "economics:15", "subject": "경제", "section": "economics", "number": 15, "selected": "3", "answer": "5", "points": "2", "visual": false, "state": {"question": "다음 자료에 대한 분석으로 옳은 것은?", "passage": "갑국에는 X재만을 생산하는 A 기업만, 을국에는 Y재만을 생산하는 B 기업만, 병국에는 Z재만을 생산하는 C 기업만 존재한다. 생산비는 임금과 중간재 구입 비용으로만 구성된다. 표는 2024년 각 기업의 생산량과 이윤을 나타낸다. 단, 각 기업은 자국 내에서만 생산하고 생산된 재화는 그 해에 모두 거래되어 소진된다. 또한 교역은 갑국과 을국, 을국과 병국 사이에서만 이루어지고 Y재와 Z재의 가격은 각각 국내외에서 동일하며, 교역에 따른 거래 비용은 없다.\n\n| 구분 | A 기업 | B 기업 | C 기업 |\n|---|---:|---:|---:|\n| 생산량(개) | 200 | 250 | 100 |\n| 이윤(달러) | 1,000 | 1,700 | 1,900 |\n\n◦ A 기업은 노동과 유일한 중간재인 Y재를 사용하여 가격이 15달러인 X재를 생산하며 임금은 생산비의 50%이다. 생산된 X재는 자국에서 최종재로 전량 소비된다.\n◦ B 기업은 노동과 유일한 중간재인 Z재를 사용하여 Y재를 생산하며 중간재 구입 비용은 생산비의 50%이다. 생산된 Y재의 60%는 자국에서 최종재로 소비되며 나머지는 갑국에 수출되어 중간재로만 사용된다.\n◦ C 기업은 중간재 없이 노동만으로 Z재를 생산한다. 생산된 Z재의 80%는 자국에서 최종재로 소비되며 나머지는 을국에 수출되어 중간재로만 사용된다."}, "options": ["생산비는 A 기업이 B 기업보다 작다.", "판매 수입은 B 기업이 C 기업보다 작다.", "지급한 임금이 가장 큰 기업은 C 기업이다.", "갑국의 수입액은 을국의 순수출보다 작다.", "창출한 부가 가치는 갑국과 병국이 같다."], "probs": {"4": 0.14, "5": 0.13, "1": 0.22, "2": 0.12, "3": 0.39}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/economics/page-03.jpg", "page": 3}, {"id": "economics:18", "subject": "경제", "section": "economics", "number": 18, "selected": "5", "answer": "4", "points": "2", "visual": false, "state": {"question": "다음 자료에 대한 분석으로 옳은 것은?", "passage": "표는 2022년∼2024년 갑국과 을국의 연도별 명목 GDP와 전년 대비 실질 GDP 변화율을 나타낸다. 단, 기준 연도는 2021년이고 두 국가의 2021년 명목 GDP는 각각 100억 달러이며, 물가 수준은 GDP 디플레이터로 측정한다.\n\n| 구분 | 갑국 명목 GDP(억 달러) | 갑국 실질 GDP 변화율(%) | 을국 명목 GDP(억 달러) | 을국 실질 GDP 변화율(%) |\n|---|---:|---:|---:|---:|\n| 2022년 | 99 | -10 | 110 | 10 |\n| 2023년 | 99 | 0 | 115 | 10 |\n| 2024년 | 98 | 10 | 115 | -5 |"}, "options": ["갑국의 화폐 가치는 지속적으로 하락하였다.", "을국의 경제 성장률은 지속적으로 높아졌다.", "2022년 갑국의 실질 GDP는 을국보다 크다.", "2023년 갑국의 GDP 디플레이터는 을국보다 크다.", "2024년 갑국의 전년 대비 물가 상승률은 을국보다 높다."], "probs": {"5": 0.57, "2": 0.01, "1": 0.06, "3": 0.02, "4": 0.34}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/economics/page-04.jpg", "page": 4}, {"id": "economics:20", "subject": "경제", "section": "economics", "number": 20, "selected": "1", "answer": "3", "points": "3", "visual": false, "state": {"question": "다음 자료에 대한 분석 및 추론으로 옳은 것은? [3점]", "passage": "같은 노동량을 보유하고 있는 갑국과 을국은 노동만을 생산 요소로 사용하여 직선인 생산 가능 곡선상에서 X재와 Y재만을 생산하고, 비교 우위를 갖는 재화에만 특화하여 양국 모두 이득이 발생하는 교환 비율에서만 교역한다. <표 1>은 갑국과 을국의 재화별 최대 생산 가능량을 나타낸다. <표 2>는 양국 간 X재 1개당 교환되는 Y재의 수량에 따른 갑국과 을국의 이득 발생 여부를 나타내고 이는 양국의 생산 가능 곡선에서 도출된 것이다. 단, 교역은 거래 비용 없이 양국 간에만 이루어진다.\n\n<표 1>\n| 구분 | 재화 | 갑국 | 을국 |\n|---|---|---:|---:|\n| 최대 생산 가능량(개) | X재 | ㉠ | 140 |\n| 최대 생산 가능량(개) | Y재 | 60 | ㉡ |\n\n<표 2>\n| X재 1개당 교환되는 Y재의 수량 | 갑국 이득 발생 여부 (○: 발생함, ×: 발생하지 않음) | 을국 이득 발생 여부 (○: 발생함, ×: 발생하지 않음) |\n|---|---|---|\n| Y재 1개 이상 | × | ○ |\n| Y재 1/2개 초과 1개 미만 | ○ | ○ |\n| Y재 1/2개 이하 | ○ | × |"}, "options": ["㉠은 ‘30’, ㉡은 ‘140’이다.", "갑국은 X재 생산에 특화한다.", "을국은 Y재 생산에 절대 우위를 갖는다.", "갑국은 교역 전 X재 40개, Y재 25개를 동시에 생산할 수 있다.", "양국 간 X재와 Y재의 교환 비율이 3 : 2라면, 을국은 교역으로 인해 Y재 1개당 X재 1/6개의 이득을 얻는다."], "probs": {"2": 0.3, "5": 0.14, "1": 0.36, "4": 0.12, "3": 0.08}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/economics/page-04.jpg", "page": 4}, {"id": "english:36", "subject": "영어", "section": "english", "number": 36, "selected": "1", "answer": "4", "points": "2", "visual": false, "state": {"question": "주어진 첫 문단 다음에 이어질 (A), (B), (C)의 순서로 가장 적절한 것을 고르시오.", "passage": "We usually think of a clock as a physical thing, like an alarm clock or a wristwatch. But a clock is really a process embodied in a machine, and the nature of that process is repetitive. (A) Indeed, it is almost impossible to think of a clock that does not depend on a repetitive cycle of events. The only example that comes to mind readily is a candle marked in hours. But here too there is iteration ― the repeated burning of molecules of wax ― so this too is an iterative process, although at first masked. (B) The use of radiocarbon dating is another, much longer scale clock that also appears to be like this. It seems to yield a smooth time scale but in fact does not: the decay of atoms of carbon-14 is repetitive, although on a large scale it gives the appearance of being continuous. (C) A clock can be almost any process that repeats itself over and over again for an indefinite period. Water clocks drip at a steady pace; quartz crystals vibrate regularly. * molecule: 분자 ** quartz: 석영(石英)"}, "options": ["(A) － (C) － (B)", "(B) － (A) － (C)", "(B) － (C) － (A)", "(C) － (A) － (B)", "(C) － (B) － (A)"], "probs": {"5": 0.03, "3": 0.02, "4": 0.07, "1": 0.83, "2": 0.05}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "../sources/page-6.png", "page": 6}, {"id": "english:37", "subject": "영어", "section": "english", "number": 37, "selected": "1", "answer": "5", "points": "3", "visual": false, "state": {"question": "주어진 첫 문단 다음에 이어질 (A), (B), (C)의 순서로 가장 적절한 것을 고르시오.", "passage": "Philosophy allows us to ask much broader questions than many other scientific disciplines. It is capable of looking at the bigger picture and providing important insights into the relationships between different areas of knowledge. (A) This means that while philosophy can provide valuable insights into theoretical concepts and broader ethical questions, it needs to be supplemented by empirical findings and experiments to reach a more comprehensive understanding. (B) Philosophers tend to ask questions rather than provide definitive answers, and their contributions often consist of challenging established assumptions and proposing new research approaches. However, for a more comprehensive understanding of the nature of consciousness, close collaboration between philosophy and neuroscience is required. (C) Philosophy is particularly important for the interdisciplinary efforts of cognitive science, where it helps to bridge gaps between different disciplines and pioneer new ways for research. Unlike scientific methods, philosophizing is a non-empirical approach that attempts to validate concepts through logical thinking and argumentation. [3점] * empirical: 경험의"}, "options": ["(A) － (C) － (B)", "(B) － (A) － (C)", "(B) － (C) － (A)", "(C) － (A) － (B)", "(C) － (B) － (A)"], "probs": {"3": 0.09, "1": 0.51, "5": 0.07, "2": 0.15, "4": 0.18}, "others": {"Luna": "3", "Terra": "4", "Sol": "5"}, "image": "../sources/page-7.png", "page": 7}, {"id": "english:39", "subject": "영어", "section": "english", "number": 39, "selected": "1", "answer": "3", "points": "3", "visual": false, "state": {"question": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 표시 위치를 고르시오.", "given_sentence": "The difference is that the action in the game world can only be explored through the virtual bodily space of the avatar.", "passage": "A video game has its own model of reality, internal to itself and separate from the player’s external reality, the player’s bodily space and the avatar’s bodily space. ( ① ) The avatar’s bodily space, the potential actions of the avatar in the game world, is the only way in which the reality of the external reality of the game world can be perceived. ( ② ) As in the real world, perception requires action. ( ③ ) Players extend their perceptual field into the game, encompassing the available actions of the avatar. ( ④ ) The feedback loop of perception and action that enables you to navigate the world around you is now one step removed: instead of perceiving primarily through interaction of your own body with the external world, you’re perceiving the game world through interaction of the avatar. ( ⑤ ) The entire perceptual system has been extended into the game world. [3점] * encompass: 둘러싸다"}, "options": ["지문에 표시된 위치 ①", "지문에 표시된 위치 ②", "지문에 표시된 위치 ③", "지문에 표시된 위치 ④", "지문에 표시된 위치 ⑤"], "probs": {"1": 0.53, "3": 0.05, "4": 0.09, "2": 0.22, "5": 0.11}, "others": {"Luna": "2", "Terra": "2", "Sol": "3"}, "image": "../sources/page-7.png", "page": 7}, {"id": "ethics-thought:6", "subject": "윤리와 사상", "section": "ethics-thought", "number": 6, "selected": "5", "answer": "1", "points": "3", "visual": true, "state": {"question": "(가)의 고대 서양 사상가 갑, 중세 서양 사상가 을의 입장을 (나) 그림으로 표현할 때, A～C에 해당하는 진술로 적절한 것만을 <보기>에서 고른 것은? [3점]", "passage": "(가)\n갑: 인간의 목적은 만물을 위한 공통의 법에 따라 사는 삶이다. 공통의 법은 다름이 아니라 만물을 관통하는 옳은 이성이다. 옳은 이성은 우주 전체를 다스리는 신과 동일하다.\n을: 만물을 다스리는 이성 자체는 신 안에 존재하며 법의 성격을 지닌다. 이런 법은 영원한 법으로 불린다. 이성적 피조물에 의해 탁월한 방식으로 수행되는 영원법 참여가 자연법이다.\n\n(나)\n두 원이 일부 겹치는 벤 다이어그램이다. 왼쪽 원은 ‘갑’, 오른쪽 원은 ‘을’로 표시되어 있다. 왼쪽 원에서 겹치지 않는 부분은 A, 두 원이 겹치는 부분은 B, 오른쪽 원에서 겹치지 않는 부분은 C로 표시되어 있다.\n<범례>\nA: 갑만의 입장\nB: 갑과 을의 공통 입장\nC: 을만의 입장\n\n<보기>\nㄱ. A: 신의 섭리 전체는 자연법 안에 포함된다.\nㄴ. B: 완전한 행복은 인간이 바라는 목적이자 당위이다.\nㄷ. C: 인간 본성의 완성은 신의 계획에 참여하는 것이다.\nㄹ. C: 도덕적 실천을 행한 자라면 자연법 역시 준수한 자이다.", "visual_description": "(나)는 서로 겹치는 두 개의 가로 방향 타원으로 이루어진 벤 다이어그램이다. 왼쪽 타원 위에는 ‘갑’, 오른쪽 타원 위에는 ‘을’이 표시되어 있다. 왼쪽만의 영역은 A, 교집합은 B, 오른쪽만의 영역은 C이다. 오른쪽에는 A가 갑만의 입장, B가 갑과 을의 공통 입장, C가 을만의 입장이라는 범례가 있다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"1": 0.02, "3": 0.33, "4": 0.11, "5": 0.47, "2": 0.07}, "others": {"Luna": "2", "Terra": "3", "Sol": "1"}, "image": "images/ethics-thought/page-02.jpg", "page": 2}, {"id": "ethics-thought:7", "subject": "윤리와 사상", "section": "ethics-thought", "number": 7, "selected": "1", "answer": "3", "points": "3", "visual": true, "state": {"question": "다음은 한국 유교 사상가 갑, 을의 가상 대화이다. 갑, 을의 입장으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "갑: 사단은 이(理)가 발(發)하여 기(氣)가 그것을 따를 때에 나타나는 감정[情]이고, 칠정은 기가 발하고 이가 그것을 탈 때에 나타나는 감정입니다.\n을: 그렇지 않습니다. 사단과 칠정은 모두 기가 발하고 이가 그것을 타는 한 가지 길[一途]을 따라서만 나타납니다. 왜냐하면 이(理)는 원리와 근거가 되고 실제로 작용하는 것은 기이기 때문입니다.\n\n<보기>\nㄱ. 갑: 이(理)의 통제를 받아도 칠정은 선한 감정이 될 수 없다.\nㄴ. 을: 기질을 교정해도 본연지성은 절대 변화시킬 수 없다.\nㄷ. 을: 성실함[誠]은 하늘의 도(道)와 구분되는 인간만의 도이다.\nㄹ. 갑과 을: 사양지심과 슬픔은 모두 성(性)이 발현된 감정이다.", "visual_description": "전통 복식과 모자를 착용한 두 인물이 마주 서 있다. 왼쪽 인물은 ‘갑’, 오른쪽 인물은 ‘을’로 표시되어 있으며, 각 인물 위의 말풍선에 해당 대사가 적혀 있다. 을은 한 손을 내밀고 있다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "probs": {"1": 0.44, "3": 0.28, "5": 0.07, "2": 0.15, "4": 0.06}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/ethics-thought/page-02.jpg", "page": 2}, {"id": "ethics-thought:10", "subject": "윤리와 사상", "section": "ethics-thought", "number": 10, "selected": "3", "answer": "5", "points": "2", "visual": false, "state": {"question": "동양 불교 사상가 갑, 을의 입장으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "갑: 무릇 현상적 존재는 모두 공하다[諸法皆空]. 생겨나지도 않고 소멸하지도 않으며, 불연속도 아니고 연속도 아니며, 같은 것도 아니고 다른 것도 아니며, 오는 것도 아니고 가는 것도 아니다.\n을: 오직 의식만이 존재할 뿐, 그 대상은 존재하지 않는다[唯識無境]. 마치 사람 눈에 백태가 끼면 터럭이나 두 개의 달이 보이듯이 실재하지 않는 대상이 허망하게 나타나 보이는 것일 뿐이다.\n\n<보기>\nㄱ. 갑: 자아는 공하지만 그것을 구성하는 요소[法]는 실재한다.\nㄴ. 을: 의식의 근원을 청정하게 하면 일체의 실상을 볼 수 있다.\nㄷ. 을: 요가 수행을 통해 열반(涅槃)의 경지에 도달해야 한다.\nㄹ. 갑과 을: 만물은 서로 의존적이므로 고유한 본성[自性]이 없다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "probs": {"4": 0.01, "1": 0.04, "2": 0.04, "5": 0.37, "3": 0.54}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/ethics-thought/page-02.jpg", "page": 2}, {"id": "ethics-thought:11", "subject": "윤리와 사상", "section": "ethics-thought", "number": 11, "selected": "2", "answer": "3", "points": "3", "visual": true, "state": {"question": "(가)의 근대 서양 사상가 갑, 을의 입장을 (나) 그림으로 탐구하고자 할 때, A～C에 들어갈 적절한 질문만을 <보기>에서 고른 것은? [3점]", "passage": "(가)\n갑: 이성은 정념의 노예이고 또한 그래야만 한다. 이성은 정념에 봉사하고 복종하는 것 외에 다른 그 어떤 임무도 요구할 수 없다.\n을: 신은 절대적으로 무한한 존재, 즉 무한한 본질을 표현하는 무한한 속성들로 이루어진 실체이다. 개별적 사물은 신의 속성을 특정한 방식으로 표현하는 양태이다.\n\n(나) 그림\n\n<보기>\nㄱ. A: 선악 판단에 대한 설명은 인간의 자연 본성에 기초하는가?\nㄴ. B: 개인의 승인 감정은 자신의 이해 관심에서 벗어날 수 있는가?\nㄷ. C: 비인격적인 신에 대해서 사랑의 정서를 지닐 수 있는가?\nㄹ. C: 지금 내게 일어난 사건 대신에 다른 사건이 일어날 수 있는가?", "visual_description": "(나)는 사상가 갑, 을의 입장을 탐구하는 흐름도이다. 맨 위 직사각형에는 ‘사상가 갑, 을의 입장을 탐구한다.’라고 쓰여 있다. 아래의 마름모 A로 화살표가 이어진다. A에서 ‘예’라고 표시된 아래 방향 화살표는 마름모 B로 이어지고, B에서 ‘예’라고 표시된 아래 방향 화살표는 ‘갑의 입장’이라고 쓰인 아래 변이 물결 모양인 도형으로 이어진다. A에서 ‘아니요’라고 표시된 오른쪽 방향의 점선 화살표는 마름모 C로 이어지고, C에서 ‘예’라고 표시된 아래 방향 화살표는 ‘을의 입장’이라고 쓰인 아래 변이 물결 모양인 도형으로 이어진다. 범례에는 직사각형이 ‘출발 조건’, 마름모가 ‘판단 내용’, 실선 화살표가 ‘판단 방향’, 아래쪽이 물결 모양인 도형이 ‘사상가의 입장’을 뜻한다고 표시되어 있다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"1": 0.15, "2": 0.42, "3": 0.22, "5": 0.12, "4": 0.09}, "others": {"Luna": "2", "Terra": "3", "Sol": "3"}, "image": "images/ethics-thought/page-03.jpg", "page": 3}, {"id": "ethics-thought:14", "subject": "윤리와 사상", "section": "ethics-thought", "number": 14, "selected": "2", "answer": "4", "points": "3", "visual": false, "state": {"question": "고대 서양 사상가 갑, 을의 입장으로 <u>옳지 않은<\/u> 것은? [3점]", "passage": "갑: 국가와 개인은 서로 닮았기 때문에 우리가 이미 국가에서 보았던 정의(正義)를 개인에게서도 볼 수 있는 것이다. 지혜, 용기, 절제도 이와 마찬가지이다.\n을: 국가는 여타의 다른 공동체를 포괄하는 최고의 공동체이다. 그리고 모든 공동체는 어떤 선을 목표로 한다. 따라서 국가의 선은 다른 선들을 포괄하는 최고의 선을 목표로 한다."}, "options": ["갑: 국가의 정의와 개인의 정의는 구조에서 유사성을 지닌다.", "갑: 국가의 통치자는 생산자 계층의 소유물을 착취해서는 안 된다.", "을: 국가가 없다면 시민의 도덕적 능력을 완전히 계발할 수 없다.", "을: 국가는 다른 공동체의 완전한 선의 실현을 위한 수단이다.", "갑과 을: 국가의 존재 목적은 단지 생존만이 아니라 좋음의 추구이다."], "probs": {"1": 0.04, "5": 0.06, "4": 0.13, "3": 0.11, "2": 0.66}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/ethics-thought/page-03.jpg", "page": 3}, {"id": "ethics-thought:17", "subject": "윤리와 사상", "section": "ethics-thought", "number": 17, "selected": "3", "answer": "2", "points": "2", "visual": false, "state": {"question": "다음을 주장한 고대 서양 사상가의 입장으로 옳은 것만을 <보기>에서 고른 것은?", "passage": "눈의 탁월성은 보는 기능을 잘 수행하게 만들고 그 눈을 좋은 눈으로 만든다. 발의 탁월성은 걷는 기능을 잘 수행하게 만들고 그 발을 좋은 발로 만든다. 그렇다면 인간 자체에도 어떤 기능이 있지 않을까? 영양 섭취와 생장은 인간뿐 아니라 식물에도 있으니 인간 영혼으로부터 제외해야 한다. 감각은 인간뿐 아니라 동물에도 있으니 제외해야 한다. 남는 것은 이성에 따른 영혼의 활동이니 이것이 곧 행복이다.\n\n<보기>\nㄱ. 인간의 영혼 안에 있는 욕구적 부분에만 귀속되는 덕이 있다.\nㄴ. 좋은 분별력은 품성적 덕을 동반할 뿐 그 자체가 덕은 아니다.\nㄷ. 삶의 목적적 위계의 최정점은 좋음의 위계의 최정점과 같다.\nㄹ. 덕을 실현하고자 노력한 사람은 행복한 사람일 수밖에 없다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"1": 0.17, "2": 0.23, "3": 0.3, "4": 0.08, "5": 0.22}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/ethics-thought/page-04.jpg", "page": 4}, {"id": "ethics-thought:19", "subject": "윤리와 사상", "section": "ethics-thought", "number": 19, "selected": "1", "answer": "3", "points": "3", "visual": false, "state": {"question": "다음을 주장한 사회사상가의 입장으로 옳은 것만을 <보기>에서 고른 것은? [3점]", "passage": "전쟁 상태를 벗어나기 위한 인간의 화합은 신의계약에 의해서만 이루어진다. 그 화합을 영속하기 위해서는, 공동 이익에 맞게 행동하도록 지도하는 공통의 권력이 필요하다. 이를 확립하는 유일한 길은 모든 사람의 의지를 다수결에 의해 하나의 의지로 결집하는 것, 즉 모두의 힘을 한 사람에게 양도하는 것이다. 이때 양도받은 자가 주권자이며, 모두의 대리인이다.\n\n<보기>\nㄱ. 주권자가 시민에게 죽음을 명령하면 그는 복종해야 한다.\nㄴ. 자연 상태에 있는 한, 자기 보존 노력은 자기 소멸 위험으로 이어진다.\nㄷ. 주권자는 대리인임에도 불구하고 모든 시민의 힘을 임의대로 사용할 수 있다.\nㄹ. 국가 설립에 반대하는 자는 계약이 체결된다고 해도 계약에 종속되지 않는다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"4": 0.02, "5": 0.01, "2": 0.08, "1": 0.82, "3": 0.07}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/ethics-thought/page-04.jpg", "page": 4}, {"id": "fishery-maritime:15", "subject": "수산·해운 산업 기초", "section": "fishery-maritime", "number": 15, "selected": "4", "answer": "5", "points": "2", "visual": true, "state": {"question": "다음 여행기에서 작성자가 체험한 해양 관광에 대한 설명으로 적절한 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "[여행기]\nDay 1\n○○섬 도착\n조개 캐기 체험\n\nDay 2\n전통 어로 방식(독살) 체험\n해수욕\n\nDay 3\n어촌계 직영 횟집에서 식사\n육지 복귀\n\n<보기>\nㄱ. 계절의 영향을 받는다.\nㄴ. 지역 어민의 소득 증대에 기여한다.\nㄷ. 어촌 문화와 해양 자원을 대상으로 한다.", "visual_description": "여행기는 점선 테두리의 세 칸으로 나뉘어 Day 1, Day 2, Day 3의 활동을 보여 준다. Day 1에는 바다와 섬 그림, 갯벌에서 사람이 조개를 캐는 그림이 있다. Day 2에는 돌로 둘러싸인 해안 안쪽에서 사람이 도구를 들고 있는 그림과 바다에서 사람이 수영하는 그림이 있다. Day 3에는 두 사람이 음식을 먹는 그림과 바다 건너편 육지의 건물들이 보이는 그림이 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"2": 0.03, "1": 0.02, "5": 0.38, "3": 0.08, "4": 0.49}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/fishery-maritime/page-03.jpg", "page": 3}, {"id": "fishery-maritime:18", "subject": "수산·해운 산업 기초", "section": "fishery-maritime", "number": 18, "selected": "4", "answer": "1", "points": "3", "visual": true, "state": {"question": "다음에 제시된 수산물 정보를 분석한 내용으로 옳은 것만을 <보기>에서 고른 것은? [3점]", "passage": "그래프: [품종별 양식 생산량]\n- 통계청, 「어업생산동향」 -\n\n<보기>\nㄱ. 2023년 생산량이 가장 적은 것은 홍조류에 속한다.\nㄴ. 2024년 생산량이 가장 많은 것은 미역이다.\nㄷ. 2023년 대비 2024년에 생산량이 감소한 것은 김이다.\nㄹ. 최근 5년 평균 생산량은 미역이 다시마보다 많다.", "visual_description": "세로 막대그래프이다. 세로축은 ‘생산량’이고 단위는 ‘(만 톤)’이다. 세로축에는 0, 축 생략 표시, 40, 50, 60, 70의 눈금이 표시되어 있다. 가로축 품종은 왼쪽부터 ‘김’, ‘미역’, ‘다시마’이다. 범례는 흰색 막대가 ‘최근 5년(2020~2024년) 평균’, 회색 막대가 ‘2023년’, 진회색 막대가 ‘2024년’이다. 각 품종의 막대와 표시값은 다음과 같다. 김: 최근 5년 평균 55.5, 2023년 53.4, 2024년 55.2. 미역: 최근 5년 평균 54.9, 2023년 56.4, 2024년 57.2. 다시마: 최근 5년 평균 63.6, 2023년 59.6, 2024년 54.2."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"2": 0.1, "1": 0.23, "4": 0.5, "5": 0.09, "3": 0.08}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/fishery-maritime/page-04.jpg", "page": 4}, {"id": "fishery-maritime:19", "subject": "수산·해운 산업 기초", "section": "fishery-maritime", "number": 19, "selected": "3", "answer": "1", "points": "3", "visual": false, "state": {"question": "다음 실험을 통해 확인된 어류의 질병에 대한 설명으로 적절한 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "[실험 목적] 참돔의 질병을 진단할 수 있다.\n\n[준비물] 이상 증상이 관찰되는 참돔, 현미경, 해부용 기구, 질병 진단 키트\n\n[실험 과정]\n\n과정 1　육안 검사\n체색이 검고 아가미가 퇴색되었으며, 체표나 지느러미에 출혈이 있는 것으로 보아 질병에 감염된 것으로 추정됨.\n\n과정 2　현미경 검사\n감염된 것으로 추정되는 참돔의 아가미를 잘라서 현미경으로 관찰한 결과, 검은 점이 많이 형성되어 있어서 이리도바이러스에 감염된 것으로 추정됨.\n\n과정 3　진단 키트 검사\n잘라 낸 아가미 부위를 이리도바이러스 진단 키트로 검사한 결과, 양성 반응이 나타남.\n\n[실험 결과]\n과정 1~3을 통해 이리도바이러스에 감염된 것으로 확인됨.\n\n<보기>\nㄱ. 전염성이 있다.\nㄴ. 비기생성 질병에 속한다.\nㄷ. 항생제로 치료할 수 있다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"3": 0.65, "1": 0.31, "2": 0.01, "4": 0.01, "5": 0.02}, "others": {"Luna": "1", "Terra": "3", "Sol": "1"}, "image": "images/fishery-maritime/page-04.jpg", "page": 4}, {"id": "french-1:2", "subject": "프랑스어Ⅰ", "section": "french-1", "number": 2, "selected": "5", "answer": "4", "points": "1", "visual": true, "state": {"question": "□에 들어갈 글자를 모두 조합하여 만들 수 있는 낱말은? [1점]", "passage": "print□mps    é□é    autom□e    hi□er", "visual_description": "네 칸의 그림이 왼쪽부터 가로로 배열되어 있다. 첫째 칸에는 꽃이 핀 나무가 있고 아래에 “print□mps”가 있다. 둘째 칸에는 잎이 무성한 나무가 있고 아래에 “é□é”가 있다. 셋째 칸에는 잎이 거의 없고 바닥에 낙엽이 떨어진 나무가 있으며 아래에 “autom□e”가 있다. 넷째 칸에는 잎이 없는 나무가 있고 아래에 “hi□er”가 있다."}, "options": ["bleu", "lune", "nuit", "vent", "vert"], "probs": {"5": 0.54, "3": 0.09, "1": 0.13, "4": 0 n": "본문 위 그림에는 산과 침엽수가 보이는 야외에서 네 사람이 긴 벤치에 나란히 앉아 대화하는 모습이 있다. 벤치 양쪽 바닥에는 가방이 하나씩 놓여 있다."}, "options": ["(a)", "(b)", "(c)", "(d)", "(e)"], "probs": {"1": 0.01, "5": 0.02, "4": 0.12, "2": 0.85, "3": 0.0}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/german-1/page-04.jpg", "page": 4}, {"id": "human-development:7", "subject": "인간 발달", "section": "human-development", "number": 7, "selected": "2", "answer": "4", "points": "3", "visual": true, "state": {"question": "다음 관찰 일지에서 알 수 있는 아동 A, B가 공통적으로 속한 시기의 발달 특성으로 가장 적절한 것은? [3점]", "passage": "관찰 일지\n2024년 12월 ○일\n\n오늘은 우리 반 아이들과 크리스마스트리를 장식하였다. 트리에 달 모양 장식을 달던 아동 A가 “아하! 달이 밝게 비춰 주니까 산타 할아버지가 밤에도 선물을 가져다줄 수 있구나.”라고 말하자, 아동 B가 “누가 달을 하늘에 달았을까?”라고 물었다. 아동 A는 나를 보더니 “선생님이가 달았을 거야!”라고 답했고, 아동 B는 “아냐, 산타 할아버지가 우리 집에 잘 찾아오라고 아빠가 달았을 거야.”라고 말했다.", "visual_description": "상단에 집게가 그려진 직사각형 일지 용지 안에 제목, 날짜, 관찰 내용이 적혀 있다."}, "options": ["다중 서열화가 가능하다.", "추상적 사고가 가능하다.", "전두엽의 발달이 완성된다.", "확인 부가 의문문을 사용한다.", "대상 영속성 개념이 형성되기 시작한다."], "probs": {"3": 0.01, "1": 0.25, "5": 0.26, "2": 0.42, "4": 0.06}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/human-development/page-02.jpg", "page": 2}, {"id": "human-development:11", "subject": "인간 발달", "section": "human-development", "number": 11, "selected": "2", "answer": "3", "points": "3", "visual": true, "state": {"question": "다음 수업 장면에서 사랑의 구성 요소 A～C에 대한 설명으로 옳은 것만을 <보기>에서 고른 것은? (단, 스턴버그의 사랑의 삼각형 이론에 근거한다.) [3점]", "passage": "[수업 장면]\n학생: 사랑의 구성 요소에 대한 질문입니다. 동기 유발적 요소인 이것은 무엇일까요?\n다른 학생: A입니다.\n교사: A는 정서적 요소에 해당하므로 오답입니다. 정답에 대한 힌트를 드리자면, 이것은 자신의 에너지를 상대에게 열렬히 쏟는 요소입니다.\n학생: B입니다.\n교사: 오답입니다. B는 관계를 지속하기 위한 책임감에 해당합니다.\n학생: C입니다.\n교사: 정답입니다!\n\n<보기>\nㄱ. A만 있는 사랑은 도취적 사랑이다.\nㄴ. 우애적 사랑에서 A를 제외하면 공허한 사랑이 된다.\nㄷ. B는 인지적 요소이다.\nㄹ. B와 C를 더하면 낭만적 사랑이 된다.", "visual_description": "네 칸으로 구성된 만화 형식의 수업 장면이다. 각 칸에는 교사 한 명과 학생 세 명이 있으며, 말풍선을 통해 위 대화가 순서대로 제시되어 있다. A, B, C는 각각 말풍선 안에서 사각형 테두리로 표시되어 있다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"4": 0.02, "1": 0.07, "3": 0.09, "2": 0.73, "5": 0.09}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/human-development/page-03.jpg", "page": 3}, {"id": "human-development:12", "subject": "인간 발달", "section": "human-development", "number": 12, "selected": "1", "answer": "4", "points": "2", "visual": false, "state": {"question": "다음 대화에서 아동 A, B가 속한 도덕성 발달 단계에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 피아제의 도덕성 발달 이론에 근거한다.)", "passage": "아동 A: 어젯밤에 우리 엄마가 많이 아파서 병원에 갈 때 아빠가 엄청 빠른 속도로 운전했어.\n아동 B: 빨리 달리는 것은 나빠. 우리 아빠가 운전할 땐 정해진 속도를 지키고, 신호도 잘 지켜야 한다고 했어.\n아동 A: 교통 규칙을 지키는 것보다 사람의 생명을 지키는 것이 더 중요해. 사람의 생명이 위험할 때는 교통 규칙을 지키지 않아도 돼.\n아동 B: 아니야. 교통 규칙을 안 지키면 벌 받아야 해.\n\n<보기>\nㄱ. 아동 A의 단계는 행위의 결과보다 행위의 의도를 고려한다.\nㄴ. 아동 B의 단계는 타율적 도덕성 단계이다.\nㄷ. 아동 B의 단계는 신처럼 권위 있는 존재가 규칙을 만들었다고 생각한다.\nㄹ. 아동 B의 단계는 아동 A의 단계보다 도덕적 판단의 자기 통제 경향이 강하다."}, "options": ["ㄱ, ㄴ", "ㄴ, ㄹ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ"], "probs": {"5": 0.04, "1": 0.41, "3": 0.01, "4": 0.35, "2": 0.19}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/human-development/page-03.jpg", "page": 3}, {"id": "human-development:15", "subject": "인간 발달", "section": "human-development", "number": 15, "selected": "3", "answer": "5", "points": "3", "visual": true, "state": {"question": "다음 검사지를 통해 알 수 있는 반사 운동에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "신생아 반사 운동 검사지\n대상: 아동 A\n\n종류 | 설명 | 결과\n(가) | 손바닥에 손가락이나 물건을 쥐어 주면 꽉 잡는다. | ✔\n근원 반사 | ⓐ | ✔\n(나) | 겨드랑이를 잡고 다리를 바닥에 닿게 하면 걸어가듯 움직인다. | ✔\n(다) | 발바닥을 간지럽히면 발가락을 부채처럼 폈다가 오므린다. | ✔\n\n※ 설명에 해당하는 경우 결과란에 ✔ 표시\n\n<보기>\nㄱ. (가)는 생존에 필수적인 반사에 해당한다.\nㄴ. (가)는 파악 반사, (나)는 걷기 반사이다.\nㄷ. (나)와 (다)는 원시 반사에 해당한다.\nㄹ. ⓐ는 ‘손가락으로 뺨이나 입가를 두드리면 그 방향으로 고개를 돌린다.’이다.", "visual_description": "‘신생아 반사 운동 검사지’라는 제목의 표이다. 오른쪽 위에 ‘대상: 아동 A’가 적혀 있다. 표는 ‘종류’, ‘설명’, ‘결과’의 세 열로 구성되며, 네 행 모두 결과 열에 체크 표시가 있다. 표 아래에는 ‘※ 설명에 해당하는 경우 결과란에 ✔ 표시’라고 적혀 있다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "probs": {"2": 0.02, "5": 0.07, "4": 0.02, "3": 0.57, "1": 0.32}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/human-development/page-03.jpg", "page": 3}, {"id": "human-development:20", "subject": "인간 발달", "section": "human-development", "number": 20, "selected": "4", "answer": "3", "points": "3", "visual": false, "state": {"question": "다음 실험을 통해 알 수 있는 아동 A가 속한 시기의 발달 특성으로 적절한 것만을 <보기>에서 있는 대로 고른 것은? (단, 피아제의 인지 발달 이론에 근거한다.) [3점]", "passage": "[대상] 아동 A\n\n[실험 과정]\n• 단계 1: 발달 전문가가 아동 A에게 동화책을 보여주며 다음 이야기를 들려준다.\n\n거북이와 토끼가 함께 사과 3개를 빈 냉장고에 넣어요.\n거북이가 방에서 나가고, 방에 남아 있던 토끼가 냉장고 속 사과 1개를 꺼내 먹어요. 거북이가 다시 방으로 돌아와요.\n\n• 단계 2: 이야기를 들려준 후 아동 A에게 “방으로 돌아온 거북이는 냉장고에 사과가 몇 개 있다고 생각할까요?”라고 질문한다.\n\n[실험 결과]\n아동 A의 답변 | 2개요. 토끼가 사과 1개를 먹었으니까요.\n\n<보기>\nㄱ. 물활론적 사고를 한다.\nㄴ. 중다 분류가 가능하다.\nㄷ. 직관적 사고가 두드러진다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"4": 0.39, "5": 0.02, "2": 0.33, "1": 0.1, "3": 0.16}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/human-development/page-04.jpg", "page": 4}, {"id": "industrial-general:7", "subject": "공업 일반", "section": "industrial-general", "number": 7, "selected": "2", "answer": "5", "points": "2", "visual": true, "state": {"question": "다음 ○○기업 신규 제품 출시 계획서를 통해 알 수 있는 내용으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "○○기업 신규 제품 출시 계획서\n\n제품 설명: 스마트폰 앱을 통해 스위치의 ON/OFF를 제어할 수 있는 제품\n제품 안정성: △-C-2XK-Sxxxxxxxxx\n기술 인증: 국내에서 최초로 개발된 신기술을 적용한 신제품으로 인정되어 정부가 부여하는 인증 획득\n생산 관리: 필요한 때 필요한 것을 필요한 만큼 생산하는 시스템 적용\n\n<보기>\nㄱ. 획득한 기술 인증은 NEP 인증이다.\nㄴ. 생산 관리에 적용한 시스템은 적시 생산 시스템(JIT)이다.\nㄷ. 제품 안정성에 대한 인증은 보건, 환경, 안전, 품질 등 분야별 인증을 단일화한 국가 통합 인증이다.", "visual_description": "제품 설명 칸에는 왼쪽부터 손에 든 스마트폰 그림, 오른쪽을 향한 화살표 위의 블루투스 기호, 벽면 스위치 그림이 연결되어 있다. 스마트폰 그림에는 ‘스마트폰’, 화살표 아래에는 ‘블루투스 (최대 반경 50 m)’, 스위치 그림에는 ‘ON/OFF 제어’라고 표시되어 있다. 제품 안정성 칸에는 검은색 ‘KC’ 형태의 인증 로고와 그 오른쪽에 ‘△-C-2XK-Sxxxxxxxxx’가 표시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"3": 0.0, "5": 0.01, "1": 0.01, "2": 0.83, "4": 0.15}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/industrial-general/page-02.jpg", "page": 2}, {"id": "industrial-general:8", "subject": "공업 일반", "section": "industrial-general", "number": 8, "selected": "3", "answer": "1", "points": "3", "visual": false, "state": {"question": "다음 기업의 생산 혁신 사례를 통해 알 수 있는 내용으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "기업의 생산 혁신 사례\n\n▪ A, B 기업은 컴퓨터를 사용하여 제품 설계, 주문 접수, 제품 판매 등 공장 전체 업무를 통합하여 정보 시스템으로 일원화한 공장 자동화 시스템을 구축함.\n\n기업 | 로봇 활용 및 생산 혁신 활동\nA | ∙ 작업자가 로봇을 직접 조작하여 작업의 순서, 위치, 조건 등의 정보를 학습시켜 저장한 후 필요시 재생이 가능한 로봇 활용\nA | ∙ 재고 최소화를 위하여 도요타 생산 시스템(TPS) 도입\nB | ∙ 작업 환경의 변화에 적응하여 로봇 스스로 제어 기능을 변화시키는 능력을 가진 로봇 활용\nB | ∙ 낭비 요소 제거를 위하여 3정 5S 활동 전개\n\n<보기>\nㄱ. A, B 기업이 구축한 공장 자동화 시스템은 CIM이다.\nㄴ. A 기업의 로봇은 시퀀스 로봇, B 기업의 로봇은 플레이백 로봇에 해당한다.\nㄷ. A 기업이 재고 최소화를 위하여 도입한 생산 시스템은 린(Lean) 생산 시스템을 연구하여 후속으로 개발된 것이다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"5": 0.01, "3": 0.55, "1": 0.43, "4": 0.0, "2": 0.01}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/industrial-general/page-02.jpg", "page": 2}, {"id": "industrial-general:10", "subject": "공업 일반", "section": "industrial-general", "number": 10, "selected": "5", "answer": "3", "points": "2", "visual": false, "state": {"question": "다음 ○○기업 자동화 사례 보고서를 통해 알 수 있는 내용으로 적절한 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "○○기업 자동화 사례 보고서\n\n▪ 생산품: 스마트 공기 청정기(제품 수명 주기: 성장기)\n▪ 상반기 자동화 현황\n\n자동화 내용 | 효과\n생산 현장의 모든 정보를 통합 관리하기 위하여 현장의 실시간 모니터링, 불량 관리, 물류 및 작업 내역 관리 등을 위한 생산 정보 시스템 도입 | 생산성 향상\nRFID 시스템을 통한 물류 창고 자동화 | 리드타임 감소\n태양광 에너지를 이용한 자동화 냉ㆍ난방 시스템 도입 | 관리비 절감\n\n<보기>\nㄱ. 도입한 생산 정보 시스템은 MES이다.\nㄴ. 냉ㆍ난방 시스템에 이용한 에너지는 신에너지이다.\nㄷ. 생산품의 제품 수명 주기에 적합한 마케팅 전략에는 시장 점유율 확대 전략이 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"5": 0.61, "3": 0.13, "1": 0.03, "4": 0.21, "2": 0.02}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/industrial-general/page-02.jpg", "page": 2}, {"id": "industrial-general:19", "subject": "공업 일반", "section": "industrial-general", "number": 19, "selected": "2", "answer": "4", "points": "2", "visual": true, "state": {"question": "위 우수 사례를 통해 알 수 있는 내용으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "passage": "위험성 평가 우수 사례\n\n▪ 회사명: ○○산업(생산품: 반도체 부품용 박막 필름)\n\n▪ 문제점 파악\n• 부서별 사고 빈도 조사\n- 조사 결과, 생산부의 사고 빈도가 가장 높음.\n- 생산부의 생산 공정을 확인한 결과, 박막 필름 가공 공정의 사고 빈도가 가장 높음.\n\n〈부서별 사고 빈도〉\n세로축: 사고 빈도(건수), 눈금 0, 300, 600, 900.\n생산부 770, 품질부 615, 자재부 332의 세로 막대가 표시되어 있다.\n\n생산 공정(공정 기호): 원자재 검사 → 원자재 투입 → 박막 필름 가공 → 제품 검사 → 출하.\n원자재 검사에는 정사각형과 마름모 기호, 원자재 투입에는 오른쪽 화살표 기호, 박막 필름 가공에는 원과 역삼각형 기호, 제품 검사에는 정사각형과 마름모 기호, 출하에는 오른쪽 화살표 기호가 표시되어 있다. ‘박막 필름 가공’ 부분은 굵은 사각형 테두리로 강조되어 있다.\n\n▪ 위험성 평가\n• 박막 필름 가공 공정의 세부 공정에 대한 위험도 점수 산출\n• 산출 점수에 대하여 관리 기준에 따라 ‘즉시 개선’이 필요한 세부 공정 선정\n\n〈위험도 관리 기준〉\n위험도 등급 | 위험도 점수 | 관리 기준\n상 | 12~18 | 즉시 개선\n중 | 5~11 | 일정 기간 내 개선\n하 | 1~4 | 현행 유지\n\n〈세부 공정별 위험도 점수 및 누적 비율〉\n가로축의 세부 공정은 왼쪽부터 표면 처리, 필름 재단, 전처리, 건조, 장착, 탈착이다. 위험도 점수 막대는 각각 16, 15, 6, 6, 5, 2이다. 왼쪽 세로축은 ‘위험도 점수(점)’이며 눈금은 0, 5, 10, 15, 20이다. 오른쪽 세로축은 ‘누적 비율(%)’이며 눈금은 0, 20, 40, 60, 80, 100이다. 각 세부 공정 위의 점들을 연결한 누적 비율 선은 표면 처리에서 시작하여 필름 재단, 전처리, 건조, 장착, 탈착 순으로 상승하며 탈착에서 100에 이른다.\n\n▪ 개선 대책\n• 선정된 세부 공정에 대하여 유해·위험 요인 도출 및 개선 대책 수립\n\n세부 공정 | 유해·위험 요인 | 개선 대책\n표면 처리 | 검사 작업 시 퓸(fume) 누출 | 국소 배기 장치 설치\n필름 재단 | 칼날 노출 | 칼날 매립형으로 커팅 장치 개선\n\n• 수립한 개선 대책에 대하여 데밍 사이클(Deming’s cycle) 적용\n\n단계 | P | D | C | A\n활동 내용 | 세부 공정별 개선 대책의 실행 계획 수립 | 세부 공정별 개선 대책의 현장 적용 | 작업자 인터뷰 및 현장 측정을 통하여 위험도 확인 | 설비의 안전성 확보를 위해 사전에 주기적으로 점검하는 설비 보전 관리 활동 실시\n\n<보기>\nㄱ. 부서별 사고 빈도를 나타낸 도표는 특성 요인도이다.\nㄴ. 생산품은 사용 목적에 따라 분류할 때 산업재에 해당한다.\nㄷ. 생산 공정에서 박막 필름 가공 공정의 공정 기호에는 저장(보관)이 포함된다.", "visual_description": "공유 자료에 부서별 사고 빈도 막대그래프, 생산 공정의 공정 기호 흐름도, 위험도 관리 기준 표, 세부 공정별 위험도 점수 막대와 누적 비율 선 그래프, 개선 대책 표 및 데밍 사이클 표가 제시되어 있다."}, "options": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"2": 0.37, "3": 0.05, "5": 0.04, "1": 0.18, "4": 0.36}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/industrial-general/page-04.jpg", "page": 4}, {"id": "industrial-general:20", "subjec -common", "number": 7, "selected": "4", "answer": "5", "points": "2", "visual": false, "state": {"question": "<u>연대 보증인<\/u>에 대한 이해로 가장 적절한 것은?", "passage": "(나)\n\n보증이란 채무자가 채무를 이행하지 않으면 그 채무를 다른 사람이 대신 이행하기로 하는 것이다. 이때 원래의 채무자를 주채무자, 주채무자 대신 채무를 이행하는 사람을 보증인이라 하고, 주채무자가 부담하는 채무를 주채무, 보증인이 부담하는 채무를 보증 채무라 한다. 보증은 담보 기능을 수행하므로 주채무가 소멸되면 보증 채무도 당연히 소멸된다. 보증이 ⓓ <u>성립하려면<\/u> 채권자와 보증인을 당사자로 하는 보증 계약이 필요하다. 보증 계약은 보증인에게만 채무를 발생시키므로 유상 계약이 아니다. ㉠ 이는 주채무자와 보증인 간에 보증의 대가를 지급하기로 하는 계약이 별도로 체결되었더라도 마찬가지이다.\n\n보증 계약에 대해서는 보증인 보호를 위하여 법적 규제가 적용된다. 우선 ｢민법｣에 의하면 보증 계약을 할 때는 일반적인 계약과는 달리 계약서가 작성되어야 하고, 여기에는 보증인의 서명이나 기명 날인이 있어야 한다. 이를 위반한 보증 계약은 무효이지만 보증 채무가 이행되었으면 보증인이 그 무효를 주장할 수 없다. 주채무가 주채무자의 사업과 무관한 금전 채무이고, 보증인이 대가 없이 주채무자에 대한 호의로 보증 계약을 한 경우에는 ｢보증인 보호를 위한 특별법｣에 의한 보호도 제공된다. 예컨대 보증 기간이 명시되지 않은 경우 보증 기간은 3년으로 간주된다.\n\n채권자가 주채무자에게 주채무의 이행을 청구하지 않고 곧바로 보증인에게만 보증 채무의 이행을 청구한 경우, 보증인은 주채무자가 강제 집행 대상 재산을 보유하고 있음을 채권자에게 증명하여 보증 채무의 이행을 거절할 수 있는 권리가 있다. 그러나 보증인이 이러한 권리를 포기하기로 하는 ‘연대 보증 특약’이 보증 계약에 포함될 수 있다. 이러한 특약을 한 보증인인 <u>연대 보증인<\/u>은, 채권자가 곧바로 주채무 전액에 해당하는 돈의 지급을 요구하더라도 그 이행을 거절할 수 없다.\n\n연대 보증인에게도 ｢보증인 보호를 위한 특별법｣이 적용되는지가 문제 되는데, 어떤 해석 방법을 따르느냐에 따라 결론이 달라질 수 있다. 위 법률 제2조가 그 적용 대상인 보증 계약을 ‘주채무자가 금전 채무를 이행하지 않는 경우 그 채무를 보증인이 이행하기로 하는 계약’이라고 ⓔ <u>규정하고<\/u> 있으나 그 입법 과정에서 연대 보증인 보호의 필요성이 강조되었기 때문이다."}, "options": ["주채무자에 대한 호의로 대가 없이 보증 계약을 한 자이어야 한다.", "｢보증인 보호를 위한 특별법｣ 제2조의 문리 해석에 의하면 이 법의 적용 대상에 해당한다.", "채권자가 주채무자에게 채무의 이행을 청구하지 않는 한 보증 채무의 이행을 거절할 권리가 있다.", "채권자와는 보증 계약을 하고 채무자와는 연대 보증 특약을 함으로써, 보증 채무를 부담하게 된다.", "채권자가 주채무자에게 채무의 이행을 청구하여 그 채권이 실현되면 더 이상 보증 채무를 이행할 의무가 없다."], "probs": {"4": 0.45, "5": 0.09, "2": 0.17, "1": 0.09, "3": 0.2}, "others": {"Luna": "2", "Terra": "5", "Sol": "5"}, "image": "images/korean/page-03.jpg", "page": 3}, {"id": "korean-common:18", "subject": "국어", "section": "korean-common", "number": 18, "selected": "4", "answer": "2", "points": "2", "visual": false, "state": {"question": "윗글에 대한 이해로 적절하지 않은 것은?", "passage": "[중모리] 그때에 사슴이 발론하되 근래 인간이 하 무서워 짐
