ons": ["é", "ẽ", "è", "ẻ", "ẹ"], "probs": {"3": 0.18, "1": 0.28, "5": 0.21, "2": 0.19, "4": 0.14}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/vietnamese-1/page-01.jpg", "page": 1}, {"id": "world-geography:2", "subject": "세계지리", "section": "world-geography", "number": 2, "selected": "5", "answer": "1", "points": "2", "visual": true, "state": {"question": "다음은 세계지리 수업 장면의 일부이다. 교사의 질문에 옳게 답한 학생만을 있는 대로 고른 것은?", "passage": "교사: 세계 여러 도시에서 지구 환경 보호를 위해 다양한 국제 환경 협약이 이루어졌어요. 협약이 이루어진 (가)～(라) 도시의 특징에 대해 이야기해 볼까요?\n\n국제 환경 협약의 주요 내용\n\n| 환경 협약 | 연도 | 주요 내용 |\n|---|---:|---|\n| (가) 협약 | 1972 | 폐기물의 해양 투기로 인한 해양 오염을 방지 |\n| (나) 협약 | 1979 | 산성비 문제 해결을 위해 국경을 넘어 이동하는 대기 오염 물질을 통제 |\n| (다) 의정서 | 1987 | 오존층 파괴 물질(CFCs, 할론 등)의 생산 및 사용을 규제 |\n| (라) 협정 | 2015 | 선진국과 개발 도상국 모두 온실가스 감축 의무 이행을 포함한 포괄적 대응에 동참하도록 규정 |\n\n갑: (가)는 세계에서 산업 혁명이 가장 먼저 시작된 나라의 수도입니다.\n을: (나)는 치즈와 시계 산업으로 유명한 나라의 수도입니다.\n병: (다)는 멕시코, 미국과 북미 자유 무역 협정(NAFTA)을 체결했던 나라의 수도입니다.\n정: (라)는 대서양과 지중해에 모두 접하는 나라의 수도입니다.", "visual_description": "교사가 국제 환경 협약의 주요 내용이 적힌 화면을 가리키고 있고, 화면 앞에 갑, 을, 병, 정으로 표시된 네 학생이 앉아 있다. 교사의 말풍선, 표, 각 학생의 말풍선 내용은 문맥에 옮겨 적었다."}, "options": ["갑, 정", "을, 병", "병, 정", "갑, 을, 병", "갑, 을, 정"], "probs": {"2": 0.17, "5": 0.33, "4": 0.09, "1": 0.28, "3": 0.13}, "others": {"Luna": "1", "Terra": "5", "Sol": "1"}, "image": "images/world-geography/page-01.jpg", "page": 1}, {"id": "world-geography:4", "subject": "세계지리", "section": "world-geography", "number": 4, "selected": "2", "answer": "3", "points": "2", "visual": true, "state": {"question": "표의 (가)～(다)에 해당하는 지역을 지도의 A～C에서 고른 것은? (단, ㉠, ㉡ 시기는 각각 1월, 7월 중 하나임.)", "passage": "| 지역 | ㉠ 시기 강수량 차이(mm) | ㉡ 시기 강수량 차이(mm) |\n|---|---:|---:|\n| (가) | −33.7 | 33.5 |\n| (나) | 71.0 | 8.1 |\n| (다) | −37.4 | −41.7 |\n\n* 강수량 차이 = 각 지역 강수량 − (세 지역 강수량의 합 ÷ 3)", "visual_description": "태평양을 중심으로 아시아 동부와 오세아니아가 왼쪽에, 아메리카가 오른쪽에 배치된 지도이다. 적도는 ‘0°’로 표시된 수평선으로 나타난다. A는 북아메리카 서부 내륙의 중위도 지역에 있는 점이다. B는 오스트레일리아 남서부 해안 부근의 점이다. C는 남아메리카 남동부 해안 부근의 점이다."}, "options": ["(가) A, (나) C, (다) B", "(가) B, (나) A, (다) C", "(가) B, (나) C, (다) A", "(가) C, (나) A, (다) B", "(가) C, (나) B, (다) A"], "probs": {"2": 0.47, "5": 0.08, "1": 0.1, "4": 0.23, "3": 0.12}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/world-geography/page-01.jpg", "page": 1}, {"id": "world-geography:5", "subject": "세계지리", "section": "world-geography", "number": 5, "selected": "1", "answer": "3", "points": "2", "visual": true, "state": {"question": "그래프는 세계 및 (가), (나) 지역(대륙)의 신·재생 에너지 발전량 비율을 나타낸 것이다. 이에 대한 설명으로 옳은 것은? (단, (가), (나)는 각각 오세아니아, 유럽 중 하나이며, A～C는 각각 수력, 지열, 풍력 중 하나임.)", "passage": "그래프는 세계, (가), (나)의 발전량 비율을 0～100% 누적 가로 막대로 나타낸다. 범례는 회색 A, 빗금 B, 흰색 태양광·태양열, 검은색 C이다.\n- 세계: A는 약 0～52%, B는 약 52～80%, 태양광·태양열은 약 80～99%, C는 약 99～100%이다.\n- (가): A는 약 0～34%, B는 약 34～61%, 태양광·태양열은 약 61～94%, C는 약 94～100%이다.\n- (나): A는 약 0～47%, B는 약 47～82%, 태양광·태양열은 약 82～99%, C는 약 99～100%이다.\n가로축 눈금은 0부터 100(%)까지 10 간격으로 표시되어 있다.\n* 수력, 지열, 태양광·태양열, 풍력의 발전량 합을 100%로 하여 나타냄. (2023)", "visual_description": "세계, (가), (나)의 신·재생 에너지원별 발전량 비율을 비교하는 누적 가로 막대그래프이다. 막대 내부의 회색, 빗금, 흰색, 검은색 무늬가 각각 A, B, 태양광·태양열, C를 나타낸다."}, "options": ["(가)는 유럽이다.", "A 발전량은 캐나다가 중국보다 많다.", "B 발전량은 독일이 프랑스보다 많다.", "노르웨이는 B 발전량이 A 발전량보다 많다.", "C 발전량이 세계에서 가장 많은 국가는 (가)에 위치한다."], "probs": {"4": 0.1, "5": 0.33, "1": 0.37, "2": 0.08, "3": 0.12}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/world-geography/page-02.jpg", "page": 2}, {"id": "world-geography:6", "subject": "세계지리", "section": "world-geography", "number": 6, "selected": "3", "answer": "5", "points": "3", "visual": false, "state": {"question": "다음 글은 (가)～(다) 국가에 대한 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "◦ (가)에는 이라와디강이 흐른다. 이라와디강 하류에 위치한 양곤은 과거부터 오랜 기간 수도였고, 수도를 네피도로 이전한 현재도 인구가 가장 많은 도시로 경제, 문화의 중심지이다.\n◦ (나)에는 짜오프라야강이 흐른다. 짜오프라야강 하류에 위치한 방콕은 이 나라의 수도로 인구가 가장 많은 도시이다. 방콕을 비롯한 전국 각지에서 매년 우기가 시작될 무렵 전통 축제인 ‘송끄란’이 열린다.\n◦ (다)의 남부에는 티베트고원에서 발원한 하천인 ㉠ 이 흐른다. 이 강 하구 북동쪽에 위치한 호찌민은 수도인 하노이보다 인구가 많은 도시이며, 식민 지배의 영향으로 프랑스풍 건축물을 볼 수 있다.\n\n<보기>\nㄱ. ㉠은 메콩강이다.\nㄴ. (가)에서는 로힝야족에 대한 차별과 억압이 이루어졌다.\nㄷ. (가)～(다)는 모두 라오스와 국경을 접하고 있다."}, "options": ["ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"1": 0.04, "3": 0.83, "4": 0.01, "5": 0.11, "2": 0.01}, "others": {"Luna": "3", "Terra": "5", "Sol": "5"}, "image": "images/world-geography/page-02.jpg", "page": 2}, {"id": "world-geography:9", "subject": "세계지리", "section": "world-geography", "number": 9, "selected": "1", "answer": "4", "points": "2", "visual": true, "state": {"question": "그래프는 광물별 중·남부 아메리카와 아프리카의 주요 생산국을 나타낸 것이다. (가)～(다) 국가에 대한 설명으로 옳은 것만을 <보기>에서 고른 것은? (단, (가)～(다)는 각각 남아프리카 공화국, 브라질, 칠레 중 하나임.)", "passage": "가로축은 0～50(%)이며 10 간격의 수치 눈금과 5 간격의 보조 눈금이 있다. 광물별로 주요 생산국의 생산량 비율 구간이 왼쪽부터 연속하여 배치된 누적 가로 막대로 표시되어 있다.\n- 철광석: 왼쪽부터 (가), (나), 페루 순으로 표시되어 있다.\n- 다이아몬드: 왼쪽부터 보츠와나, 앙골라, (나) 순으로 표시되어 있다.\n- 구리: 왼쪽부터 (다), 콩고 민주 공화국, 페루 순으로 표시되어 있다.\n* 중·남부 아메리카와 아프리카 전체 국가 중 해당 광물의 생산량 상위 3개국이 전 세계 생산량에서 차지하는 비율을 나타냄.\n** 다이아몬드는 보석용 다이아몬드 생산량을 기준으로 함. (2022)\n\n<보기>\nㄱ. (가)는 인종 차별 정책인 ‘아파르트헤이트’를 시행했었다.\nㄴ. (다)에는 추키카마타 광산이 있다.\nㄷ. (다)는 (나)보다 석탄 생산량이 많다.\nㄹ. (가)와 (다)는 같은 지역(대륙)에 위치한다.", "visual_description": "철광석, 다이아몬드, 구리의 주요 생산국이 전 세계 생산량에서 차지하는 비율을 광물별 누적 가로 막대로 나타낸 그래프이다. 각 광물의 막대 안에는 국가별 비율 구간이 왼쪽부터 연속하여 배치되어 있으며, 국가명 또는 (가)～(다)가 각 구간 위나 안에 표시되어 있다."}, "options": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "probs": {"4": 0.01, "5": 0.01, "2": 0.02, "3": 0.02, "1": 0.94}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/world-geography/page-02.jpg", "page": 2}, {"id": "world-geography:10", "subject": "세계지리", "section": "world-geography", "number": 10, "selected": "3", "answer": "2", "points": "3", "visual": true, "state": {"question": "그래프의 (가)～(라) 국가에 대한 설명으로 옳은 것은? (단, (가)～(라)는 각각 독일, 브라질, 차드, 파키스탄 중 하나임.) [3점]", "passage": "<촌락 인구 변화>\n세로축 단위는 천만 명이며 눈금은 0, 2, 4, 6, 8, 10, 12, 14이다. 가로축은 1970년부터 2020년까지이며 10년 간격으로 연도가 표시되어 있다.\n- (가): 원 표식의 선으로, 1970년 약 4.3천만 명에서 지속적으로 증가하여 2020년 약 13천만 명이다.\n- (나): 삼각형 표식의 선으로, 1970년 약 4.2천만 명에서 완만하게 감소하여 2020년 약 2.8천만 명이다.\n- (다): 사각형 표식의 선으로, 1970년 약 2.2천만 명에서 감소하여 2010년경 약 1.7천만 명이 된 뒤 2020년 약 2천만 명이다.\n- (라): 검은 원 표식의 선으로, 1970년 약 0.4천만 명에서 지속적으로 증가하여 2020년 약 1.1천만 명이다.\n\n<인구 밀도 변화>\n세로축 단위는 명/km²이며 눈금은 0, 50, 100, 150, 200, 250, 300, 350이다. 가로축은 1970년부터 2020년까지이며 10년 간격으로 연도가 표시되어 있다.\n- (가): 원 표식의 선으로, 1970년 약 75명/km²에서 지속적으로 증가하여 2020년 약 305명/km²이다.\n- (다): 사각형 표식의 선으로, 1970년 약 225명/km²에서 대체로 완만하게 증가하여 2020년 약 240명/km²이다.\n- (나): 삼각형 표식의 선으로, 1970년 약 10명/km²에서 완만하게 증가하여 2020년 약 25명/km²이다.\n- (라): 검은 원 표식의 선으로, 1970년 약 5명/km²에서 완만하게 증가하여 2020년 약 15명/km²이다.", "visual_description": "왼쪽에는 네 국가의 1970～2020년 촌락 인구 변화를 나타낸 꺾은선그래프가 있고, 오른쪽에는 같은 기간 인구 밀도 변화를 나타낸 꺾은선그래프가 있다. 두 그래프 모두 (가)는 원, (나)는 삼각형, (다)는 사각형, (라)는 검은 원 표식으로 구분된다."}, "options": ["(나)는 1970년의 도시 인구가 2020년의 도시 인구보다 많다.", "(나)는 (가)보다 2020년의 도시 인구가 많다.", "(나)는 (다)보다 2020년의 국가 내 노년층 인구 비율이 높다.", "(다)는 (라)보다 2020년의 합계 출산율이 높다.", "(가)는 아프리카, (라)는 아메리카에 위치한다."], "probs": {"2": 0.05, "3": 0.62, "1": 0.26, "5": 0.02, "4": 0.05}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/world-geography/page-02.jpg", "page": 2}, {"id": "world-geography:11", "subject": "세계지리", "section": "world-geography", "number": 11, "selected": "5", "answer": "4", "points": "3", "visual": true, "state": {"question": "지도의 A～D 지역에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? [3점]", "passage": "<보기>\nㄱ. A에서는 이동식 전통 가옥인 유르트를 볼 수 있다.\nㄴ. B에는 영구 동토층이 분포한다.\nㄷ. C에는 타이가 지대가 나타난다.\nㄹ. D에는 카나트라 불리는 전통적인 지하 관개 수로가 있다.", "visual_description": "세계 지도 중 아시아·태평양과 북아메리카 및 오세아니아 일부가 나타나 있다. 적도는 ‘0°’로 표시되어 있다. 네 지점이 빈 원과 문자로 표시되어 있다. A는 중앙아시아 내륙의 카스피해 동쪽 부근, B는 A의 남동쪽인 중국 서부 내륙 부근, C는 북아메리카 북중부의 캐나다 내륙 부근, D는 남아메리카 서부의 태평양 해안 부근에 표시되어 있다."}, "options": ["ㄱ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ"], "probs": {"5": 0.35, "1": 0.27, "4": 0.17, "2": 0.07, "3": 0.14}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/world-geography/page-03.jpg", "page": 3}, {"id": "world-geography:12", "subject": "세계지리", "section": "world-geography", "number": 12, "selected": "2", "answer": "3", "points": "2", "visual": false, "state": {"question": "다음 글은 곡물의 지역(대륙)별 생산과 국제적 이동에 관한 것이다. 이에 대한 설명으로 옳은 것은? (단, A～D는 각각 에스파냐, 인도, 중국, 프랑스 중 하나임.)", "passage": "곡물의 생산량과 소비량은 지역(대륙)별, 국가별로 차이가 있으며, 이로 인해 곡물의 국제적 이동이 발생한다.\n2023년 기준 지역(대륙)별 전체 곡물 생산량은 (가)가 가장 많고 다음으로 아메리카, (나) 순이다. 이 중 (가)는 곡물 수입량이 수출량보다 많고, 아메리카와 (나)는 수출량이 수입량보다 많다.\n이 세 지역(대륙)의 대표적인 순 수출국으로는 (가)의 A, 아메리카의 미국, (나)의 B 등이 있으며, 순 수입국으로는 (가)의 C, 아메리카의 멕시코, (나)의 D 등이 있다."}, "options": ["(가)는 (나)보다 1인당 곡물 생산량이 많다.", "(나)는 (가)보다 쌀 생산량이 많다.", "A는 B보다 밀 생산량이 많다.", "C는 A보다 소 사육 두수가 많다.", "D는 B보다 밀 수출량이 많다."], "probs": {"1": 0.2, "4": 0.06, "2": 0.4, "5": 0.1, "3": 0.24}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/world-geography/page-03.jpg", "page": 3}, {"id": "world-geography:13", "subject": "세계지리", "section": "world-geography", "number": 13, "selected": "3", "answer": "5", "points": "3", "visual": true, "state": {"question": "다음 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, (가)～(다)는 각각 지도에 표시된 세 국가 중 하나이고, A～C는 각각 불교, 이슬람교, 힌두교 중 하나임.) [3점]", "passage": "<(가)～(다) 국가의 신자 수 1, 2위 종교>\n\n표:\n순위 | (가) | (나) | (다)\n1위 | A | B | C\n2위 | B | A | A\n\n<보기>\nㄱ. B는 나이지리아 북부 지역 주민들이 주로 믿는 종교이다.\nㄴ. C는 (다)의 신할리즈족이 주로 믿는 종교이다.\nㄷ. (가)～(다) 중 A 신자가 가장 많은 국가는 (가)이다.", "visual_description": "남아시아와 그 주변을 나타낸 지도에서 세 국가가 서로 다른 농도의 회색으로 구분되어 있다. 표시된 국가는 인도, 인도 동쪽의 방글라데시, 인도 남동쪽 해상의 스리랑카이다. 방글라데시는 가장 짙은 회색, 스리랑카는 중간 회색, 인도는 밝은 회색으로 표시되어 있다. 지도에는 (가)～(다) 문자가 직접 기입되어 있지 않고, 표의 세 국가가 지도에 표시된 세 국가 중 하나라고 제시되어 있다."}, "options": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "probs": {"3": 0.37, "1": 0.15, "5": 0.3, "2": 0.05, "4": 0.13}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/world-geography/page-03.jpg", "page": 3}, {"id": "world-geography:15", "subject": "세계지리", "section": "world-geography", "number": 15, "selected": "1", "answer": "2", "points": "3", "visual": true, "state": {"question": "다음 자료는 미국 6개 도시의 도시 간 거리를 나타낸 것이다. (가)～(라) 도시에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, (가)～(라)는 각각 로스앤젤레스, 샌프란시스코, 시카고, 휴스턴 중 하나임.) [3점]", "passage": "도시 간 거리표 (단위: km):\n\n열과 행의 도시 순서는 (가), (나), (다), (라), 뉴욕, 보스턴이며, 대각선 아래에 다음 거리가 제시되어 있다.\n(가)―(나): 559\n(가)―(다): 2,648\n(나)―(다): 2,210\n(가)―(라): 2,992\n(나)―(라): 2,809\n(다)―(라): 1,514\n(가)―뉴욕: 4,139\n(나)―뉴욕: 3,944\n(다)―뉴욕: 2,284\n(라)―뉴욕: 1,147\n(가)―보스턴: 4,344\n(나)―보스턴: 4,179\n(다)―보스턴: 2,584\n(라)―보스턴: 1,369\n뉴욕―보스턴: 307\n\n* 도시 간 거리는 두 도시 시청 간 최단 거리임.\n\n<보기>\nㄱ. (가)에는 세계 영화 산업의 중심지인 할리우드가 있다.\nㄴ. (다)는 선벨트 지역의 도시로 석유 화학 산업이 발달하였다.\nㄷ. (라)는 오대호 연안 도시로 내륙 교통의 중심지이다.\nㄹ. (다)는 (나)보다 고위도에 위치한다.", "visual_description": "도시 간 거리는 계단 모양의 대칭 거리 행렬에서 대각선 아래쪽 칸에만 수치가 적힌 형태로 제시되어 있다. 대각선의 도시 표시는 위에서 왼쪽부터 (가), (나), (다), (라), 뉴욕, 보스턴 순이다."}, "options": ["ㄱ, ㄹ", "ㄴ, ㄷ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ"], "probs": {"4": 0.0, "5": 0.02, "2": 0.01, "3": 0.0, "1": 0.97}, "others": {"Luna": "4", "Terra": "1", "Sol": "2"}, "image": "images/world-geography/page-03.jpg", "page": 3}, {"id": "world-geography:16", "subject": "세계지리", "section": "world-geography", "number": 16, "selected": "2", "answer": "3", "points": "3", "visual": true, "state": {"question": "그래프의 (가)～(다) 국가에 대한 설명으로 옳은 것은? (단, (가)～(다)는 각각 사우디아라비아, 이집트, 카자흐스탄 중 하나임.) [3점]", "passage": "", "visual_description": "2022년 자료를 나타낸 삼각형 방사형 그래프이다. 세 축은 위쪽의 ‘1차 산업 종사자 비율’, 왼쪽 아래의 ‘국토 면적’, 오른쪽 아래의 ‘국내 총생산’이다. 중심은 0이며 위쪽 축에 50과 100 눈금이 표시되어 있다. 범례에서 굵은 실선은 (가), 가는 실선은 (나), 점선은 (다)를 나타낸다. 1차 산업 종사자 비율 축에서 (가)가 100에 이르고, (나)는 그보다 낮지만 50보다 높으며, (다)는 중심에 가까운 낮은 값이다. 국토 면적 축에서는 (나)가 바깥쪽 꼭짓점에 이르고, (다)는 (나)보다 안쪽에 있으며, (가)는 중심에 가장 가깝다. 국내 총생산 축에서는 (다)가 바깥쪽 꼭짓점에 이르고, (가)와 (나)는 중심에 가까우며 (가)가 (나)보다 바깥쪽에 있다. 아래에는 ‘* 항목별 최댓값을 가진 국가의 값을 100으로 했을 때의 상대값임. (2022)’이라고 적혀 있다."}, "options": ["(가)는 총수출액이 총수입액보다 많다.", "(나)는 홍해에 접해 있다.", "(다)는 (가)보다 화석 에너지 자원의 생산량이 많다.", "(나)는 아시아, (다)는 아프리카에 위치한다.", "(가)～(다) 중 인구가 가장 많은 국가는 (나)이다."], "probs": {"1": 0.07, "4": 0.01, "3": 0.06, "2": 0.62, "5": 0.24}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/world-geography/page-03.jpg", "page": 3}, {"id": "world-geography:18", "subject": "세계지리", "section": "world-geography", "number": 18, "selected": "3", "answer": "5", "points": "2", "visual": true, "state": {"question": "다음은 (가)～(다) 국가에 대한 자료이다. 이에 대한 설명으로 옳은 것은?", "passage": "(가) 지중해와 흑해에 접한 이 국가는 아시아와 유럽을 잇는 지리적 이점으로 일찍이 교역과 문화 교류의 요충지로 발전했다. 이 국가의 경제ㆍ문화 중심지이자 인구 최대 도시인 [㉠] 은/는 보스포루스 해협의 양안에 위치한다.\n\n(나) 카스피해와 페르시아만에 모두 접한 국가로 일찍이 고대 문명이 발달했다. 인구 최대 도시인 테헤란은 자동차 및 전자 산업이 발달하였으며, 엘부르즈산맥 남쪽 기슭에 위치한다. 이 국가와 아라비아반도 사이에 위치한 호르무즈 해협은 에너지 자원의 주요 운송로로 이용된다.\n\n(다) 화석 에너지 자원이 발견되면서 급속히 성장한 이 국가는 페르시아만에 위치한 반도국으로 육상으로는 남쪽의 사우디아라비아, 해상으로는 서쪽의 바레인과 접하고 있다. 인구 최대 도시인 [㉡] 은/는 금융, 물류의 중심지이자 각종 국제회의 및 스포츠 행사를 개최하고 있다.", "visual_description": "자료 표의 각 국가 설명 옆에 국기가 제시되어 있다. (가)의 국기는 어두운 단색 바탕에 흰색 초승달과 별이 있다. (나)의 국기는 가로로 세 구역이며 가운데의 밝은 구역 중앙에 문양이 있고, 위쪽과 아래쪽 구역의 경계 부근에 작은 반복 무늬가 있다. (다)의 국기는 깃대 쪽의 밝은 세로 영역과 나머지 어두운 영역 사이가 여러 개의 삼각 톱니 모양 경계로 나뉜다."}, "options": ["㉡은 ㉠보다 인구가 많다.", "(나)는 수니파가 시아파보다 많다.", "(다)의 수도는 아부다비이다.", "(가)는 (다)보다 1인당 국내 총생산이 많다.", "(다)는 (나)보다 천연가스 수출량이 많다."], "probs": {"2": 0.03, "3": 0.29, "1": 0.14, "5": 0.26, "4": 0.28}, "others": {"Luna": "5", "Terra": "5", "Sol": "5"}, "image": "images/world-geography/page-04.jpg", "page": 4}, {"id": "world-geography:19", "subject": "세계지리", "section": "world-geography", "number": 19, "selected": "3", "answer": "4", "points": "2", "visual": true, "state": {"question": "다음 자료에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, (가)～(다)는 각각 지도에 표시된 세 경로 중 하나임.)", "passage": "◦ 1월 평균 낮 길이는 (가)～(다) 모두 도착지가 출발지보다 짧다.\n◦ 북반구 여름은 6～8월, 남반구 여름은 12～2월로 고려할 때, (나)는 도착지가 출발지보다 여름 강수량이 많고, (가)와 (다)는 모두 출발지가 도착지보다 여름 강수량이 많다.\n◦ (가)의 출발지는 (다)의 출발지보다 1월 평균 정오의 태양 고도가 높다.\n\n<보기>\nㄱ. (가)의 출발지는 7월보다 1월에 열대(적도) 수렴대의 영향을 많이 받는다.\nㄴ. (나)의 출발지는 (다)의 출발지보다 기온의 연교차가 크다.\nㄷ. (나)의 도착지는 (다)의 출발지보다 연 강수량이 많다.\nㄹ. (다)의 도착지는 (가)의 도착지보다 7월 강수량이 많다.", "visual_description": "세계 지도에 세 경로가 양 끝의 검은 점과 이를 잇는 직선으로 표시되어 있다. 어느 끝이 출발지인지는 표시되어 있지 않고 범례에는 양 끝 모두 출발지 또는 도착지라고 되어 있다. 경로에 (가), (나), (다)의 문자도 적혀 있지 않다. 한 경로는 영국 남동부 부근의 점과 인도 북동부 부근의 점을 잇는다. 다른 경로는 북아메리카 서부, 미국 서해안의 점과 남아메리카 브라질 동부 부근의 점을 잇는다. 나머지 경로는 오스트레일리아 동남부 해안 부근의 점과 그보다 남서쪽에 있는 남극 대륙의 점을 잇는다. 왼쪽에 적도가 0°로 표시되어 있다."}, "options": ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ"], "probs": {"2": 0.21, "1": 0.14, "4": 0.15, "5": 0.24, "3": 0.26}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/world-geography/page-04.jpg", "page": 4}, {"id": "world-history:8", "subject": "세계사", "section": "world-history", "number": 8, "selected": "1", "answer": "2", "points": "2", "visual": false, "state": {"question": "밑줄 친 ‘<u>우리 왕조<\/u>’에 대한 설명으로 옳은 것은?", "passage": "우리 왕조는 향촌 질서를 유지하기 위해 10호를 1패로, 10패를 1갑으로, 10갑을 1보로 편성한 보갑제를 시행하고 있다. 지방관이 힘써 행한다면, 도적 무리와 간사한 악당이 기댈 곳이 없어져 민간의 생계가 편안해진다. 따라서 보갑의 운영은 지방관의 중요한 임무이다. 그런데 세월이 오래 지나 소홀함이 생겨 담당 관리들이 성심성의껏 살피지 않고 있다. 이에 보갑제를 성실히 운영하도록 새로이 보갑의 규정을 반포한다. … (중략) …\n우리 왕조의 전·현직 관료, 과거 응시 자격이 있는 공립 학교 학생, 서민 등을 보갑에 일체 편성한다. 또한 기인(旗人)과 일반 백성이 섞여 사는 향촌에도 기인과 일반 백성을 보갑에 일체 편성한다. 그리고 몽골 지역에도 보갑을 편성하고 만일 도적질을 하거나 도망자를 은닉한 자가 있으면 조사하여 보고하도록 한다."}, "options": ["조광윤이 세웠다.", "군기처를 설치하였다.", "파스파 문자를 만들었다.", "장거정이 개혁을 추진하였다.", "북면관제와 남면관제를 시행하였다."], "probs": {"2": 0.09, "4": 0.3, "1": 0.53, "5": 0.06, "3": 0.02}, "others": {"Luna": "2", "Terra": "2", "Sol": "2"}, "image": "images/world-history/page-02.jpg", "page": 2}, {"id": "world-history:10", "subject": "세계사", "section": "world-history", "number": 10, "selected": "5", "answer": "3", "points": "2", "visual": false, "state": {"question": "(가) 왕조에서 있었던 사실로 옳은 것은?", "passage": "(가)은/는 처음에 사방의 이민족을 살필 여유가 없었다. 그런데 동돌궐을 복속한 이래로 탕구트, 설연타 등 주변 민족이 점점 복속해 오자, 그들이 원래 살고 있던 지역에 주와 현을 설치하였다. 그 가운데 큰 것을 도독부라고 하고, 그 수령을 도독 및 자사로 삼았으며 모두 세습을 허용하였다. 이러한 주와 현은 대부분 호부에 세금을 납부하거나 호적을 보고하지 않았지만, 황제의 덕이 미치는 곳은 변주 도독이 다스렸다. 이민족에 대한 이러한 통치 방식은 마치 고삐로 소와 말을 잡아끄는 이치와 같았다."}, "options": ["자금성이 축조되었다.", "9품중정제가 시행되었다.", "안사의 난이 발생하였다.", "청명상하도가 제작되었다.", "만한 병용제가 실시되었다."], "probs": {"2": 0.03, "1": 0.1, "4": 0.01, "5": 0.47, "3": 0.39}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/world-history/page-02.jpg", "page": 2}, {"id": "world-history:12", "subject": "세계사", "section": "world-history", "number": 12, "selected": "3", "answer": "4", "points": "3", "visual": false, "state": {"question": "밑줄 친 ‘짐’의 재위 시기에 있었던 사실로 옳은 것은? [3점]", "passage": "<u>짐<\/u>은 귀족원과 하원에서 개정한 다음의 헌장을 공표한다.\n\n제1조　프랑스 국민은 법 앞에 평등하다.\n제7조　국민은 법률에 따라 자신의 의견을 표현하고 발행할 권리를 가진다. 검열 등 자유를 제한하는 조치는 결코 다시 시행할 수 없다.\n제10조　왕정복고 이전에 표명된 의견과 투표에 대한 모든 조사는 금지한다.\n제13조　국왕은 국가의 최고 원수이다. 국왕은 육군과 해군을 지휘하고, 선전포고를 하고, 평화ㆍ동맹ㆍ통상 조약을 체결하고, 모든 공공 행정직을 임명하고, 법 집행에 필요한 규정과 행정 명령을 제정한다. 그러나 법 자체를 정지시킬 수 없다.\n제15조　법안의 제안은 국왕, 귀족원과 하원의 소관이다. 그렇지만 세금과 관련된 모든 법은 먼저 하원에서 표결을 거쳐야 한다.\n제67조　삼색기를 복원한다."}, "options": ["이탈리아 왕국이 수립되었다.", "신성 로마 제국이 해체되었다.", "데카브리스트의 봉기가 일어났다.", "영국에서 부패 선거구가 폐지되었다.", "3월 혁명으로 메테르니히가 실각되었다."], "probs": {"1": 0.06, "2": 0.13, "3": 0.53, "4": 0.17, "5": 0.11}, "others": {"Luna": "4", "Terra": "4", "Sol": "4"}, "image": "images/world-history/page-03.jpg", "page": 3}, {"id": "world-history:14", "subject": "세계사", "section": "world-history", "number": 14, "selected": "4", "answer": "3", "points": "3", "visual": true, "state": {"question": "(가) 국가에 대한 설명으로 옳은 것은? [3점]", "passage": "〈(가)의 주요 전적지〉\n\n① 마르즈 라히트 전투에서 승리하여 시리아 일대의 지배권을 확립함.\n② 카르타고를 점령하여 북아프리카에서의 영향력을 확대함.\n③ 베르베르인을 제압하여 탕헤르 일대를 차지함.\n④ 마슬라마가 이끄는 군대가 콘스탄티노폴리스를 공격함.\n\n①～④는 시간순", "visual_description": "지중해와 주변 지역을 나타낸 지도에 네 개의 검은 점과 설명 상자가 연결되어 있다. ①은 지중해 동쪽의 시리아 일대에 표시되어 있고, ②는 북아프리카 중부 해안의 카르타고 일대에 표시되어 있다. ③은 북아프리카 서북쪽의 탕헤르 일대에 표시되어 있고, ④는 지중해 동북쪽의 콘스탄티노폴리스 일대에 표시되어 있다. 지도 왼쪽 아래에는 ‘①～④는 시간순’이라고 적혀 있다."}, "options": ["사마르칸트를 수도로 삼았다.", "이스마일 1세에 의해 수립되었다.", "아랍인을 우대하는 정책을 펼쳤다.", "탈라스에서 당의 군대와 격돌하였다.", "헝가리를 정복하고 빈을 포위 공격하였다."], "probs": {"2": 0.04, "3": 0.15, "4": 0.68, "5": 0.06, "1": 0.07}, "others": {"Luna": "3", "Terra": "3", "Sol": "3"}, "image": "images/world-history/page-03.jpg", "page": 3}, {"id": "world-history:15", "subject": "세계사", "section": "world-history", "number": 15, "selected": "4", "answer": "2", "points": "3", "visual": false, "state": {"question": "(가), (나) 국가에 대한 설명으로 옳은 것은? [3점]", "passage": "지난 몇 달간 (가)의 상황은 우리의 우려가 현실이 되었음을 보여 줍니다. 새롭게 들어선 정부는 빠르게 권력을 공고히 하였으며, 대중에게 약속했던 ‘즉각적인 평화’를 이행하고 있습니다. 이로 인해 현재 벌어지고 있는 전쟁에서 (나)의 동부 전선은 곧 붕괴될 것이며, 이는 (나)이/가 대규모 병력과 자원을 서부 전선으로 이동시킬 수 있는 길을 열어 줄 것입니다. 저는 이 상황이 전쟁에서 연합국의 승리를 위협하는 가장 중대한 위험이라고 판단합니다. 서부 전선의 전력 불균형은 치명적일 수 있습니다. (가)의 새로운 정부에 저항하는 세력에게 지원을 확대해야 합니다."}, "options": ["(가) - 바이마르 공화국을 선포하였다.", "(가) - 그리스 독립 운동을 지원하였다.", "(나) - 인도차이나 연방을 조직하였다.", "(나) - 얄타 회담에 참여하여 전후 처리를 논의하였다.", "(가)와 (나) - 모로코에서 두 차례 군사 충돌 위기를 겪었다."], "probs": {"1": 0.39, "3": 0.02, "4": 0.5, "5": 0.06, "2": 0.03}, "others": {"Luna": "4", "Terra": "2", "Sol": "2"}, "image": "images/world-history/page-03.jpg", "page": 3}, {"id": "world-history:18", "subject": "세계사", "section": "world-history", "number": 18, "selected": "2", "answer": "1", "points": "2", "visual": false, "state": {"question": "(가) 국가에 대한 설명으로 옳은 것은?", "passage": "(가)은/는 북아프리카의 트리폴리 항구를 공격하면서 전쟁을 시작하였다. (가)의 군대는 비행기 등을 활용하여 벵가지, 홈스 등 여러 도시를 장악해 나갔다. 이에 몇 해 전 입헌 혁명에 성공한 청년 튀르크당 소속의 장교들이 현지 부족과 함께 격렬한 저항을 하였지만, 결국 (가)은/는 트리폴리타니아, 키레나이카 등에 대한 통치권을 확보하였다."}, "options": ["에티오피아를 침공하였다.", "크림 전쟁에서 패배하였다.", "체코슬로바키아를 점령하였다.", "나이지리아를 식민지로 삼았다.", "필리핀 지배를 두고 미국과 전쟁을 벌였다."], "probs": {"2": 0.35, "1": 0.33, "4": 0.04, "5": 0.24, "3": 0.04}, "others": {"Luna": "1", "Terra": "1", "Sol": "1"}, "image": "images/world-history/page-04.jpg", "page": 4}];const C='①②③④⑤';
let cur='전체';
function el(t,txt,c){const x=document.createElement(t);if(txt!=null)x.textContent=txt;if(c)x.className=c;return x}
function filtered(){const solo=document.getElementById('solo').checked,vis=document.getElementById('vis').checked;
 return DATA.filter(d=>(!solo||Object.values(d.others).every(v=>v==d.answer))&&(!vis||!d.visual))}
function nav(){const box=document.getElementById('subjects');box.replaceChildren();const items=filtered();const counts={};
 for(const d of items)counts[d.subject]=(counts[d.subject]||0)+1;
 const all=[['전체',items.length],...Object.entries(counts)];
 for(const [name,n] of all){const b=el('button');b.append(el('span',name),el('span',n));if(name===cur)b.className='on';b.onclick=()=>{cur=name;render()};box.append(b)}
 document.getElementById('total').textContent='884문항 중 '+DATA.length+'개 오답 · 표시 '+(cur==='전체'?items.length:counts[cur]||0)+'개'}
function card(d){const q=el('section',null,'q'+(d.image?'':' noimg'));q.id=d.id;const b=el('div',null,'body');
 const h=el('div',null,'head');h.append(el('h2',d.subject+' '+d.number+'번'),el('span','배점 '+d.points,'chip'));
 if(d.visual)h.append(el('span','그림·표 전사','chip'));
 if(Object.values(d.others).length&&Object.values(d.others).every(v=>v==d.answer))h.append(el('span','Jev만 틀림','chip solo'));
 b.append(h,el('div',d.state.question,'stem'));
 for(const [k,label] of [['passage','지문'],['visual_description','그림 설명(모델 입력)']]){if(d.state[k]){const det=el('details');det.append(el('summary',label),el('pre',d.state[k]));b.append(det)}}
 const ol=el('ol');d.options.forEach((o,i)=>{const n=i+1;const li=el('li');if(n==d.answer)li.classList.add('ans');if(n==d.selected)li.classList.add('pick');
  const row=el('div',null,'row');row.append(el('span',C[i]||n,'n'),el('span',o));
  const tags=[];if(n==d.answer)tags.push('정답');if(n==d.selected)tags.push('Jev');for(const [m,v] of Object.entries(d.others))if(v==n)tags.push(m);
  const p=d.probs[n];row.append(el('span',tags.join(' · ')+(p!=null?'  '+Math.round(p*100)+'%':''),'tags'));li.append(row);
  if(p!=null){const bar=el('div',null,'bar');const f=el('i');f.style.width=(p*100)+'%';bar.append(f);li.append(bar)}ol.append(li)});
 b.append(ol);q.append(b);
 if(d.image){const w=el('div',null,'img');const im=el('img');im.loading='lazy';im.src=d.image;im.alt=d.subject+' '+d.page+'쪽';w.append(im);w.onclick=()=>w.classList.toggle('big');q.append(w)}
 return q}
function render(){nav();const list=document.getElementById('list');list.replaceChildren();for(const d of filtered())if(cur==='전체'||d.subject===cur)list.append(card(d));window.scrollTo(0,0)}
document.getElementById('solo').onchange=render;document.getElementById('vis').onchange=render;
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.img.big').forEach(x=>x.classList.remove('big'));
 if(e.key!=='j'&&e.key!=='k')return;const qs=[...document.querySelectorAll('.q')];if(!qs.length)return;
 let i=qs.findIndex(x=>x.getBoundingClientRect().top>5);if(i<0)i=qs.length;i=e.key==='j'?Math.min(i,qs.length-1):Math.max(i-2,0);
 qs.forEach(x=>x.classList.remove('focus'));qs[i].classList.add('focus');qs[i].scrollIntoView({block:'start'})});
render();</script></html>
