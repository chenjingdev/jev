<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev 버그헌터</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --ink: #1c1c1c; --muted: #6b6b6b; --line: #e3e3df;
    --bar: #d6d6d0; --calm: #9a9a96; --hot: #c8283a; --hot-soft: rgba(200,40,58,.12); --flash: rgba(28,28,28,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131313; --panel: #1c1c1c; --ink: #ececea; --muted: #8f8f8a; --line: #2a2a28; --bar: #2e2e2c; --calm: #6f6f6a; --hot: #ff4d5e; --hot-soft: rgba(255,77,94,.14); --flash: rgba(255,255,255,.07); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif; overflow: hidden; }
  body.flash::before { content: ""; position: fixed; inset: 0; background: var(--flash); pointer-events: none; animation: blink .12s ease-out forwards; z-index: 9; }
  @keyframes blink { from { opacity: 1; } to { opacity: 0; } }

  /* Two equal columns filling the window: editor left, verdicts right. */
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; height: 100%; padding: 14px; }
  section { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); min-height: 36px; }
  .bar h1 { font-size: 13px; margin: 0; color: var(--ink); }
  .bar .grow { flex: 1; }
  .bar button, .bar select { border: 1px solid var(--line); background: none; color: var(--muted); font: inherit; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .bar .dirty { color: var(--hot); }

  /* editor */
  .editor { flex: 1; display: grid; grid-template-columns: 48px 1fr; min-height: 0; font: 15px/24px ui-monospace, "SF Mono", Menlo, monospace; }
  .gutter { overflow: hidden; color: var(--muted); text-align: right; padding: 10px 12px 10px 0; user-select: none; white-space: pre; }
  .textwrap { position: relative; min-height: 0; }
  .overlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .overlay .mark { position: absolute; left: 0; right: 0; }
  .overlay .caretline { background: var(--flash); }
  .overlay .fn { background: var(--hot-soft); border-left: 3px solid var(--hot); }
  .overlay .fn.fresh { animation: bloom .9s ease-out; }
  @keyframes bloom { 0% { background: rgba(255,77,94,.55); } 100% { background: var(--hot-soft); } }
  .overlay .fn.cool { background: rgba(120,200,140,.10); border-left-color: #58b37a; animation: none; }
  .overlay .fn.cool.fresh { animation: cool .9s ease-out; }
  @keyframes cool { 0% { background: rgba(88,179,122,.45); } 100% { background: rgba(120,200,140,.10); } }
  textarea { position: relative; width: 100%; height: 100%; border: 0; outline: 0; resize: none; background: none; color: var(--ink); font: inherit; padding: 10px 12px 10px 0; white-space: pre; overflow: auto; tab-size: 4; caret-color: var(--hot); }
  .typing { color: var(--hot); font-weight: 600; }
  .typing::after { content: ""; animation: dots 1s steps(4, end) infinite; }
  #left.saved { box-shadow: 0 0 0 3px var(--hot); transition: box-shadow .1s; }
  #left { transition: box-shadow .6s; }

  /* verdict toast */
  #right { position: relative; }
  .toast { position: absolute; left: 12px; right: 12px; top: 48px; z-index: 5; padding: 14px 18px; border-radius: 10px; background: var(--hot); color: #fff; font-weight: 700; font-size: 20px; display: flex; justify-content: space-between; align-items: baseline; opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .25s, transform .25s; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .toast.show { opacity: 1; transform: none; }
  .toast.cool { background: #2f9e64; }
  .toast .fnm { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .toast .big { font-size: 26px; font-variant-numeric: tabular-nums; }
  .row.pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.03); } 100% { transform: scale(1); } }

  /* verdicts */
  #list { flex: 1; overflow: auto; padding: 8px; }
  .row {
    display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; cursor: pointer;
    padding: 5px 10px; margin: 0 0 2px; border-radius: 7px; border: 1px solid transparent;
    transition: background .4s, border-color .4s, box-shadow .4s;
  }
  .row.hot { border-color: var(--hot); background: var(--hot-soft); }
  .row.recent { box-shadow: 0 0 0 2px var(--hot-soft); }
  .row.recent:not(.hot) { box-shadow: 0 0 0 2px var(--flash); }
  .row.selected { border-color: var(--ink); }
  .row.pending { opacity: .7; }
  .row.pending .risk::after { content: ""; animation: dots 1s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .row.error { border-color: var(--hot); border-style: dashed; }
  .risk { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); text-align: right; font-size: 13px; }
  .row.hot .risk { color: var(--hot); }
  .name { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .fn { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fn .file { color: var(--muted); }
  .track { height: 5px; background: var(--bar); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--calm); border-radius: 3px; transition: width .5s cubic-bezier(.2,.7,.2,1), background .3s; }
  .row.hot .fill { background: var(--hot); }
  .tags { display: flex; gap: 5px; justify-content: flex-end; font-size: 11px; }
  .tag { padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.smell { border-color: var(--hot); color: var(--hot); font-weight: 600; }
  .tag.sev2, .tag.sev3 { color: var(--ink); border-color: var(--ink); }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }

  /* detail of the selected function */
  .detail { border-top: 1px solid var(--line); padding: 8px 12px 10px; }
  .detail .head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; margin-bottom: 6px; }
  .detail .head .fn { font-size: 13px; }
  .detail .head .risk { font-size: 15px; }
  .smells { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; }
  .sm { display: grid; grid-template-columns: 74px 1fr 34px; align-items: center; gap: 8px; font-size: 11.5px; }
  .sm .p { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sm.hit { font-weight: 600; } .sm.hit .p { color: var(--hot); }
  .sm .track { height: 4px; }
  .placeholder { color: var(--muted); font-size: 12px; }
  footer { display: flex; gap: 12px; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  footer b { color: var(--ink); font-weight: 600; }
  .syntax { color: var(--hot); }
</style>
</head>
<body>
<main>
  <section id="left">
    <div class="bar">
      <select id="fileSel"></select>
      <span id="dirty"></span>
      <span class="grow"></span>
      <span>⌘S 저장</span>
    </div>
    <div class="editor">
      <div class="gutter" id="gutter"></div>
      <div class="textwrap"><div class="overlay" id="overlay"></div><textarea id="src" spellcheck="false" autocomplete="off"></textarea></div>
    </div>
  </section>
  <section id="right">
    <div class="toast" id="toast"></div>
    <div class="bar"><h1>Jev 버그헌터</h1><span id="watching">연결 중</span><span class="grow"></span><span class="syntax" id="syntax"></span><button id="sound">소리 켜기</button></div>
    <div id="list"><div class="empty">함수를 기다리는 중</div></div>
    <div class="detail" id="detail"><div class="placeholder">저장하면 바뀐 함수가 여기 뜹니다</div></div>
    <footer id="stats"></footer>
  </section>
</main>
<script>
(() => {
  const list = document.getElementById('list');
  const statsEl = document.getElementById('stats');
  const syntaxEl = document.getElementById('syntax');
  const detailEl = document.getElementById('detail');
  const src = document.getElementById('src');
  const gutter = document.getElementById('gutter');
  const fileSel = document.getElementById('fileSel');
  const dirtyEl = document.getElementById('dirty');
  const rows = new Map();          // id -> {data, el}
  let threshold = 0.5, smellNames = {}, severity = [];
  let changedTotal = 0, batchStart = 0, batchPending = 0, lastBatchMs = null, requests = 0;
  let audio = null, selectedId = null;
  const files = new Map();         // file -> text on disk
  let current = null, dirty = false;

  fetch('/api/smells').then(r => r.json()).then(m => { threshold = m.threshold; smellNames = m.smells; severity = m.severity; });

  // ---- editor ---------------------------------------------------------------
  function gutterLines() {
    const n = src.value.split('\n').length;
    gutter.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
  }
  const overlay = document.getElementById('overlay');
  const LH = 24, PAD = 10;
  let typingTimer = null;
  function lineOfCaret() { return src.value.slice(0, src.selectionStart).split('\n').length - 1; }
  function renderOverlay() {
    const top = l => PAD + l * LH - src.scrollTop;
    let html = `<div class="mark caretline" style="top:${top(lineOfCaret())}px;height:${LH}px"></div>`;
    for (const e of rows.values()) {
      const d = e.data;
      if (d.file !== current || d.status !== 'done' || !d.source) continue;
      const hot = d.risk >= threshold;
      if (!hot && !e.recent) continue;
      const n = d.source.replace(/\n$/, '').split('\n').length;
      html += `<div class="mark fn${hot ? '' : ' cool'}${e.fresh ? ' fresh' : ''}" style="top:${top(d.lineno - 1)}px;height:${n * LH}px"></div>`;
    }
    overlay.innerHTML = html;
  }
  src.addEventListener('scroll', () => { gutter.scrollTop = src.scrollTop; renderOverlay(); });
  ['keyup', 'click', 'select'].forEach(ev => src.addEventListener(ev, renderOverlay));
  src.addEventListener('input', () => {
    dirty = true; dirtyEl.textContent = '타이핑 중'; dirtyEl.className = 'typing'; gutterLines(); renderOverlay();
    clearTimeout(typingTimer); typingTimer = setTimeout(() => { if (dirty) { dirtyEl.textContent = '● 수정됨'; dirtyEl.className = 'dirty'; } }, 900);
  });
  src.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(); }
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = src.selectionStart, t = src.selectionEnd;
      src.setRangeText('    ', s, t, 'end'); dirty = true; dirtyEl.textContent = '● 수정됨'; dirtyEl.className = 'dirty';
    }
  });
  function openFile(name) {
    current = name; src.value = files.get(name) ?? ''; dirty = false; dirtyEl.textContent = ''; gutterLines(); renderOverlay();
  }
  fileSel.onchange = () => openFile(fileSel.value);
  async function save() {
    if (!current) return;
    const text = src.value;
    await fetch('/api/save', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ file: current, text }) });
    files.set(current, text); dirty = false; dirtyEl.textContent = '저장됨 → Jev'; dirtyEl.className = 'dirty';
    const left = document.getElementById('left'); left.classList.add('saved'); setTimeout(() => left.classList.remove('saved'), 350);
  }
  fetch('/api/files').then(r => r.json()).then(m => {
    for (const f of m.files) { files.set(f.file, f.text); const o = document.createElement('option'); o.value = o.textContent = f.file; fileSel.appendChild(o); }
    const first = new URLSearchParams(location.search).get('file') || m.files[0]?.file;
    if (first) { fileSel.value = first; openFile(first); }
  });

  // ---- sound ----------------------------------------------------------------
  document.getElementById('sound').onclick = e => {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    audio.resume(); e.target.textContent = '소리 켜짐';
  };
  function tick(hot) {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = hot ? 880 : 440; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, audio.currentTime + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.09);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.1);
  }

  // ---- verdict list ---------------------------------------------------------
  function shortFile(f) { return f.split('/').slice(-2).join('/'); }

  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(d) {
    const hot = d.risk >= threshold;
    const label = hot ? (d.labels[0] || d.severity) : '깨끗함';
    toastEl.className = 'toast show' + (hot ? '' : ' cool');
    toastEl.innerHTML = `<span><span class="fnm">${d.function}</span> — ${label}</span><span class="big">${d.risk.toFixed(2)}</span>`;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }
  function countUp(el, from, to) {
    const t0 = performance.now(), dur = 600;
    (function step(now) {
      const k = Math.min(1, (now - t0) / dur), v = from + (to - from) * (1 - Math.pow(1 - k, 3));
      el.textContent = v.toFixed(2);
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  function render(entry) {
    const d = entry.data, el = entry.el;
    const risk = d.status === 'done' ? d.risk : (d.risk ?? null);
    const hot = d.status === 'done' && d.risk >= threshold;
    el.className = 'row' + (hot ? ' hot' : '') + (d.status === 'pending' ? ' pending' : '') + (d.status === 'error' ? ' error' : '') + (entry.recent ? ' recent' : '') + (selectedId === d.id ? ' selected' : '') + (entry.pop ? ' pop' : '');
    const riskEl = el.querySelector('.risk');
    if (entry.animateFrom != null && risk != null) { countUp(riskEl, entry.animateFrom, risk); entry.animateFrom = null; }
    else riskEl.textContent = risk == null ? '' : risk.toFixed(2);
    el.querySelector('.fn').innerHTML = `<span class="file">${shortFile(d.file)}:${d.lineno} </span>${d.function}`;
    el.querySelector('.fill').style.width = ((risk ?? 0) * 100) + '%';
    const tags = el.querySelector('.tags');
    tags.innerHTML = '';
    if (d.status === 'error') { tags.innerHTML = `<span class="tag">${d.error}</span>`; return; }
    if (d.status !== 'done') return;
    const lvl = severity.indexOf(d.severity);
    tags.innerHTML = `<span class="tag sev${lvl}">${d.severity}</span>` + (d.labels || []).slice(0, 2).map(l => `<span class="tag smell">${l}</span>`).join('');
  }

  function showDetail(id) {
    const e = rows.get(id); if (!e) return;
    const prev = selectedId; selectedId = id;
    if (prev && rows.get(prev)) render(rows.get(prev));
    render(e);
    const d = e.data;
    const hot = d.status === 'done' && d.risk >= threshold;
    const risk = d.status === 'done' ? `${d.risk.toFixed(2)} · ${d.severity}` : (d.status === 'pending' ? '판정 중…' : '');
    const smells = d.status === 'done' ? Object.entries(d.probabilities).map(([k, p]) =>
      `<div class="sm${p >= threshold ? ' hit' : ''}"><span>${smellNames[k] || k}</span><div class="track"><div class="fill" style="width:${p * 100}%;background:${p >= threshold ? 'var(--hot)' : 'var(--calm)'}"></div></div><span class="p">${p.toFixed(2)}</span></div>`).join('') : '';
    detailEl.innerHTML = `<div class="head"><span class="fn"><span class="file">${shortFile(d.file)}:${d.lineno} </span>${d.function}</span><span class="risk" style="color:${hot ? 'var(--hot)' : 'var(--muted)'}">${risk}</span></div><div class="smells">${smells}</div>`;
  }

  function sortKey(d) { return [(d.status === 'done' ? d.risk : (d.risk ?? -1)), d.severity_score ?? 0]; }

  // FLIP: remember positions, reorder, then slide each row from where it was.
  function reorder() {
    const before = new Map();
    for (const [id, e] of rows) before.set(id, e.el.getBoundingClientRect().top);
    const sorted = [...rows.values()].sort((a, b) => {
      const ka = sortKey(a.data), kb = sortKey(b.data);
      return kb[0] - ka[0] || kb[1] - ka[1] || a.data.function.localeCompare(b.data.function);
    });
    const empty = list.querySelector('.empty'); if (empty) empty.remove();
    for (const e of sorted) list.appendChild(e.el);
    for (const [id, e] of rows) {
      const prev = before.get(id); if (prev == null) continue;
      const dy = prev - e.el.getBoundingClientRect().top;
      if (!dy) continue;
      e.el.style.transition = 'none'; e.el.style.transform = `translateY(${dy}px)`;
      requestAnimationFrame(() => { e.el.style.transition = 'transform .25s cubic-bezier(.2,.7,.2,1), background .4s, border-color .4s, box-shadow .4s'; e.el.style.transform = ''; });
    }
  }

  function upsert(d, recent) {
    let e = rows.get(d.id);
    if (!e) {
      const el = document.createElement('div');
      el.className = 'row';
      el.innerHTML = '<div class="risk"></div><div class="name"><div class="fn"></div><div class="track"><div class="fill"></div></div></div><div class="tags"></div>';
      e = { data: d, el, recent: false, timer: null };
      el.onclick = () => showDetail(d.id);
      rows.set(d.id, e);
      list.appendChild(el);
    }
    const wasHot = e.data.status === 'done' && e.data.risk >= threshold;
    const oldRisk = e.data.status === 'done' ? e.data.risk : null;
    e.data = d;
    if (recent) {
      e.recent = true; clearTimeout(e.timer);
      e.timer = setTimeout(() => { e.recent = false; e.fresh = false; render(e); renderOverlay(); }, 2500);
    }
    if (recent && d.status === 'done') {
      e.pop = true; e.fresh = true; e.animateFrom = oldRisk ?? 0;
      setTimeout(() => { e.pop = false; render(e); }, 600);
      toast(d);
    }
    render(e);
    renderOverlay();
    return { wasHot };
  }

  function stats(s) {
    if (s) requests = s.requests;
    const n = rows.size, hot = [...rows.values()].filter(e => e.data.status === 'done' && e.data.risk >= threshold).length;
    statsEl.innerHTML = `<span><b>${n}</b> functions</span><span><b>${hot}</b> hot</span><span><b>${changedTotal}</b> changed</span><span><b>${requests}</b> requests</span>` + (lastBatchMs != null ? `<span><b>${(lastBatchMs / 1000).toFixed(1)}s</b></span>` : '');
  }

  const es = new EventSource('/events');
  es.onopen = () => { document.getElementById('watching').textContent = '감시 중'; };
  es.onerror = () => { document.getElementById('watching').textContent = '연결 끊김'; };
  es.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'snapshot') {
      for (const d of m.functions) upsert(d, false);
      reorder();
    } else if (m.type === 'changed') {
      changedTotal += m.count; batchStart = performance.now(); batchPending += m.count;
      document.body.classList.remove('flash'); void document.body.offsetWidth; document.body.classList.add('flash');
      syntaxEl.textContent = '';
      // A save from outside the page: refresh the editor if it is not mid-edit.
      fetch('/api/files').then(r => r.json()).then(fm => {
        for (const f of fm.files) files.set(f.file, f.text);
        if (!dirty && current && files.get(current) !== src.value) openFile(current);
      });
    } else if (m.type === 'pending') {
      upsert(m.function, true);
      showDetail(m.function.id);
    } else if (m.type === 'verdict' && m.quiet) {
      upsert(m.function, false); reorder();
    } else if (m.type === 'verdict') {
      const { wasHot } = upsert(m.function, true);
      if (selectedId === m.function.id || batchPending === 1) showDetail(m.function.id);
      const d = m.function, hot = d.status === 'done' && d.risk >= threshold;
      if (hot !== wasHot || hot) tick(hot);
      if (batchPending > 0 && --batchPending === 0) lastBatchMs = performance.now() - batchStart;
      reorder();
    } else if (m.type === 'removed') {
      const e = rows.get(m.id); if (e) { e.el.remove(); rows.delete(m.id); }
      if (selectedId === m.id) { selectedId = null; detailEl.innerHTML = '<div class="placeholder">함수가 사라졌습니다</div>'; }
    } else if (m.type === 'syntax') {
      syntaxEl.textContent = `${shortFile(m.file)} 문법 오류 (${m.message}) — 마지막 판정 유지`;
    }
    stats(m.stats);
  };
})();
</script>
</body>
</html>
