[project]
name = "sif"
version = "0.1.0"
description = "semantic if - Jev judgement as a one-line if/switch/score"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-vision>=12.2.2",
    "python-chess>=1.999",
    "typesafe-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sif"]

[dependency-groups]
dev = ["pytest>=8"]
