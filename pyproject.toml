[project]
name = "sif"
version = "0.1.0"
description = "semantic if - Jev judgement as a one-line if/switch/score"
requires-python = ">=3.10"
dependencies = ["typesafe-sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sif"]

[dependency-groups]
dev = ["pytest>=8"]
